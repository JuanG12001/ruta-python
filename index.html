ura >= 0,0001:` con coma decimal: SyntaxError. Es `0.0001` o `1e-4`; `10E-4` vale 0.001.","El `print` del resultado fuera del `else`: con datos inválidos el contador no existe (NameError).","Un `if` de validación que debía ser `elif`: con flujos iguales el programa avisa y después entra al ciclo, que no termina.","`Tiempo = Tiempo + 1` con mayúscula: NameError, y `tiempo` nunca avanza."],"donde":"Clase del 8-6 (rebotes y tanque con válvula), repaso del quiz del 22-6 (multiplicación rusa), problemario 64-66 y 74."},{"id":"p-atajos","nombre":"Atajos de Python para listas","definicion":"Funciones y métodos que ya vienen en Python y hacen en una línea lo que en clase se hace con un ciclo: contar, sumar, buscar el menor o el mayor, ordenar, quitar repetidos.","para_que":"Sirven para escribir rápido y para comprobar tus resultados. Pero muchos enunciados los prohíben («No se permite usar», «sin vectores auxiliares», «no use funciones reservadas para valores alfanuméricos»): ahí se resuelve con ciclos.","como":["Funciones (la lista va entre paréntesis): `len(L)`, `sum(L)`, `min(L)`, `max(L)`, `sorted(L)`, `list(...)`, `set(...)`.","Métodos (van después de un punto): `L.append(x)`, `L.insert(i, x)`, `L.remove(x)`, `L.pop()` y `L.sort()` cambian la lista; `L.count(x)` y `L.index(x)` solo consultan.","`sorted(L)` devuelve una lista nueva; `L.sort()` ordena L y devuelve None. `reverse=True` invierte el orden y `key=funcion` ordena según lo que devuelve la función.","`set(L)` quita repetidos y pierde el orden; `&` da los comunes y `|` la unión. `list(...)` o `sorted(...)` lo vuelven lista.","Para llenar una lista desde el teclado: `L = []` y, dentro de un `for i in range(n)`, `L.append(int(input(...)))`."],"plantilla":"datos = [21, 2, 61, 10, 2]\nprint(len(datos), sum(datos), min(datos), max(datos))\nprint(sum(datos) / len(datos))\nprint(sorted(datos), sorted(datos, reverse=True))\nprint(datos.count(2), datos.index(61))\nprint(sorted(set(datos)))","errores":["`L = L.sort()`: L queda en None y `L[0]` da TypeError.","`sorted(lista Key=primer_digito)`: falta la coma y `key` va en minúscula (TypeError).","`L.remove(x)` cuando x no está: ValueError. Pregunta antes con `if x in L:`.","`list(set(L))` desordena: no sirve si el enunciado pide conservar el orden.","Leer el dato dentro del `for` y olvidar el `append`: la lista queda vacía."],"donde":"Clase de listas (llenar con input, págs. 84-85), ejercicio del profesor del primer dígito (pág. 90), intersección con set (pág. 97) y unión con `|` (pág. 99)."},{"id":"p-rebanadas","nombre":"Rebanadas y búsqueda en textos","definicion":"Una rebanada `t[a:b]` copia el trozo de un texto o una lista que va de la posición a hasta la b − 1. Los índices negativos cuentan desde el final. `in`, `find`, `index`, `startswith` y `endswith` buscan un trozo dentro de un texto.","para_que":"Sacar las últimas cifras de un número hecho texto (automórfico), voltear con `[::-1]` (capicúa), separar el comienzo del resto de un mensaje Morse (`morse[:k]` y `morse[k:]`), buscar trozos comunes en el ADN, cambiar letras de una palabra.","como":["`t[-1]` es el último; `t[:n]` los primeros n; `t[n:]` desde n hasta el final; `t[-n:]` los últimos n; `t[::-1]` al revés. Funciona igual con listas.","Una rebanada nunca da IndexError; un índice suelto fuera de rango sí (`t[len(t)]`).","`x in t` dice si está; `t.find(x)` da la posición o −1; `t.index(x)` da la posición o ValueError.","Las cadenas no se modifican: para cambiar un texto arma uno nuevo (`nueva = nueva + c`, o `t[0].upper() + t[1:]`) y guárdalo en la variable.","`str(n)` pasa de número a texto, `int(t)` de texto a número y `\" \".join(lista)` une palabras con un espacio."],"plantilla":"def es_capicua_texto(n):\n    t = str(n)\n    return t == t[::-1]\n\ndef es_automorfico_texto(numero):\n    return str(numero * numero).endswith(str(numero))\n\ndef sin_espacios(t):\n    nueva = \"\"\n    for c in t:\n        if c != \" \":\n            nueva = nueva + c\n    return nueva\n\nprint(es_capicua_texto(12321), es_automorfico_texto(76), sin_espacios(\"esto es\"))","errores":["`p[0] = \"M\"`: las cadenas no se modifican (TypeError).","Usar `index` con algo que puede no estar: ValueError. Pregunta antes con `in` o usa `find`.","En tus apuntes, los índices de «esto es una cadena» llegan a 18 y 19; con `len` = 18 van de 0 a 17.","Pegar un número a un texto sin `str()`: TypeError."],"donde":"Clase del 15-6 (cadenas, capicúa y automórfico con cadena), clase del 14-9 (primo palindrómico, versión alfanumérica con `str`), problemario 109 (ADN) y 115 (Morse)."},{"id":"p-paralelas","nombre":"Listas paralelas como tabla","definicion":"Dos listas del mismo largo y alineadas por posición: `claves[i]` y `valores[i]` describen la misma fila de una tabla.","para_que":"Traducir de un sistema a otro: números romanos (problemario 112 y 113), código Morse (115) o cualquier tabla de equivalencias.","como":["Para traducir x: `i = claves.index(x)` y después `valores[i]`. Si x puede faltar, pregunta antes con `x in claves`.","Para recorrer la tabla fila por fila: `for i in range(len(valores)):` y usa el mismo i en las dos listas.","A romano: tabla de mayor a menor que incluya 900, 400, 90, 40, 9 y 4; mientras el número alcance, pega el símbolo y resta su valor.","De romano: si un símbolo vale menos que el siguiente, se resta; si no, se suma. Compara con el siguiente solo si `i + 1 < len(t)`.","Morse con espacios: `mensaje.split(\" \")` da la lista de códigos y cada uno se traduce por separado."],"plantilla":"letras = [\"a\", \"e\", \"m\", \"o\", \"s\", \"t\"]\ncodigos = [\".-\", \".\", \"--\", \"---\", \"...\", \"-\"]\n\ndef traducir(mensaje):\n    texto = \"\"\n    for c in mensaje.split(\" \"):\n        if c in codigos:\n            texto = texto + letras[codigos.index(c)]\n        else:\n            texto = texto + \"?\"\n    return texto\n\nprint(traducir(\"... --- ...\"))","errores":["Listas desalineadas: si falta un elemento en una, todas las filas siguientes quedan corridas y no aparece ningún mensaje de error.","Buscar con `index` algo que no está (por ejemplo, una minúscula en una tabla de mayúsculas): ValueError.","Tabla de romanos de menor a mayor: 4 sale IIII.","Usar `if` en vez de `while` al escribir romanos: 3 sale I y no III."],"donde":"Problemario 112 (a romano), 113 (de romano), 114 (ahorcado) y 115 (Morse)."},{"id":"p-iterativo","nombre":"Métodos iterativos: el valor nuevo a partir del anterior hasta la tolerancia","definicion":"Un método iterativo calcula un valor nuevo a partir del anterior y repite hasta que el cambio entre los dos sea menor que una tolerancia. Así trabajan las series, la bisección, Newton-Raphson, la secante, la regula falsi y la sección dorada.","para_que":"Problemario 81 al 103 y las evaluaciones: el seno del parcial, la serie del quiz del 16-6 y el número e del quiz del 3-10. Ninguno de esos resultados sale en un solo paso: se aproxima vuelta a vuelta.","como":["Calcula el valor nuevo en otra variable para no perder el viejo: `nuevo = x - f(x) / df(x)`; después `x = nuevo`.","Para cuando `abs(nuevo - viejo) < tol`. En una serie esa diferencia es el último término sumado: `while abs(t) >= tol`.","Pon un máximo de vueltas (`vueltas < 100`): los métodos abiertos (Newton, secante) pueden no converger.","Para avanzar dos valores a la vez usa `a, b = b, a + b` (Fibonacci) o `x0, x1 = x1, x2` (secante).","Comprueba el resultado: contra la librería (`math.cos`, `math.exp`, `math.pi`) o viendo que `f(raiz)` sea casi 0."],"plantilla":"def f(x):\n    return x**3 - x - 2\n\ndef df(x):\n    return 3 * x**2 - 1\n\ndef siguiente(x):\n    return x - f(x) / df(x)\n\ndef iterar(x, tol):\n    nuevo = siguiente(x)\n    vueltas = 1\n    while abs(nuevo - x) >= tol and vueltas < 100:\n        x = nuevo\n        nuevo = siguiente(x)\n        vueltas += 1\n    return nuevo","errores":["`while abs(x) > tol` en la serie del quiz: x no cambia y el ciclo no termina. Se mira el término.","`10E-4` vale 0.001; 10⁻⁴ se escribe `1e-4`. Y `0,0001` con coma es SyntaxError (rebotes, 8-6).","Newton con df(x) = 0 en el punto inicial: ZeroDivisionError. Empieza en otro punto.","`t1 = t2` y luego `t2 = t1 + t2` pierde el valor viejo: usa una variable extra o `a, b = b, a + b`.","`print (s*96)**(1/4)` eleva el resultado del print, que es None: TypeError."],"donde":"Rebotes (8-6), series de clase (2-6), quiz del 16-6, parcial, quiz del 3-10, hoja impresa de métodos (22-9), problemario 81 al 103."}]};
const HARNESS = "import sys, json, re, math, linecache, traceback\n\nARCHIVO = \"programa.py\"\nLIMITE_SALIDA = 20000\n\n\nclass _Salida:\n    def __init__(self):\n        self.partes = []\n        self.total = 0\n\n    def write(self, s):\n        if not s:\n            return 0\n        s = str(s)\n        self.total += len(s)\n        if self.total > LIMITE_SALIDA:\n            raise _DemasiadaSalida()\n        self.partes.append([\"out\", s])\n        return len(s)\n\n    def flush(self):\n        pass\n\n\nclass _SinDatos(Exception):\n    pass\n\n\nclass _DemasiadaSalida(Exception):\n    pass\n\n\ndef _formatear(e):\n    if isinstance(e, SyntaxError):\n        txt = \"\".join(traceback.format_exception_only(type(e), e))\n        return txt, getattr(e, \"lineno\", None)\n    tb = e.__traceback__\n    while tb is not None and tb.tb_frame.f_code.co_filename != ARCHIVO:\n        tb = tb.tb_next\n    linea = None\n    t = tb\n    while t is not None:\n        if t.tb_frame.f_code.co_filename == ARCHIVO:\n            linea = t.tb_lineno\n        t = t.tb_next\n    if tb is None:\n        txt = \"\".join(traceback.format_exception_only(type(e), e))\n    else:\n        txt = \"\".join(traceback.format_exception(type(e), e, tb))\n    return txt, linea\n\n\ndef _ejecutar(codigo, entrada):\n    \"\"\"Ejecuta el programa completo. Devuelve (ns, salida, estado, error).\"\"\"\n    salida = _Salida()\n    lineas = entrada.split(\"\\n\") if entrada else []\n    if lineas and lineas[-1] == \"\":\n        lineas.pop()\n    estado = {\"leidas\": 0, \"pos\": 0, \"pedidas\": 0}\n\n    def _input(prompt=\"\"):\n        prompt = str(prompt)\n        if prompt:\n            salida.partes.append([\"prompt\", prompt])\n        estado[\"pedidas\"] += 1\n        if estado[\"leidas\"] >= len(lineas):\n            raise _SinDatos()\n        v = lineas[estado[\"leidas\"]]\n        estado[\"leidas\"] += 1\n        salida.partes.append([\"in\", v + \"\\n\"])\n        estado[\"pos\"] = len(salida.partes)\n        return v\n\n    ns = {\"__name__\": \"__main__\", \"input\": _input}\n    linecache.cache[ARCHIVO] = (len(codigo), None, codigo.splitlines(True), ARCHIVO)\n    error = None\n    viejo = sys.stdout\n    sys.stdout = salida\n    try:\n        cod = compile(codigo, ARCHIVO, \"exec\")\n        exec(cod, ns)\n    except _SinDatos:\n        error = {\"tipo\": \"SinDatos\", \"texto\": \"\", \"linea\": None}\n    except _DemasiadaSalida:\n        error = {\"tipo\": \"DemasiadaSalida\", \"texto\": \"\", \"linea\": None}\n    except SystemExit:\n        pass\n    except BaseException as e:\n        txt, linea = _formatear(e)\n        error = {\"tipo\": type(e).__name__, \"texto\": txt, \"linea\": linea}\n    finally:\n        sys.stdout = viejo\n    return ns, salida, estado, error\n\n\ndef _texto(partes, desde=0, tipos=(\"out\",)):\n    return \"\".join(p[1] for p in partes[desde:] if p[0] in tipos)\n\n\ndef _es_num(x):\n    return isinstance(x, (int, float)) and not isinstance(x, bool)\n\n\ndef _comparar(obt, esp, tol, desordenado):\n    if isinstance(esp, bool):\n        return isinstance(obt, bool) and obt == esp\n    if esp is None:\n        return obt is None\n    if _es_num(esp):\n        if not _es_num(obt):\n            return False\n        t = tol if tol is not None else max(1e-6, 1e-9 * abs(esp))\n        return abs(obt - esp) <= t\n    if isinstance(esp, str):\n        return isinstance(obt, str) and obt == esp\n    if isinstance(esp, list):\n        if not isinstance(obt, (list, tuple)):\n            return False\n        a, b = list(obt), list(esp)\n        if len(a) != len(b):\n            return False\n        if desordenado:\n            try:\n                a, b = sorted(a), sorted(b)\n            except TypeError:\n                return False\n        return all(_comparar(x, y, tol, False) for x, y in zip(a, b))\n    return obt == esp\n\n\ndef _repr(x):\n    try:\n        r = repr(x)\n    except Exception:\n        r = \"<valor>\"\n    return r if len(r) < 300 else r[:300] + \"…\"\n\n\ndef _numeros(txt):\n    return [float(m) for m in re.findall(r\"-?\\d+(?:\\.\\d+)?(?:[eE][-+]?\\d+)?\", txt)]\n\n\ndef _transcripcion(partes):\n    return \"\".join(p[1] for p in partes)\n\n\ndef trabajo(job_json):\n    job = json.loads(job_json)\n    modo = job.get(\"modo\")\n    codigo = job.get(\"codigo\", \"\")\n    res = {\"modo\": modo}\n\n    if modo == \"ejecutar\":\n        ns, salida, estado, error = _ejecutar(codigo, job.get(\"entrada\", \"\"))\n        res[\"transcripcion\"] = _transcripcion(salida.partes)\n        res[\"error\"] = error\n        return json.dumps(res)\n\n    if modo == \"funcion\":\n        ns, salida, estado, error = _ejecutar(codigo, job.get(\"entrada\", \"\"))\n        res[\"transcripcion\"] = _transcripcion(salida.partes)\n        res[\"error\"] = error\n        pruebas = []\n        if error is None:\n            for t in job[\"pruebas\"]:\n                r = {\"expr\": t[\"expr\"], \"esperado\": _repr(t[\"esperado\"]), \"ok\": False,\n                     \"obtenido\": None, \"error\": None, \"nota\": t.get(\"nota\", \"\")}\n                buf = _Salida()\n                viejo = sys.stdout\n                sys.stdout = buf\n                try:\n                    obt = eval(t[\"expr\"], ns)\n                    r[\"obtenido\"] = _repr(obt)\n                    r[\"ok\"] = _comparar(obt, t[\"esperado\"], t.get(\"tol\"), t.get(\"desordenado\", False))\n                    if not r[\"ok\"] and obt is None:\n                        r[\"pista\"] = \"La función devolvió None: falta un return o el return no se alcanza.\"\n                    elif not r[\"ok\"] and isinstance(obt, str) and isinstance(t[\"esperado\"], str) and obt.strip() == t[\"esperado\"]:\n                        r[\"pista\"] = \"El texto es correcto pero tiene espacios de más al inicio o al final.\"\n                    elif not r[\"ok\"] and isinstance(t[\"esperado\"], bool) and not isinstance(obt, bool):\n                        r[\"pista\"] = \"Se esperaba True o False (un booleano).\"\n                except _SinDatos:\n                    r[\"error\"] = \"La función pidió un dato con input(). Las funciones de este reto deben recibir los datos como parámetros.\"\n                except _DemasiadaSalida:\n                    r[\"error\"] = \"La función imprimió demasiado texto (posible ciclo infinito con print).\"\n                except BaseException as e:\n                    txt, linea = _formatear(e)\n                    r[\"error\"] = txt\n                    r[\"linea\"] = linea\n                finally:\n                    sys.stdout = viejo\n                pruebas.append(r)\n        res[\"pruebas\"] = pruebas\n        return json.dumps(res)\n\n    if modo == \"programa\":\n        pruebas = []\n        for t in job[\"pruebas\"]:\n            ns, salida, estado, error = _ejecutar(codigo, t[\"entrada\"])\n            r = {\"nombre\": t.get(\"nombre\", \"\"), \"entrada\": t[\"entrada\"],\n                 \"transcripcion\": _transcripcion(salida.partes), \"ok\": False, \"motivo\": \"\"}\n            resultado = _texto(salida.partes, estado[\"pos\"])\n            n_lineas = len([x for x in t[\"entrada\"].split(\"\\n\") if x != \"\"])\n            if error is not None:\n                if error[\"tipo\"] == \"SinDatos\":\n                    r[\"motivo\"] = \"El programa pidió más datos de los que trae esta prueba. Si el dato era válido, no debió volver a pedirlo.\"\n                elif error[\"tipo\"] == \"DemasiadaSalida\":\n                    r[\"motivo\"] = \"El programa imprimió demasiado texto (posible ciclo infinito).\"\n                else:\n                    r[\"motivo\"] = \"El programa terminó con un error.\"\n                    r[\"error\"] = error\n            elif estado[\"leidas\"] < n_lineas:\n                r[\"motivo\"] = \"El programa no volvió a pedir el dato después de un valor inválido. Usa un ciclo while con bandera para validar.\"\n            else:\n                chk = t[\"check\"]\n                low = resultado.lower()\n                if not resultado.strip():\n                    r[\"motivo\"] = \"El programa no mostró ningún resultado después de leer los datos.\"\n                elif chk[0] == \"si\":\n                    r[\"ok\"] = re.search(r\"\\bno\\b\", low) is None\n                    if not r[\"ok\"]:\n                        r[\"motivo\"] = \"Se esperaba que el programa dijera que SÍ cumple, pero su mensaje contiene la palabra «no».\"\n                elif chk[0] == \"no\":\n                    r[\"ok\"] = re.search(r\"\\bno\\b\", low) is not None\n                    if not r[\"ok\"]:\n                        r[\"motivo\"] = \"Se esperaba que el programa dijera que NO cumple (con la palabra «no» en el mensaje).\"\n                elif chk[0] == \"num\":\n                    nums = _numeros(resultado)\n                    v = chk[1]\n                    r[\"ok\"] = any(abs(x - v) <= (chk[2] if len(chk) > 2 else 1e-9) for x in nums)\n                    if not r[\"ok\"]:\n                        r[\"motivo\"] = \"No aparece el valor esperado \" + str(v) + \" en lo que imprimió el programa.\"\n                elif chk[0] == \"token\":\n                    r[\"ok\"] = re.search(r\"(?<![0-9A-Za-z])\" + re.escape(chk[1]) + r\"(?![0-9A-Za-z])\", resultado) is not None\n                    if not r[\"ok\"]:\n                        r[\"motivo\"] = \"No aparece «\" + chk[1] + \"» en lo que imprimió el programa.\"\n            pruebas.append(r)\n        res[\"pruebas\"] = pruebas\n        return json.dumps(res)\n\n    return json.dumps({\"fatal\": \"modo desconocido\"})\n";

const S={xp:0,lec:{},retos:{},codigo:{},entrada:{},dias:[],sim:null,simHist:[]};
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&typeof p==="object")Object.assign(S,p);}}catch(e){}
let tG=null;function guardar(){clearTimeout(tG);tG=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}},120);}
const fechaStr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function marcarDia(){const h=fechaStr(new Date());if(!S.dias.includes(h)){S.dias.push(h);guardar();}}
function racha(){const set=new Set(S.dias);const d=new Date();if(!set.has(fechaStr(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(fechaStr(d))){n++;d.setDate(d.getDate()-1);}return n;}
function estrellasTot(){return Object.values(S.lec).reduce((a,l)=>a+(l.est||0),0)+Object.values(S.retos).filter(r=>r.ok).length;}
function sumarXP(n){S.xp+=n;guardar();barra();}
function barra(){$("#st-xp").textContent=S.xp;$("#st-est").textContent=estrellasTot();$("#st-racha").textContent=racha();}
let tT=null;function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>{t.hidden=true;},1900);}
function diasQuiz(){const q=new Date(2026,9,13);const h=new Date();h.setHours(0,0,0,0);return Math.round((q-h)/86400000);}
function textoQuiz(){const d=diasQuiz();return d>1?"faltan "+d+" días":d===1?"es mañana":d===0?"es hoy":"ya pasó: sigue practicando para el próximo";}

/* ---------------- navegación ---------------- */
let actual={p:"mapa"};
function ir(p,arg){
  actual={p,arg};cerrarCapa();
  ({mapa:verMapa,desafios:verDesafios,reto:verReto,apuntes:verApuntes,final:verFinal}[p]||verMapa)(arg);
  window.scrollTo({top:0});
  if(p==="reto"||p==="final")Py.iniciar();
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){e.preventDefault();ir(g.dataset.go,g.dataset.arg);return;}
});
function cerrarCapa(){$("#capa").innerHTML="";document.body.style.overflow="";}
function unidadDe(lid){return LECS.find(x=>x.l.id===lid);}

/* ---------------- MAPA ---------------- */
function siguiente(){
  for(const {u,l} of LECS){if(!(S.lec[l.id]&&S.lec[l.id].est))return{tipo:"lec",u,l};}
  for(const u of U){const p=u.retos.find(r=>!(S.retos[r]&&S.retos[r].ok));if(p)return{tipo:"ret",u,r:p};}
  return{tipo:"final"};
}
const ZIG=[0,1,1.5,1,0,-1,-1.5,-1];
function estrellasHTML(n){let h="";for(let i=0;i<3;i++)h+='<svg style="color:'+(i<n?"var(--gold)":"var(--gray)")+'"><use href="#i-estrella"/></svg>';return h;}
function verMapa(){
  const sig=siguiente();
  const lecHechas=LECS.filter(x=>S.lec[x.l.id]&&S.lec[x.l.id].est).length;
  const retHechos=Object.values(S.retos).filter(r=>r.ok).length;
  const pct=Math.round((lecHechas+retHechos)/(LECS.length+TOTAL_RETOS)*100);
  let cta;
  if(sig.tipo==="lec")cta='<button type="button" class="btn" data-lec="'+sig.l.id+'">'+(lecHechas?"Continuar":"Empezar")+": "+esc(sig.l.titulo)+"</button>";
  else if(sig.tipo==="ret")cta='<button type="button" class="btn" data-go="reto" data-arg="'+sig.r+'">Siguiente desafío: '+esc(RT[sig.r].titulo)+"</button>";
  else cta='<button type="button" class="btn" data-go="final">Hacer el quiz de práctica</button>';
  let h='<div class="col"><section class="hero"><span class="ceja">Quiz en computadora · martes 13 de octubre · '+textoQuiz()+'</span>'+
    '<h1>Tu ruta para el quiz</h1><p>'+U.length+' temas, en el orden en que conviene estudiarlos: toda la teoría de tus apuntes y todos los ejercicios del profesor. Cada lección explica primero y después te pregunta, una cosa a la vez. Al final de cada tema hay desafíos donde escribes código de verdad.</p><p class="nodo-s">Si el tiempo no alcanza antes del martes, haz primero los desafíos marcados «Prioridad para el martes».</p>'+
    '<div class="hero-pie">'+cta+'<div class="progreso"><span>'+lecHechas+" de "+LECS.length+" lecciones · "+retHechos+" de "+TOTAL_RETOS+' desafíos</span><div class="barra"><i style="width:'+pct+'%"></i></div></div></div></section>';
  let k=0;
  U.forEach(u=>{
    const hechas=u.lecciones.filter(l=>S.lec[l.id]&&S.lec[l.id].est).length;
    const rh=u.retos.filter(r=>S.retos[r]&&S.retos[r].ok).length;
    h+='<section class="unidad u-'+u.color+'" id="'+u.id+'"><div class="u-cab"><span class="u-num">'+u.n+'</span><h2>'+esc(u.titulo)+'</h2><p>'+esc(u.sub)+'</p>'+
      '<div class="u-pie"><span>'+hechas+" de "+u.lecciones.length+" lecciones"+(u.retos.length?" · "+rh+" de "+u.retos.length+" desafíos":"")+'</span><button type="button" class="link" data-go="apuntes" data-arg="'+u.id+'">Ver el resumen del tema</button></div></div><div class="camino">';
    u.lecciones.forEach(l=>{
      const st=S.lec[l.id];const est=st&&st.est||0;
      const esAct=sig.tipo==="lec"&&sig.l.id===l.id;
      const cls=est?"hecho":esAct?"actual":"";
      h+='<div class="paso'+(esAct?" con-globo":"")+'" style="--x:'+ZIG[k++%ZIG.length]+'">'+(esAct?'<span class="globo">'+(lecHechas?"Sigue aquí":"Empieza aquí")+"</span>":"")+
        '<button type="button" class="nodo '+cls+'" data-lec="'+l.id+'" aria-label="Lección '+esc(l.titulo)+'">'+ic(est?"check":"libro")+'</button><div class="estrellas" aria-label="'+est+' estrellas">'+estrellasHTML(est)+'</div><span class="nodo-t">'+esc(l.titulo)+"</span></div>";
    });
    if(u.retos.length){
      const esAct=sig.tipo==="ret"&&sig.u.id===u.id;
      h+='<div class="paso'+(esAct?" con-globo":"")+'" style="--x:'+ZIG[k++%ZIG.length]+'">'+(esAct?'<span class="globo">Escribe código</span>':"")+
        '<button type="button" class="nodo desafio '+(rh===u.retos.length?"hecho":(esAct||hechas===u.lecciones.length)?"actual":"")+'" data-go="desafios" data-arg="'+u.id+'" aria-label="Desafíos de '+esc(u.titulo)+'">'+ic("bandera")+'</button><span class="nodo-t">Desafíos</span><span class="nodo-s">'+rh+" de "+u.retos.length+"</span></div>";
    }
    h+="</div></section>";
  });
  const ult=S.simHist[0];
  h+='<section class="unidad u-oro"><div class="u-cab"><span class="u-num">'+ic("trofeo").replace("<svg",'<svg style="width:28px;height:28px"')+'</span><h2>Quiz de práctica</h2><p>3 problemas al azar con reloj y sin pistas, como el día del quiz.</p></div>'+
    '<div class="camino"><div class="paso'+(sig.tipo==="final"?" con-globo":"")+'"><button type="button" class="nodo '+(ult?"hecho":sig.tipo==="final"?"actual":"")+'" data-go="final" aria-label="Quiz de práctica">'+ic("trofeo")+'</button><span class="nodo-t">Quiz de práctica</span><span class="nodo-s">'+(ult?"Último: "+ult.bien+" de 3":"Sin hacer")+"</span></div></div></section></div>";
  $("#pantalla").innerHTML=h;
  $$("[data-lec]").forEach(b=>b.addEventListener("click",()=>abrirLeccion(b.dataset.lec)));
  barra();
}

/* ---------------- LECCIÓN ---------------- */
let L=null;
function abrirLeccion(lid){
  const {u,l}=unidadDe(lid);
  const items=l.items.map(it=>({it,rep:false}));
  L={u,l,cola:items,i:0,errores:0,xp:0,preguntas:l.items.filter(x=>x.t!=="aprende").length,bien:0,est:null,res:null};
  document.body.style.overflow="hidden";
  $("#capa").innerHTML='<div class="lec u-'+u.color+'" role="dialog" aria-modal="true" aria-label="Lección '+esc(l.titulo)+'"><div class="lec-top"><button type="button" class="cerrar" id="lec-x" aria-label="Salir de la lección">'+ic("x")+'</button><div class="barra" aria-hidden="true"><i id="lec-bar"></i></div><span class="lec-n" id="lec-n"></span></div><div class="lec-body" id="lec-body"><div class="lec-in" id="lec-in"></div></div><div class="lec-pie" id="lec-pie"><div class="pie-in" id="pie-in"></div></div></div>';
  $("#lec-x").addEventListener("click",salirLeccion);
  document.addEventListener("keydown",teclasLec);
  pintarItem();
}
function salirLeccion(){
  if(!L||L.res){cerrarLeccion();return;}
  const d=document.createElement("div");d.className="dialogo";
  d.innerHTML='<div><h3>¿Salir de la lección?</h3><p>Lo que llevas de esta lección no se guarda.</p><div class="fila" style="justify-content:center"><button type="button" class="btn sec" id="dl-no">Seguir</button><button type="button" class="btn bad" id="dl-si">Salir</button></div></div>';
  $(".lec").appendChild(d);$("#dl-no").focus();
  $("#dl-no").addEventListener("click",()=>d.remove());
  $("#dl-si").addEventListener("click",cerrarLeccion);
}
function cerrarLeccion(){document.removeEventListener("keydown",teclasLec);L=null;cerrarCapa();verMapa();}
function teclasLec(ev){
  if(!L)return;
  if($(".dialogo")){if(ev.key==="Escape")$(".dialogo").remove();return;}
  if(ev.target.tagName==="TEXTAREA"||ev.target.tagName==="INPUT")return;
  if(ev.key==="Enter"){const b=$("#accion");if(b&&!b.disabled){ev.preventDefault();b.click();}}
  else if(/^[1-4]$/.test(ev.key)){const o=$$("#lec-in [data-op]")[+ev.key-1];if(o&&!o.disabled)o.click();}
  else if(ev.key==="Escape")salirLeccion();
}
function progreso(){const tot=L.cola.length;$("#lec-bar").style.width=Math.round(L.i/tot*100)+"%";const q=L.cola.slice(0,L.i).filter(x=>x.it.t!=="aprende").length;$("#lec-n").textContent=L.i<tot?(L.i+1)+"/"+tot:"";}
function pie(html,clase){const p=$("#lec-pie");p.className="lec-pie"+(clase?" "+clase:"");$("#pie-in").innerHTML=html;}
function boton(txt,dis){return '<span></span><button type="button" class="btn" id="accion"'+(dis?" disabled":"")+">"+txt+"</button>";}
const TIPOS={aprende:["bombilla","Aprende"],elige:["lupa","Elige la respuesta"],completa:["lapiz","Completa el código"],salida:["pantalla","¿Qué muestra la pantalla?"],error:["lupa","Encuentra el error"],ordena:["piezas","Arma el programa"]};
function pintarItem(){
  if(L.i>=L.cola.length){terminarLeccion();return;}
  progreso();
  const c=L.cola[L.i];const it=c.it;
  const t=TIPOS[it.t];
  const z=$("#lec-in");$("#lec-body").scrollTop=0;
  const cab='<span class="tipo">'+ic(t[0])+t[1]+(c.rep?" · repaso":"")+"</span>";
  ({aprende:itAprende,elige:itElige,completa:itCompleta,salida:itSalida,error:itError,ordena:itOrdena})[it.t](it,z,cab);
}
function resolver(bien,titulo,cuerpo){
  const c=L.cola[L.i];
  if(bien){L.bien++;const g=c.rep?5:10;L.xp+=g;}
  else{L.errores++;if(!c.rep)L.cola.push({it:c.it,rep:true});}
  pie('<div class="fb" role="status"><h3>'+ic(bien?"check":"x")+(titulo||(bien?"¡Correcto!":"No es así"))+"</h3>"+(cuerpo||"")+'</div><button type="button" class="btn '+(bien?"ok":"bad")+'" id="accion">Continuar</button>',bien?"ok":"bad");
  $("#accion").addEventListener("click",()=>{L.i++;pintarItem();});
  $("#accion").focus({preventScroll:true});
}
function itAprende(it,z,cab){
  z.innerHTML=cab+'<article class="aprende"><h2>'+esc(it.titulo)+"</h2>"+(it.texto.length>1?"<ul>"+it.texto.map(p=>"<li>"+fmt(p)+"</li>").join("")+"</ul>":"<p>"+fmt(it.texto[0])+"</p>")+
    (it.code?codigo(it.code)+(it.salida!=null?pantalla(it.salida):""):"")+
    (it.ojo?'<div class="ojo">'+ic("bombilla")+'<div><b>Ojo</b>'+fmt(it.ojo)+"</div></div>":"")+"</article>";
  pie(boton("Entendido"));
  $("#accion").addEventListener("click",()=>{L.i++;pintarItem();});
}
function opcionesHTML(ops,mono,clase){return '<div class="ops'+(clase?" "+clase:"")+'">'+ops.map((o,i)=>'<button type="button" class="op" data-op="'+i+'" aria-pressed="false"><span class="k">'+(i+1)+'</span><span class="v'+(mono?" mono":"")+'">'+(mono?esc(o):fmt(o))+"</span></button>").join("")+"</div>";}
function elegible(z,alElegir){
  $$("[data-op]",z).forEach(b=>b.addEventListener("click",()=>{$$("[data-op]",z).forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");alElegir(+b.dataset.op);}));
}
function marcarOps(z,correcta,elegida){$$("[data-op]",z).forEach((b,i)=>{b.disabled=true;if(i===correcta)b.classList.add("ok");else if(i===elegida)b.classList.add("bad");});}
function itElige(it,z,cab){
  const orden=barajar(it.ops.map((o,i)=>i),it.id);
  const ops=orden.map(i=>it.ops[i]);const ok=orden.indexOf(it.ok);
  L.ok=ok;
  z.innerHTML=cab+'<p class="pregunta">'+fmt(it.q)+"</p>"+(it.code?codigo(it.code):"")+opcionesHTML(ops,false);
  let sel=null;pie(boton("Comprobar",true));
  elegible(z,i=>{sel=i;$("#accion").disabled=false;});
  $("#accion").addEventListener("click",()=>{const bien=sel===ok;marcarOps(z,ok,sel);resolver(bien,null,(bien?"":'<p class="corr">Respuesta correcta: '+fmt(ops[ok])+"</p>")+"<p>"+fmt(it.exp)+"</p>");});
}
function itSalida(it,z,cab){
  const todas=[it.correcta].concat(it.ops);
  const orden=barajar(todas.map((o,i)=>i),it.id);
  const ops=orden.map(i=>todas[i]);const ok=orden.indexOf(0);
  L.ok=ok;
  z.innerHTML=cab+'<p class="pregunta">'+fmt(it.q)+"</p>"+codigo(it.code)+opcionesHTML(ops,true,"salidas");
  let sel=null;pie(boton("Comprobar",true));
  elegible(z,i=>{sel=i;$("#accion").disabled=false;});
  $("#accion").addEventListener("click",()=>{const bien=sel===ok;marcarOps(z,ok,sel);resolver(bien,null,pantalla(it.correcta).replace('class="pantalla"','class="pantalla" style="margin:4px 0"')+"<p>"+fmt(it.exp)+"</p>");});
}
function itCompleta(it,z,cab){
  const orden=barajar(it.ops.map((o,i)=>i),it.id);
  const ops=orden.map(i=>it.ops[i]);const ok=orden.indexOf(it.ok);
  const partes=it.code.split("___");
  const pinta=v=>'<pre class="code"><code>'+hl(partes[0])+'<span class="hueco'+(v==null?" vacio":"")+'" id="hueco">'+(v==null?"___":esc(v))+"</span>"+hl(partes[1])+"</code></pre>";
  L.ok=ok;
  z.innerHTML=cab+'<p class="pregunta">'+fmt(it.q)+'</p><div id="cod">'+pinta(null)+'</div><div class="fichas">'+ops.map((o,i)=>'<button type="button" class="ficha" data-op="'+i+'" aria-pressed="false">'+esc(o)+"</button>").join("")+"</div>";
  let sel=null;pie(boton("Comprobar",true));
  $$("[data-op]",z).forEach(b=>b.addEventListener("click",()=>{$$("[data-op]",z).forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");sel=+b.dataset.op;$("#cod").innerHTML=pinta(ops[sel]);$("#accion").disabled=false;}));
  $("#accion").addEventListener("click",()=>{
    const bien=sel===ok;$$("[data-op]",z).forEach(b=>b.disabled=true);
    $("#cod").innerHTML=pinta(ops[ok]);$("#hueco").classList.add(bien?"ok":"bad");
    resolver(bien,null,(bien?"":'<p class="corr">Lo correcto es <code>'+esc(ops[ok])+"</code>.</p>")+"<p>"+fmt(it.exp)+"</p>"+(it.salida?pantalla(it.salida).replace('class="pantalla"','class="pantalla" style="margin-top:6px"'):""));
  });
}
function itError(it,z,cab){
  const e=ER[it.ref];
  const lineas=e.codigo.split("\n");
  const orden=barajar(e.opciones.map((o,i)=>i),it.id);const ops=orden.map(i=>e.opciones[i]);const ok=orden.indexOf(e.correcta);
  let fase="linea",lineaSel=null,mal=false,sel=null;L.ok=ok;
  z.innerHTML=cab+'<p class="pregunta">'+esc(e.titulo)+'</p><p class="fase" id="fase-t">Paso 1 de 2 · Toca la línea que hay que corregir</p>'+
    '<div class="listado" id="listado">'+lineas.map((ln,i)=>'<button type="button" class="cl" data-n="'+(i+1)+'" aria-pressed="false"><span class="nl">'+(i+1)+"</span><span>"+(hl(ln)||" ")+"</span></button>").join("")+"</div>"+
    pantalla(e.salida,"Lo que muestra la terminal")+'<div id="paso2"></div>';
  pie(boton("Comprobar",true));
  $$(".cl",z).forEach(b=>b.addEventListener("click",()=>{if(fase!=="linea")return;$$(".cl",z).forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");lineaSel=+b.dataset.n;$("#accion").disabled=false;}));
  const accion=()=>{
    if(fase==="linea"){
      const bien=e.lineas.includes(lineaSel);if(!bien)mal=true;
      $$(".cl",z).forEach(b=>{b.disabled=true;const n=+b.dataset.n;if(e.lineas.includes(n)&&(bien?n===lineaSel:n===e.lineas[0]))b.classList.add("ok");else if(n===lineaSel)b.classList.add("bad");});
      const nota=bien?(e.linea_error&&!e.lineas.includes(e.linea_error)?"Bien. Python señaló la línea "+e.linea_error+", pero la causa está en la "+lineaSel+".":"Bien, es la línea "+lineaSel+"."):
        "Era la línea "+e.lineas[0]+"."+(e.linea_error&&e.linea_error!==e.lineas[0]?" Python señaló la "+e.linea_error+", pero ahí solo explotó: la causa está antes.":"");
      $("#paso2").innerHTML='<div class="aviso '+(bien?"ok":"bad")+'">'+esc(nota)+'</div><p class="fase" style="margin-top:14px">Paso 2 de 2 · ¿Cómo se arregla?</p>'+opcionesHTML(ops,false);
      fase="arreglo";$("#accion").disabled=true;
      elegible($("#paso2"),i=>{sel=i;$("#accion").disabled=false;});
      $("#fase-t").textContent="Paso 1 de 2 · Línea marcada";
      $("#paso2").scrollIntoView({block:"nearest",behavior:"smooth"});
    }else{
      const bien=sel===ok;marcarOps($("#paso2"),ok,sel);
      resolver(bien&&!mal,bien&&!mal?"¡Correcto!":(bien?"Arreglo correcto, pero la línea no":"No es así"),(bien?"":'<p class="corr">El arreglo: '+fmt(ops[ok])+"</p>")+"<p><b>Qué dice el mensaje:</b> "+fmt(e.significado)+"</p><p>"+fmt(e.leccion)+"</p>");
    }
  };
  $("#accion").addEventListener("click",accion);
}
function itOrdena(it,z,cab){
  const a=AR[it.ref];
  const bl=a.lineas.map((l,i)=>({id:"s"+i,t:l[0],ind:l[1]}));
  a.trampas.forEach((t,i)=>bl.push({id:"t"+i,t:t[0],ind:t[1],razon:t[2]}));
  (TX[a.id]||[]).forEach((t,i)=>bl.push({id:"x"+i,t:t[0],ind:t[1],razon:t[2]}));
  const B=Object.fromEntries(bl.map(b=>[b.id,b]));
  let banco=barajar(bl.map(b=>b.id),it.id+(L.cola[L.i].rep?"r":"")),prog=[];
  const blq=(b,extra)=>'<button type="button" class="blq'+(extra||"")+'" data-b="'+b.id+'"><span class="ind" style="--n:'+b.ind+'"></span><span class="bt">'+hl(b.t)+"</span></button>";
  function pinta(){
    $("#prog").innerHTML=prog.length?prog.map(id=>blq(B[id])).join(""):'<span class="vacio-t">Toca los bloques de abajo en el orden correcto.</span>';
    $("#banco").innerHTML=banco.length?banco.map(id=>blq(B[id])).join(""):'<span class="vacio-t">Ya usaste todos los bloques.</span>';
    $$("#prog .blq").forEach(b=>b.addEventListener("click",()=>{if(hecho)return;prog=prog.filter(x=>x!==b.dataset.b);banco.push(b.dataset.b);pinta();}));
    $$("#banco .blq").forEach(b=>b.addEventListener("click",()=>{if(hecho)return;banco=banco.filter(x=>x!==b.dataset.b);prog.push(b.dataset.b);pinta();}));
    $("#accion").disabled=prog.length===0;
  }
  let hecho=false;
  const ntr=a.trampas.length+(TX[a.id]||[]).length;
  z.innerHTML=cab+'<p class="pregunta">'+esc(a.titulo)+'</p><p>'+fmt(a.enunciado)+' Cada bloque ya trae su sangría: cada rayita vertical a la izquierda es un nivel. <b>'+ntr+" bloques son trampas</b>: no los uses.</p>"+
    '<span class="zona-t">Tu programa</span><div class="programa" id="prog"></div><span class="zona-t">Bloques</span><div class="banco" id="banco"></div>';
  pie(boton("Comprobar",true));pinta();
  $("#accion").addEventListener("click",()=>{
    hecho=true;
    const r=verificar(a,prog.map(id=>B[id]));
    $$("#prog .blq").forEach((b,i)=>{if(r.ok)b.classList.add("ok");else if(i===r.idx)b.classList.add("bad");});
    const sol='<details class="pleg" style="margin-top:6px"><summary>Ver el programa completo</summary>'+codigo(a.lineas.map(l=>"    ".repeat(l[1])+l[0]).join("\n"))+"</details>";
    resolver(r.ok,null,"<p>"+fmt(r.msg)+"</p>"+(r.ok?pantalla(a.salida_ejemplo,"Al ejecutarlo, la pantalla muestra"):sol));
  });
}
function verificar(a,user){
  const sol=a.lineas;
  for(let i=0;i<user.length;i++)if(user[i].razon)return{ok:false,idx:i,msg:"La línea "+(i+1)+" es una trampa. "+user[i].razon};
  const grupo=new Array(sol.length).fill(-1);a.intercambiables.forEach((g,gi)=>g.forEach(k=>grupo[k]=gi));
  let i=0;
  while(i<sol.length){
    if(i>=user.length){const f=sol.length-user.length;return{ok:false,idx:null,msg:"Lo que pusiste va bien, pero falta"+(f>1?"n ":" ")+f+" línea"+(f>1?"s":"")+"."};}
    if(grupo[i]>=0){
      const g=a.intercambiables[grupo[i]];const n=g.length;const solK=sol.slice(i,i+n).map(x=>x[0]+"|"+x[1]);
      for(let k=0;k<n;k++){const u=user[i+k];if(!u){const f=sol.length-user.length;return{ok:false,idx:null,msg:"Falta"+(f>1?"n ":" ")+f+" línea"+(f>1?"s":"")+"."};}
        const p=solK.indexOf(u.t+"|"+u.ind);if(p<0)return{ok:false,idx:i+k,msg:"La línea "+(i+k+1)+" no va en ese lugar."};solK[p]=null;}
      i+=n;continue;
    }
    if(user[i].t!==sol[i][0]||user[i].ind!==sol[i][1])return{ok:false,idx:i,msg:"La línea "+(i+1)+" no va en ese lugar."};
    i++;
  }
  return{ok:true,msg:"Ese es el orden del programa de clase."+(a.intercambiables.length?" Algunas líneas se podían poner en otro orden sin cambiar el resultado.":"")};
}

/* ---------------- Python (Pyodide en un Worker) ---------------- */
const PYV="0.26.4";
const WORKER_SRC=`let py=null;
self.onmessage=async(ev)=>{const m=ev.data;
 if(m.tipo==="init"){try{importScripts(m.base+"pyodide.js");py=await loadPyodide({indexURL:m.base});py.runPython(m.harness);self.postMessage({tipo:"listo",version:py.runPython("import sys; sys.version.split()[0]")});}catch(e){self.postMessage({tipo:"fallo",error:String(e&&e.message||e)});}}
 else if(m.tipo==="job"){try{const f=py.globals.get("trabajo");const r=f(m.job);if(f.destroy)f.destroy();self.postMessage({tipo:"resultado",id:m.id,r:r});}catch(e){self.postMessage({tipo:"resultado",id:m.id,r:JSON.stringify({fatal:String(e&&e.message||e)})});}}
};`;
const Py={estado:"sin",worker:null,base:null,version:"",prom:null,seq:0,pend:new Map(),
  fuentes(){const l=[];try{if(/^https?:$/.test(location.protocol))l.push(new URL("py/",location.href).href);}catch(e){}l.push("https://cdn.jsdelivr.net/npm/pyodide@"+PYV+"/");return l;},
  iniciar(){
    if(this.estado==="listo")return Promise.resolve(true);if(this.prom)return this.prom;
    this.prom=(async()=>{
      this.estado="cargando";pyEstado();
      for(const base of(this.base?[this.base]:this.fuentes())){
        if(base.indexOf("cdn.jsdelivr")<0){try{const r=await fetch(base+"pyodide.js",{method:"HEAD",cache:"no-store"});if(!r.ok)continue;}catch(e){continue;}}
        if(await this.probar(base)){this.base=base;this.estado="listo";pyEstado();this.prom=null;return true;}
      }
      this.estado="no";pyEstado();this.prom=null;return false;
    })();
    return this.prom;
  },
  probar(base){return new Promise(res=>{let w;try{w=new Worker(URL.createObjectURL(new Blob([WORKER_SRC],{type:"text/javascript"})));}catch(e){res(false);return;}
    const to=setTimeout(()=>{w.terminate();res(false);},120000);
    w.onmessage=ev=>{const m=ev.data;if(m.tipo==="listo"){clearTimeout(to);this.worker=w;this.version=m.version||"";w.onmessage=ev2=>this.recibir(ev2.data);res(true);}else if(m.tipo==="fallo"){clearTimeout(to);w.terminate();res(false);}};
    w.onerror=()=>{clearTimeout(to);w.terminate();res(false);};
    w.postMessage({tipo:"init",base:base,harness:HARNESS});});},
  recibir(m){if(m.tipo!=="resultado")return;const p=this.pend.get(m.id);if(!p)return;this.pend.delete(m.id);clearTimeout(p.to);let r;try{r=JSON.parse(m.r);}catch(e){r={fatal:"Respuesta inválida"};}p.res(r);},
  async correr(job,ms){
    if(!(await this.iniciar()))return{noPython:true};
    return new Promise(res=>{const id=++this.seq;
      const to=setTimeout(()=>{this.pend.delete(id);try{this.worker.terminate();}catch(e){}this.worker=null;this.estado="sin";pyEstado();res({timeout:true});},ms);
      this.pend.set(id,{res,to});this.worker.postMessage({tipo:"job",id:id,job:JSON.stringify(job)});});
  }
};
function pyEstado(){const el=$("#py-estado");if(!el)return;const e=Py.estado;el.dataset.e=e;el.querySelector("span").textContent=e==="listo"?"Python "+Py.version+" listo":e==="cargando"?"Preparando Python (solo la primera vez, unos segundos)…":e==="no"?"Python no se pudo cargar aquí":"Python se prepara al comprobar";}

function explicarError(texto,linea){
  const t=texto||"";const L2=linea?"la línea "+linea:"esa línea";
  const R=[
    [/expected ':'/,"Faltan los dos puntos al final de "+L2+"."],
    [/leading zeros in decimal/,"Hay un decimal escrito con coma en "+L2+". Los decimales van con punto: 0.0001."],
    [/was never closed/,"Un paréntesis o corchete abierto en "+L2+" nunca se cerró."],
    [/unterminated string literal/,"Faltan las comillas de cierre de un texto en "+L2+"."],
    [/expected an indented block/,"Después de una línea que termina en dos puntos va al menos una línea con 4 espacios de sangría."],
    [/unexpected indent/,"La "+L2.replace("la ","")+" tiene sangría de más."],
    [/unindent does not match/,"La sangría de "+L2+" no coincide con las anteriores. Usa siempre múltiplos de 4 espacios."],
    [/Maybe you meant '==' or ':=' instead of '='/,"Dentro de un if o while se compara con ==. Un solo = guarda un valor."],
    [/invalid syntax/,"Python no entiende "+L2+". Revisa: una palabra mal escrita (retur), un operador en español (y, o), = en vez de ==, o un paréntesis o comillas sin cerrar en la línea anterior."],
    [/Did you forget to import '(\w+)'/,m=>"Falta importar la biblioteca: agrega import "+m[1]+" al inicio."],
    [/name '([^']+)' is not defined\. Did you mean: '([^']+)'/,m=>"«"+m[1]+"» no existe. Python sugiere «"+m[2]+"»: revisa mayúsculas, tildes y letras."],
    [/name '([^']+)' is not defined/,m=>"«"+m[1]+"» no existe en ese punto: está mal escrita, se define más abajo, o nunca se creó."],
    [/cannot access local variable '([^']+)'/,m=>"Usas «"+m[1]+"» antes de darle un primer valor dentro de la función."],
    [/object is not callable/,"Hay un paréntesis pegado a algo que no es una función. ¿Falta un * en una multiplicación?"],
    [/can only concatenate str/,"Uniste texto con un número usando +. En print sepáralos con coma, o convierte con str()."],
    [/unsupported operand type\(s\).*NoneType/,"Uno de los valores es None: seguramente a una función le falta el return."],
    [/unsupported operand type/,"Operaste dos valores de tipos que no se combinan (por ejemplo texto y número). ¿Faltó int() o float()?"],
    [/cannot be interpreted as an integer/,"range() recibió un decimal. Usa enteros: 10000 (no 10.000), n // 2 (no n / 2)."],
    [/not subscriptable/,"Usaste corchetes con algo que no es una lista ni un texto, como append[i] en vez de append(i)."],
    [/object is not iterable/,"El for intenta recorrer algo que no es una lista, un texto ni un range. ¿Faltó range()?"],
    [/missing (\d+) required positional argument/,"Llamaste la función con menos datos de los que pide su def."],
    [/takes (\d+) positional arguments? but (\d+)/,"Llamaste la función con más datos de los que pide su def."],
    [/invalid literal for int\(\)/,"int() recibió un texto que no es un número entero. Valida con isdigit() antes de convertir."],
    [/could not convert string to float/,"float() recibió un texto que no es un número."],
    [/math domain error/,"Le pediste algo imposible a math: raíz de un negativo o acos fuera de [−1, 1]. Revisa los paréntesis."],
    [/index out of range/,"Pediste una posición que no existe. Las posiciones van de 0 a len − 1."],
    [/division by zero|modulo by zero/,"División entre 0. Busca de dónde salió ese 0."],
    [/has no attribute '([^']+)'/,m=>"«"+m[1]+"» no existe para ese tipo de dato o está mal escrito."]
  ];
  for(const [re,msg] of R){const m=t.match(re);if(m)return typeof msg==="function"?msg(m):msg;}
  return "Lee la última línea del mensaje: dice el tipo de error. «line N» indica dónde pasó.";
}

function teclasEditor(ev,ed){
  const v=ed.value,s=ed.selectionStart,e=ed.selectionEnd;
  const ins=txt=>{ed.focus();if(!document.execCommand||!document.execCommand("insertText",false,txt)){ed.setRangeText(txt,ed.selectionStart,ed.selectionEnd,"end");ed.dispatchEvent(new Event("input"));}};
  if(ev.key==="Enter"&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();$("#probar").click();return;}
  if(ev.key==="Tab"){
    ev.preventDefault();const ini=v.lastIndexOf("\n",s-1)+1;
    if(s===e&&!ev.shiftKey){ins("    ");return;}
    let fin=e;if(v.charAt(e-1)==="\n")fin=e-1;else{const n=v.indexOf("\n",e);fin=n<0?v.length:n;}
    const bloque=v.slice(ini,fin);const nuevo=ev.shiftKey?bloque.split("\n").map(l=>l.replace(/^ {1,4}/,"")).join("\n"):bloque.split("\n").map(l=>"    "+l).join("\n");
    ed.setSelectionRange(ini,fin);ins(nuevo);ed.setSelectionRange(ini,ini+nuevo.length);return;
  }
  if(ev.key==="Enter"&&!ev.shiftKey&&!ev.altKey){
    const ini=v.lastIndexOf("\n",s-1)+1;const linea=v.slice(ini,s);let sang=(linea.match(/^ */)||[""])[0];
    if(/:\s*(#.*)?$/.test(linea))sang+="    ";else if(/^\s*(return|break|pass|continue)\b/.test(linea))sang=sang.slice(0,Math.max(0,sang.length-4));
    ev.preventDefault();ins("\n"+sang);return;
  }
  if(ev.key==="Backspace"&&s===e&&s>0){const ini=v.lastIndexOf("\n",s-1)+1;const antes=v.slice(ini,s);if(antes.length>0&&/^ +$/.test(antes)&&antes.length%4===0){ev.preventDefault();ed.setSelectionRange(s-4,s);ins("");}}
}

async function probar(r){
  const ed=$("#ed");const sz=$("#salida-zona");$("#pruebas-zona").innerHTML="";
  sz.innerHTML=pantalla(Py.estado==="listo"?"(ejecutando…)":"(preparando Python, solo la primera vez…)","Pantalla");
  const en=$("#entrada").value;
  const res=await Py.correr({modo:"ejecutar",codigo:ed.value,entrada:en?en+"\n":""},6000);
  if(ED.id!==r.id)return;
  if(res.noPython){sz.innerHTML=sinPython(r);return;}
  let txt="",extra="";
  if(res.timeout){txt="El programa no terminó en 6 segundos y se detuvo.";extra='<div class="aviso bad"><b>Posible ciclo infinito.</b> Revisa que la variable de la condición del while cambie dentro del ciclo. En VS Code se detiene con Ctrl + C.</div>';}
  else if(res.fatal)txt=res.fatal;
  else{
    txt=res.transcripcion||"";const er=res.error;marcar(er&&er.linea);
    if(er){if(er.tipo==="SinDatos"){txt+="\n(El programa pidió un dato con input() y no hay más datos en la caja.)";extra='<div class="aviso oro"><b>Faltan datos.</b> Abre «Datos para input()» y escribe un dato por línea.</div>';$("#entrada-wrap").open=true;}
      else if(er.tipo==="DemasiadaSalida")txt+="\n(El programa imprimió sin parar y se detuvo.)";
      else{txt+=er.texto;extra=errorHTML(er);}}
    else if(!res.transcripcion)txt="(El programa terminó sin mostrar nada. "+(r.tipo==="funcion"?"Para ver el resultado agrega un print, por ejemplo: print("+r.pruebas[0].expr+")":"¿Falta un print?")+")";
  }
  sz.innerHTML=pantalla(txt,"Pantalla")+extra;
}
async function comprobar(r){
  const ed=$("#ed");const pz=$("#pruebas-zona");$("#salida-zona").innerHTML="";
  const st=S.retos[r.id]||(S.retos[r.id]={});
  const sinCom=ed.value.split("\n").map(l=>l.replace(/#.*$/,"")).join("\n");
  const pro=(r.prohibido||[]).filter(p=>sinCom.includes(p));
  if(pro.length){pz.innerHTML='<div class="aviso bad"><b>El enunciado no permite</b> '+proTxt(pro).map(p=>"<code>"+esc(p)+"</code>").join(", ")+". Resuélvelo sin eso.</div>";st.intentado=true;guardar();return;}
  pz.innerHTML='<div class="aviso">'+(Py.estado==="listo"?"Comprobando…":"Preparando Python (solo la primera vez, unos segundos)…")+"</div>";
  const job=r.tipo==="funcion"?{modo:"funcion",codigo:ed.value,entrada:$("#entrada").value?$("#entrada").value+"\n":"",pruebas:r.pruebas}:{modo:"programa",codigo:ed.value,pruebas:r.pruebas};
  const res=await Py.correr(job,4000+r.pruebas.length*1500);
  if(ED.id!==r.id)return;
  if(res.noPython){pz.innerHTML=sinPython(r);return;}
  if(res.timeout){pz.innerHTML='<div class="aviso bad"><b>Se acabó el tiempo.</b> Las pruebas no terminaron: seguramente hay un ciclo infinito. Revisa que la variable del while cambie dentro del ciclo.</div>';st.intentado=true;guardar();return;}
  if(res.fatal){pz.innerHTML='<div class="aviso bad">'+esc(res.fatal)+"</div>";return;}
  let h="",tot=0,bien=0;
  const icOk=ic("check","ic"),icBad=ic("x","ic");
  if(r.tipo==="funcion"){
    if(res.error){marcar(res.error.linea);tot=r.pruebas.length;
      h=res.error.tipo==="SinDatos"?'<div class="aviso oro"><b>Tu código pide datos con input().</b> En este desafío los datos llegan como parámetros de la función.</div>':pantalla((res.transcripcion||"")+(res.error.texto||""),"Al cargar tu código")+errorHTML(res.error);}
    else{tot=res.pruebas.length;
      h='<div class="pruebas">'+res.pruebas.map((p,i)=>{if(p.ok)bien++;
        let d="<span>Prueba "+(i+1)+': <code>'+esc(p.expr)+"</code></span><span>Debía dar <code>"+esc(p.esperado)+"</code>"+(p.obtenido!=null?" · dio <code>"+esc(p.obtenido)+"</code>":"")+"</span>";
        if(p.pista)d+="<span><b>"+esc(p.pista)+"</b></span>";
        if(p.error)d+=pantalla(p.error,"Error")+"<span>"+esc(explicarError(p.error,p.linea))+"</span>";
        return '<div class="prueba '+(p.ok?"ok":"bad")+'">'+(p.ok?icOk:icBad)+'<div class="d">'+d+"</div></div>";}).join("")+"</div>";}
  }else{
    tot=res.pruebas.length;
    h='<div class="pruebas">'+res.pruebas.map(p=>{if(p.ok)bien++;
      let d="<b>"+esc(p.nombre)+"</b><span>Datos: <code>"+esc(p.entrada.trim().replace(/\n/g," ⏎ "))+"</code></span>";
      if(!p.ok&&p.motivo)d+="<span><b>"+esc(p.motivo)+"</b></span>";
      d+=pantalla((p.transcripcion||"")+(p.error?p.error.texto||"":""),"Pantalla");
      if(p.error)d+="<span>"+esc(explicarError(p.error.texto,p.error.linea))+"</span>";
      return '<div class="prueba '+(p.ok?"ok":"bad")+'">'+(p.ok?icOk:icBad)+'<div class="d">'+d+"</div></div>";}).join("")+"</div>";
  }
  const todo=tot>0&&bien===tot;
  pz.innerHTML=(todo?'<div class="aviso ok"><b>¡Resuelto!</b> Pasaron las '+tot+" pruebas.</div>":'<div class="aviso bad"><b>Pasan '+bien+" de "+tot+" pruebas.</b> Mira las que fallan: dicen qué se esperaba y qué dio tu código.</div>")+h;
  st.intentado=true;
  if(simActivo()&&S.sim.ids.includes(r.id))S.sim.res[r.id]=todo;
  if(todo){const primera=!st.ok;st.ok=true;if(primera){const g=st.vioSol?10:30;if(st.vioSol)st.ayuda=true;sumarXP(g);marcarDia();toast("+"+g+" de experiencia");}if(!enSim(r.id))explicacion(r);}
  guardar();barra();
}
