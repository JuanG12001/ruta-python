as y no se cerraron, así que Python no sabe dónde termina el texto.","leccion":"Ni siquiera apareció «Calculando...»: con un error de sintaxis Python no ejecuta ninguna línea. Ojo con lo que quieres mostrar: `print(\"resultado\")` muestra la palabra; `print(resultado)`, sin comillas, muestra el valor de una variable.","tipo_error":"SyntaxError","linea_error":4,"salida":"  File \"programa.py\", line 4\n    print(\"resultado)\n          ^\nSyntaxError: unterminated string literal (detected at line 4)\n"},{"id":"fu_int_decimal","titulo":"Área del rectángulo","codigo":"base = int(input(\"Ingrese la base: \"))\naltura = int(input(\"Ingrese la altura: \"))\narea = base * altura\nprint(\"El área del rectángulo es:\", area)","lineas":[1],"opciones":["Cambiar `int` por `float` en las líneas 1 y 2","Pedirle al usuario que escriba la base con coma: 3,5","Cambiar `int` por `str` en las líneas 1 y 2"],"correcta":0,"significado":"«invalid literal for int() with base 10: '3.5'» significa «valor no válido para int()»: el texto «3.5» no es un entero, e `int()` no acepta el punto decimal. Es un error de ejecución: el programa alcanzó a pedir la base antes de detenerse.","leccion":"Tus apuntes lo dicen: el área del rectángulo no es solo con números enteros. Si el dato puede tener decimales, conviértelo con `float()`. Con `str`, `base * altura` daría TypeError, y «3,5» tampoco lo acepta `int()`.","tipo_error":"ValueError","linea_error":1,"salida":"Ingrese la base: 3.5\nTraceback (most recent call last):\n  File \"programa.py\", line 1, in <module>\n    base = int(input(\"Ingrese la base: \"))\nValueError: invalid literal for int() with base 10: '3.5'\n"},{"id":"de_elif","titulo":"Calificación con elif","codigo":"nota = float(input(\"Nota: \"))\nif nota >= 9:\n    print(\"Excelente\")\nelif nota >= 5\n    print(\"Aprobado\")\nelse:\n    print(\"Reprobado\")","lineas":[4],"opciones":["Agregar los dos puntos al final: `elif nota >= 5:`","Cambiar `elif` por `else if`","Quitar la sangría de la línea 5"],"correcta":0,"significado":"«expected ':'» significa «se esperaba el signo de dos puntos». `elif` abre un bloque igual que `if` y `else`, y todo lo que abre un bloque termina en `:`.","leccion":"Es el ejemplo de la calificación de tus apuntes. La opción 2 da otro SyntaxError: «else if» no existe en Python. Fíjate que no apareció el mensaje «Nota:»: con un error de sintaxis no corre ninguna línea.","tipo_error":"SyntaxError","linea_error":4,"salida":"  File \"programa.py\", line 4\n    elif nota >= 5\n                  ^\nSyntaxError: expected ':'\n"},{"id":"de_else_if","titulo":"Signo de un número","codigo":"x = float(input(\"Ingrese un número: \"))\nif x > 0:\n    print(\"Positivo\")\nelse if x < 0:\n    print(\"Negativo\")\nelse:\n    print(\"Cero\")","lineas":[4],"opciones":["Escribir `elif x < 0:`","Agregar los dos puntos después de `else`: `else: if x < 0:`","Escribir `eilf x < 0:`"],"correcta":0,"significado":"Python lee `else` y espera los dos puntos enseguida, porque `else` nunca lleva condición. En ese lugar encontró `if`, y por eso dice «expected ':'» (se esperaban dos puntos) y marca el `if` con ^^.","leccion":"El mensaje engaña: agregar los dos puntos no lo arregla, porque después de `else:` no puede venir otra instrucción en la misma línea. En Python «si no, si» se escribe junto: `elif`. «eilf» es un error de tipeo de tus apuntes.","tipo_error":"SyntaxError","linea_error":4,"salida":"  File \"programa.py\", line 4\n    else if x < 0:\n         ^^\nSyntaxError: expected ':'\n"},{"id":"de_try","titulo":"Precisión con try","codigo":"bandera = True\nwhile bandera:\n    t = input(\"Precisión (entre 0 y 1): \")\n    precision = float(t)\n    try:\n        if 0 < precision < 1:\n            bandera = False\n        else:\n            print(\"Debe estar entre 0 y 1\")\n    except ValueError:\n        print(\"Escribe el número con punto decimal\")\nprint(\"Precisión:\", precision)","lineas":[4],"opciones":["Mover la línea 4 adentro del `try`, como su primera línea","Cambiar `except ValueError:` por `except TypeError:`","Cambiar `float(t)` por `int(t)`"],"correcta":0,"significado":"«could not convert string to float: '0,001'» significa «no se pudo convertir el texto '0,001' a decimal»: Python usa punto, no coma. El error ocurrió en la línea 4, que está fuera del `try`, así que el `except` no lo atrapa y el programa se detiene.","leccion":"El `try` solo protege las líneas que tiene adentro, con sangría. La conversión que puede fallar va dentro del `try`, y el `if` del rango después de ella.","tipo_error":"ValueError","linea_error":4,"salida":"Precisión (entre 0 y 1): 0,001\nTraceback (most recent call last):\n  File \"programa.py\", line 4, in <module>\n    precision = float(t)\nValueError: could not convert string to float: '0,001'\n"},{"id":"de_local","titulo":"Promedio de una lista","codigo":"def promedio(lista):\n    suma = 0\n    for x in lista:\n        suma += x\n    prom = suma / len(lista)\n    return prom\n\npromedio([21, 13, 35, 2])\nprint(\"El promedio es:\", prom)","lineas":[8,9],"opciones":["Guardar lo que devuelve la función en la línea 8: `prom = promedio([21, 13, 35, 2])`","Cambiar la línea 9 por `print(\"El promedio es:\", suma / len(lista))`","Mover el `return prom` antes del `for`"],"correcta":0,"significado":"«name 'prom' is not defined»: afuera de la función no existe ninguna variable `prom`. La `prom` de la línea 5 es local: nace cuando la función corre y desaparece cuando termina. El `return` entrega su valor, pero en la línea 8 nadie lo recibe.","leccion":"Lo que calcula una función sale solo por el `return`, y afuera hay que guardarlo en una variable o usarlo directo: `print(promedio(...))`. La opción 2 falla igual: `suma` y `lista` también son locales.","tipo_error":"NameError","linea_error":9,"salida":"Traceback (most recent call last):\n  File \"programa.py\", line 9, in <module>\n    print(\"El promedio es:\", prom)\n                             ^^^^\nNameError: name 'prom' is not defined\n"},{"id":"de_sin_base","titulo":"Suma de cifras sin caso base","codigo":"def suma_cifras(n):\n    return n % 10 + suma_cifras(n // 10)\n\nprint(suma_cifras(472))","lineas":[2,1],"opciones":["Agregar el caso base antes de la línea 2: `if n < 10:` y adentro `return n`","Cambiar `n // 10` por `n % 10` en la línea 2","Cambiar `return` por `print` en la línea 2"],"correcta":0,"significado":"«maximum recursion depth exceeded» significa «se superó la profundidad máxima de recursión»: la función se llamó a sí misma unas 1000 veces sin terminar. «[Previous line repeated … more times]» avisa que la misma línea se repitió casi mil veces. Cuando n llega a 0, `suma_cifras(0)` vuelve a llamar a `suma_cifras(0)`, y así sin fin.","leccion":"Toda función recursiva necesita un caso base que responda sin llamarse. Python señala la llamada, pero lo que falta está antes: la condición para parar.","tipo_error":"RecursionError","linea_error":2,"salida":"Traceback (most recent call last):\n  File \"programa.py\", line 4, in <module>\n    print(suma_cifras(472))\n          ~~~~~~~~~~~^^^^^\n  File \"programa.py\", line 2, in suma_cifras\n    return n % 10 + suma_cifras(n // 10)\n                    ~~~~~~~~~~~^^^^^^^^^\n  File \"programa.py\", line 2, in suma_cifras\n    return n % 10 + suma_cifras(n // 10)\n                    ~~~~~~~~~~~^^^^^^^^^\n  File \"programa.py\", line 2, in suma_cifras\n    return n % 10 + suma_cifras(n // 10)\n                    ~~~~~~~~~~~^^^^^^^^^\n  [Previous line repeated 990 more times]\nRecursionError: maximum recursion depth exceeded\n"},{"id":"ge_pi","titulo":"Área de un círculo","codigo":"import math\nradio = 3\narea = math.Pi * radio ** 2\nprint(\"Área del círculo:\", area)","lineas":[3],"opciones":["Escribir `math.pi` en minúscula","Escribir `math.Pi()` con paréntesis","Agregar `import Pi` al inicio"],"correcta":0,"significado":"«module 'math' has no attribute 'Pi'»: la biblioteca math no tiene nada que se llame `Pi`. «attribute» (atributo) es lo que va después del punto. Python mismo sugiere: «Did you mean: 'pi'?» (¿quisiste decir pi?).","leccion":"Todo lo de math va en minúscula: `math.pi`, `math.sqrt`, `math.cos`. Y las constantes van sin paréntesis.","tipo_error":"AttributeError","linea_error":3,"salida":"Traceback (most recent call last):\n  File \"programa.py\", line 3, in <module>\n    area = math.Pi * radio ** 2\n           ^^^^^^^\nAttributeError: module 'math' has no attribute 'Pi'. Did you mean: 'pi'?\n"},{"id":"ge_cos_grados","titulo":"Coseno de la librería","codigo":"import math\ngrados = 180\nprint(\"cos de librería:\", math.cos(grados))","lineas":[3],"opciones":["Convertir antes a radianes: `math.cos(math.radians(grados))`","Cambiar a `math.radians(math.cos(grados))`","Cambiar a `math.degrees(math.cos(grados))`"],"correcta":0,"significado":"No hay mensaje de error, pero el coseno de 180° es −1 y salió −0.598. `math.cos` tomó el 180 como 180 radianes, que son más de 28 vueltas.","leccion":"`sin`, `cos` y `tan` reciben radianes. El orden importa: primero se convierte el ángulo con `math.radians` y ese resultado va dentro de `math.cos`. En tus apuntes se imprimió `math.radians(grados)` solo, que convierte pero no calcula el coseno.","tipo_error":"Sin mensaje de error","salida":"cos de librería: -0.5984600690578581\n"},{"id":"ge_atan_cero","titulo":"Ángulo polar","codigo":"import math\nx = 0\ny = 5\nr = math.sqrt(x**2 + y**2)\ntheta = math.degrees(math.atan(y / x))\nprint(r, theta)","lineas":[5],"opciones":["Usar `math.atan2(y, x)`, que recibe y y x por separado y acepta x = 0","Cambiar `y / x` por `y // x`","Cambiar `math.degrees` por `math.radians`"],"correcta":0,"significado":"«division by zero»: se dividió entre cero. Con x = 0 el cociente y / x no existe, y Python se detiene antes de llegar a `atan`.","leccion":"En tus apuntes la fórmula θ = tg⁻¹(y/x) traía la condición x ≠ 0, y el programa resolvía x = 0 aparte con tres `if`. `math.atan2(y, x)` cubre todos los casos y además da el cuadrante correcto: con (0, 5) da 90°.","tipo_error":"ZeroDivisionError","linea_error":5,"salida":"Traceback (most recent call last):\n  File \"programa.py\", line 5, in <module>\n    theta = math.degrees(math.atan(y / x))\n                                   ~~^~~\nZeroDivisionError: division by zero\n"},{"id":"ge_triangulo_or","titulo":"Área con tres lados","codigo":"import math\n\ndef area_triangulo(a, b, c):\n    if a < b + c or b < a + c or c < a + b:\n        s = (a + b + c) / 2\n        return math.sqrt(s * (s - a) * (s - b) * (s - c))\n    return 0\n\nprint(area_triangulo(3, 4, 5))\nprint(area_triangulo(1, 2, 10))","lineas":[4,6],"opciones":["Cambiar `or` por `and` en la línea 4: las tres desigualdades deben cumplirse","Cambiar `math.sqrt(...)` por `(...) ** 0.5` en la línea 6","Cambiar `return 0` por `return -1`"],"correcta":0,"significado":"«math domain error» (error de dominio): `math.sqrt` recibió un número negativo. Con 1, 2 y 10, s = 6.5 y s − c = −3.5, así que el producto dentro de la raíz es negativo.","leccion":"Python marca la línea 6, pero la causa está en la 4: con `or` basta que se cumpla una desigualdad, y 1 < 2 + 10 se cumple. Para formar triángulo cada lado debe ser menor que la suma de los otros dos, los tres a la vez: `and`. Con `** 0.5` no saldría mensaje, pero el resultado sería un número complejo.","tipo_error":"ValueError","linea_error":6,"salida":"6.0\nTraceback (most recent call last):\n  File \"programa.py\", line 10, in <module>\n    print(area_triangulo(1, 2, 10))\n          ~~~~~~~~~~~~~~^^^^^^^^^^\n  File \"programa.py\", line 6, in area_triangulo\n    return math.sqrt(s * (s - a) * (s - b) * (s - c))\n           ~~~~~~~~~^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\nValueError: math domain error\n"},{"id":"ge_coma_reloj","titulo":"Ángulo del reloj","codigo":"hora = 2\nminutos = 20\nangulo_minutero = minutos * 6\nangulo_horario = (hora * 30) + (minutos * 0,5)\nd = abs(angulo_horario - angulo_minutero)\nprint(min(d, 360 - d))","lineas":[4],"opciones":["Escribir el decimal con punto: `minutos * 0.5`","Quitar los paréntesis: `hora * 30 + minutos * 0,5`","Escribir `0,5` entre comillas: `minutos * \"0,5\"`"],"correcta":0,"significado":"«unsupported operand type(s) for +: 'int' and 'tuple'»: el `+` no sabe sumar un entero (int) con una tupla. Con coma, `(minutos * 0,5)` no es un número: es una tupla de dos valores, `(0, 5)`.","leccion":"En Python la coma separa valores y el punto marca los decimales. Es el mismo error de las dos versiones del reloj de tus apuntes. Sin paréntesis el error solo cambia de lugar: aparece en la línea siguiente.","tipo_error":"TypeError","linea_error":4,"salida":"Traceback (most recent call last):\n  File \"programa.py\", line 4, in <module>\n    angulo_horario = (hora * 30) + (minutos * 0,5)\n                     ~~~~~~~~~~~~^~~~~~~~~~~~~~~~~\nTypeError: unsupported operand type(s) for +: 'int' and 'tuple'\n"},{"id":"ci_mcd","titulo":"MCD que divide entre cero","codigo":"def mcd(a, b):\n    while a != 0:\n        resto = a % b\n        a = b\n        b = resto\n    return a\n\nprint(mcd(48, 18))","lineas":[2],"opciones":["Cambiar la condición de la línea 2 a `while b != 0:`","Cambiar `a % b` por `a // b` en la línea 3","Cambiar `return a` por `return b` en la línea 6"],"correcta":0,"significado":"«integer modulo by zero»: se pidió el resto de dividir entre 0. Después de tres vueltas b vale 0 (el último resto) y a vale 6, pero el ciclo sigue porque revisa `a`, y la línea 3 calcula `6 % 0`.","leccion":"Python señala la línea 3, pero el problema está en la condición: Euclides para cuando el resto, que queda guardado en b, llega a 0. Antes de dividir entre una variable, pregúntate si puede valer 0.","tipo_error":"ZeroDivisionError","linea_error":3,"salida":"Traceback (most recent call last):\n  File \"programa.py\", line 8, in <module>\n    print(mcd(48, 18))\n          ~~~^^^^^^^^\n  File \"programa.py\", line 3, in mcd\n    resto = a % b\n            ~~^~~\nZeroDivisionError: integer modulo by zero\n"},{"id":"ci_rebotes","titulo":"Rebotes con datos inválidos","codigo":"h = float(input(\"Valor de la altura inicial: \"))\nperdida = float(input(\"Porcentaje de rebote perdido: \"))\nif h <= 0 or perdida <= 0:\n    print(\"Revisa tus datos\")\nelse:\n    contador_saltos = 0\n    altura = h\n    while altura >= 0.0001:\n        altura = altura - altura * perdida / 100\n        contador_saltos += 1\nprint(\"La cantidad de saltos es\", contador_saltos)","lineas":[11],"opciones":["Sangrar la línea 11 para que quede dentro del `else`","Agregar `contador_saltos = 0` entre las líneas 2 y 3, antes del `if`","Cambiar `perdida <= 0` por `perdida < 0` en la línea 3"],"correcta":0,"significado":"«name 'contador_saltos' is not defined»: la variable no existe. Con pérdida 0 el programa entró al `if`, así que nunca pasó por el `else`, que es donde se crea `contador_saltos`. El último `print` está fuera del `else` y la usa igual.","leccion":"Es el error del programa de rebotes de tus apuntes. La opción 2 quita el mensaje, pero el programa diría «La cantidad de saltos es 0» con datos inválidos. Lo que depende del cálculo va dentro del `else`.","tipo_error":"NameError","linea_error":11,"salida":"Valor de la altura inicial: 10\nPorcentaje de rebote perdido: 0\nRevisa tus datos\nTraceback (most recent call last):\n  File \"programa.py\", line 11, in <module>\n    print(\"La cantidad de saltos es\", contador_saltos)\n                                      ^^^^^^^^^^^^^^^\nNameError: name 'contador_saltos' is not defined\n"},{"id":"ci_sort_none","titulo":"Menor y mayor de unas notas","codigo":"notas = [14, 9, 18, 11, 16]\nnotas = notas.sort()\nprint(\"Menor:\", notas[0])\nprint(\"Mayor:\", notas[len(notas) - 1])","lineas":[2],"opciones":["En la línea 2, ordenar sin asignar: `notas.sort()`","En la línea 3, usar paréntesis: `notas(0)`","En la línea 2, escribir `notas = notas.sort(reverse=True)`"],"correcta":0,"significado":"«'NoneType' object is not subscriptable»: a `None` no se le pueden pedir posiciones con corchetes. `notas.sort()` ordena la lista y devuelve None, y la línea 2 guardó ese None en `notas`.","leccion":"`L.sort()` cambia L y no devuelve nada; si quieres una lista nueva, usa `L = sorted(L)`. Python señala la línea 3, pero la lista se perdió en la 2.","tipo_error":"TypeError","linea_error":3,"salida":"Traceback (most recent call last):\n  File \"programa.py\", line 3, in <module>\n    print(\"Menor:\", notas[0])\n                    ~~~~~^^^\nTypeError: 'NoneType' object is not subscriptable\n"},{"id":"ci_remove","titulo":"Eliminar un valor que no está","codigo":"lista = [21, 2, 61, 10, 2]\nx = int(input(\"Valor a eliminar: \"))\nlista.remove(x)\nprint(\"Queda:\", lista)","lineas":[3],"opciones":["Preguntar antes con `if x in lista:` y dentro llamar `lista.remove(x)`","Usar `lista.pop(x)`","Escribir `lista.remove[x]` con corchetes"],"correcta":0,"significado":"«list.remove(x): x not in list»: se pidió borrar un valor que no está en la lista (el 5). `remove` busca el valor y, si no lo encuentra, detiene el programa con ValueError.","leccion":"`pop` recibe una posición, no un valor: `lista.pop(5)` daría IndexError. Además `remove` borra solo la primera aparición: con x = 2 queda [21, 61, 10, 2]. Para quitarlas todas, construye una lista nueva con un ciclo.","tipo_error":"ValueError","linea_error":3,"salida":"Valor a eliminar: 5\nTraceback (most recent call last):\n  File \"programa.py\", line 3, in <module>\n    lista.remove(x)\n    ~~~~~~~~~~~~^^^\nValueError: list.remove(x): x not in list\n"},{"id":"ca_inmutable","titulo":"Mayúscula al comienzo de cada palabra","codigo":"frase = \"esto es una cadena\"\npalabras = frase.split()\nfor i in range(len(palabras)):\n    p = palabras[i]\n    p[0] = p[0].upper()\n    palabras[i] = p\nprint(\" \".join(palabras))","lineas":[5],"opciones":["Armar un texto nuevo: `p = p[0].upper() + p[1:]`","Comparar en vez de asignar: `p[0] == p[0].upper()`","Cambiar `upper()` por `lower()`"],"correcta":0,"significado":"«'str' object does not support item assignment»: un texto (str) no permite asignar un valor en una de sus posiciones. A diferencia de las listas, las cadenas no se modifican letra por letra.","leccion":"Para cambiar un texto se arma uno nuevo y se guarda en la variable: con rebanadas (`p[0].upper() + p[1:]`) o concatenando en un ciclo. Con `==` no hay error, pero solo se compara y la frase sale igual.","tipo_error":"TypeError","linea_error":5,"salida":"Traceback (most recent call last):\n  File \"programa.py\", line 5, in <module>\n    p[0] = p[0].upper()\n    ~^^^\nTypeError: 'str' object does not support item assignment\n"},{"id":"ca_minuscula","titulo":"Valor de cada símbolo romano","codigo":"simbolos = [\"I\", \"V\", \"X\", \"L\", \"C\", \"D\", \"M\"]\nvalores = [1, 5, 10, 50, 100, 500, 1000]\ntexto = input(\"Número romano: \")\nfor c in texto:\n    i = simbolos.index(c)\n    print(c, \"vale\", valores[i])","lineas":[3,4,5],"opciones":["Pasar el texto a mayúsculas con `upper()` antes de buscarlo en la tabla","Cambiar `simbolos.index(c)` por `simbolos.find(c)`","Agregar las letras minúsculas al final de la lista `simbolos`"],"correcta":0,"significado":"«'x' is not in list»: la x minúscula no está en la lista. `index` solo encuentra un elemento exactamente igual, y para Python «x» y «X» son caracteres distintos.","leccion":"Normaliza el texto antes de buscarlo en la tabla, por ejemplo `texto = input(\"Número romano: \").upper()`. `find` no sirve: es un método de cadenas y las listas no lo tienen. Si agregas letras a una sola de las listas, las dos dejan de estar alineadas.","tipo_error":"ValueError","linea_error":5,"salida":"Número romano: xiv\nTraceback (most recent call last):\n  File \"programa.py\", line 5, in <module>\n    i = simbolos.index(c)\nValueError: 'x' is not in list\n"},{"id":"ca_octal_str","titulo":"Decimal a octal","codigo":"def a_octal(n):\n    t = \"\"\n    while n > 0:\n        t = n % 8 + t\n        n = n // 8\n    return t\n\nprint(a_octal(163))","lineas":[4],"opciones":["Convertir el resto en texto: `t = str(n % 8) + t`","Empezar con `t = 0` en la línea 2","Cambiar `n % 8` por `n // 8`"],"correcta":0,"significado":"«unsupported operand type(s) for +: 'int' and 'str'»: el `+` no sabe operar un entero (int) con un texto (str). `n % 8` es un número y `t` es texto.","leccion":"Para pegar una cifra delante de un texto, conviértela con `str()`. Con `t = 0` no hay error, pero se suman las cifras: 3 + 4 + 2 = 9 en vez de «243».","tipo_error":"TypeError","linea_error":4,"salida":"Traceback (most recent call last):\n  File \"programa.py\", line 8, in <module>\n    print(a_octal(163))\n          ~~~~~~~^^^^^\n  File \"programa.py\", line 4, in a_octal\n    t = n % 8 + t\n        ~~~~~~^~~\nTypeError: unsupported operand type(s) for +: 'int' and 'str'\n"},{"id":"se_range_cero","titulo":"eˣ con n términos","codigo":"import math\nx = 1\nn = 10\nt = 1\ns = t\nfor i in range(n):\n    t = t * x / i\n    s += t\nprint(s, math.exp(x))","lineas":[6,7],"opciones":["Empezar el range en 1: `for i in range(1, n):`","Cambiar `/` por `//` en la línea 7","Empezar con `t = 0` en la línea 4"],"correcta":0,"significado":"«ZeroDivisionError: division by zero» significa «división entre cero». `range(n)` empieza en 0, así que en la primera vuelta i vale 0 y `t * x / i` divide entre 0.","leccion":"Si divides entre el contador, el range empieza en 1. Así además das n − 1 vueltas, justas porque el 1 ya está sumado antes del ciclo: en total, n términos.","tipo_error":"ZeroDivisionError","linea_error":7,"salida":"Traceback (most recent call last):\n  File \"programa.py\", line 7, in <module>\n    t = t * x / i\n        ~~~~~~^~~\nZeroDivisionError: division by zero\n"},{"id":"se_print_pi","titulo":"Serie de π (versión de clase)","codigo":"n = 100\nj = 1\ns = 1\ni = 1\nwhile i < n:\n    i += 1\n    j += 2\n    t = 1 / (j**4)\n    s = s + t\nprint (s*96)**(1/4)","lineas":[10],"opciones":["Meter toda la cuenta en el print: `print((s*96)**(1/4))`","Quitar el espacio entre `print` y el paréntesis","Cambiar `(1/4)` por `0.25`"],"correcta":0,"significado":"«unsupported operand type(s) for ** or pow(): 'NoneType' and 'float'» significa que no se puede elevar None a un decimal. Python ejecuta primero `print(s*96)`, que muestra 97.409… y devuelve None; después intenta elevar ese None a 1/4.","leccion":"Es la línea de tus apuntes. Toda la cuenta va dentro de los paréntesis del print. Más claro todavía: guárdala antes, `pi = (s * 96) ** (1/4)`, y luego `print(pi)`.","tipo_error":"TypeError","linea_error":10,"salida":"97.40908903410242\nTraceback (most recent call last):\n  File \"programa.py\", line 10, in <module>\n    print (s*96)**(1/4)\n    ~~~~~~~~~~~~^^~~~~~\nTypeError: unsupported operand type(s) for ** or pow(): 'NoneType' and 'float'\n"},{"id":"se_newton_cero","titulo":"Raíz de 2 por Newton","codigo":"def f(x):\n    return x**2 - 2\n\ndef df(x):\n    return 2 * x\n\nx = 0\nfor vuelta in range(20):\n    x = x - f(x) / df(x)\nprint(x)","lineas":[7],"opciones":["Empezar en un punto donde la derivada no sea 0, por ejemplo `x = 1`","Cambiar el signo en la línea 9: `x = x + f(x) / df(x)`","Dar más vueltas: `range(100)`"],"correcta":0,"significado":"«ZeroDivisionError: division by zero» significa «división entre cero». Python marca la línea 9, pero la causa está en la línea 7: con x = 0, df(0) = 2 · 0 = 0 y Newton divide entre la derivada.","leccion":"Newton no sirve donde la derivada es 0: la tangente es horizontal y nunca corta el eje. La hoja impresa lo advierte («diverge si f'(x) ≈ 0»). Por eso el problemario empieza en 1.","tipo_error":"ZeroDivisionError","linea_error":9,"salida":"Traceback (most recent call last):\n  File \"programa.py\", line 9, in <module>\n    x = x - f(x) / df(x)\n            ~~~~~^~~~~~~\nZeroDivisionError: division by zero\n"}],"armar":[{"id":"validar","titulo":"Validar un número natural","patron":"p-validar","enunciado":"Pide un número natural y vuelva a pedirlo mientras el dato no sea válido. Es la validación que el profesor usa en todas sus respuestas.","intercambiables":[[4,5]],"trampas":[["numero = int(input(\"Ingrese un número natural: \"))",0,"Convertir con int() antes de validar hace que el programa se caiga con «abc» (ValueError)."],["if n.isdigit()",1,"Le faltan los dos puntos al final."]],"lineas":[["bandera = True",0],["while bandera:",0],["n = input(\"Ingrese un número natural: \")",1],["if n.isdigit():",1],["numero = int(n)",2],["bandera = False",2],["else:",1],["print(\"Debe escribir correctamente el número\")",2]],"salida_ejemplo":"Ingrese un número natural: abc\nDebe escribir correctamente el número\nIngrese un número natural: 25\nDato aceptado: 25"},{"id":"harshad","titulo":"Número Harshad","patron":"p-cifras","enunciado":"Ya se tiene `numero` validado. Suma sus dígitos y di si el número es divisible entre esa suma.","intercambiables":[[0,1]],"trampas":[["if copia % s == 0:",0,"Al terminar el ciclo `copia` vale 0: hay que comparar con el número original."],["s += copia // 10",1,"`// 10` quita la última cifra; la cifra se obtiene con `% 10`."]],"lineas":[["copia = numero",0],["s = 0",0],["while copia > 0:",0],["s += copia % 10",1],["copia //= 10",1],["if numero % s == 0:",0],["print(\"Es Harshad\")",1],["else:",0],["print(\"No es Harshad\")",1]],"salida_ejemplo":"Es Harshad"},{"id":"persistencia","titulo":"Persistencia multiplicativa","patron":"p-cifras","enunciado":"Con `numero` ya validado, cuenta cuántas veces hay que multiplicar sus dígitos hasta que quede un solo dígito. 39 → 27 → 14 → 4: persistencia 3.","intercambiables":[[6,7]],"trampas":[["producto = 0",1,"Un producto que empieza en 0 siempre da 0. El acumulador de una multiplicación empieza en 1."],["contador = contador + producto",0,"El contador suma 1 por cada vuelta, no el producto."]],"lineas":[["contador = 0",0],["while numero > 9:",0],["producto = 1",1],["while numero > 0:",1],["producto *= numero % 10",2],["numero //= 10",2],["numero = producto",1],["contador += 1",1],["print(\"Persistencia:\", contador)",0]],"salida_ejemplo":"Persistencia: 3"},{"id":"seno","titulo":"Seno por serie (parcial)","patron":"p-serie","enunciado":"Función del parcial: seno de un ángulo en grados por la serie de Mac Laurin, generando cada término a partir del anterior y parando cuando el término sea menor que la precisión.","intercambiables":[[4,5]],"trampas":[["termino = -termino * x * x / (i + (i - 1))",2,"El denominador es un producto: i · (i − 1). Con suma la serie da otro valor."],["while termino >= precision:",1,"Sin abs(), un término negativo hace que el ciclo termine antes de tiempo."]],"lineas":[["import math",0],["def seno(grados, precision):",0],["x = grados * math.pi / 180",1],["termino = x",1],["s = termino",1],["i = 1",1],["while abs(termino) >= precision:",1],["i += 2",2],["termino = -termino * x * x / (i * (i - 1))",2],["s += termino",2],["return s",1]],"salida_ejemplo":"0.5"},{"id":"biseccion","titulo":"Raíz por bisección","patron":"p-numerico","enunciado":"Función del método de bisección. Ojo con la sangría del `return`: va fuera del ciclo.","intercambiables":[],"trampas":[["def raiz_biseccion(a, b, tolerancia=0,0000000001):",0,"El decimal va con punto. Con coma es SyntaxError."],["while a - b > tolerancia:",1,"Con a < b, a − b es negativo y el ciclo nunca corre. Usa abs(b - a)."]],"lineas":[["def raiz_biseccion(a, b, tolerancia=0.0000000001):",0],["c = (a + b) / 2",1],["while abs(b - a) > tolerancia:",1],["c = (a + b) / 2",2],["if f(a) * f(c) < 0:",2],["b = c",3],["else:",2],["a = c",3],["return c",1]],"salida_ejemplo":"1.52138"},{"id":"posicion","titulo":"Posición del mayor","patron":"p-lista","enunciado":"Función de clase: devuelve la posición del mayor valor de una lista.","intercambiables":[[1,2],[5,6]],"trampas":[["for i in lista:",1,"Con `for i in lista`, i es el valor, no la posición: `lista[i]` se sale de rango o toma otro elemento."],["retur posicion",1,"Falta la n: `return`."]],"lineas":[["def posicion_mayor(lista):",0],["posicion = 0",1],["mayor = lista[0]",1],["for i in range(len(lista)):",1],["if mayor < lista[i]:",2],["mayor = lista[i]",3],["posicion = i",3],["return posicion",1]],"salida_ejemplo":"5"},{"id":"union","titulo":"Unión sin repetidos","patron":"p-construir","enunciado":"Función de clase (2-10): une dos listas sin repetir valores.","intercambiables":[],"trampas":[["resultado.append(lista1)",1,"Agrega la lista entera como un solo elemento: [[1, 2, 3], …]."],["if i in resultado:",2,"Al revés: hay que agregar cuando NO está."]],"lineas":[["def une_listas(lista1, lista2):",0],["resultado = []",1],["for i in lista1:",1],["if not (i in resultado):",2],["resultado.append(i)",3],["for i in lista2:",1],["if not (i in resultado):",2],["resultado.append(i)",3],["return resultado",1]],"salida_ejemplo":"[1, 2, 3, 4, 6]"},{"id":"simetrica","titulo":"Lista simétrica","patron":"p-simetria","enunciado":"Función de clase: compara cada posición con su espejo y corta con break en la primera diferencia.","intercambiables":[],"trampas":[["if lista[i] != lista[len(lista) - i]:",2,"Con i = 0 pide lista[len(lista)], que no existe (IndexError). El espejo de i es len − i − 1."],["resultado = falso",3,"Los booleanos son True y False, con mayúscula y en inglés."]],"lineas":[["def lista_simetrica(lista):",0],["resultado = True",1],["for i in range(len(lista)):",1],["if lista[i] != lista[len(lista) - i - 1]:",2],["resultado = False",3],["break",3],["return resultado",1]],"salida_ejemplo":"True False"},{"id":"ordenar","titulo":"Ordenar de menor a mayor","patron":"p-ordenar","enunciado":"Ordenamiento por intercambio de la clase de listas.","intercambiables":[],"trampas":[["lista[i] = lista[j]",4,"Eso copia, no intercambia: el valor que estaba en i se pierde."],["for j in range(n):",2,"j debe empezar después de i; desde 0 vuelve a desordenar lo ya ordenado."]],"lineas":[["def ordenar_menor_mayor(lista):",0],["n = len(lista)",1],["for i in range(n - 1):",1],["for j in range(i + 1, n):",2],["if lista[i] > lista[j]:",3],["lista[i], lista[j] = lista[j], lista[i]",4],["return lista",1]],"salida_ejemplo":"[2, 10, 21, 35, 61]"},{"id":"bin_dec","titulo":"Binario a decimal","patron":"p-base","enunciado":"Función de la clase del 6-10: convierte 10100011 en 163.","intercambiables":[[1,2],[6,7]],"trampas":[["retur s",1,"Falta la n: `return`."],["n //= 2",2,"El binario se escribió como un entero de base 10: cada cifra se quita con // 10."]],"lineas":[["def binario_a_decimal(n):",0],["s = 0",1],["base = 1",1],["while n > 0:",1],["digito = n % 10",2],["s += digito * base",2],["base *= 2",2],["n //= 10",2],["return s",1]],"salida_ejemplo":"163"},{"id":"factorion","titulo":"Número factorion","patron":"p-funciones","enunciado":"Programa completo de clase: función factorial, luego el programa principal que suma los factoriales de las cifras. El `def` va antes de usarse.","intercambiables":[[6,7]],"trampas":[["for i in range(1, n):",1,"range(1, n) se detiene en n − 1: 5! daría 24. Para incluir n: range(1, n + 1)."],["if suma == Copia:",0,"`Copia` con mayúscula es otra variable (NameError)."]],"lineas":[["def factorial(n):",0],["f = 1",1],["for i in range(1, n + 1):",1],["f = f * i",2],["return f",1],["numero = int(input(\"Ingrese un número: \"))",0],["copia = numero",0],["suma = 0",0],["while numero > 0:",0],["digito = numero % 10",1],["suma += factorial(digito)",1],["numero //= 10",1],["if suma == copia:",0],["print(\"Es factorion\")",1],["else:",0],["print(\"No es factorion\")",1]],"salida_ejemplo":"Ingrese un número: 145\nEs factorion"},{"id":"primo","titulo":"¿Es primo?","patron":"p-funciones","enunciado":"Función que devuelve True si n es primo. Debe descartar 0 y 1.","intercambiables":[],"trampas":[["for i in range(1, n):",1,"1 divide a todos los números: con range(1, n) ningún número sería primo."],["if n % i = 0:",2,"`=` asigna un valor; para comparar se usa `==`. Así es SyntaxError."]],"lineas":[["def es_primo(n):",0],["if n < 2:",1],["return False",2],["for i in range(2, n):",1],["if n % i == 0:",2],["return False",3],["return True",1]],"salida_ejemplo":"True False False"},{"id":"fu_rectangulo","titulo":"Área y perímetro de un rectángulo","patron":"p-programa","enunciado":"Pide la base y la altura (pueden tener decimales), calcula el área y el perímetro y muestra los dos resultados. Es el problema del rectángulo de tus apuntes: entrada, proceso y salida.","intercambiables":[[0,1],[2,3]],"trampas":[["base = input(\"Ingrese la base: \")",0,"Sin `float()`, la base queda como texto y `base * altura` da TypeError."],["perimetro = 2 * base + altura",0,"Sin paréntesis solo se duplica la base: con 4 y 2.5 daría 10.5 en vez de 13.0."],["print(\"El área es: area\")",0,"Dentro de las comillas, `area` es texto: se mostraría la palabra y no el valor."]],"lineas":[["base = float(input(\"Ingrese la base: \"))",0],["altura = float(input(\"Ingrese la altura: \"))",0],["area = base * altura",0],["perimetro = 2 * (base + altura)",0],["print(\"El área es:\", area)",0],["print(\"El perímetro es:\", perimetro)",0]],"salida_ejemplo":"Ingrese la base: 4\nIngrese la altura: 2.5\nEl área es: 10.0\nEl perímetro es: 13.0"},{"id":"fu_triangulo","titulo":"¿Forman triángulo? Área con Herón","patron":"p-programa","enunciado":"Problema 11 del problemario: pide tres longitudes, revisa si pueden formar un triángulo (cada lado menor que la suma de los otros dos) y, si lo forman, muestra el área con la fórmula de Herón. Si no, muestra un mensaje.","intercambiables":[[0,1,2]],"trampas":[["if a + b > c or a + c > b or b + c > a:",0,"Con `or` basta que se cumpla una desigualdad: 1, 1 y 5 pasarían como triángulo."],["area = (s * (s - a) * (s - b) * (s - c)) ** 1/2",1,"`** 1/2` eleva a 1 y después divide entre 2: no es la raíz. El exponente va entre paréntesis: `** (1/2)`."],["print(\"El área es:\", area)",0,"Fuera del `if`, se mostraría también cuando no hay triángulo, y ahí `area` no existe (NameError)."]],"lineas":[["a = float(input(\"Lado a: \"))",0],["b = float(input(\"Lado b: \"))",0],["c = float(input(\"Lado c: \"))",0],["if a + b > c and a + c > b and b + c > a:",0],["s = (a + b + c) / 2",1],["area = (s * (s - a) * (s - b) * (s - c)) ** (1/2)",1],["print(\"El área es:\", area)",1],["else:",0],["print(\"Esas longitudes no forman un triángulo\")",1]],"salida_ejemplo":"Lado a: 3\nLado b: 4\nLado c: 5\nEl área es: 6.0"},{"id":"fu_circulo","titulo":"Área y longitud de un círculo","patron":"p-programa","enunciado":"Pide el radio y muestra el área (π·r²) y la longitud de la circunferencia (2·π·r), redondeadas a 2 decimales. π está en la biblioteca math, que se importa al inicio.","intercambiables":[[2,3]],"trampas":[["area = math.pi * radio ^ 2",0,"`^` no es la potencia en Python. La potencia es `**`."],["area = pi * radio ** 2",0,"Sin `math.` delante, Python no encuentra `pi` (NameError): pi está dentro de la biblioteca math."],["import Math",0,"Los nombres distinguen mayúsculas: la biblioteca es `math`, en minúscula. `Math` da ModuleNotFoundError."]],"lineas":[["import math",0],["radio = float(input(\"Ingrese el radio: \"))",0],["area = math.pi * radio ** 2",0],["longitud = 2 * math.pi * radio",0],["print(\"Área:\", round(area, 2))",0],["print(\"Longitud:\", round(longitud, 2))",0]],"salida_ejemplo":"Ingrese el radio: 3\nÁrea: 28.27\nLongitud: 18.85"},{"id":"de_tanque","titulo":"Tanque: ¿se llena o se vacía?","patron":"p-decidir","enunciado":"Tanque de tus apuntes: pide el flujo de entrada y el de salida y di si el nivel nunca cambia, si el tanque se llena o si se vacía. Tiene que salir un solo mensaje.","intercambiables":[[0,1]],"trampas":[["if flujo_entrada > flujo_salida:",0,"Un segundo `if` empieza otra pregunta: con flujos iguales diría «Nunca se vacía ni se llena» y también «El tanque se vacía». En tus apuntes ese `if` debía ser `elif`."],["if flujo_entrada = flujo_salida:",0,"Un solo `=` guarda un valor; para comparar va `==`. Así está en tus apuntes y da SyntaxError."],["else flujo_entrada < flujo_salida:",0,"`else` no lleva condición: atrapa todo lo que quedó."]],"lineas":[["flujo_entrada = float(input(\"Flujo de entrada: \"))",0],["flujo_salida = float(input(\"Flujo de salida: \"))",0],["if flujo_entrada == flujo_salida:",0],["print(\"Nunca se vacía ni se llena\")",1],["elif flujo_entrada > flujo_salida:",0],["print(\"El tanque se llena\")",1],["else:",0],["print(\"El tanque se vacía\")",1]],"salida_ejemplo":"Flujo de entrada: 69\nFlujo de salida: 16\nEl tanque se llena"},{"id":"de_binario","titulo":"Validar un número binario","patron":"p-validar","enunciado":"Pide un número binario como texto y vuelve a pedirlo mientras tenga algo distinto de ceros y unos (o esté vacío).","intercambiables":[[4,5]],"trampas":[["if t.isdigit():",1,"`isdigit()` acepta «1021»: el 2 es un dígito, pero no es binario."],["t = int(input(\"Número binario: \"))",1,"Con `int()` el dato deja de ser texto: los números no tienen `count` (AttributeError), y con «abc» el programa se cae."],["bandera = True",2,"La bandera tiene que pasar a False para que el ciclo termine; con True vuelve a pedir el dato para siempre."]],"lineas":[["bandera = True",0],["while bandera:",0],["t = input(\"Número binario: \")",1],["if t != \"\" and t.count(\"0\") + t.count(\"1\") == len(t):",1],["binario = t",2],["bandera = False",2],["else:",1],["print(\"Solo puede tener ceros y unos\")",2],["print(\"Binario aceptado:\", binario)",0]],"salida_ejemplo":"Número binario: 1021\nSolo puede tener ceros y unos\nNúmero binario: 10100011\nBinario aceptado: 10100011"},{"id":"de_pedir_natural","titulo":"Validar con funciones","patron":"p-funciones","enunciado":"Escribe la validación una sola vez y úsala en cualquier problema: `es_natural` responde True o False, y `pedir_natural` repite la pregunta hasta tener un natural y lo devuelve.","intercambiables":[],"trampas":[["print(int(t))",1,"Con `print` la función muestra el número pero devuelve None: `n` quedaría en None."],["if es_natural(t) == \"True\":",2,"La función devuelve el booleano True, no el texto \"True\": la comparación siempre es falsa y el ciclo no termina."],["print(\"Dato aceptado:\", t)",0,"`t` es local de `pedir_natural`: afuera no existe (NameError). El valor salió por el `return` y quedó en `n`."]],"lineas":[["def es_natural(texto):",0],["return texto.isdigit() and int(texto) > 0",1],["def pedir_natural(mensaje):",0],["bandera = True",1],["while bandera:",1],["t = input(mensaje)",2],["if es_natural(t):",2],["bandera = False",3],["else:",2],["print(\"Debe ser un número natural\")",3],["return int(t)",1],["n = pedir_natural(\"Ingrese n: \")",0],["print(\"Dato aceptado:\", n)",0]],"salida_ejemplo":"Ingrese n: 0\nDebe ser un número natural\nIngrese n: abc\nDebe ser un número natural\nIngrese n: 12\nDato aceptado: 12"},{"id":"de_mayor_cifra","titulo":"Mayor cifra, con recursión","patron":"p-recursion","enunciado":"Función recursiva que devuelve la mayor cifra de un número natural: compara la última cifra con la mayor cifra del resto del número. Con una sola cifra, la respuesta es el mismo número.","intercambiables":[[3,4]],"trampas":[["resto = mayor_cifra(n)",1,"Con `n` el problema no se achica: la función se llama con el mismo número sin fin (RecursionError)."],["ultima = n // 10",1,"`n // 10` quita la última cifra; la cifra se obtiene con `n % 10`."],["print(ultima)",2,"Con `print` la función muestra la cifra pero devuelve None, y la llamada de arriba no puede comparar un número con None (TypeError)."]],"lineas":[["def mayor_cifra(n):",0],["if n < 10:",1],["return n",2],["ultima = n % 10",1],["resto = mayor_cifra(n // 10)",1],["if ultima > resto:",1],["return ultima",2],["else:",1],["return resto",2]],"salida_ejemplo":"9 5 6"},{"id":"ge_ecuacion","titulo":"Raíces de una ecuación de segundo grado","patron":"p-geometria","enunciado":"Problema 21 del problemario: muestra las raíces de a·x² + b·x + c = 0, también cuando son imaginarias. Si el discriminante d es negativo, `math.sqrt(d)` da ValueError: la parte imaginaria se calcula con la raíz de −d.","intercambiables":[[2,3]],"trampas":[["imaginaria = math.sqrt(d) / (2*a)",2,"Dentro del else, d es negativo y `math.sqrt(d)` da ValueError. La raíz se le saca a −d, que es positivo."],["real = -b / 2*a",1,"Sin paréntesis divide entre 2 y después multiplica por a: con a = 2 y b = 4 da −4.0 en vez de −1.0."],["import Math",0,"El nombre de la biblioteca va en minúscula: `import math`. Con mayúscula Python no la encuentra."]],"lineas":[["import math",0],["def raices(a, b, c):",0],["d = b**2 - 4*a*c",1],["real = -b / (2*a)",1],["if d >= 0:",1],["print(\"x1 =\", real + math.sqrt(d) / (2*a))",2],["print(\"x2 =\", real - math.sqrt(d) / (2*a))",2],["else:",1],["imaginaria = math.sqrt(-d) / (2*a)",2],["print(\"x =\", real, \"±\", imaginaria, \"i\")",2]],"salida_ejemplo":"x1 = 2.0\nx2 = 1.0\nx = -1.0 ± 2.0 i"},{"id":"ge_punto_dentro","titulo":"Punto dentro de un triángulo","patron":"p-geometria","enunciado":"Tu programa arreglado de Herón: un punto P está dentro del triángulo si las áreas de los tres triángulos que P forma con cada lado suman el área total. Ya tienes `import math`, `distancia(x1, y1, x2, y2)` y `heron(a, b, c)`.","intercambiables":[[1,2,3,4,5,6]],"trampas":[["partes = heron(a, d1, d3) + heron(b, d2, d3) + heron(c, d1, d2)",1,"Cada lado va con las distancias desde sus dos vértices: a une P1 y P2, así que va con d1 y d2. En tu primera versión los lados estaban mezclados y un área salía como número complejo."],["return heron(a, b, c) == partes",1,"Con decimales las dos áreas pueden diferir en la última cifra y `==` diría False aunque el punto esté dentro. Tu versión arreglada usó `math.isclose`."]],"lineas":[["def esta_dentro(x1, y1, x2, y2, x3, y3, px, py):",0],["a = distancia(x1, y1, x2, y2)",1],["b = distancia(x2, y2, x3, y3)",1],["c = distancia(x1, y1, x3, y3)",1],["d1 = distancia(x1, y1, px, py)",1],["d2 = distancia(x2, y2, px, py)",1],["d3 = distancia(x3, y3, px, py)",1],["partes = heron(a, d1, d2) + heron(b, d2, d3) + heron(c, d1, d3)",1],["return math.isclose(heron(a, b, c), partes, abs_tol=1e-9)",1]],"salida_ejemplo":"True\nFalse"},{"id":"ge_espejo","titulo":"La hora en el espejo","patron":"p-unidades","enunciado":"Problema 18 del problemario: dada la hora que se ve en un espejo, devuelve la hora real. Las 8:05 en el espejo son las 3:55. Pasa todo a minutos, refleja con 720 − total (12 horas son 720 minutos) y vuelve a horas y minutos con `//` y `%`. La hora viene de 1 a 12.","intercambiables":[[3,4]],"trampas":[["h = espejo / 60",1,"Con `/` sale 3.9166…: para las horas completas se usa `//`."],["espejo = 720 - total",1,"Con las 12:30 da −30 minutos. El `% 720` lo lleva al rango de 0 a 719: 690 minutos, las 11:30."],["m = espejo // 60",1,"`//` da las horas completas. Los minutos son lo que sobra: `espejo % 60`."]],"lineas":[["def hora_espejo(hora, minutos):",0],["total = hora * 60 + minutos",1],["espejo = (720 - total) % 720",1],["h = espejo // 60",1],["m = espejo % 60",1],["if h == 0:",1],["h = 12",2],["return h, m",1]],"salida_ejemplo":"(3, 55)\n(11, 30)\n(12, 0)"},{"id":"ci_cuadratica","titulo":"Amistad cuadrática","patron":"p-funciones","enunciado":"Problema 33: 13 y 16 profesan amistad cuadrática porque 16² = 256 y 2 + 5 + 6 = 13, y 13² = 169 y 1 + 6 + 9 = 16. Arma una función que sume las cifras y otra que la use en los dos sentidos.","intercambiables":[],"trampas":[["return suma_cifras(m * m) == n",1,"Revisa un solo sentido. Con 2 y 4 diría True: 2² = 4 cumple, pero 4² = 16 y 1 + 6 = 7, no 2."],["s += n // 10",2,"`// 10` quita la última cifra; la cifra se obtiene con `% 10`."],["return suma_cifras(m) * suma_cifras(m) == n",1,"Eso eleva al cuadrado la suma de las cifras. Hay que sumar las cifras del cuadrado: `suma_cifras(m * m)`."]],"lineas":[["def suma_cifras(n):",0],["s = 0",1],["while n > 0:",1],["s += n % 10",2],["n //= 10",2],["return s",1],["def amistad_cuadratica(m, n):",0],["return suma_cifras(m * m) == n and suma_cifras(n * n) == m",1]],"salida_ejemplo":"True False"},{"id":"ci_valvula","titulo":"Tanque con válvula","patron":"p-simulacion","enunciado":"Versión mejorada del tanque de la clase del 8-6. Cada segundo, con la válvula abierta el volumen cambia en `flujo_entrada - flujo_salida`; cerrada, solo pierde `flujo_salida`. La válvula cambia cada `intervalo` segundos. Simula hasta que el tanque se llene o se vacíe.","intercambiables":[[0,1,2]],"trampas":[["valvula_abierta = True",2,"Así la válvula nunca se cierra. Lo que la invierte es `not valvula_abierta`."],["while volumen < volumen_tanque or volumen > 0:",0,"Con `or`, cuando el tanque se llena `volumen > 0` sigue siendo True y el ciclo no termina."],["if tiempo % intervalo == 0:",1,"En el segundo 0, `0 % intervalo` es 0: la válvula se cerraría antes de empezar."]],"lineas":[["volumen = volumen_inicial",0],["tiempo = 0",0],["valvula_abierta = True",0],["while volumen < volumen_tanque and volumen > 0:",0],["if tiempo > 0 and tiempo % intervalo == 0:",1],["valvula_abierta = not valvula_abierta",2],["if valvula_abierta:",1],["volumen = volumen + flujo_entrada - flujo_salida",2],["else:",1],["volumen = volumen - flujo_salida",2],["tiempo += 1",1],["print(\"Tiempo:\", tiempo, \"segundos\")",0]],"salida_ejemplo":"Tiempo: 128 segundos"},{"id":"ci_llenar","titulo":"Llenar una lista validando","patron":"p-atajos","enunciado":"Ya tienes `n`, la cantidad de datos. Pide `n` números naturales, valida cada uno como el profesor (`while bandera:` con `isdigit()`), guárdalos en una lista y muestra la media y el mayor con `sum`, `len` y `max`.","intercambiables":[[6,7]],"trampas":[["datos = []",1,"Dentro del for, la lista se vacía en cada vuelta y al final solo queda el último dato."],["bandera = True",0,"Fuera del for, la bandera queda en False después del primer dato y el while ya no pide los demás."],["datos.append(texto)",3,"Sin `int()` se guarda el texto y `sum` da TypeError."]],"lineas":[["datos = []",0],["for i in range(n):",0],["bandera = True",1],["while bandera:",1],["texto = input(\"Ingresa el dato: \")",2],["if texto.isdigit():",2],["datos.append(int(texto))",3],["bandera = False",3],["else:",2],["print(\"Debe ser un número natural\")",3],["print(\"Media:\", sum(datos) / len(datos), \"Mayor:\", max(datos))",0]],"salida_ejemplo":"Ingresa el dato: 21\nIngresa el dato: abc\nDebe ser un número natural\nIngresa el dato: 2\nIngresa el dato: 61\nMedia: 28.0 Mayor: 61"},{"id":"ca_automorfico","titulo":"Automórfico con cadena","patron":"p-rebanadas","enunciado":"Completa la versión con cadena del automórfico que quedó a medias en tus apuntes: valida el número como el profesor y después revisa si el texto del cuadrado termina con el texto del número.","intercambiables":[[4,5]],"trampas":[["if str(cuadrado).startswith(str(numero)):",0,"`startswith` mira el comienzo: 25² = 625 empieza con 6, no con 25."],["if cuadrado.endswith(numero):",0,"Los números no tienen `endswith`: primero pásalos a texto con `str()` (si no, AttributeError)."],["if str(cuadrado)[-1] == str(numero):",0,"Eso compara solo la última cifra del cuadrado: con 25 compararía «5» con «25»."]],"lineas":[["bandera = True",0],["while bandera:",0],["n = input(\"Ingrese un número natural: \")",1],["if n.isdigit():",1],["numero = int(n)",2],["bandera = False",2],["else:",1],["print(\"Debe escribir correctamente el número\")",2],["cuadrado = numero * numero",0],["if str(cuadrado).endswith(str(numero)):",0],["print(\"Es automórfico:\", cuadrado)",1],["else:",0],["print(\"No es automórfico:\", cuadrado)",1]],"salida_ejemplo":"Ingrese un número natural: abc\nDebe escribir correctamente el número\nIngrese un número natural: 76\nEs automórfico: 5776"},{"id":"ca_morse","titulo":"Palabra a código Morse","patron":"p-paralelas","enunciado":"Arma `a_morse(palabra)`: busca cada letra en `letras`, toma el código de la misma posición en `codigos` y devuelve los códigos separados por un espacio. «sos» → «... --- ...».","intercambiables":[[0,1]],"trampas":[["i = codigos.index(c)",2,"La letra se busca en `letras`. En `codigos` no está, y `index` da ValueError."],["partes.append(letras[i])",2,"Eso vuelve a poner la letra. El código está en la otra lista, en la misma posición i."],["return \"\".join(partes)",1,"Sin el espacio, los códigos quedan pegados (`...---...`) y ya no se sabe dónde termina cada letra."]],"lineas":[["letras = [\"a\", \"e\", \"m\", \"o\", \"s\", \"t\"]",0],["codigos = [\".-\", \".\", \"--\", \"---\", \"...\", \"-\"]",0],["def a_morse(palabra):",0],["partes = []",1],["for c in palabra:",1],["i = letras.index(c)",2],["partes.append(codigos[i])",2],["return \" \".join(partes)",1]],"salida_ejemplo":"... --- ...\n-- . ... .-"},{"id":"ca_bits","titulo":"Decimal a lista de bits","patron":"p-base","enunciado":"Arma `a_bits(n)`, que devuelve los bits de n en una lista, del primero al último: 11 → [1, 0, 1, 1]. Es la conversión de clase, pero pegando cada bit delante de una lista.","intercambiables":[],"trampas":[["bits.append(n % 2)",2,"`append` pega al final: los bits quedarían al revés, [1, 1, 0, 1] para 11."],["bits = n % 2 + bits",2,"Un número más una lista da TypeError: el bit va entre corchetes, `[n % 2]`."],["n = n % 2",2,"Eso deja n en 0 o 1. Para avanzar se divide: `n // 2`."]],"lineas":[["def a_bits(n):",0],["if n == 0:",1],["return [0]",2],["bits = []",1],["while n > 0:",1],["bits = [n % 2] + bits",2],["n = n // 2",2],["return bits",1]],"salida_ejemplo":"[1, 0, 1, 1]\n[0]\n[1, 0, 0, 0, 0]"},{"id":"se_pi4","titulo":"π con potencias de 4","patron":"p-serie","enunciado":"Problema 83: suma 1 + 1/3⁴ + 1/5⁴ + … y despeja π de π⁴/96 hasta que difiera de `math.pi` en menos de `tol`. Devuelve cuántos términos sumaste y el π calculado.","intercambiables":[[2,3,4],[7,8]],"trampas":[["pi = 96 * s ** (1/4)",2,"Sin paréntesis, Python saca primero la raíz cuarta de s y después multiplica por 96. Va `(96 * s) ** (1/4)`."],["s = 1 / (2 * k + 1)**4",2,"Así s guarda solo el último término y no la suma. Es el error de la 2ª versión de tus apuntes (`s=t`)."],["while abs(pi - math.pi) < tol:",1,"Al revés: el ciclo sigue mientras la diferencia todavía es grande. Con `<` no entra nunca, porque al principio pi vale 0."]],"lineas":[["import math",0],["def terminos_pi(tol):",0],["s = 0",1],["k = 0",1],["pi = 0",1],["while abs(pi - math.pi) >= tol:",1],["s += 1 / (2 * k + 1)**4",2],["k += 1",2],["pi = (96 * s) ** (1/4)",2],["return k, pi",1]],"salida_ejemplo":"26 3.1415917"},{"id":"se_serie_quiz","titulo":"Serie del quiz","patron":"p-serie","enunciado":"Quiz del 16-6 (problema 86): S = −x + x²/2! − 2x³/3! + 3x⁴/4! − … Los dos primeros términos van aparte; desde ahí, cada término sale del anterior. Para cuando el último término sumado sea menor que `tol` en valor absoluto.","intercambiables":[[1,2,3]],"trampas":[["t = -t * x * (i - 1) / (i + (i - 2))",2,"El divisor es un producto. En el repaso del quiz quedó `(i + (j - 1))` con suma, y la serie da otro valor."],["while abs(x) >= tol:",1,"x no cambia dentro del ciclo: si empieza mayor que tol, el ciclo no termina nunca. Se mira el término t."],["i = 1",1,"El último término sumado es x²/2!, de exponente 2. Con i = 1, en la primera vuelta i pasa a 2 y se divide entre i − 2 = 0."]],"lineas":[["def serie_quiz(x, tol):",0],["s = -x + x * x / 2",1],["t = x * x / 2",1],["i = 2",1],["while abs(t) >= tol:",1],["i += 1",2],["t = -t * x * (i - 1) / (i * (i - 2))",2],["s += t",2],["return s",1]],"salida_ejemplo":"-0.409796"},{"id":"se_newton","titulo":"Raíz por Newton-Raphson","patron":"p-iterativo","enunciado":"Ya tienes `f(x)` y su derivada `df(x)`. Arma `newton(x, tol)`: repite `nuevo = x - f(x) / df(x)` hasta que el cambio sea menor que `tol`, con un máximo de 100 vueltas, y devuelve la raíz y las vueltas.","intercambiables":[[1,2],[7,8]],"trampas":[["nuevo = x + f(x) / df(x)",2,"Con + el punto se aleja de la raíz. La tangente baja hasta el eje: `x - f(x) / df(x)`."],["while bandera or vueltas < 100:",1,"Con `or` el ciclo sigue aunque ya haya llegado: siempre da las 100 vueltas. Las dos condiciones se unen con `and`."],["if abs(nuevo - x) > tol:",2,"Al revés: así pararía en la primera vuelta, cuando el cambio todavía es grande. Se para cuando el cambio es menor que tol."]],"lineas":[["def newton(x, tol):",0],["vueltas = 0",1],["bandera = True",1],["while bandera and vueltas < 100:",1],["nuevo = x - f(x) / df(x)",2],["if abs(nuevo - x) < tol:",2],["bandera = False",3],["x = nuevo",2],["vueltas += 1",2],["return x, vueltas",1]],"salida_ejemplo":"1.52138 6"}],"conceptos":[{"id":"p-validar","nombre":"Validar el dato de entrada","definicion":"Comprobar que lo que escribe el usuario cumple las condiciones del enunciado antes de usarlo, y volver a pedirlo mientras no las cumpla.","para_que":"El problemario lo exige en todos los problemas: «es una pésima práctica dejar en el usuario la responsabilidad de validar». En el parcial, cada respuesta del profesor empieza con esta validación. Sin ella, `int(\"abc\")` detiene el programa con ValueError.","como":["`input()` siempre devuelve texto. Por eso se valida el texto antes de convertirlo.","`texto.isdigit()` es True solo si todos los caracteres son dígitos: acepta «25» y «0»; rechaza «-5», «2.5», «abc» y el texto vacío.","La bandera mantiene el ciclo: empieza en True y pasa a False cuando el dato es válido.","Si el problema pide un natural mayor que 0, agrega `and int(n) > 0`. Para decimales, convierte con `float()` y compruebe el rango con `if` (en el parcial: `0 < precision < 1`)."],"plantilla":"bandera = True\nwhile bandera:\n    n = input(\"Ingrese un número natural: \")\n    if n.isdigit() and int(n) > 0:\n        numero = int(n)\n        bandera = False\n    else:\n        print(\"Debe escribir correctamente el número\")","errores":["`if n.isdigit()` sin dos puntos.","Poner la bandera pero sin `while bandera:`: el programa avisa del error y termina, en vez de volver a pedir.","Aceptar 0 cuando el problema pide un natural: en Harshad eso termina en división entre 0."],"donde":"Parcial 1 (Harshad, persistencia), quiz del 16-6 (narcisista), factorion."},{"id":"p-cifras","nombre":"Recorrer las cifras de un número","definicion":"Separar un entero en sus dígitos con aritmética: `n % 10` da la última cifra y `n // 10` la elimina.","para_que":"Es la base de capicúa, Harshad, narcisista, persistencia, factorion, automórfico y binario a decimal. Varios enunciados prohíben convertir a texto, así que hay que saberlo hacer con números.","como":["1234 = 123 × 10 + 4. El resto de dividir entre 10 es la última cifra; el cociente entero es el número sin ella.","Se repite con `while n > 0` hasta que no quedan cifras.","El ciclo deja el número en 0. Si después necesitas el original, guarde antes una copia.","Variantes: contar cifras (`c += 1`), sumarlas (`s += d`), multiplicarlas (`p *= d`, empieza en 1), voltear (`v = v * 10 + d`)."],"plantilla":"copia = numero\nsuma = 0\nwhile copia > 0:\n    digito = copia % 10\n    suma += digito\n    copia //= 10","errores":["Usar `/` en vez de `//`: aparecen decimales y el ciclo da cientos de vueltas.","Olvidar la copia y comparar al final con un número que ya vale 0.","En persistencia: el ciclo externo es `while numero > 9` (más de una cifra), no `> 0`."],"donde":"Capicúa, automórfico, narcisista, Harshad, persistencia, factorion, binario."},{"id":"p-divisores","nombre":"Divisores y números primos","definicion":"d es divisor de n cuando `n % d == 0`. Un primo es un número mayor que 1 cuyo único divisor entre 2 y n − 1 no existe.","para_que":"Aparece en número perfecto, primo, primo palindrómico, amistad numérica, número poderoso y en el filtro «primos de un arreglo».","como":["Para sumar los divisores propios de n se prueba cada d desde 1 hasta n − 1 (o hasta n // 2, porque ningún divisor propio es mayor que la mitad).","Para saber si es primo conviene una función `es_primo(n)` que devuelva True o False; así otra parte del programa la puede reutilizar.","Usa la definición del enunciado aunque difiera de otra fuente: el problemario define «poderoso» como «al menos un divisor primo cuyo cuadrado también divide»."],"plantilla":"def es_primo(n):\n    if n < 2:\n        return False\n    for i in range(2, n):\n        if n % i == 0:\n            return False\n    return True\n\ndef suma_divisores(n):\n    s = 0\n    for d in range(1, n // 2 + 1):\n        if n % d == 0:\n            s += d\n    return s","errores":["Empezar en 1 al buscar divisores para `es_primo`: 1 divide a todos.","No descartar 0 y 1: sin `if n < 2`, el ciclo no da vueltas y la función dice que 1 es primo.","`resultado = falso`: los booleanos son `True` y `False`."],"donde":"Número perfecto, primo palindrómico, poderoso (quiz 3-10), primos de un arreglo."},{"id":"p-serie","nombre":"Series: cada término a partir del anterior","definicion":"Sumar los términos de una serie infinita hasta que el último término (o la diferencia entre dos sumas) sea menor que una tolerancia dada por el usuario.","para_que":"El profesor la pide en cada evaluación: seno en el parcial, serie de e en el quiz del 3-10, la serie −x + x²/2! … en el quiz del 16-6. Los enunciados exigen generar el término «como una unidad a partir del anterior», sin calcular factoriales por separado.","como":["Divide el término k + 1 entre el término k para hallar la razón. En e: (1/(k+1)!) ÷ (1/k!) = 1/(k + 1), así que `t = t / i`.","Seno: del término con xⁱ al siguiente con xⁱ⁺² se multiplica por −x² y se divide entre (i + 1)(i + 2). Con `i += 2` primero, queda `t = -t * x * x / (i * (i - 1))`.","La condición es `while abs(t) >= tolerancia`: los términos alternan signo y lo que importa es su tamaño.","Si el ángulo viene en grados, páselo a radianes: `x = grados * math.pi / 180`."],"plantilla":"import math\ngrados = float(input(\"Ángulo en grados: \"))\nprecision = float(input(\"Precisión: \"))\nif 0 < precision < 1:\n    x = grados * math.pi / 180\n    termino = x\n    s = termino\n    i = 1\n    while abs(termino) >= precision:\n        i += 2\n        termino = -termino * x * x / (i * (i - 1))\n        s += termino\n    print(\"Seno:\", s)\nelse:\n    print(\"La precisión debe estar entre 0 y 1\")","errores":["`while abs(x) > ...`: x nunca cambia y el ciclo es infinito; debe ser el término.","`10E-5` vale 0.0001; 10⁻⁵ se escribe `1e-5`.","Escribir `(i + (j - 1))` con suma donde va multiplicación."],"donde":"Parcial 1 (seno), quiz 16-6 (serie con −x), quiz 3-10 (número e), problemario 82-91 y 94-95."},{"id":"p-lista","nombre":"Recorrer una lista","definicion":"Una lista es un conjunto ordenado y modificable de valores entre corchetes. Sus posiciones van de 0 a `len(lista) - 1`.","para_que":"Todos los problemas de arreglos lineales (116-142 del problemario) empiezan recorriendo la lista para sumar, buscar o comparar.","como":["`for x in lista` entrega los valores. Úselo cuando no necesitas la posición (sumar, buscar el mayor).","`for i in range(len(lista))` entrega las posiciones. Úselo cuando necesitas la posición o comparar dos listas a la vez (`a[i] * b[i]`).","Acumulador: empieza en 0 antes del ciclo y crece dentro (`suma += x`).","Mayor o menor: arranque con `lista[0]`, no con 0, y reemplace cuando aparezca uno mejor."],"plantilla":"def resumen(lista):\n    suma = 0\n    mayor = lista[0]\n    posicion = 0\n    for i in range(len(lista)):\n        suma += lista[i]\n        if lista[i] > mayor:\n            mayor = lista[i]\n            posicion = i\n    return suma / len(lista), mayor, posicion","errores":["`print(lista)` dentro del `for` imprime la lista completa en cada vuelta; lo que se quería era `print(x)`.","`suma = suma + len(L)` en vez de `suma + i`.","Llamar `promedio2(L)` fuera de la función, donde `L` no existe."],"donde":"Media, menor, mayor, posición del mayor, rango, norma, producto escalar, polinomio."},{"id":"p-construir","nombre":"Construir una lista nueva","definicion":"Empezar con una lista vacía y agregar con `append` los elementos que cumplen una condición.","para_que":"Filtrar (primos de A), unir sin repetidos, intersección, eliminar un valor, posiciones de un valor. Es más seguro que borrar elementos mientras se recorre.","como":["`resultado = []` antes del ciclo; `resultado.append(x)` dentro; `return resultado` después.","`x in lista` es True si x está en la lista. Con `not (x in resultado)` se evita agregar repetidos.","`append` agrega un solo elemento: `resultado.append(lista1)` mete la lista entera como un elemento."],"plantilla":"def comunes(a, b):\n    resultado = []\n    for x in a:\n        if (x in b) and not (x in resultado):\n            resultado.append(x)\n    return resultado","errores":["`posiciones.append[i]`: append es una función y va con paréntesis.","Definir `intercepto_lista` y llamar `intercepta_lista`.","`if resultado = True`: un `=` dentro de un if es SyntaxError."],"donde":"Unión y comunes (clase 5-10), primos de A, eliminar, posiciones."},{"id":"p-simetria","nombre":"Comparar posiciones espejo","definicion":"En una secuencia de largo n, la posición espejo de i es `n - 1 - i`: la primera con la última, la segunda con la penúltima.","para_que":"Capicúa con cadenas, lista simétrica, palíndromos, voltear una cadena.","como":["Basta comparar hasta la mitad: `range(n // 2)`. Con largo impar, el del centro no tiene pareja.","En cuanto una pareja no coincide ya se sabe la respuesta: `return False` o bandera en False con `break`.","El `return True` va fuera del ciclo: solo se llega allí si ninguna pareja falló."],"plantilla":"def es_simetrico(s):\n    n = len(s)\n    for i in range(n // 2):\n        if s[i] != s[n - 1 - i]:\n            return False\n    return True","errores":["Usar `len(lista) - i` sin el −1: con i = 0 pide una posición que no existe.","Escribir `while (i < len(numero)//2), bandera:` con coma: debe ser `and`."],"donde":"Capicúa (versión cadenas), lista simétrica (clase 5-10), vector simétrico."},{"id":"p-ordenar","nombre":"Intercambiar y ordenar","definicion":"Ordenar es reubicar los elementos mediante intercambios. En Python dos variables se intercambian con `a, b = b, a`.","para_que":"Ordenar sin `sort` (el problemario lo pide sin vectores auxiliares), mediana, insertar en orden, ordenar por un criterio (primer dígito).","como":["Intercambio de clase: para cada i, recorra j desde i + 1; si `lista[i] > lista[j]`, intercámbielos. Al terminar cada i, esa posición tiene el menor de los que quedaban.","Para mayor a menor, invierta la comparación.","Para ordenar por un criterio, compara el criterio: `primer_digito(lista[i]) < primer_digito(lista[j])`.","Las listas son modificables: una función que ordena cambia la lista original que se te pasó."],"plantilla":"def ordenar(lista):\n    n = len(lista)\n    for i in range(n - 1):\n        for j in range(i + 1, n):\n            if lista[i] > lista[j]:\n                lista[i], lista[j] = lista[j], lista[i]\n    return lista","errores":["`lista[i] = lista[j]` solo copia: el valor de i se pierde.","`a = b` sola no intercambia."],"donde":"Ordenar (clase), mediana, insertar ordenado, ordenar por primer dígito (ejercicio del profesor)."},{"id":"p-numerico","nombre":"Métodos numéricos con f(x)","definicion":"Aproximar una respuesta (una raíz, un área, una longitud) dividiendo el problema en muchos pasos pequeños y sumando o acotando.","para_que":"Clases del 21-9 al 6-10: rectángulos, trapecios, bisección, tanteo y longitud de curva. El problemario los pide «utilizando funciones».","como":["La función se escribe como `def f(x): return ...`. Sin `return` devuelve None y cualquier cálculo con ella falla.","Ancho de cada franja: `(b - a) / n`, con n entero (10000, no 10.000).","Bisección: punto medio c; si `f(a) * f(c) < 0` la raíz está en [a, c], si no en [c, b]; repetir mientras `abs(b - a) > tolerancia`; `return c` fuera del ciclo.","Longitud de curva: suma de las distancias entre puntos consecutivos de la curva.","Con decimales no compara con `==`: usa `abs(a - b) < 1e-9` o `math.isclose`."],"plantilla":"def f(x):\n    return x**3 - x - 2\n\ndef raiz_biseccion(a, b, tolerancia=0.0000001):\n    c = (a + b) / 2\n    while abs(b - a) > tolerancia:\n        c = (a + b) / 2\n        if f(a) * f(c) < 0:\n            b = c\n        else:\n            a = c\n    return c","errores":["`return c` dentro del `while`: la función termina en la primera vuelta (daba 1.0).","`while a - b > tolerancia` con a < b: nunca entra al ciclo.","`distancia((x1, x2), y1, y2)`: el paréntesis extra forma una tupla y faltan argumentos."],"donde":"Integración numérica (21-9), raíz de una ecuación (22-9), longitud de curva (6-10), problemario 92-103."},{"id":"p-base","nombre":"Cambio de base (binario)","definicion":"En binario cada posición vale una potencia de 2: 1, 2, 4, 8… de derecha a izquierda. 10100011₂ = 128 + 32 + 2 + 1 = 163.","para_que":"Clase del 6-10 y su tarea (suma de binarios); problemario 50-52 y 141.","como":["Binario → decimal: tome las cifras con `% 10` y `// 10` (el binario está escrito como entero) y multiplica cada una por `base`, que empieza en 1 y se duplica.","Decimal → binario: `n % 2` da el siguiente bit y `n // 2` avanza. Los bits salen de derecha a izquierda, así que se pegan delante: `b = str(n % 2) + b`.","Para validar un binario escrito como texto: `t.count('0') + t.count('1') == len(t)`."],"plantilla":"def decimal_a_binario(n):\n    if n == 0:\n        return \"0\"\n    b = \"\"\n    while n > 0:\n        b = str(n % 2) + b\n        n = n // 2\n    return b","errores":["`binario = \" \"` con un espacio: el resultado sale con un espacio al final.","Escribir 1010011 (siete cifras = 83) cuando era 10100011 (ocho cifras = 163)."],"donde":"Clase del 6-10, suma de binarios."},{"id":"p-cadena","nombre":"Cadenas alfanuméricas","definicion":"Una cadena es texto entre comillas. Cada carácter tiene una posición desde 0, igual que en una lista, pero la cadena no se puede modificar: sus métodos devuelven una cadena nueva.","para_que":"Problemario 106-115 (telegrama, pentavocálica, anagramas, contar palabras), capicúa con cadenas y la validación con `isdigit()`.","como":["Vistos en clase: `len`, `lower`, `upper`, `strip`, `rstrip` (derecha), `lstrip` (izquierda), `replace`, `count`, `split`, `in`, `isdigit`.","`for c in texto` recorre carácter por carácter.","Como los métodos no cambian la variable, hay que guardar el resultado: `p = p.lower()`.","«á» y «a» son caracteres distintos; también «A» y «a». Normaliza con `lower()` y `replace()` antes de comparar."],"plantilla":"def contar_vocales(texto):\n    t = texto.lower()\n    c = 0\n    for letra in t:\n        if letra in \"aeiou\":\n            c += 1\n    return c","errores":["Los apuntes dicen que `rstrip` quita los espacios de la izquierda: es al revés, quita los de la derecha.","`replere` en vez de `replace`.","`isalpha()` considera letras a «ñ» y «á»: no sirve para el telegrama."],"donde":"Clase del 15-6, capicúa, pentavocálica, problemario 106-115."},{"id":"p-funciones","nombre":"Funciones","definicion":"Bloque de código con nombre que recibe datos (parámetros), hace un proceso y entrega un resultado con `return`.","para_que":"El último quiz pidió las dos respuestas con `def`, y el problemario recomienda resolver con funciones. Además permiten probar cada parte por separado.","como":["Definir no es ejecutar: el cuerpo corre cuando se llama, por ejemplo `es_primo(13)`.","Parámetros en la definición, argumentos en la llamada; se asignan en orden.","Valor por defecto: `def calculo_e(tolerancia=0.0001)` permite llamar `calculo_e()`.","Puede devolver dos valores: `return True, raiz` y recibirlos con `bandera, raiz = funcion(...)`.","Orden del archivo: `import`, después todas las `def`, al final el programa principal."],"plantilla":"def es_par(n):\n    return n % 2 == 0\n\ndef contar_pares(lista):\n    c = 0\n    for x in lista:\n        if es_par(x):\n            c += 1\n    return c\n\nprint(contar_pares([1, 2, 4, 7]))","errores":["Llamar la función antes de su `def`: NameError.","Definir con un nombre y llamar con otro (`busca_mayor` / `buscamayor`).","`retur` en vez de `return`; o no poner `return` y recibir None."],"donde":"Desde el 14-9 en todas las clases; quiz del 3-10."},{"id":"p-programa","nombre":"Estructura de un programa","definicion":"Todo programa sigue el esquema entrada → proceso → salida: recibe datos, los procesa y muestra el resultado. En el archivo, las partes van en este orden: los `import`, después las funciones `def` y al final el programa principal.","para_que":"Es el esqueleto de cualquier respuesta del quiz. Ordenar el archivo así evita NameError (usar algo antes de crearlo), y separar validar, calcular y mostrar hace que cada parte sea fácil de revisar y de probar.","como":["Antes de escribir, analiza: datos (y sus limitaciones), método de solución, condiciones de solución y resultados.","Arriba, los `import` de las bibliotecas que uses (`import math`).","Después, las funciones `def` que hacen el cálculo. Una función no existe hasta que Python pasa por su `def`.","Al final, el programa principal: **validar** la entrada (`while bandera:` + `isdigit()`), **calcular** (llamar a las funciones) y **mostrar** el resultado con `print` y un mensaje claro."],"plantilla":"import math\n\ndef area_circulo(radio):\n    return math.pi * radio ** 2\n\n# programa principal\nbandera = True\nwhile bandera:\n    dato = input(\"Ingrese el radio (entero positivo): \")\n    if dato.isdigit() and int(dato) > 0:\n        radio = int(dato)\n        bandera = False\n    else:\n        print(\"Debe escribir un entero positivo\")\narea = area_circulo(radio)\nprint(f\"El área del círculo es {area:.2f}\")","errores":["Calcular y no mostrar: falta el `print` final. Como dice el profesor, no mostrar la solución carece de sentido lógico.","Usar una función o `math` antes de su `def` o de su `import`: NameError.","Convertir con `int(input(...))` sin validar: con «abc» el programa se cae (ValueError).","`print = (\"...\")` con `=`: no muestra nada y además deja de funcionar `print` en el resto del programa."],"donde":"Todos los problemas del curso: área del cuadrado y del rectángulo, Herón, y cada respuesta del profesor en el parcial y los quizzes."},{"id":"p-decidir","nombre":"Decidir con if, elif y else","definicion":"Hacer que el programa tome un camino u otro según una condición que vale True o False.","para_que":"Los «Problemas iniciales» del problemario (cuadrante, bisiesto, Ork, mayor-medio-menor, triángulos) son decisiones, y toda validación de datos es un if. Cada caso tiene que terminar en un solo mensaje.","como":["`if condición:` ejecuta su bloque solo si la condición es True. `else:` no lleva condición: es el camino cuando no se cumple.","`if / elif / else` es una sola cadena: Python se detiene en la primera condición verdadera. Por eso el orden importa: `nota >= 9` va antes que `nota >= 5`.","Varios `if` seguidos son preguntas independientes: Python revisa todas. Usa `elif` cuando los casos se excluyen entre sí.","Un `if` dentro de otro equivale a unir con `and`; con `or` basta que se cumpla una. Comparadores: `==`, `!=`, `<`, `>`, `<=`, `>=`.","Divisibilidad con el resto: `n % d == 0`. Bisiesto: si `anio % 100 == 0` (fin de siglo) decide `anio % 400 == 0`; si no, decide `anio % 4 == 0`."],"plantilla":"def calificacion(nota):\n    if nota >= 9:\n        return \"Excelente\"\n    elif nota >= 5:\n        return \"Aprobado\"\n    else:\n        return \"Reprobado\"\n\nprint(calificacion(7))","errores":["`elif nota >= 5` sin dos puntos (tus apuntes, pág. 9): SyntaxError.","Escribir «eilf» o «else if»: en Python es `elif`.","Un segundo `if` donde iba `elif` (tanque, pág. 37): con flujos iguales salían dos mensajes y el programa seguía al `else`.","`if anno % 4 = 0:` con un solo `=` (bisiesto, pág. 21): SyntaxError. Para comparar se usa `==`.","Poner primero la condición más amplia: con `nota >= 5` arriba, un 10 nunca llega a «Excelente»."],"donde":"Tus apuntes, págs. 9 a 11, 20, 21 y 37; problemario 8 a 20 (cuadrante, bisiesto, Ork, mayor-medio-menor)."},{"id":"p-recursion","nombre":"Funciones recursivas","definicion":"Una función que, para resolver un problema, se llama a sí misma con una versión más pequeña del mismo problema, hasta llegar a un caso que se responde directo.","para_que":"El problemario pide funciones recursivas en el 104 (factorial), el 105 (interés compuesto) y el 190 (binarios sin ceros seguidos). Sirven cuando la definición matemática ya es recursiva, como n! = n · (n − 1)!.","como":["Caso base: la respuesta directa, sin llamarse (un número de una sola cifra, 0! = 1, cero años de interés).","Caso recursivo: `return` con una llamada a la misma función y un problema más pequeño (`n // 10`, `n - 1`).","Las llamadas se apilan: cada una espera la respuesta de la siguiente. Al llegar al caso base, los valores regresan en orden inverso.","Cada llamada tiene sus propias variables locales.","Si hay que repetir muchas veces (más de unas 1000) o solo es repetir, usa un ciclo."],"plantilla":"def suma_cifras(n):\n    if n < 10:\n        return n\n    else:\n        return n % 10 + suma_cifras(n // 10)\n\nprint(suma_cifras(4071))","errores":["Olvidar el caso base: la función se llama sin fin y Python da RecursionError.","Llamar con el mismo valor (`suma_cifras(n)`): el problema no se achica.","Olvidar el `return` delante de la llamada recursiva: el resultado se calcula, se pierde y llega None.","Un caso base que nunca se alcanza, por ejemplo `if n == 0:` cuando n baja de 2 en 2 desde un impar."],"donde":"Problemario 104, 105 y 190; desafíos «Factorial recursivo» e «Interés compuesto recursivo»."},{"id":"p-geometria","nombre":"Fórmulas con funciones","definicion":"Traducir una fórmula matemática a una función `def` pequeña: un parámetro por dato y `return` con el resultado. Las funciones pequeñas se llaman entre sí: `distancia` da los lados que usa `heron`.","para_que":"Los problemas iniciales del problemario son fórmulas: polares, longitud y punto medio, interpolación, cilindro, cilíndricas y esféricas, colineales, tipo de triángulo, y también Herón y el punto dentro de un triángulo. Como funciones se prueban por separado con el ejemplo del enunciado y se reutilizan.","como":["Escribe la fórmula como función y pruébala con un caso que conozcas: de (0, 0) a (3, 4) la distancia es 5; el triángulo 3, 4, 5 tiene área 6.","Escribe todos los `*` y los paréntesis: `s = (a + b + c) / 2` y `s * (s - a)`, nunca `a + b + c / 2` ni `s(s - a)`.","`sin`, `cos` y `tan` reciben radianes; `atan`, `atan2` y `acos` devuelven radianes. Convierte con `math.radians` y `math.degrees`.","Para el ángulo de un punto usa `math.atan2(y, x)`: acepta x = 0 y da el cuadrante correcto, entre −180° y 180°.","Antes de dividir o sacar raíz, revisa el caso que falla: x1 == x2 en la pendiente, ρ == 0 en esféricas, lados que no cumplen la desigualdad triangular.","Con decimales compara con `math.isclose(a, b)`, y con cero usa `abs_tol`: `math.isclose(det, 0, abs_tol=1e-9)` o `abs(det) < 1e-9`."],"plantilla":"import math\n\ndef distancia(x1, y1, x2, y2):\n    return math.sqrt((x2 - x1)**2 + (y2 - y1)**2)\n\ndef heron(a, b, c):\n    s = (a + b + c) / 2\n    return math.sqrt(s * (s - a) * (s - b) * (s - c))\n\ndef angulo_grados(x, y):\n    return math.degrees(math.atan2(y, x))\n\nprint(distancia(0, 0, 3, 4))\nprint(heron(3, 4, 5))\nprint(angulo_grados(-1, -1))","errores":["`S = a+b+c / 2` y `S(S-a)` (Herón, pág. 7): sin paréntesis divide solo a c, y sin `*` Python intenta llamar a S como función.","`math.radians(grados)` impreso como si fuera el coseno: solo convierte el ángulo.","`math.cos(180)` con el ángulo en grados: da −0.598, no −1.","`math.atan(y / x)` con x = 0: ZeroDivisionError. Se usa `math.atan2(y, x)`.","Pendiente con `//`: (4 − 1)//(3 − 1) da 1 y no 1.5 (interpolación).","`theta_rad = math.degrees(theta_rad)` sin calcular antes el ángulo: NameError (esféricas).","Comparar lados o áreas con `==`: 2.0 y 1.9999999999999998 no son iguales para Python."],"donde":"Problemario: problemas iniciales 1 a 7 y 9 a 11, y el 97 (Herón). Clase de septiembre: punto dentro de un triángulo y ejercicios de guía (colineales, tipo de triángulo)."},{"id":"p-unidades","nombre":"Convertir unidades con // y %","definicion":"`a // b` dice cuántas unidades completas de tamaño b caben en a, y `a % b` dice cuánto sobra. Aplicado en cascada, de la unidad más grande a la más pequeña, convierte una cantidad en unidades mixtas: días, horas, minutos y segundos.","para_que":"Problema 4 del problemario (segundos a años, meses, días, horas y segundos), el reloj (`hora % 12`) y la hora en el espejo. Es la misma idea que separar cifras con `% 10` y `// 10`.","como":["Calcula cuántos segundos tiene cada unidad: 1 min = 60, 1 h = 3600, 1 día = 86400. Con la variante del problemario, 1 mes de 30 días = 2592000 y 1 año de 360 días = 31104000.","En cada paso: `cantidad = resto // unidad` y después `resto = resto % unidad`. El resto pasa a la unidad siguiente.","`divmod(a, b)` devuelve los dos a la vez: `horas, resto = divmod(resto, 3600)`. Es una función integrada.","Para comprobar, vuelve a segundos: multiplica cada cantidad por su unidad y suma.","`%` también sirve para dar la vuelta: `hora % 12` lleva 15 a 3 y `(720 - total) % 720` deja los minutos entre 0 y 719."],"plantilla":"def dias_horas_minutos(segundos):\n    dias = segundos // 86400\n    resto = segundos % 86400\n    horas = resto // 3600\n    resto = resto % 3600\n    minutos = resto // 60\n    resto = resto % 60\n    return dias, horas, minutos, resto\n\nprint(dias_horas_minutos(100000))","errores":["Usar `/` en vez de `//`: 7384 / 3600 da 2.0511… y no 2 horas completas.","No actualizar el resto: si falta `resto = resto % 3600`, los minutos salen de los segundos totales.","`31.104.000` con puntos de miles: SyntaxError. Se escribe `31104000` o `31_104_000`.","Al revés: la pendiente de la interpolación con `//` (tus apuntes). `//` solo para unidades completas.","`minutos * 0,5` con coma en el reloj: crea una tupla y la suma da TypeError.","`días` con tilde en un lado y `dias` en otro: son variables distintas (NameError)."],"donde":"Problema 4 (segundos), problema 7 (reloj: clase del 9-6 y ejercicios de junio), problema 18 (hora en el espejo)."},{"id":"p-simulacion","nombre":"Simular paso a paso","definicion":"Reproducir con un `while` lo que pasa en cada paso de tiempo (un rebote, un día, un segundo): se actualiza el estado con la regla del enunciado y un contador cuenta los pasos hasta que se cumple la condición de parada.","para_que":"Rebotes (clase del 8-6, problemas 65 y 66), caracol en el pozo (64), tanque que rebosa con válvula (clase del 8-6, problema 74) y la traza de la multiplicación rusa (repaso del quiz del 22-6). El problemario pide «simular» el proceso, no usar una fórmula.","como":["Usa `while`: no sabes cuántos pasos habrá. Cada vuelta es un paso de tiempo y un contador (`tiempo += 1`) los cuenta.","Dentro del ciclo, actualiza el estado con la regla del enunciado: `altura = altura * (1 - p / 100)`, `volumen = volumen + flujo_entrada - flujo_salida`.","Revisa la condición en el momento correcto: el caracol que llega arriba de día ya no resbala esa noche.","Un estado que alterna (válvula abierta o cerrada) es una bandera: `valvula_abierta = not valvula_abierta`. `tiempo % intervalo == 0` marca cada cuántos pasos cambia.","Antes del ciclo descarta los datos que harían un ciclo infinito: flujos iguales, un caracol que resbala lo mismo que sube, un porcentaje de 0."],"plantilla":"def simular_tanque(volumen_tanque, volumen_inicial, flujo_entrada, flujo_salida, intervalo):\n    volumen = volumen_inicial\n    tiempo = 0\n    valvula_abierta = True\n    while volumen < volumen_tanque and volumen > 0:\n        if tiempo > 0 and tiempo % intervalo == 0:\n            valvula_abierta = not valvula_abierta\n        if valvula_abierta:\n            volumen = volumen + flujo_entrada - flujo_salida\n        else:\n            volumen = volumen - flujo_salida\n        tiempo += 1\n    return tiempo, volumen","errores":["`while alt
