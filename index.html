):\n        for j in range(i + 1, n):\n            if lista[i] == lista[j]:\n                return i\n    return -1","explicacion":["`range(i + 1, n)` mira solo hacia adelante: es el mismo doble ciclo del ordenamiento de clase.","El primer `return i` que se ejecuta es la respuesta, porque i avanza de izquierda a derecha.","`return -1` va fuera de los dos ciclos."],"pruebas":[{"expr":"primer_repetido([5, 3, 7, 3, 5])","esperado":0},{"expr":"primer_repetido([1, 2, 3, 2])","esperado":1},{"expr":"primer_repetido([1, 2, 3])","esperado":-1},{"expr":"primer_repetido([8, 8])","esperado":0}]},{"id":"ordenar","tipo":"funcion","nivel":2,"tema":"Listas","patron":"p-ordenar","fuente":"Problemario, arreglos lineales: ordenar sin vectores auxiliares; clase de listas","titulo":"Ordenar de menor a mayor","enunciado":"Diseña `ordenar(lista)` que ordene la lista de menor a mayor en la misma lista (sin crear otra) y la devuelva. No usa `sort` ni `sorted`.","inicio":"def ordenar(lista):\n    \n","pistas":["Ordenamiento por intercambio (el de clase): para cada i, compara con cada j > i y, si están al revés, intercámbielos.","def ordenar(lista):\n    n = len(lista)\n    for i in range(n - 1):\n        for j in range(i + 1, n):\n            if lista[i] > lista[j]:\n                lista[i], lista[j] = ___\n    return lista"],"solucion":"def ordenar(lista):\n    n = len(lista)\n    for i in range(n - 1):\n        for j in range(i + 1, n):\n            if lista[i] > lista[j]:\n                lista[i], lista[j] = lista[j], lista[i]\n    return lista","explicacion":["`a, b = b, a` intercambia en una línea. Con `lista[i] = lista[j]` solo se copia y el valor de i se pierde.","Al terminar cada vuelta de i, la posición i ya tiene el menor de los que quedaban.","Para mayor a menor basta cambiar `>` por `<`."],"prohibido":["sorted(",".sort("],"pruebas":[{"expr":"ordenar([21, 2, 61, 10, 35])","esperado":[2,10,21,35,61]},{"expr":"ordenar([3, 1, 2, 1])","esperado":[1,1,2,3]},{"expr":"ordenar([5])","esperado":[5]},{"expr":"ordenar([-1, -5, 0])","esperado":[-5,-1,0]}]},{"id":"mediana","tipo":"funcion","nivel":2,"tema":"Listas","patron":"p-ordenar","fuente":"Problemario, arreglos lineales: mediana","titulo":"Mediana","enunciado":"La mediana de un arreglo ordenado es el valor central si la cantidad es impar, o el promedio de los dos centrales si es par. Ejemplos: [2, 5, 6, 8, 9] → 6; [2, 5, 6, 8, 9, 12] → 7. Diseña `mediana(lista)` (la lista puede venir desordenada).","inicio":"def mediana(lista):\n    \n","pistas":["Ordena primero (puedes reutilizar tu función `ordenar`). Con n elementos, el central está en `n // 2`; si n es par, los centrales son `n // 2 - 1` y `n // 2`.","def mediana(lista):\n    v = ordenar(lista)\n    n = len(v)\n    if n % 2 == 1:\n        return v[n // 2]\n    else:\n        return (___ + ___) / 2"],"solucion":"def ordenar(lista):\n    n = len(lista)\n    for i in range(n - 1):\n        for j in range(i + 1, n):\n            if lista[i] > lista[j]:\n                lista[i], lista[j] = lista[j], lista[i]\n    return lista\n\ndef mediana(lista):\n    v = ordenar(lista)\n    n = len(v)\n    if n % 2 == 1:\n        return v[n // 2]\n    else:\n        return (v[n // 2 - 1] + v[n // 2]) / 2","explicacion":["El enunciado numera casillas desde 1 (casillas 3 y 4); en Python son las posiciones 2 y 3.","`n % 2 == 1` pregunta si n es impar."],"pruebas":[{"expr":"mediana([2, 5, 6, 8, 9])","esperado":6},{"expr":"mediana([2, 5, 6, 8, 9, 12])","esperado":7.0},{"expr":"mediana([9, 2, 8, 5, 6])","esperado":6},{"expr":"mediana([4])","esperado":4},{"expr":"mediana([3, 1])","esperado":2.0}]},{"id":"insertar","tipo":"funcion","nivel":2,"tema":"Listas","patron":"p-ordenar","fuente":"Problemario, arreglos lineales: insertar sin romper el orden","titulo":"Insertar en orden","enunciado":"Dado un arreglo ordenado de menor a mayor y un valor, inserte el valor en la posición que le corresponde sin romper el orden. Diseña `insertar_ordenado(lista, valor)` que devuelva la lista resultante. No usa `sort` ni `sorted`.","inicio":"def insertar_ordenado(lista, valor):\n    \n","pistas":["Busca la primera posición cuyo elemento sea mayor que el valor. Copia lo de antes, ponga el valor y copie lo de después.","def insertar_ordenado(lista, valor):\n    resultado = []\n    puesto = False\n    for x in lista:\n        if not puesto and x > valor:\n            resultado.append(valor)\n            puesto = True\n        resultado.append(x)\n    if ___:\n        resultado.append(valor)\n    return resultado"],"solucion":"def insertar_ordenado(lista, valor):\n    resultado = []\n    puesto = False\n    for x in lista:\n        if not puesto and x > valor:\n            resultado.append(valor)\n            puesto = True\n        resultado.append(x)\n    if not puesto:\n        resultado.append(valor)\n    return resultado","explicacion":["La bandera `puesto` evita insertar el valor más de una vez.","Si ningún elemento es mayor, el valor va al final: por eso el `if not puesto` después del ciclo."],"prohibido":["sorted(",".sort("],"pruebas":[{"expr":"insertar_ordenado([2, 5, 8, 10], 7)","esperado":[2,5,7,8,10]},{"expr":"insertar_ordenado([2, 5, 8], 1)","esperado":[1,2,5,8]},{"expr":"insertar_ordenado([2, 5, 8], 20)","esperado":[2,5,8,20]},{"expr":"insertar_ordenado([], 3)","esperado":[3]},{"expr":"insertar_ordenado([1, 3, 3, 9], 3)","esperado":[1,3,3,3,9]}]},{"id":"montana","tipo":"funcion","nivel":3,"tema":"Listas","patron":"p-lista","fuente":"Problemario, arreglos lineales: vector tipo montaña","titulo":"Vector tipo montaña","enunciado":"Un vector es «tipo montaña» si sus valores suben estrictamente hasta un máximo y luego bajan estrictamente, como [1, 3, 7, 4, 2]. Debe haber subida y bajada. Diseña `es_montana(lista)`.","inicio":"def es_montana(lista):\n    \n","pistas":["Avanza con un índice mientras suba; luego avanza mientras baje. Es montaña si el pico no quedó en un extremo y se llegó al final.","def es_montana(lista):\n    n = len(lista)\n    i = 0\n    while i < n - 1 and lista[i] < lista[i + 1]:\n        i += 1\n    if i == 0 or i == n - 1:\n        return False\n    while i < n - 1 and ___:\n        i += 1\n    return i == n - 1"],"solucion":"def es_montana(lista):\n    n = len(lista)\n    i = 0\n    while i < n - 1 and lista[i] < lista[i + 1]:\n        i += 1\n    if i == 0 or i == n - 1:\n        return False\n    while i < n - 1 and lista[i] > lista[i + 1]:\n        i += 1\n    return i == n - 1","explicacion":["El primer `while` sube; se detiene en el pico.","Si el pico quedó en la posición 0 no hubo subida; si quedó al final no hubo bajada.","El segundo `while` baja; si llega al final, toda la bajada fue estricta. Un valor repetido (meseta) lo detiene antes."],"pruebas":[{"expr":"es_montana([1, 3, 7, 4, 2])","esperado":true},{"expr":"es_montana([1, 2, 3])","esperado":false},{"expr":"es_montana([3, 2, 1])","esperado":false},{"expr":"es_montana([1, 5, 5, 2])","esperado":false},{"expr":"es_montana([2, 4, 1, 3])","esperado":false},{"expr":"es_montana([0, 1, 0])","esperado":true}]},{"id":"primer_digito","tipo":"funcion","nivel":3,"tema":"Listas","patron":"p-ordenar","fuente":"Problemario, arreglos lineales: ordenar según el primer dígito (ejercicio que mencionó el profesor)","titulo":"Ordenar por el primer dígito","enunciado":"Ordena de mayor a menor un grupo de enteros positivos según su primer dígito. Ejemplo: [2950, 3200, 91, 456] → [91, 456, 3200, 2950]. Trabaje con valores numéricos: no usa `str`. Diseña `primer_digito(n)` y `ordenar_por_primer_digito(lista)`. Si dos números tienen el mismo primer dígito, mantenga el orden en que venían.","inicio":"def primer_digito(n):\n    \n\ndef ordenar_por_primer_digito(lista):\n    \n","pistas":["El primer dígito se obtiene quitando cifras con `// 10` mientras el número tenga más de una (`while n >= 10`). Para ordenar, usa el intercambio de clase comparando `primer_digito(...)` en vez de los números.","def primer_digito(n):\n    while n >= 10:\n        n = n // 10\n    return n\n\ndef ordenar_por_primer_digito(lista):\n    n = len(lista)\n    for i in range(n - 1):\n        for j in range(n - 1 - i):\n            if primer_digito(lista[j]) < primer_digito(lista[j + 1]):\n                lista[j], lista[j + 1] = ___\n    return lista"],"solucion":"def primer_digito(n):\n    while n >= 10:\n        n = n // 10\n    return n\n\ndef ordenar_por_primer_digito(lista):\n    n = len(lista)\n    for i in range(n - 1):\n        for j in range(n - 1 - i):\n            if primer_digito(lista[j]) < primer_digito(lista[j + 1]):\n                lista[j], lista[j + 1] = lista[j + 1], lista[j]\n    return lista","explicacion":["En clase se resolvió con `int(str(num)[0])` y `sorted(..., key=...)`. El enunciado prohíbe funciones de texto, así que el dígito se saca con `// 10`.","Aquí se usa burbuja (vecinos `j` y `j + 1`) porque no desordena los que empatan; el intercambio i–j de clase sí podría hacerlo.","`while n >= 10` deja de quitar cifras cuando queda una sola."],"prohibido":["str(","sorted(",".sort("],"pruebas":[{"expr":"ordenar_por_primer_digito([2950, 3200, 91, 456])","esperado":[91,456,3200,2950]},{"expr":"ordenar_por_primer_digito([91, 86, 85, 54, 76, 101])","esperado":[91,86,85,76,54,101]},{"expr":"primer_digito(7)","esperado":7},{"expr":"primer_digito(40585)","esperado":4}]},{"id":"penta","tipo":"funcion","nivel":2,"tema":"Cadenas","patron":"p-cadena","fuente":"Problemario, cadenas alfanuméricas: palabra pentavocálica","titulo":"Palabra pentavocálica","enunciado":"Una palabra es pentavocálica si tiene las cinco vocales sin repetición, por ejemplo: murciélago, abuelito, hipotenusa, educación. Diseña `es_pentavocalica(palabra)`. Debe aceptar mayúsculas y vocales con tilde.","inicio":"def es_pentavocalica(palabra):\n    \n","pistas":["Pasa a minúsculas con `.lower()` y cambie las tildes con `.replace('á', 'a')`, etc. Después cuenta cada vocal con `.count()`: cada una debe aparecer exactamente 1 vez.","def es_pentavocalica(palabra):\n    p = palabra.lower()\n    p = p.replace('á', 'a').replace('é', 'e').replace('í', 'i').replace('ó', 'o').replace('ú', 'u')\n    for v in 'aeiou':\n        if ___:\n            return False\n    return True"],"solucion":"def es_pentavocalica(palabra):\n    p = palabra.lower()\n    p = p.replace('á', 'a').replace('é', 'e').replace('í', 'i').replace('ó', 'o').replace('ú', 'u')\n    for v in 'aeiou':\n        if p.count(v) != 1:\n            return False\n    return True","explicacion":["Para Python, «é» y «e» son caracteres distintos. Por eso la versión de clase falla con «murciélago».","«Sin repetición» se comprueba con `count(v) != 1`: si una vocal falta (0) o se repite (2 o más), no cumple.","`for v in 'aeiou'` recorre un texto letra por letra, igual que una lista."],"pruebas":[{"expr":"es_pentavocalica('murciélago')","esperado":true},{"expr":"es_pentavocalica('Abuelito')","esperado":true},{"expr":"es_pentavocalica('educación')","esperado":true},{"expr":"es_pentavocalica('papa')","esperado":false},{"expr":"es_pentavocalica('aeiouu')","esperado":false},{"expr":"es_pentavocalica('EUFORIA')","esperado":true}]},{"id":"anagramas","tipo":"funcion","nivel":2,"tema":"Cadenas","patron":"p-cadena","fuente":"Problemario, cadenas alfanuméricas: anagramas","titulo":"Anagramas","enunciado":"Dos palabras son anagramas si tienen las mismas letras en otro orden: «torpes» y «postre» lo son; «aparta» y «raptar» no (raptar tiene una r de más y una a de menos). Diseña `son_anagramas(a, b)` sin distinguir mayúsculas.","inicio":"def son_anagramas(a, b):\n    \n","pistas":["Mismo largo y, para cada letra de a, la misma cantidad de apariciones en b (`count`).","def son_anagramas(a, b):\n    a = a.lower()\n    b = b.lower()\n    if len(a) != len(b):\n        return False\n    for letra in a:\n        if ___:\n            return False\n    return True"],"solucion":"def son_anagramas(a, b):\n    a = a.lower()\n    b = b.lower()\n    if len(a) != len(b):\n        return False\n    for letra in a:\n        if a.count(letra) != b.count(letra):\n            return False\n    return True","explicacion":["Comparar solo con `in` no basta: «aparta» y «raptar» usan las mismas letras pero en distinta cantidad.","Si los largos son iguales y cada letra de a aparece igual número de veces en b, no puede sobrar nada en b."],"pruebas":[{"expr":"son_anagramas('torpes', 'postre')","esperado":true},{"expr":"son_anagramas('aparta', 'raptar')","esperado":false},{"expr":"son_anagramas('Roma', 'amor')","esperado":true},{"expr":"son_anagramas('abc', 'ab')","esperado":false},{"expr":"son_anagramas('aab', 'abb')","esperado":false}]},{"id":"contar_palabra","tipo":"funcion","nivel":2,"tema":"Cadenas","patron":"p-cadena","fuente":"Problemario, cadenas alfanuméricas: veces que aparece una palabra","titulo":"Contar una palabra","enunciado":"Diseña `contar_palabra(texto, palabra)` que devuelva cuántas veces aparece `palabra` como palabra completa en `texto`, sin distinguir mayúsculas. Ejemplo: en «el gato y el elefante» la palabra «el» aparece 2 veces (la «el» de «elefante» no cuenta).","inicio":"def contar_palabra(texto, palabra):\n    \n","pistas":["`texto.split()` separa el texto en una lista de palabras. Después es un contador sobre esa lista.","def contar_palabra(texto, palabra):\n    palabras = texto.lower().split()\n    c = 0\n    for p in palabras:\n        if ___:\n            c += 1\n    return c"],"solucion":"def contar_palabra(texto, palabra):\n    palabras = texto.lower().split()\n    c = 0\n    for p in palabras:\n        if p == palabra.lower():\n            c += 1\n    return c","explicacion":["`texto.count('el')` contaría también la «el» de «elefante»: por eso se separa en palabras.","`split()` sin argumento corta por cualquier cantidad de espacios."],"pruebas":[{"expr":"contar_palabra('el gato y el elefante', 'el')","esperado":2},{"expr":"contar_palabra('Hola hola HOLA', 'hola')","esperado":3},{"expr":"contar_palabra('nada que ver', 'gato')","esperado":0},{"expr":"contar_palabra('uno  dos   uno', 'uno')","esperado":2}]},{"id":"telegrama","tipo":"funcion","nivel":3,"tema":"Cadenas","patron":"p-cadena","fuente":"Problemario, cadenas alfanuméricas: costo de un telegrama","titulo":"Costo de un telegrama","enunciado":"Cada letra cuesta 10 u.m., cada dígito 20 u.m., los espacios no cuestan y cualquier otro carácter cuesta 30 u.m. Las letras del castellano ñ, á, é, í, ó, ú cuentan como caracteres especiales (30). Diseña `costo_telegrama(mensaje)`.","inicio":"def costo_telegrama(mensaje):\n    \n","pistas":["Define un texto con las letras que valen 10: `letras = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'` y pregunte con `in`. No usa `isalpha()`: para Python «ñ» y «á» también son letras.","def costo_telegrama(mensaje):\n    letras = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'\n    total = 0\n    for c in mensaje:\n        if c in letras:\n            total += 10\n        elif c in '0123456789':\n            total += 20\n        elif ___:\n            total += 30\n    return total"],"solucion":"def costo_telegrama(mensaje):\n    letras = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'\n    total = 0\n    for c in mensaje:\n        if c in letras:\n            total += 10\n        elif c in '0123456789':\n            total += 20\n        elif c != ' ':\n            total += 30\n    return total","explicacion":["`'ñ'.isalpha()` da True en Python, así que con `isalpha` la ñ costaría 10 y no 30.","El orden del `if/elif` importa: primero letras, luego dígitos y al final «todo lo que no sea espacio»."],"pruebas":[{"expr":"costo_telegrama('Hola 2026!')","esperado":150},{"expr":"costo_telegrama('año')","esperado":50},{"expr":"costo_telegrama('   ')","esperado":0},{"expr":"costo_telegrama('A1.')","esperado":60}]},{"id":"serie_e","tipo":"funcion","nivel":2,"tema":"Series","patron":"p-serie","fuente":"Problemario: número e por serie (respuesta del quiz del 3-10)","titulo":"Número e por serie","enunciado":"e = 1 + 1/1! + 1/2! + 1/3! + … Diseña `calculo_e(tolerancia)` que sume términos hasta que el último término generado sea menor que la tolerancia. Genere cada término a partir del anterior (no usa factorial).","inicio":"def calculo_e(tolerancia):\n    \n","pistas":["Si el término i es 1/i!, el siguiente es el anterior dividido entre (i + 1). No hace falta calcular el factorial.","def calculo_e(tolerancia):\n    resultado = 1\n    termino = 1\n    i = 0\n    while termino > tolerancia:\n        i += 1\n        termino = ___\n        resultado += termino\n    return resultado"],"solucion":"def calculo_e(tolerancia):\n    resultado = 1\n    termino = 1\n    i = 0\n    while termino > tolerancia:\n        i += 1\n        termino = termino / i\n        resultado += termino\n    return resultado","explicacion":["1/3! = (1/2!) / 3: cada término es el anterior entre i. Así se cumple «generar el término a partir del anterior».","La respuesta del profesor usó una función `factorial`; esta versión evita recalcular el factorial completo en cada vuelta.","Las pruebas aceptan cualquier forma de parar razonable: comparan con e = 2.718281828… con un margen."],"pruebas":[{"expr":"calculo_e(0.000001)","esperado":2.718281828459045,"tol":1e-05},{"expr":"calculo_e(0.0001)","esperado":2.718281828459045,"tol":0.001},{"expr":"calculo_e(1e-12)","esperado":2.718281828459045,"tol":1e-10}]},{"id":"seno","tipo":"funcion","nivel":3,"tema":"Series","patron":"p-serie","fuente":"Parcial 1 (23-6): seno por serie de Mac Laurin","titulo":"Seno por serie de Mac Laurin","enunciado":"sen(x) = x − x³/3! + x⁵/5! − x⁷/7! + … con x en radianes. Diseña `seno(grados, precision)` que pase el ángulo a radianes y sume hasta que el último término sumado sea menor, en valor absoluto, que la precisión. Cada término se genera a partir del anterior; no usa factorial ni `math.sin`.","inicio":"import math\n\ndef seno(grados, precision):\n    \n","pistas":["Del término con xⁱ al siguiente con xⁱ⁺²: se multiplica por −x² y se divide entre (i + 1)(i + 2). Si lleva i como el exponente actual, sume 2 y divida entre i·(i − 1).","import math\n\ndef seno(grados, precision):\n    x = grados * math.pi / 180\n    termino = x\n    s = termino\n    i = 1\n    while abs(termino) >= precision:\n        i += 2\n        termino = ___\n        s += termino\n    return s"],"solucion":"import math\n\ndef seno(grados, precision):\n    x = grados * math.pi / 180\n    termino = x\n    s = termino\n    i = 1\n    while abs(termino) >= precision:\n        i += 2\n        termino = -termino * x * x / (i * (i - 1))\n        s += termino\n    return s","explicacion":["Es la respuesta del profesor del parcial, convertida en función.","`abs(termino)`: los términos alternan de signo y la condición debe mirar su tamaño.","En el repaso del quiz aparece `(i + (j - 1))` con suma: debe ser multiplicación."],"prohibido":["math.sin","factorial("],"pruebas":[{"expr":"seno(30, 0.0000001)","esperado":0.5,"tol":1e-06},{"expr":"seno(90, 0.0000001)","esperado":1.0,"tol":1e-06},{"expr":"seno(270, 0.0000001)","esperado":-1.0,"tol":1e-06},{"expr":"seno(0, 0.001)","esperado":0.0,"tol":1e-09}]},{"id":"biseccion","tipo":"funcion","nivel":2,"tema":"Métodos numéricos","patron":"p-numerico","fuente":"Problemario: método de bisección; clases del 22-9","titulo":"Raíz por bisección","enunciado":"Define `f(x) = x**3 - x - 2` y diseñe `raiz_biseccion(a, b, tolerancia)` que aplique el método de bisección en [a, b] (donde f cambia de signo) y devuelva la raíz aproximada. La raíz está cerca de 1.5214.","inicio":"def f(x):\n    return x**3 - x - 2\n\ndef raiz_biseccion(a, b, tolerancia):\n    \n","pistas":["Mientras el intervalo sea más largo que la tolerancia: punto medio c; si f(a)·f(c) < 0 la raíz está en [a, c], si no, en [c, b]. El `return` va fuera del ciclo.","def raiz_biseccion(a, b, tolerancia):\n    c = (a + b) / 2\n    while abs(b - a) > tolerancia:\n        c = (a + b) / 2\n        if f(a) * f(c) < 0:\n            b = c\n        else:\n            ___\n    return c"],"solucion":"def f(x):\n    return x**3 - x - 2\n\ndef raiz_biseccion(a, b, tolerancia):\n    c = (a + b) / 2\n    while abs(b - a) > tolerancia:\n        c = (a + b) / 2\n        if f(a) * f(c) < 0:\n            b = c\n        else:\n            a = c\n    return c","explicacion":["Con el `return` dentro del `while` la función termina en la primera vuelta (te pasó en clase: daba 1.0).","`c = (a + b) / 2` antes del ciclo asegura que c exista aunque el intervalo ya sea pequeño.","En tus apuntes, una versión decía `a - b > tolerancia`: con a < b eso es negativo y el ciclo nunca corre. Usa `abs(b - a)`."],"pruebas":[{"expr":"raiz_biseccion(1, 2, 0.0000001)","esperado":1.5213797068045676,"tol":1e-06},{"expr":"raiz_biseccion(0, 3, 0.000001)","esperado":1.5213797068045676,"tol":1e-05},{"expr":"f(raiz_biseccion(1, 2, 1e-9))","esperado":0.0,"tol":1e-07}]},{"id":"tanteo","tipo":"funcion","nivel":3,"tema":"Métodos numéricos","patron":"p-numerico","fuente":"Problemario: método de tanteos; clase del 22-9","titulo":"Raíz por tanteos","enunciado":"Define `f(x) = x**3 - x - 2` y diseñe `raiz_tanteo(a, b, eps)` con el método de tanteos del problemario: Dx = (b − a)/10; avanza x desde a en pasos de Dx comparando el signo de f(a) con el de f(x). Cuando los signos sean opuestos (se pasó la raíz), retroceda un paso, haga Dx = Dx/10 y siga. Termina cuando Dx sea menor que eps y devuelva x.","inicio":"def f(x):\n    return x**3 - x - 2\n\ndef raiz_tanteo(a, b, eps):\n    \n","pistas":["Un solo `while dx >= eps`. Dentro: avanza `x = x + dx`; si `f(a) * f(x) < 0` se pasó la raíz: retroceda y divida dx entre 10.","def raiz_tanteo(a, b, eps):\n    dx = (b - a) / 10\n    x = a\n    while dx >= eps:\n        x = x + dx\n        if f(a) * f(x) < 0:\n            x = ___\n            dx = ___\n    return x"],"solucion":"def f(x):\n    return x**3 - x - 2\n\ndef raiz_tanteo(a, b, eps):\n    dx = (b - a) / 10\n    x = a\n    while dx >= eps:\n        x = x + dx\n        if f(a) * f(x) < 0:\n            x = x - dx\n            dx = dx / 10\n    return x","explicacion":["El tanteo no parte el intervalo a la mitad: lo recorre en 10 pasos, y cada vez que se pasa de la raíz retrocede y afina el paso 10 veces.","Todos los puntos antes de la raíz tienen el mismo signo que f(a); por eso basta comparar con f(a).","En la clase del 22-9 se vio por separado de la bisección. La hoja impresa de tus apuntes los junta («Tanteo (Bisección)»), pero el problemario los trata como métodos distintos (101 y 102)."],"pruebas":[{"expr":"raiz_tanteo(1, 2, 0.0000001)","esperado":1.5213797068045676,"tol":1e-06},{"expr":"raiz_tanteo(0, 3, 0.000001)","esperado":1.5213797068045676,"tol":1e-05}]},{"id":"punto_medio","tipo":"funcion","nivel":2,"tema":"Métodos numéricos","patron":"p-numerico","fuente":"Problemario: área bajo la curva, rectángulo por el punto medio; clase del 21-9","titulo":"Área por rectángulos (punto medio)","enunciado":"Define `f(x) = x**2` y diseñe `area_punto_medio(a, b, n)`: divida [a, b] en n franjas de ancho (b − a)/n y sume el área de cada rectángulo, con la altura evaluada en el punto medio de la franja. El área exacta entre 0 y 3 es 9.","inicio":"def f(x):\n    return x**2\n\ndef area_punto_medio(a, b, n):\n    \n","pistas":["El punto medio de la franja k es `a + ancho * k + ancho / 2`. El área de la franja es ancho · f(punto medio).","def area_punto_medio(a, b, n):\n    ancho = (b - a) / n\n    total = 0\n    for k in range(n):\n        medio = ___\n        total += ancho * f(medio)\n    return total"],"solucion":"def f(x):\n    return x**2\n\ndef area_punto_medio(a, b, n):\n    ancho = (b - a) / n\n    total = 0\n    for k in range(n):\n        medio = a + ancho * k + ancho / 2\n        total += ancho * f(medio)\n    return total","explicacion":["`n` debe ser entero: `range(10.000)` falla porque 10.000 es el decimal 10.0 (pasó en tus apuntes). Diez mil se escribe 10000.","Es `area_rectangulo_3` de clase, sin modificar `a` dentro de la función."],"pruebas":[{"expr":"area_punto_medio(0, 3, 1000)","esperado":9.0,"tol":0.0001},{"expr":"area_punto_medio(0, 3, 1)","esperado":6.75},{"expr":"area_punto_medio(1, 2, 2)","esperado":2.3125}]},{"id":"trapecio","tipo":"funcion","nivel":2,"tema":"Métodos numéricos","patron":"p-numerico","fuente":"Problemario: área bajo la curva, regla trapecial; clase del 21-9","titulo":"Área por trapecios","enunciado":"Define `f(x) = x**2` y diseñe `area_trapecio(a, b, n)`: en cada franja de ancho (b − a)/n el área es ancho · (f(izquierda) + f(derecha)) / 2. Suma todas.","inicio":"def f(x):\n    return x**2\n\ndef area_trapecio(a, b, n):\n    \n","pistas":["El extremo izquierdo de la franja k es `a + ancho * k` y el derecho `a + ancho * (k + 1)`.","def area_trapecio(a, b, n):\n    ancho = (b - a) / n\n    total = 0\n    for k in range(n):\n        izq = a + ancho * k\n        der = ___\n        total += ancho * (f(izq) + f(der)) / 2\n    return total"],"solucion":"def f(x):\n    return x**2\n\ndef area_trapecio(a, b, n):\n    ancho = (b - a) / n\n    total = 0\n    for k in range(n):\n        izq = a + ancho * k\n        der = a + ancho * (k + 1)\n        total += ancho * (f(izq) + f(der)) / 2\n    return total","explicacion":["Área del trapecio: (B + b) · h / 2, con las bases f(izq), f(der) y la altura igual al ancho.","Usa un solo nombre para cada variable: en tus apuntes aparecen `Salto`/`salto` y `areatotal`/`areaTotal`, que Python trata como variables distintas."],"pruebas":[{"expr":"area_trapecio(0, 3, 1000)","esperado":9.0,"tol":0.0001},{"expr":"area_trapecio(0, 3, 1)","esperado":13.5},{"expr":"area_trapecio(1, 2, 2)","esperado":2.375}]},{"id":"longitud","tipo":"funcion","nivel":3,"tema":"Métodos numéricos","patron":"p-numerico","fuente":"Problemario: longitud de arco; clase del 6-10","titulo":"Longitud de una curva","enunciado":"Define `f(x) = x**2` y diseñe `longitud_curva(a, b, n)`: divida [a, b] en n tramos y sume la longitud de cada segmento recto entre (x, f(x)) y (x + Δx, f(x + Δx)). Usa una función `distancia(x1, y1, x2, y2)`.","inicio":"def f(x):\n    return x**2\n\ndef distancia(x1, y1, x2, y2):\n    \n\ndef longitud_curva(a, b, n):\n    \n","pistas":["Cada tramo es una distancia entre dos puntos de la curva. Llama a `distancia` con 4 números, sin agrupar con paréntesis de más.","def distancia(x1, y1, x2, y2):\n    return ((x2 - x1)**2 + (y2 - y1)**2) ** (1/2)\n\ndef longitud_curva(a, b, n):\n    dx = (b - a) / n\n    total = 0\n    for i in range(n):\n        x1 = a + i * dx\n        x2 = ___\n        total += distancia(x1, f(x1), x2, f(x2))\n    return total"],"solucion":"def f(x):\n    return x**2\n\ndef distancia(x1, y1, x2, y2):\n    return ((x2 - x1)**2 + (y2 - y1)**2) ** (1/2)\n\ndef longitud_curva(a, b, n):\n    dx = (b - a) / n\n    total = 0\n    for i in range(n):\n        x1 = a + i * dx\n        x2 = a + (i + 1) * dx\n        total += distancia(x1, f(x1), x2, f(x2))\n    return total","explicacion":["En clase la llamada fue `distancia((a+i*deltax, a+(i+1)*deltax), ...)`: el paréntesis extra agrupa dos valores en una tupla y la función recibe 3 argumentos en vez de 4 (TypeError).","Guardar x1 y x2 en variables hace la llamada más fácil de leer y de revisar.","Para y = x² entre 0 y 1 la longitud exacta es 1.4789428…"],"pruebas":[{"expr":"longitud_curva(0, 1, 1000)","esperado":1.4789428575445975,"tol":1e-05},{"expr":"distancia(0, 0, 3, 4)","esperado":5.0},{"expr":"longitud_curva(0, 1, 1)","esperado":1.4142135623730951}]},{"id":"harshad","tipo":"programa","nivel":2,"tema":"Cifras","patron":"p-validar","fuente":"Parcial 1 (23-6): número Harshad","titulo":"Número Harshad (programa completo)","enunciado":"Un entero positivo es Harshad (o de Niven) si es divisible de forma exacta entre la suma de sus dígitos. Diseña un programa que pida un número natural, lo valide (si el dato no es un número natural mayor que 0, debe volver a pedirlo) e indique si es Harshad. Usa la palabra «no» solo en el mensaje negativo.","inicio":"# Número Harshad\n","pistas":["Dos partes: (1) validación con `while bandera:` + `isdigit()` y `> 0`; (2) suma de dígitos con `% 10` y `// 10`, guardando una copia del número.","bandera = True\nwhile bandera:\n    n = input(\"Ingrese un número natural: \")\n    if n.isdigit() and int(n) > 0:\n        numero = int(n)\n        bandera = False\n    else:\n        print(\"Dato inválido\")\ncopia = numero\ns = 0\nwhile copia > 0:\n    s += copia % 10\n    copia //= 10\nif ___:\n    print(\"El número es Harshad\")\nelse:\n    print(\"El número no es Harshad\")"],"solucion":"# Número Harshad\nbandera = True\nwhile bandera:\n    n = input(\"Ingrese un número natural: \")\n    if n.isdigit() and int(n) > 0:\n        numero = int(n)\n        bandera = False\n    else:\n        print(\"Debe escribir correctamente el número\")\ncopia = numero\ns = 0\nwhile copia > 0:\n    s += copia % 10\n    copia //= 10\nif numero % s == 0:\n    print(\"El número es Harshad\")\nelse:\n    print(\"El número no es Harshad\")","explicacion":["Es la respuesta del profesor con una mejora: `int(n) > 0`. Sin ella, con 0 la suma de dígitos es 0 y `numero % s` da ZeroDivisionError.","La copia es necesaria porque el ciclo deja el número en 0.","Las pruebas también envían datos inválidos («abc», «0») para comprobar que el programa vuelve a pedir."],"pruebas":[{"nombre":"18 es Harshad (1+8 = 9 divide a 18)","entrada":"18\n","check":["si"]},{"nombre":"19 no es Harshad","entrada":"19\n","check":["no"]},{"nombre":"Rechaza «abc» y luego acepta 21","entrada":"abc\n21\n","check":["si"]},{"nombre":"Rechaza 0 y luego acepta 13","entrada":"0\n13\n","check":["no"]}]},{"id":"persistencia","tipo":"programa","nivel":2,"tema":"Cifras","patron":"p-cifras","fuente":"Parcial 1 (23-6): persistencia multiplicativa","titulo":"Persistencia multiplicativa (programa completo)","enunciado":"La persistencia multiplicativa es el número de veces que hay que multiplicar los dígitos de un número hasta llegar a un número de un solo dígito. Ejemplo: 39 → 27 → 14 → 4, persistencia 3. Diseña un programa que pida y valide un número natural y muestre su persistencia.","inicio":"# Persistencia multiplicativa\n","pistas":["Ciclo externo: mientras el número tenga más de un dígito (`numero > 9`), multiplica sus dígitos (ciclo interno) y cuenta una vuelta.","contador = 0\nwhile numero > 9:\n    producto = 1\n    while numero > 0:\n        producto *= numero % 10\n        numero //= 10\n    numero = ___\n    contador += 1\nprint(\"La persistencia multiplicativa es:\", contador)"],"solucion":"# Persistencia multiplicativa\nbandera = True\nwhile bandera:\n    n = input(\"Ingrese un número natural: \")\n    if n.isdigit():\n        numero = int(n)\n        bandera = False\n    else:\n        print(\"Debe escribir correctamente el número\")\ncontador = 0\nwhile numero > 9:\n    producto = 1\n    while numero > 0:\n        producto *= numero % 10\n        numero //= 10\n    numero = producto\n    contador += 1\nprint(\"La persistencia multiplicativa es:\", contador)","explicacion":["En tus apuntes el ciclo externo dice `while numero > 0`: al llegar a 4, multiplica 4 → 4 → 4… y nunca termina. La condición correcta es `numero > 9` (más de un dígito).","En los apuntes también aparecen `multiplicación` (con tilde) y `multiplicacion`: para Python son dos variables distintas.","Un número de un dígito tiene persistencia 0."],"pruebas":[{"nombre":"39 → 3","entrada":"39\n","check":["num",3]},{"nombre":"77 → 4 (77, 49, 36, 18, 8)","entrada":"77\n","check":["num",4]},{"nombre":"7 → 0","entrada":"7\n","check":["num",0]},{"nombre":"Rechaza «x» y luego 999 → 4","entrada":"x\n999\n","check":["num",4]}]},{"id":"narcisista","tipo":"programa","nivel":2,"tema":"Cifras","patron":"p-cifras","fuente":"Quiz del 16-6: número narcisista","titulo":"Número narcisista (programa completo)","enunciado":"Un número es narcisista si es igual a la suma de sus dígitos elevados a la cantidad de cifras. Ejemplo: 153 = 1³ + 5³ + 3³. Diseña un programa que pida y valide un número natural e indique si es narcisista. Usa la palabra «no» solo en el mensaje negativo.","inicio":"# Número narcisista\n","pistas":["Dos recorridos de las cifras: el primero cuenta cuántas tiene; el segundo suma cada dígito elevado a esa cantidad. Usa copias, porque cada recorrido deja el número en 0.","copia = numero\ncifras = 0\nwhile copia > 0:\n    copia //= 10\n    cifras += 1\ncopia = numero\ns = 0\nwhile copia > 0:\n    s += (copia % 10) ** ___\n    copia //= 10"],"solucion":"# Número narcisista\nbandera = True\nwhile bandera:\n    n = input(\"Ingrese un número natural: \")\n    if n.isdigit() and int(n) > 0:\n        numero = int(n)\n        bandera = False\n    else:\n        print(\"Debe escribir correctamente el número\")\ncopia = numero\ncifras = 0\nwhile copia > 0:\n    copia //= 10\n    cifras += 1\ncopia = numero\ns = 0\nwhile copia > 0:\n    s += (copia % 10) ** cifras\n    copia //= 10\nif s == numero:\n    print(\"El número es narcisista\")\nelse:\n    print(\"El número no es narcisista\")","explicacion":["Es la traza de tu repaso del quiz (407 → 3 cifras → 4³ + 0³ + 7³ = 407) escrita como programa.","Antes del segundo recorrido hay que volver a copiar el número: el primero lo dejó en 0."],"pruebas":[{"nombre":"153 es narcisista","entrada":"153\n","check":["si"]},{"nombre":"407 es narcisista","entrada":"407\n","check":["si"]},{"nombre":"123 no es narcisista","entrada":"123\n","check":["no"]},{"nombre":"Rechaza «-5» y luego acepta 9474","entrada":"-5\n9474\n","check":["si"]}]},{"id":"suma_binaria","tipo":"programa","nivel":3,"tema":"Binario","patron":"p-base","fuente":"Clase del 6-10: suma entre binarios","titulo":"Suma de binarios (programa completo)","enunciado":"Diseña un programa que pida dos números binarios, valide que solo tengan ceros y unos (si no, debe volver a pedir ese número), y muestre su suma en binario. Puedes convertir a decimal, sumar y volver a binario.","inicio":"# Suma de binarios\n","pistas":["Para validar: `texto.count('0') + texto.count('1') == len(texto)` y que no esté vacío. Reutilice `binario_a_decimal` y `decimal_a_binario`.","def binario_a_decimal(n):\n    s = 0\n    base = 1\n    while n > 0:\n        s += (n % 10) * ___\n        base *= 2\n        n //= 10\n    return s\n\ndef decimal_a_binario(n):\n    if n == 0:\n        return '0'\n    binario = ''\n    while n > 0:\n        binario = ___ + binario\n        n = n // 2\n    return binario\n\ndef leer_binario(mensaje):\n    bandera = True\n    while bandera:\n        t = input(mensaje)\n        if len(t) > 0 and ___:\n            bandera = False\n        else:\n            print(\"Solo se permiten ceros y unos\")\n    return int(t)\n\nb1 = leer_binario(\"Primer binario: \")\nb2 = leer_binario(\"Segundo binario: \")\nsuma = ___\nprint(\"La suma es:\", decimal_a_binario(suma))"],"solucion":"# Suma de binarios\ndef binario_a_decimal(n):\n    s = 0\n    base = 1\n    while n > 0:\n        s += (n % 10) * base\n        base *= 2\n        n //= 10\n    return s\n\ndef decimal_a_binario(n):\n    if n == 0:\n        return '0'\n    binario = ''\n    while n > 0:\n        binario = str(n % 2) + binario\n        n = n // 2\n    return binario\n\ndef leer_binario(mensaje):\n    bandera = True\n    while bandera:\n        t = input(mensaje)\n        if len(t) > 0 and t.count('0') + t.count('1') == len(t):\n            bandera = False\n        else:\n            print(\"Solo se permiten ceros y unos\")\n    return int(t)\n\nb1 = leer_binario(\"Primer binario: \")\nb2 = leer_binario(\"Segundo binario: \")\nsuma = binario_a_decimal(b1) + binario_a_decimal(b2)\nprint(\"La suma es:\", decimal_a_binario(suma))","explicacion":["La validación con `count` es la idea de tu apunte del 6-10, completada con `len(t) > 0`.","Una función `leer_binario` evita escribir dos veces la misma validación."],"pruebas":[{"nombre":"1011 + 101 = 10000","entrada":"1011\n101\n","check":["token","10000"]},{"nombre":"0 + 1 = 1","entrada":"0\n1\n","check":["token","1"]},{"nombre":"Rechaza «102» y luego 11 + 11 = 110","entrada":"102\n11\n11\n","check":["token","110"]}]},{"id":"bisiesto","tipo":"funcion","nivel":1,"tema":"Condiciones","patron":"","fuente":"Problemario: año bisiesto (13); clase, pág. 21","titulo":"¿Año bisiesto?","enunciado":"Un año es bisiesto si es divisible exacto entre 4. Pero si es fin de siglo (divisible entre 100, como 1900 o 2000), entonces tiene que ser divisible entre 400. Diseña la función `es_bisiesto(anio)` que devuelva True si el año es bisiesto y False si no. Ejemplos: 2024 sí, 1900 no, 2000 sí. Asume que el año es mayor que 1582.","inicio":"def es_bisiesto(anio):\n    \n","pistas":["Como en tu clase, separa primero los fin de siglo con `anio % 100 == 0`. A esos les preguntas por 400; a los demás, por 4.","def es_bisiesto(anio):\n    if anio % 100 == 0:\n        if ___:\n            return True\n        else:\n            return False\n    else:\n        if ___:\n            return True\n        else:\n            return False"],"solucion":"def es_bisiesto(anio):\n    if anio % 100 == 0:\n        if anio % 400 == 0:\n            return True\n        else:\n            return False\n    else:\n        if anio % 4 == 0:\n            return True\n        else:\n            return False","explicacion":["El orden importa. Si preguntas solo por 4, el 1900 sale bisiesto, porque 1900 % 4 == 0.","Divisible exacto se escribe `anio % 4 == 0`, con dos signos de igual. En tu cuaderno aparece `anno % 4 = 0`, que da SyntaxError.","La función devuelve True o False, no un texto como \"es bisiesto\"."],"pruebas":[{"expr":"es_bisiesto(2024)","esperado":true},{"expr":"es_bisiesto(2023)","esperado":false},{"expr":"es_bisiesto(1900)","esperado":false},{"expr":"es_bisiesto(2000)","esperado":true},{"expr":"es_bisiesto(2100)","esperado":false},{"expr":"es_bisiesto(1600)","esperado":true}]},{"id":"cuadrante","tipo":"funcion","nivel":1,"tema":"Condiciones","patron":"","fuente":"Problemario: cuadrante de un punto (8)","titulo":"¿En qué cuadrante está?","enunciado":"Diseña la función `cuadrante(x, y)` que reciba las coordenadas de un punto y devuelva un texto: `'I'` si x > 0 y y > 0, `'II'` si x < 0 y y > 0, `'III'` si x < 0 y y < 0, `'IV'` si x > 0 y y < 0. Si el punto está sobre un eje (x == 0 o y == 0, incluido el origen), devuelve `'eje'`.","inicio":"def cuadrante(x, y):\n    \n","pistas":["Usa una cadena `if/elif/else`. Pregunta primero por los ejes; así en las demás ramas ya sabes que x y y no valen 0.","def cuadrante(x, y):\n    if ___:\n        return 'eje'\n    elif x > 0 and y > 0:\n        return 'I'\n    elif ___:\n        return 'II'\n    elif x < 0 and y < 0:\n        return 'III'\n    else:\n        return ___"],"solucion":"def cuadrante(x, y):\n    if x == 0 or y == 0:\n        return 'eje'\n    elif x > 0 and y > 0:\n        return 'I'\n    elif x < 0 and y > 0:\n        return 'II'\n    elif x < 0 and y < 0:\n        return 'III'\n    else:\n        return 'IV'","explicacion":["Si dejas los ejes para el final, el punto (0, 5) no cumple ninguna condición con `>` o `<` y cae en el `else`: saldría 'IV'.","Es `x == 0 or y == 0`: basta con que una coordenada sea 0. Con `and` solo atraparías el origen.","El `else` cubre el único caso que queda: x > 0 y y < 0."],"pruebas":[{"expr":"cuadrante(3, 5)","esperado":"I"},{"expr":"cuadrante(-2, 4)","esperado":"II"},{"expr":"cuadrante(-1.5, -7)","esperado":"III"},{"expr":"cuadrante(6, -2)","esperado":"IV"},{"expr":"cuadrante(0, 5)","esperado":"eje"},{"expr":"cuadrante(4, 0)","esperado":"eje"}]},{"id":"tres_numeros","tipo":"funcion","nivel":1,"tema":"Condiciones","patron":"","fuente":"Problemario: mayor, medio y menor (17); clase, pág. 20","titulo":"Mayor, medio y menor","enunciado":"Diseña la función `mayor_medio_menor(a, b, c)` que reciba tres números en cualquier orden y devuelva la lista `[mayor, medio, menor]`. Ejemplo: `mayor_medio_menor(5, 9, 2)` devuelve `[9, 5, 2]`. No puedes usar `sort`, `sorted`, `max` ni `min`.","inicio":"def mayor_medio_menor(a, b, c):\n    \n","pistas":["Supón que `a` es el mayor y compáralo con `b` y con `c`. Haz lo mismo para el menor. El del medio es la suma de los tres menos el mayor y el menor.","def mayor_medio_menor(a, b, c):\n    mayor = a\n    if mayor < b:\n        mayor = b\n    if mayor < c:\n        mayor = c\n    menor = a\n    if ___:\n        menor = b\n    if ___:\n        menor = c\n    medio = ___\n    return [mayor, medio, menor]"],"solucion":"def mayor_medio_menor(a, b, c):\n    mayor = a\n    if mayor < b:\n        mayor = b\n    if mayor < c:\n        mayor = c\n    menor = a\n    if menor > b:\n        menor = b\n    if menor > c:\n        menor = c\n    medio = a + b + c - mayor - menor\n    return [mayor, medio, menor]","explicacion":["Es el «primer programa del if» de tu cuaderno (pág. 20), escrito como función que devuelve una lista.","Son `if` separados, no `if/elif`: hay que comparar con `b` y también con `c`.","El truco del medio funciona aunque haya repetidos: con 4, 4, 1 da 4 + 4 + 1 − 4 − 1 = 4."],"prohibido":["sorted(",".sort(","max(","min("],"pruebas":[{"expr":"mayor_medio_menor(5, 9, 2)","esperado":[9,5,2]},{"expr":"mayor_medio_menor(1, 2, 3)","esperado":[3,2,1]},{"expr":"mayor_medio_menor(3, 2, 1)","esperado":[3,2,1]},{"expr":"mayor_medio_menor(10, 30, 20)","esperado":[30,20,10]},{"expr":"mayor_medio_menor(4, 4, 1)","esperado":[4,4,1]},{"expr":"mayor_medio_menor(7, 7, 7)","esperado":[7,7,7]}]},{"id":"festivo_ork","tipo":"funcion","nivel":2,"tema":"Condiciones","patron":"","fuente":"Problemario: festividades de Ork (14)","titulo":"Años festivos en Ork","enunciado":"En el planeta Ork hay fiesta cada 8 años. Cada 72 años se celebra el cumpleaños de Orson y también se festeja el año siguiente. Pero cada 48 años se suspende cualquier celebración. Los años se cuentan desde el año 1. Interpreta así: un año es festivo si es divisible entre 8, o si `anio >= 72` y `anio % 72` vale 0 o 1. Aun así, si el año es divisible entre 48, no es festivo. Diseña la función `es_festivo(anio)` que devuelva True o False. Ejemplos: 16 y 73 son festivos; 48 y 144 no.","inicio":"def es_festivo(anio):\n    \n","pistas":["Pregunta primero por la regla que suspende (48). Después revisa las dos reglas que dan fiesta. Si ninguna se cumple, no es festivo.","def es_festivo(anio):\n    if ___:\n        return False\n    elif anio % 8 == 0:\n        return True\n    elif anio >= 72 and (___):\n        return True\n    else:\n        return False"],"solucion":"def es_festivo(anio):\n    if anio % 48 == 0:\n        return False\n    elif anio % 8 == 0:\n        return True\n    elif anio >= 72 and (anio % 72 == 0 or anio % 72 == 1):\n        return True\n    else:\n        return False","explicacion":["La suspensión va primero. Si preguntas antes por 8, el 48 entra como festivo, porque 48 % 8 == 0.","`anio % 72 == 1` es el año siguiente al cumpleaños (73, 145…). El `anio >= 72` evita que el año 1 cuente, porque 1 % 72 también da 1.","Los paréntesis en `(anio % 72 == 0 or anio % 72 == 1)` hacen que el `and` se aplique a las dos opciones."],"pruebas":[{"expr":"es_festivo(16)","esperado":true},{"expr":"es_festivo(48)","esperado":false},{"expr":"es_festivo(73)","esperado":true},{"expr":"es_festivo(144)","esperado":false},{"expr":"es_festivo(145)","esperado":true},{"expr":"es_festivo(1)","esperado":false}]},{"id":"factorial_rec","tipo":"funcion","nivel":2,"tema":"Funciones","patron":"p-funciones","fuente":"Problemario: factorial recursivo (104)","titulo":"Factorial recursivo","enunciado":"Diseña una función recursiva `factorial(n)` que devuelva n! para un entero n ≥ 0. Recuerda: 0! = 1 y n! = n · (n − 1)!. Recursiva quiere decir que la función se llama a sí misma. No uses `for`, `while` ni `math`.","inicio":"def factorial(n):\n    \n","pistas":["Una función recursiva tiene dos partes: un caso base que se responde sin llamarse (0! = 1) y una llamada a sí misma con un problema más pequeño (n − 1).","def factorial(n):\n    if n == 0:\n        return ___\n    else:\n        return n * ___"],"solucion":"def factorial(n):\n    if n == 0:\n        return 1\n    else:\n        return n * factorial(n - 1)","explicacion":["Caso base: `if n == 0: return 1`. Sin él, la función se llama sin fin y Python da RecursionError.","Llamada recursiva: factorial(3) = 3 · factorial(2) = 3 · 2 · factorial(1) = 3 · 2 · 1 · factorial(0) = 6.","Errores comunes: llamar `factorial(n)` en vez de `factorial(n - 1)` (el problema no se achica) u olvidar el `return` delante."],"prohibido":["for ","while","math"],"pruebas":[{"expr":"factorial(0)","esperado":1},{"expr":"factorial(1)","esperado":1},{"expr":"factorial(3)","esperado":6},{"expr":"factorial(5)","esperado":120},{"expr":"factorial(10)","esperado":3628800}]},{"id":"capital_rec","tipo":"funcion","nivel":2,"tema":"Funciones","patron":"p-funciones","fuente":"Problemario: interés compuesto recursivo (105)","titulo":"Interés compuesto recursivo","enunciado":"Si pones un capital inicial c0 a interés compuesto durante n años, con interés anual r (en porcentaje), al final tienes Cn = c0 · (1 + r/100)ⁿ. Diseña una función recursiva `capital(c0, r, n)` que devuelva ese capital. Idea: el capital de n años es el de n − 1 años multiplicado por (1 + r/100), y con n = 0 el capital es c0. No uses `**`, `pow`, `for` ni `while`.","inicio":"def capital(c0, r, n):\n    \n","pistas":["Caso base: si n es 0, devuelve c0. Si no, calcula el capital de un año menos llamando a la misma función y multiplícalo por (1 + r / 100).","def capital(c0, r, n):\n    if n == 0:\n        return ___\n    else:\n        return capital(c0, r, ___) * (1 + r / 100)"],"solucion":"def capital(c0, r, n):\n    if n == 0:\n        return c0\n    else:\n        return capital(c0, r, n - 1) * (1 + r / 100)","explicacion":["Con 0 años el dinero no ha crecido: por eso el caso base es `return c0`.","Cada llamada resta un año: capital(1000, 5, 2) = capital(1000, 5, 1) · 1.05 = 1000 · 1.05 · 1.05 = 1102.5.","Error común: multiplicar por `r / 100` sin el `1 +`. Eso da solo el interés y el capital se encoge."],"prohibido":["**","pow(","for ","while"],"pruebas":[{"expr":"capital(1000, 5, 0)","tol":1e-06,"esperado":1000},{"expr":"capital(1000, 5, 1)","tol":1e-06,"esperado":1050.0},{"expr":"capital(1000, 5, 2)","tol":1e-06,"esperado":1102.5},{"expr":"capital(1000, 10, 3)","tol":1e-06,"esperado":1331.0},{"expr":"capital(2500, 3.5, 10)","tol":1e-06,"esperado":3526.496901552803},{"expr":"capital(500, 0, 7)","tol":1e-06,"esperado":500.0}]},{"id":"dec_octal","tipo":"funcion","nivel":2,"tema":"Binario","patron":"p-base","fuente":"Problemario: base diez a binaria u octal (50); clase del 6-10","titulo":"Decimal a otra base","enunciado":"Diseña la función `decimal_a_base(n, base)` que reciba un entero n ≥ 0 y una base entre 2 y 9, y devuelva la representación de n en esa base como texto. Ejemplos: `decimal_a_base(163, 2)` devuelve '10100011', `decimal_a_base(64, 8)` devuelve '100' y `decimal_a_base(0, 8)` devuelve '0'. No uses `bin`, `oct` ni `format`.","inicio":"def decimal_a_base(n, base):\n    \n","pistas":["Es el método de clase para binario, pero dividiendo entre `base` en lugar de 2: `n % base` da la siguiente cifra y `n // base` avanza. Pega cada cifra delante del texto.","def decimal_a_base(n, base):\n    if n == 0:\n        return '0'\n    texto = ''\n    while n > 0:\n        texto = ___ + texto\n        n = ___\n    return texto"],"solucion":"def decimal_a_base(n, base):\n    if n == 0:\n        return '0'\n    texto = ''\n    while n > 0:\n        texto = str(n % base) + texto\n        n = n // base\n    return texto","explicacion":["Los restos salen de la última cifra a la primera. Por eso se pega delante: `str(n % base) + texto`.","`texto` empieza vacío (`''`), no con un espacio como en tu apunte de binario.","El 0 va aparte: el `while` no correría y devolverías un texto vacío."],"prohibido":["bin(","oct(","format("],"pruebas":[{"expr":"decimal_a_base(163, 2)","esperado":"10100011"},{"expr":"decimal_a_base(64, 8)","esperado":"100"},{"expr":"decimal_a_base(2026, 8)","esperado":"3752"},{"expr":"decimal_a_base(7, 8)","esperado":"7"},{"expr":"decimal_a_base(23, 5)","esperado":"43"},{"expr":"decimal_a_base(0, 8)","esperado":"0"}]},{"id":"capicua_dos_bases","tipo":"funcion","nivel":2,"tema":"Binario","patron":"p-cifras","fuente":"Problemario: capicúa en base 10 y base 2 (52)","titulo":"Capicúa en dos bases","enunciado":"El 585 es capicúa en base 10 y también en binario, donde se escribe 1001001001. Diseña la función `capicua_dos_bases(n)` que reciba un natural n y devuelva True si n es capicúa en las dos bases, y False si no. No uses `bin` ni `[::-1]`.","inicio":"def capicua_dos_bases(n):\n    \n","pistas":["Usa tu programa de capicúa de clase (`volteado = volteado * 10 + digito`) con la base como parámetro: en base 2 usas `% 2`, `// 2` y `* 2`. Si el volteado es igual al original, es capicúa en esa base.","def voltear(n, base):\n    volteado = 0\n    while n > 0:\n        volteado = volteado * base + ___\n        n = n // base\n    return volteado\n\ndef capicua_dos_bases(n):\n    return voltear(n, 10) == n and ___"],"solucion":"def voltear(n, base):\n    volteado = 0\n    while n > 0:\n        volteado = volteado * base + n % base\n        n = n // base\n    return volteado\n\ndef capicua_dos_bases(n):\n    return voltear(n, 10) == n and voltear(n, 2) == n","explicacion":["No hace falta escribir el binario como texto: voltear en base 2 trabaja directo con los bits.","Hacen falta las dos condiciones (`and`). El 6 es capicúa en base 10, pero en binario es 110. El 17 en binario es 10001, pero no es capicúa en base 10.","Dentro de `voltear` el ciclo deja `n` en 0, pero eso no daña el `n` de `capicua_dos_bases`: cada función tiene su propia variable."],"prohibido":["bin(","[::-1]"],"pruebas":[{"expr":"capicua_dos_bases(585)","esperado":true},{"expr":"capicua_dos_bases(33)","esperado":true},{"expr":"capicua_dos_bases(7)","esperado":true},{"expr":"capicua_dos_bases(6)","esperado":false},{"expr":"capicua_dos_bases(17)","esperado":false},{"expr":"capicua_dos_bases(121)","esperado":false}]},{"id":"suma_bin_listas","tipo":"funcion","nivel":3,"tema":"Binario","patron":"p-base","fuente":"Problemario: suma de binarios en vectores (141)","titulo":"Suma binaria con listas","enunciado":"Los dígitos de un binario se guardan en una lista, del primero al último: [1, 0, 1, 1] es 1011. Diseña la función `suma_binaria(a, b)` que reciba dos listas así (pueden tener distinto largo) y devuelva la suma como lista de dígitos. Suma columna por columna, de derecha a izquierda, con acarreo (lo que «llevas»), como en tu cuaderno. Ejemplo: `suma_binaria([1, 0, 1, 1], [1, 0, 1])` devuelve `[1, 0, 0, 0, 0]`. No conviertas a decimal: no uses `int` ni `bin`.","inicio":"def suma_binaria(a, b):\n    \n","pistas":["Lleva un índice para cada lista, empezando por el final. En cada columna suma el acarreo y los dígitos que queden. El dígito del resultado es `s % 2` y lo que llevas es `s // 2`.","def suma_binaria(a, b):\n    i = len(a) - 1\n    j = len(b) - 1\n    acarreo = 0\n    resultado = []\n    while i >= 0 or j >= 0 or acarreo > 0:\n        s = acarreo\n        if i >= 0:\n            s = s + a[i]\n        if j >= 0:\n            s = s + ___\n        resultado = [___] + resultado\n        acarreo = ___\n        i = i - 1\n        j = j - 1\n    return resultado"],"solucion":"def suma_binaria(a, b):\n    i = len(a) - 1\n    j = len(b) - 1\n    acarreo = 0\n    resultado = []\n    while i >= 0 or j >= 0 or acarreo > 0:\n        s = acarreo\n        if i >= 0:\n            s = s + a[i]\n        if j >= 0:\n            s = s + b[j]\n        resultado = [s % 2] + resultado\n        acarreo = s // 2\n        i = i - 1\n        j = j - 1\n    return resultado","explicacion":["En cada columna `s` vale 0, 1, 2 o 3. 2 es «0 y llevo 1»; 3 es «1 y llevo 1». Por eso el dígito es `s % 2` y el acarreo `s // 2`.","Los `if i >= 0` y `if j >= 0` resuelven el distinto largo: cuando una lista se acaba, esa columna solo suma la otra.","El `or acarreo > 0` del `while` agrega el 1 final: [1] + [1] da [1, 0]. Sin él, saldría [0]."],"prohibido":["bin("," int(","=int("],"pruebas":[{"expr":"suma_binaria([1, 0, 1, 1], [1, 0, 1])","esperado":[1,0,0,0,0]},{"expr":"suma_binaria([1, 0, 1], [1, 0, 1, 1])","esperado":[1,0,0,0,0]},{"expr":"suma_binaria([1], [1])","esperado":[1,0]},{"expr":"suma_binaria([0], [0])","esperado":[0]},{"expr":"suma_binaria([1, 1, 0, 1, 0], [1, 1, 1])","esperado":[1,0,0,0,0,1]},{"expr":"suma_binaria([1, 1, 1, 1], [1])","esperado":[1,0,0,0,0]}]},{"id":"polares","tipo":"funcion","nivel":1,"tema":"Geometría","patron":"","fuente":"Problemario: coordenadas polares (1); clase de junio","titulo":"Coordenadas polares","enunciado":"Diseña `polares(x, y)` que reciba las coordenadas cartesianas de un punto del plano y devuelva la lista `[r, theta]`. r es la distancia al origen: r = √(x² + y²). theta es el ángulo en grados medido desde el eje x positivo, con 0 ≤ theta < 360. Usa `math.atan2(y, x)` y `math.degrees`. En el origen, `atan2` da 0, así que (0, 0) devuelve [0, 0].","inicio":"import math\n\ndef polares(x, y):\n    \n","pistas":["`math.atan2(y, x)` da el ángulo en radianes, entre −180° y 180°, y ya toma en cuenta el cuadrante. Pásalo a grados y, si sale negativo, súmale 360.","import math\n\ndef polares(x, y):\n    r = math.sqrt(x**2 + y**2)\n    theta = math.degrees(___)\n    if theta < 0:\n        theta = theta + 360\n    return [r, theta]"],"solucion":"import math\n\ndef polares(x, y):\n    r = math.sqrt(x**2 + y**2)\n    theta = math.degrees(math.atan2(y, x))\n    if theta < 0:\n        theta = theta + 360\n    return [r, theta]","explicacion":["`math.atan(y / x)` solo ve el cociente: para (1, 1) y (−1, −1) da lo mismo, 45°, y con x = 0 divide entre cero. `math.atan2(y, x)` recibe los dos datos por separado, así sabe en qué cuadrante está el punto.","`atan2` devuelve valores entre −180° y 180°. Sumar 360 a los negativos los lleva a [0, 360): −90° pasa a ser 270°.","En tus apuntes, cuando x ≠ 0 el programa mostraba solo la tangente y / x, no el ángulo. Faltaba convertirla en ángulo."],"pruebas":[{"expr":"polares(3, 4)","tol":1e-06,"esperado":[5.0,53.13010235415598]},{"expr":"polares(-1, 1)","tol":1e-06,"esperado":[1.4142135623730951,135.0]},{"expr":"polares(-1, -1)","tol":1e-06,"esperado":[1.4142135623730951,225.0]},{"expr":"polares(0, -2)","tol":1e-06,"esperado":[2.0,270.0]},{"expr":"polares(-3, 0)","tol":1e-06,"esperado":[3.0,180.0]},{"expr":"polares(0, 0)","tol":1e-06,"esperado":[0.0,0.0]}]},{"id":"segmento","tipo":"funcion","nivel":1,"tema":"Geometría","patron":"","fuente":"Problemario: longitud y punto medio de un segmento (2); clase de junio","titulo":"Longitud y punto medio","enunciado":"Diseña `segmento(x1, y1, x2, y2)` que reciba dos puntos del plano y devuelva la lista `[longitud, xm, ym]`: la longitud del segmento que los une y las coordenadas del punto medio. Fórmulas: d = √((x2 − x1)² + (y2 − y1)²), xm = (x1 + x2)/2, ym = (y1 + y2)/2.","inicio":"import math\n\ndef segmento(x1, y1, x2, y2):\n    \n","pistas":["Es tu programa de clase: las mismas tres fórmulas, pero al final un `return` con la lista en lugar de los `print`.","import math\n\ndef segmento(x1, y1, x2, y2):\n    longitud = math.sqrt((x2 - x1)**2 + ___)\n    xm = (x1 + x2) / 2\n    ym = ___\n    return [longitud, xm, ym]"],"solucion":"import math\n\ndef segmento(x1, y1, x2, y2):\n    longitud = math.sqrt((x2 - x1)**2 + (y2 - y1)**2)\n    xm = (x1 + x2) / 2\n    ym = (y1 + y2) / 2\n    return [longitud, xm, ym]","explicacion":["La función devuelve los tres valores juntos en una lista, en el orden que pide el enunciado.","Los paréntesis de `(x1 + x2) / 2` son necesarios: sin ellos, `x1 + x2 / 2` divide solo a x2.","Si los dos puntos son iguales, la longitud es 0 y el punto medio es el mismo punto."],"pruebas":[{"expr":"segmento(0, 0, 3, 4)","tol":1e-06,"esperado":[5.0,1.5,2.0]},{"expr":"segmento(-1, -1, 2, 3)","tol":1e-06,"esperado":[5.0,0.5,1.0]},{"expr":"segmento(2, 5, -4, 1)","tol":1e-06,"esperado":[7.211102550927978,-1.0,3.0]},{"expr":"segmento(1, 2, 1, 2)","tol":1e-06,"esperado":[0.0,1.0,2.0]},{"expr":"segmento(0.5, 0, 0.5, -3)","tol":1e-06,"esperado":[3.0,0.5,-1.5]}]},{"id":"interpolacion","tipo":"funcion","nivel":1,"tema":"Geometría","patron":"","fuente":"Problemario: interpolación lineal (3); clase de junio","titulo":"Interpolación lineal","enunciado":"La recta que pasa por (x1, y1) y (x2, y2) permite calcular la ordenada y de cualquier abscisa x: y = y1 + (y2 − y1)/(x2 − x1) · (x − x1). Diseña `interpolar(x1, y1, x2, y2, x)` que devuelva y. Supón que x1 ≠ x2.","inicio":"def interpolar(x1, y1, x2, y2, x):\n    \n","pistas":["Calcula primero la pendiente m = (y2 − y1)/(x2 − x1) con `/` y después aplica la fórmula.","def interpolar(x1, y1, x2, y2, x):\n    m = ___\n    return y1 + m * (x - x1)"],"solucion":"def interpolar(x1, y1, x2, y2, x):\n    m = (y2 - y1) / (x2 - x1)\n    return y1 + m * (x - x1)","explicacion":["En tus apuntes la pendiente se calculó con `//`. Esa es la división entera: (4 − 1)//(3 − 1) da 1 y no 1.5. Para la pendiente se usa `/`.","La fórmula también sirve si x está fuera de [x1, x2]: eso se llama extrapolar.","Con x1 == x2 la división da ZeroDivisionError. En un programa con `input` hay que avisarlo antes, como hiciste en clase con el `if`."],"pruebas":[{"expr":"interpolar(1, 1, 3, 4, 2)","tol":1e-06,"esperado":2.5},{"expr":"interpolar(0, 0, 10, 100, 2.5)","tol":1e-06,"esperado":25.0},{"expr":"interpolar(1, 5, 3, 1, 4)","tol":1e-06,"esperado":-1.0},{"expr":"interpolar(2, 3, 6, 3, 100)","tol":1e-06,"esperado":3.0},{"expr":"interpolar(-1, 2, 1, 4, 0)","tol":1e-06,"esperado":3.0}]},{"id":"segundos","tipo":"funcion","nivel":1,"tema":"Geometría","patron":"","fuente":"Problemario: segundos a años, meses, días, horas y minutos (4); clase de junio","titulo":"Segundos a años, meses y días","enunciado":"Diseña `convertir_segundos(s)` que reciba una cantidad entera y positiva de segundos y devuelva la lista `[anios, meses, dias, horas, minutos, segundos]`. Supón años de 360 días y meses de 30 días. Usa `//` y `%`. Ojo: el problemario pone como ejemplo que 31803310 s son 1 año, 3 días, 2 h, 15 min y 10 s, pero eso sale con años de 365 días. Con años de 360 días, como dice el mismo enunciado, son 1 año, 0 meses, 8 días, 2 h, 15 min y 10 s.","inicio":"def convertir_segundos(s):\n    \n","pistas":["Equivalencias: 1 año = 31104000 s, 1 mes = 2592000 s, 1 día = 86400 s, 1 hora = 3600 s. Con `//` sabes cuántas unidades completas caben y con `%` te quedas con lo que sobra.","def convertir_segundos(s):\n    anios = s // 31104000\n    s = s % 31104000\n    meses = s // 2592000\n    s = s % 2592000\n    dias = ___\n    s = ___\n    horas = s // 3600\n    s = s % 3600\n    minutos = s // 60\n    s = s % 60\n    return [anios, meses, dias, horas, minutos, s]"],"solucion":"def convertir_segundos(s):\n    anios = s // 31104000\n    s = s % 31104000\n    meses = s // 2592000\n    s = s % 2592000\n    dias = s // 86400\n    s = s % 86400\n    horas = s // 3600\n    s = s % 3600\n    minutos = s // 60\n    s = s % 60\n    return [anios, meses, dias, horas, minutos, s]","explicacion":["Cada paso es igual: `//` da cuántas unidades completas caben y `%` deja el resto para la unidad siguiente.","En Python los miles no se separan con puntos: `31.104.000` da SyntaxError. Se escribe `31104000` (o `31_104_000`).","Usa nombres sin tilde ni ñ (`anios`, `dias`). Si escribes `días` en un lado y `dias` en otro, Python los toma como variables distintas y da NameError."],"pruebas":[{"expr":"convertir_segundos(31803310)","esperado":[1,0,8,2,15,10]},{"expr":"convertir_segundos(36561906)","esperado":[1,2,3,4,5,6]},{"expr":"convertir_segundos(59)","esperado":[0,0,0,0,0,59]},{"expr":"convertir_segundos(86399)","esperado":[0,0,0,23,59,59]},{"expr":"convertir_segundos(2592000)","esperado":[0,1,0,0,0,0]},{"expr":"convertir_segundos(3600)","esperado":[0,0,0,1,0,0]}]},{"id":"cilindro","tipo":"funcion","nivel":1,"tema":"Geometría","patron":"","fuente":"Problemario: recipiente cilíndrico (5); clase de junio","titulo":"Volumen y área de un cilindro","enunciado":"Diseña `cilindro(radio, altura)` que devuelva la lista `[volumen, area_total]` de un recipiente cilíndrico. Volumen: V = π·r²·h. Área total (las dos tapas más la pared): A = 2·π·r² + 2·π·r·h. Usa `math.pi`.","inicio":"import math\n\ndef cilindro(radio, altura):\n    \n","pistas":["Traduce cada fórmula a una línea de Python: π es `math.pi` y r² es `radio**2`.","import math\n\ndef cilindro(radio, altura):\n    volumen = math.pi * radio**2 * altura\n    area_total = ___\n    return [volumen, area_total]"],"solucion":"import math\n\ndef cilindro(radio, altura):\n    volumen = math.pi * radio**2 * altura\n    area_total = 2 * math.pi * radio**2 + 2 * math.pi * radio * altura\n    return [volumen, area_total]","explicacion":["`2 * math.pi * radio**2` son las dos tapas circulares. `2 * math.pi * radio * altura` es la pared: desenrollada es un rectángulo de 2πr por h.","Escribe `math.pi` y no 3.14: con 3.14 el resultado se aleja del exacto y las pruebas lo notan.","Es la solución de tu clase convertida en función, con nombres en minúscula (`volumen`, `area_total`)."],"pruebas":[{"expr":"cilindro(1, 1)","tol":1e-06,"esperado":[3.141592653589793,12.566370614359172]},{"expr":"cilindro(2, 5)","tol":1e-06,"esperado":[62.83185307179586,87.96459430051421]},{"expr":"cilindro(3, 0)","tol":1e-06,"esperado":[0.0,56.548667764616276]},{"expr":"cilindro(0.5, 10)","tol":1e-06,"esperado":[7.853981633974483,32.98672286269283]}]},{"id":"esfericas","tipo":"funcion","nivel":2,"tema":"Geometría","patron":"","fuente":"Problemario: coordenadas cilíndricas y esféricas (6); clase de junio","titulo":"Coordenadas esféricas","enunciado":"Diseña `cartesianas_a_esfericas(x, y, z)` que devuelva la lista `[r, theta, phi]` del punto (x, y, z), con los ángulos en grados. r = √(x² + y² + z²) es la distancia al origen. theta es el ángulo azimutal: está en el plano xy, se mide desde el eje x positivo y va de 0 a 360 (sin incluir 360); es el mismo ángulo de las polares, con `math.atan2(y, x)`. phi es el ángulo polar: se mide desde el eje z positivo, phi = arccos(z / r), y va de 0 a 180. Si el punto es el origen (r == 0), devuelve [0, 0, 0].","inicio":"import math\n\ndef cartesianas_a_esfericas(x, y, z):\n    \n","pistas":["Calcula r y, si es 0, devuelve [0, 0, 0] antes de dividir. theta sale igual que en el reto de polares, y phi con `math.acos(z / r)` pasado a grados.","import math\n\ndef cartesianas_a_esfericas(x, y, z):\n    r = math.sqrt(x**2 + y**2 + z**2)\n    if r == 0:\n        return [0, 0, 0]\n    theta = math.degrees(math.atan2(y, x))\n    if theta < 0:\n        theta = theta + 360\n    phi = math.degrees(___)\n    return [r, theta, phi]"],"solucion":"import math\n\ndef cartesianas_a_esfericas(x, y, z):\n    r = math.sqrt(x**2 + y**2 + z**2)\n    if r == 0:\n        return [0, 0, 0]\n    theta = math.degrees(math.atan2(y, x))\n    if theta < 0:\n        theta = theta + 360\n    phi = math.degrees(math.acos(z / r))\n    return [r, theta, phi]","explicacion":["El `if r == 0` va antes de `z / r`: en el origen esa división daría ZeroDivisionError.","`math.acos` siempre devuelve un ángulo entre 0 y π (0° y 180°), justo el rango de phi. Sobre el eje z, `atan2(0, 0)` da 0, así que theta queda en 0.","En tus apuntes se escribió `theta_rad = math.degrees(theta_rad)` sin calcular antes `theta_rad` (NameError). Primero `math.atan2(y, x)` y después `math.degrees`. Las cilíndricas del mismo problema son (√(x² + y²), theta, z)."],"pruebas":[{"expr":"cartesianas_a_esfericas(1, 1, 1)","tol":1e-06,"esperado":[1.7320508075688772,45.0,54.735610317245346]},{"expr":"cartesianas_a_esfericas(0, 0, 5)","tol":1e-06,"esperado":[5.0,0.0,0.0]},{"expr":"cartesianas_a_esfericas(0, 0, -2)","tol":1e-06,"esperado":[2.0,0.0,180.0]},{"expr":"cartesianas_a_esfericas(0, -3, 0)","tol":1e-06,"esperado":[3.0,270.0,90.0]},{"expr":"cartesianas_a_esfericas(-1, 0, 1)","tol":1e-06,"esperado":[1.4142135623730951,180.0,45.00000000000001]},{"expr":"cartesianas_a_esfericas(0, 0, 0)","tol":1e-06,"esperado":[0,0,0]}]},{"id":"reloj","tipo":"funcion","nivel":2,"tema":"Geometría","patron":"","fuente":"Problemario: ángulo entre las agujas del reloj (7); clases del 9-6 y de junio","titulo":"Ángulo entre las agujas del reloj","enunciado":"Diseña `angulo_reloj(hora, minutos)` que devuelva el menor ángulo, en grados, entre el horario y el minutero. La hora puede venir de 0 a 23 (15 es lo mismo que 3) y los minutos de 0 a 59. El minutero avanza 6° por minuto. El horario avanza 30° por hora y además 0.5° por cada minuto. El resultado queda entre 0 y 180. Ejemplos: 3:00 da 90; 12:30 da 165.","inicio":"def angulo_reloj(hora, minutos):\n    \n","pistas":["Lleva la hora a 12 horas con `hora % 12`, calcula la posición de cada aguja, toma la diferencia con `abs` y, si pasa de 180, usa 360 menos la diferencia.","def angulo_reloj(hora, minutos):\n    hora = hora % 12\n    angulo_minutero = minutos * 6\n    angulo_horario = ___\n    diferencia = abs(angulo_horario - angulo_minutero)\n    if diferencia > 180:\n        diferencia = ___\n    return diferencia"],"solucion":"def angulo_reloj(hora, minutos):\n    hora = hora % 12\n    angulo_minutero = minutos * 6\n    angulo_horario = hora * 30 + minutos * 0.5\n    diferencia = abs(angulo_horario - angulo_minutero)\n    if diferencia > 180:\n        diferencia = 360 - diferencia\n    return diferencia","explicacion":["A las 12:30 el horario no está en el 12: ya avanzó 30 × 0.5 = 15°. Por eso el ángulo es 180 − 15 = 165 y no 180.","En tus apuntes aparece `minutos * 0,5`. En Python el decimal va con punto: `0,5` crea una tupla y la suma da TypeError. También faltaban los `:` después de `if diferencia > 180`.","`abs` evita el `if/else` para restar el mayor menos el menor. Si la diferencia pasa de 180, el ángulo menor es el del otro lado: 360 − diferencia."],"pruebas":[{"expr":"angulo_reloj(3, 0)","tol":1e-06,"esperado":90.0},{"expr":"angulo_reloj(9, 0)","tol":1e-06,"esperado":90.0},{"expr":"angulo_reloj(12, 30)","tol":1e-06,"esperado":165.0},{"expr":"angulo_reloj(6, 0)","tol":1e-06,"esperado":180.0},{"expr":"angulo_reloj(15, 15)","tol":1e-06,"esperado":7.5},{"expr":"angulo_reloj(23, 59)","tol":1e-06,"esperado":5.5}]},{"id":"colineales","tipo":"funcion","nivel":1,"tema":"Geometría","patron":"","fuente":"Problemario: puntos colineales (9); clase de septiembre (ejercicio de guía)","titulo":"¿Puntos colineales?","enunciado":"Tres puntos son colineales si están sobre una misma recta. Diseña `son_colineales(x1, y1, x2, y2, x3, y3)` que devuelva True o False. Usa el producto cruz (determinante) de tu clase: los puntos son colineales si x1·(y2 − y3) + x2·(y3 − y1) + x3·(y1 − y2) = 0. Como los datos pueden ser decimales, toma como cero cualquier valor con `abs(det) < 1e-9`.","inicio":"def son_colineales(x1, y1, x2, y2, x3, y3):\n    \n","pistas":["Guarda el determinante en una variable y devuelve directamente la comparación `abs(det) < 1e-9`, que ya es True o False.","def son_colineales(x1, y1, x2, y2, x3, y3):\n    det = x1 * (y2 - y3) + x2 * (y3 - y1) + ___\n    return abs(det) < 1e-9"],"solucion":"def son_colineales(x1, y1, x2, y2, x3, y3):\n    det = x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2)\n    return abs(det) < 1e-9","explicacion":["Comparar pendientes (la opción A de tu clase) divide entre x2 − x1, que vale 0 si los puntos están en una recta vertical. El producto cruz no divide: por eso es la opción recomendada.","En tus apuntes faltaba el `*`: `x1(y2-y3)` significa «llamar a x1 como función» y da TypeError. Se escribe `x1 * (y2 - y3)`.","Con decimales, `== 0` puede fallar por redondeo: con (0.1, 0.2), (0.2, 0.4) y (0.3, 0.6) el determinante da 6.9e-18, no 0 exacto. Por eso `abs(det) < 1e-9`."],"pruebas":[{"expr":"son_colineales(0, 0, 1, 1, 2, 2)","esperado":true},{"expr":"son_colineales(0, 0, 1, 1, 2, 0)","esperado":false},{"expr":"son_colineales(1, 1, 1, 5, 1, -3)","esperado":true},{"expr":"son_colineales(0.1, 0.2, 0.2, 0.4, 0.3, 0.6)","esperado":true},{"expr":"son_colineales(2, 3, 4, 7, 5, 8)","esperado":false},{"expr":"son_colineales(0, 0, 0, 0, 3, 4)","esperado":true}]},{"id":"tipo_triangulo","tipo":"funcion","nivel":2,"tema":"Geometría","patron":"p-funciones","fuente":"Problemario: tipo de triángulo (10); clase de septiembre (ejercicio de guía)","titulo":"¿Qué tipo de triángulo?","enunciado":"Diseña `tipo_triangulo(x1, y1, x2, y2, x3, y3)` que reciba tres puntos y devuelva uno de estos textos, escritos sin tildes: `'no forma triangulo'` si los puntos son colineales; si forman triángulo, `'equilatero'` (3 lados iguales), `'isosceles'` (2 lados iguales) o `'escaleno'` (3 lados distintos). Compara los lados con `math.isclose`, no con `==`. Puedes escribir una función auxiliar `distancia(x1, y1, x2, y2)`.","inicio":"import math\n\ndef distancia(x1, y1, x2, y2):\n    \n\ndef tipo_triangulo(x1, y1, x2, y2, x3, y3):\n    \n","pistas":["Primero el determinante del reto de colineales: si es casi 0, no hay triángulo. Si no, calcula los tres lados con `distancia` y clasifica con `if/elif/else`, empezando por el equilátero.","import math\n\ndef distancia(x1, y1, x2, y2):\n    return math.sqrt((x2 - x1)**2 + (y2 - y1)**2)\n\ndef tipo_triangulo(x1, y1, x2, y2, x3, y3):\n    det = x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2)\n    if abs(det) < 1e-9:\n        return 'no forma triangulo'\n    a = distancia(x1, y1, x2, y2)\n    b = distancia(x2, y2, x3, y3)\n    c = distancia(x1, y1, x3, y3)\n    if math.isclose(a, b) and math.isclose(b, c):\n        return 'equilatero'\n    elif ___:\n        return 'isosceles'\n    else:\n        return 'escaleno'"],"solucion":"import math\n\ndef distancia(x1, y1, x2, y2):\n    return math.sqrt((x2 - x1)**2 + (y2 - y1)**2)\n\ndef tipo_triangulo(x1, y1, x2, y2, x3, y3):\n    det = x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2)\n    if abs(det) < 1e-9:\n        return 'no forma triangulo'\n    a = distancia(x1, y1, x2, y2)\n    b = distancia(x2, y2, x3, y3)\n    c = distancia(x1, y1, x3, y3)\n    if math.isclose(a, b) and math.isclose(b, c):\n        return 'equilatero'\n    elif math.isclose(a, b) or math.isclose(b, c) or math.isclose(a, c):\n        return 'isosceles'\n    else:\n        return 'escaleno'","explicacion":["Con (0, 0), (2, 0) y (1, √3) los lados dan 2.0, 1.9999999999999998 y 1.9999999999999998: con `==` el equilátero no se detecta. `math.isclose(a, b)` los acepta como iguales.","El orden importa: un equilátero también tiene dos lados iguales, así que se pregunta por el equilátero antes que por el isósceles.","En tus apuntes el cálculo de los lados quedó fuera del `else` y se ejecutaba aunque no hubiera triángulo. Aquí el `return 'no forma triangulo'` termina la función y evita ese problema."],"pruebas":[{"expr":"tipo_triangulo(0, 0, 2, 0, 1, 1.7320508075688772)","esperado":"equilatero"},{"expr":"tipo_triangulo(0, 0, 4, 0, 2, 3)","esperado":"isosceles"},{"expr":"tipo_triangulo(0, 0, 3, 0, 0, 4)","esperado":"escaleno"},{"expr":"tipo_triangulo(0, 0, 1, 1, 2, 2)","esperado":"no forma triangulo"},{"expr":"tipo_triangulo(0, 0, 1, 0, 0, 1)","esperado":"isosceles"},{"expr":"tipo_triangulo(1, 1, 1, 1, 4, 5)","esperado":"no forma triangulo"}]},{"id":"heron_vertices","tipo":"funcion","nivel":2,"tema":"Geometría","patron":"p-funciones","fuente":"Problemario: área por la fórmula de Herón (97); clase de septiembre (método de Herón)","titulo":"Área con la fórmula de Herón","enunciado":"Diseña `area_heron(x1, y1, x2, y2, x3, y3)` que reciba los tres vértices de un triángulo y devuelva su área con la fórmula de Herón: A = √(s·(s − a)·(s − b)·(s − c)), donde a, b y c son los lados y s = (a + b + c)/2 es el semiperímetro. Si los tres puntos son colineales (no forman triángulo), devuelve 0. Escribe también la función auxiliar `distancia(x1, y1, x2, y2)`.","inicio":"import math\n\ndef distancia(x1, y1, x2, y2):\n    \n\ndef area_heron(x1, y1, x2, y2, x3, y3):\n    \n","pistas":["Reutiliza piezas: el determinante decide si hay triángulo, `distancia` da los tres lados, y al final calculas s y la raíz.","import math\n\ndef distancia(x1, y1, x2, y2):\n    return math.sqrt((x2 - x1)**2 + (y2 - y1)**2)\n\ndef area_heron(x1, y1, x2, y2, x3, y3):\n    det = x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2)\n    if abs(det) < 1e-9:\n        return 0\n    a = distancia(x1, y1, x2, y2)\n    b = distancia(x2, y2, x3, y3)\n    c = distancia(x1, y1, x3, y3)\n    s = ___\n    return math.sqrt(___)"],"solucion":"import math\n\ndef distancia(x1, y1, x2, y2):\n    return math.sqrt((x2 - x1)**2 + (y2 - y1)**2)\n\ndef area_heron(x1, y1, x2, y2, x3, y3):\n    det = x1 * (y2 - y3) + x2 * (y3 - y1) + x3 * (y1 - y2)\n    if abs(det) < 1e-9:\n        return 0\n    a = distancia(x1, y1, x2, y2)\n    b = distancia(x2, y2, x3, y3)\n    c = distancia(x1, y1, x3, y3)\n    s = (a + b + c) / 2\n    return math.sqrt(s * (s - a) * (s - b) * (s - c))","explicacion":["s es el semiperímetro: `(a + b + c) / 2`. En tus apuntes se anotó `s = a+b+c`, que es el perímetro; en el código sí estaba bien, con `/ 2`.","Con puntos colineales, por redondeo, el producto dentro de la raíz puede salir negativo y muy pequeño: `math.sqrt` da ValueError y `** (1/2)` da un número complejo. Revisar primero la colinealidad evita ese caso.","Para comprobar tu resultado: el área también es `abs(det) / 2`, con el mismo determinante del reto de colineales."],"pruebas":[{"expr":"area_heron(0, 0, 4, 0, 0, 3)","tol":1e-06,"esperado":6.0},{"expr":"area_heron(0, 0, 1, 1, 2, 0)","tol":1e-06,"esperado":0.9999999999999996},{"expr":"area_heron(0, 0, 2, 0, 1, 1.7320508075688772)","tol":1e-06,"esperado":1.7320508075688779},{"expr":"area_heron(-2, 1, 3, 1, 0, 5)","tol":1e-06,"esperado":10.0},{"expr":"area_heron(0, 0, 1, 1, 2, 2)","tol":1e-06,"esperado":0},{"expr":"distancia(0, 0, 3, 4)","tol":1e-06,"esperado":5.0}]},{"id":"puntos_elipse","tipo":"funcion","nivel":3,"tema":"Geometría","patron":"p-divisores","fuente":"Problemario: puntos con MCD 1 dentro de una elipse (96)","titulo":"Puntos con MCD 1 dentro de una elipse","enunciado":"Diseña `contar_puntos(a, b, r)` que cuente los puntos (x, y) de coordenadas enteras que están estrictamente dentro de la elipse a·x² + b·y² = r² (es decir, a·x² + b·y² < r²) y cuyo máximo común divisor es 1. a, b y r son positivos y pueden ser decimales. Escribe tu propia función `mcd(m, n)` con el algoritmo de Euclides, sin `math.gcd`. Por definición mcd(0, k) = |k|: así (0, 1), (0, −1), (1, 0) y (−1, 0) cuentan, pero (0, 0) y (0, 2) no.","inicio":"import math\n\ndef mcd(m, n):\n    \n\ndef contar_puntos(a, b, r):\n    \n","pistas":["Dos ciclos anidados, uno para x y otro para y. Como a·x² < r², |x| es menor que r/√a: recorre x desde −limite_x hasta limite_x con `limite_x = int(r / math.sqrt(a)) + 1`, y lo mismo para y con b.","import math\n\ndef mcd(m, n):\n    m = abs(m)\n    n = abs(n)\n    while n != 0:\n        resto = m % n\n        m = n\n        n = ___\n    return m\n\ndef contar_puntos(a, b, r):\n    limite_x = int(r / math.sqrt(a)) + 1\n    limite_y = int(r / math.sqrt(b)) + 1\n    contador = 0\n    for x in range(-limite_x, limite_x + 1):\n        for y in range(-limite_y, limite_y + 1):\n            if ___ and mcd(x, y) == 1:\n                contador += 1\n    return contador"],"solucion":"import math\n\ndef mcd(m, n):\n    m = abs(m)\n    n = abs(n)\n    while n != 0:\n        resto = m % n\n        m = n\n        n = resto\n    return m\n\ndef contar_puntos(a, b, r):\n    limite_x = int(r / math.sqrt(a)) + 1\n    limite_y = int(r / math.sqrt(b)) + 1\n    contador = 0\n    for x in range(-limite_x, limite_x + 1):\n        for y in range(-limite_y, limite_y + 1):\n            if a * x**2 + b * y**2 < r**2 and mcd(x, y) == 1:\n                contador += 1\n    return contador","explicacion":["Límites: si a·x² < r², entonces |x| < r/√a. Con `limite_x = int(r / math.sqrt(a)) + 1` el ciclo cubre todos los x posibles; el + 1 es un margen, y la condición del `if` descarta los que sobran. Lo mismo para y con b. El `+ 1` de `range(..., limite_x + 1)` es porque `range` no incluye el final.","Euclides: mcd(m, n) = mcd(n, m % n) hasta que el segundo sea 0. Con `abs` funciona con negativos, da mcd(0, k) = |k| y mcd(0, 0) = 0, así que el origen no cuenta.","La versión del MCD de tu clase (probar divisores con un contador desde 1) no sirve aquí: con 0 o con negativos el `while` no corre y devuelve 1, y contaría el origen y puntos como (0, 2)."],"prohibido":["gcd("],"pruebas":[{"expr":"mcd(-12, 18)","esperado":6},{"expr":"mcd(0, 7)","esperado":7},{"expr":"contar_puntos(1, 1, 2)","esperado":8},{"expr":"contar_puntos(1, 1, 5)","esperado":40},{"expr":"contar_puntos(2, 3, 10)","esperado":80},{"expr":"contar_puntos(0.5, 2, 7)","esperado":92}]},{"id":"capicua","tipo":"funcion","nivel":1,"tema":"Cifras","patron":"p-cifras","fuente":"Problemario: número capicúa (30); clase del 15-6","titulo":"¿Es capicúa? (sin cadenas)","enunciado":"Un número es capicúa si se lee igual de izquierda a derecha que de derecha a izquierda, como 124421. Diseña `es_capicua(n)` que reciba un entero positivo y devuelva True o False. Condición del problemario: no puedes usar cadenas (`str`, `[::-1]`). Trabaja solo con `%` y `//`.","inicio":"def es_capicua(n):\n    \n","pistas":["Voltea el número cifra por cifra: `copia % 10` da la última cifra, `copia // 10` la quita y `volteado * 10 + digito` la pega al final del volteado.","def es_capicua(n):\n    volteado = 0\n    copia = n\n    while copia > 0:\n        digito = copia % 10\n        copia = copia // 10\n        volteado = ___\n    return volteado == n"],"solucion":"def es_capicua(n):\n    volteado = 0\n    copia = n\n    while copia > 0:\n        digito = copia % 10\n        copia = copia // 10\n        volteado = volteado * 10 + digito\n    return volteado == n","explicacion":["El ciclo trabaja sobre `copia` porque la deja en 0. Así `n` queda intacto para compararlo al final.","En tus apuntes decía `numeroVotedo = ...`: con ese error de tipeo `numeroVolteado` se queda en 0 y nunca sale capicúa. El nombre debe ser idéntico.","`return volteado == n` ya devuelve True o False. No hace falta un `if`."],"prohibido":["str(","[::-1]"],"pruebas":[{"expr":"es_capicua(124421)","esperado":true},{"expr":"es_capicua(12321)","esperado":true},{"expr":"es_capicua(7)","esperado":true},{"expr":"es_capicua(123)","esperado":false},{"expr":"es_capicua(10)","esperado":false},{"expr":"es_capicua(1231)","esperado":false}]},{"id":"automorfico","tipo":"funcion","nivel":2,"tema":"Cifras","patron":"p-cifras","fuente":"Problemario: número automórfico (37); clases del 9-6 y 15-6","titulo":"¿Es automórfico?","enunciado":"Un número es automórfico si su cuadrado termina en el mismo número: 5² = 25, 76² = 5776, 625² = 390625. Diseña `es_automorfico(n)` que reciba un entero positivo y devuelva True o False. No uses `str`: resuélvelo con `%` y `//`.","inicio":"def es_automorfico(n):\n    \n","pistas":["Por cada cifra de n multiplica un `divisor` por 10 (1, 10, 100...). Al final, `cuadrado % divisor` te deja las últimas cifras del cuadrado.","def es_automorfico(n):\n    cuadrado = n * n\n    divisor = 1\n    copia = n\n    while copia > 0:\n        copia = copia // 10\n        divisor = ___\n    return cuadrado % divisor == n"],"solucion":"def es_automorfico(n):\n    cuadrado = n * n\n    divisor = 1\n    copia = n\n    while copia > 0:\n        copia = copia // 10\n        divisor = divisor * 10\n    return cuadrado % divisor == n","explicacion":["En tus apuntes del 15-6 decía `divisor = numero * 10`. En la última vuelta `numero` ya vale 0, el divisor queda en 0 y `cuadrado % 0` da ZeroDivisionError. Es `divisor = divisor * 10`.","Con n = 76 el ciclo da dos vueltas, así que `divisor` vale 100 y `5776 % 100` es 76.","El ciclo usa `copia` para no perder n, que se nece
