sita en la comparación final."],"prohibido":["str("],"pruebas":[{"expr":"es_automorfico(5)","esperado":true},{"expr":"es_automorfico(76)","esperado":true},{"expr":"es_automorfico(9376)","esperado":true},{"expr":"es_automorfico(1)","esperado":true},{"expr":"es_automorfico(7)","esperado":false},{"expr":"es_automorfico(10)","esperado":false}]},{"id":"mcd","tipo":"funcion","nivel":1,"tema":"Cifras","patron":"p-divisores","fuente":"Problemario: MCD (34) y algoritmo de Euclides (55); clase del 1-6","titulo":"MCD por Euclides","enunciado":"Algoritmo de Euclides (problema 55): divides a entre b y te quedas con el resto. Si el resto no es 0, ahora divides b entre ese resto, y así sigues. Cuando un resto da 0, el MCD es el último divisor. Diseña `mcd(a, b)` que reciba dos naturales y devuelva su máximo común divisor. No uses `math.gcd`.","inicio":"def mcd(a, b):\n    \n","pistas":["Mientras b no sea 0, guarda el resto `a % b`, pasa b a `a` y el resto a `b`. Cuando b llega a 0, la respuesta quedó en `a`.","def mcd(a, b):\n    while b != 0:\n        resto = a % b\n        a = b\n        b = ___\n    return a"],"solucion":"def mcd(a, b):\n    while b != 0:\n        resto = a % b\n        a = b\n        b = resto\n    return a","explicacion":["Cada vuelta hace lo del problema 55: el divisor pasa a ser dividendo y el resto pasa a ser divisor.","Si a < b, la primera vuelta solo los intercambia: `18 % 48` es 18.","En la versión «arreglada» de tus apuntes, `contador += 1` quedó dentro del `if` y el ciclo nunca termina. Euclides no necesita contador."],"prohibido":["math.gcd","gcd("],"pruebas":[{"expr":"mcd(48, 18)","esperado":6},{"expr":"mcd(18, 48)","esperado":6},{"expr":"mcd(17, 5)","esperado":1},{"expr":"mcd(12, 12)","esperado":12},{"expr":"mcd(100, 75)","esperado":25},{"expr":"mcd(1071, 462)","esperado":21}]},{"id":"mcm","tipo":"funcion","nivel":1,"tema":"Cifras","patron":"p-divisores","fuente":"Problemario: mínimo común múltiplo (35)","titulo":"Mínimo común múltiplo","enunciado":"El mínimo común múltiplo cumple mcd(a, b) · mcm(a, b) = a · b. Diseña `mcm(a, b)` que devuelva el mcm de dos naturales usando tu función `mcd(a, b)` del reto anterior (escríbela también en el editor). Ejemplo: mcm(4, 6) = 12.","inicio":"def mcd(a, b):\n    \n\ndef mcm(a, b):\n    \n","pistas":["Despeja de la fórmula: mcm = a · b / mcd(a, b), y usa `//` para que el resultado quede entero.","def mcd(a, b):\n    while b != 0:\n        resto = a % b\n        a = b\n        b = resto\n    return a\n\ndef mcm(a, b):\n    return ___"],"solucion":"def mcd(a, b):\n    while b != 0:\n        resto = a % b\n        a = b\n        b = resto\n    return a\n\ndef mcm(a, b):\n    return a * b // mcd(a, b)","explicacion":["Una función puede llamar a otra: `mcm` usa la `mcd` que escribiste arriba.","Con `//` el resultado queda entero (12 y no 12.0). La división es exacta porque el mcd divide a `a * b`.","Con 4 y 6: 4 · 6 = 24, mcd = 2, y 24 // 2 = 12."],"prohibido":["lcm(","gcd("],"pruebas":[{"expr":"mcm(4, 6)","esperado":12},{"expr":"mcm(6, 4)","esperado":12},{"expr":"mcm(5, 7)","esperado":35},{"expr":"mcm(12, 18)","esperado":36},{"expr":"mcm(9, 3)","esperado":9},{"expr":"mcm(1, 10)","esperado":10}]},{"id":"amigos","tipo":"funcion","nivel":2,"tema":"Cifras","patron":"p-divisores","fuente":"Problemario: amistad matemática (32); clase del 1-6","titulo":"Números amigos","enunciado":"Dos naturales m y n son amigos (amistad matemática) si la suma de los divisores de m, sin contar a m, da n, y la suma de los divisores de n, sin contar a n, da m. Ejemplo: 220 y 284. Diseña `suma_divisores(n)`, que devuelve esa suma, y `son_amigos(m, n)`, que devuelve True o False. Si m y n son iguales, devuelve False: un número perfecto como 6 no cuenta como amigo de sí mismo.","inicio":"def suma_divisores(n):\n    \n\ndef son_amigos(m, n):\n    \n","pistas":["Escribe una sola vez el acumulador de divisores en `suma_divisores` y llámalo dos veces: una con m y otra con n.","def suma_divisores(n):\n    suma = 0\n    for d in range(1, n):\n        if n % d == 0:\n            suma += d\n    return suma\n\ndef son_amigos(m, n):\n    return m != n and suma_divisores(m) == ___ and suma_divisores(n) == ___"],"solucion":"def suma_divisores(n):\n    suma = 0\n    for d in range(1, n):\n        if n % d == 0:\n            suma += d\n    return suma\n\ndef son_amigos(m, n):\n    return m != n and suma_divisores(m) == n and suma_divisores(n) == m","explicacion":["`suma_divisores` es el acumulador del número perfecto. En tus apuntes del 1-6 ese ciclo está escrito dos veces; con una función lo escribes una vez.","Hay que revisar las dos direcciones: los divisores de 10 suman 8, pero los de 8 suman 7. Por eso 10 y 8 no son amigos.","`m != n` descarta los perfectos: sin esa condición, 6 saldría amigo de sí mismo."],"pruebas":[{"expr":"suma_divisores(220)","esperado":284},{"expr":"son_amigos(220, 284)","esperado":true},{"expr":"son_amigos(1184, 1210)","esperado":true},{"expr":"son_amigos(10, 8)","esperado":false},{"expr":"son_amigos(6, 6)","esperado":false},{"expr":"son_amigos(220, 221)","esperado":false}]},{"id":"feliz","tipo":"funcion","nivel":2,"tema":"Cifras","patron":"p-cifras","fuente":"Problemario: números cadena (61); clase del 9-6","titulo":"¿Número feliz?","enunciado":"Números cadena (problema 61): sumas los cuadrados de las cifras de un número para formar otro, y repites. 44 → 16 + 16 = 32 → 9 + 4 = 13 → 1 + 9 = 10 → 1. Toda cadena llega a 1 (número feliz) o a 89 (número infeliz). Diseña `suma_cuadrados(n)`, que devuelve la suma de los cuadrados de las cifras de n, y `es_feliz(n)`, que recibe un entero positivo y devuelve True si su cadena llega a 1 y False si llega a 89.","inicio":"def suma_cuadrados(n):\n    \n\ndef es_feliz(n):\n    \n","pistas":["Repite `n = suma_cuadrados(n)` mientras n no sea 1 ni 89. Al salir del ciclo, n vale 1 o 89.","def suma_cuadrados(n):\n    s = 0\n    while n > 0:\n        digito = n % 10\n        n = n // 10\n        s = s + digito * digito\n    return s\n\ndef es_feliz(n):\n    while n != 1 and n != 89:\n        n = ___\n    return n == 1"],"solucion":"def suma_cuadrados(n):\n    s = 0\n    while n > 0:\n        digito = n % 10\n        n = n // 10\n        s = s + digito * digito\n    return s\n\ndef es_feliz(n):\n    while n != 1 and n != 89:\n        n = suma_cuadrados(n)\n    return n == 1","explicacion":["La condición lleva `and`: el ciclo sigue mientras n no sea 1 y tampoco sea 89. Con `or` sería siempre True y nunca terminaría.","En tus apuntes del 9-6 el dato se guardaba en `n` pero el ciclo usaba `numero` (NameError). Y al llegar a 89 decía «no es un numero infeliz», cuando sí lo es.","Separar `suma_cuadrados` deja `es_feliz` en tres líneas."],"pruebas":[{"expr":"suma_cuadrados(44)","esperado":32},{"expr":"es_feliz(44)","esperado":true},{"expr":"es_feliz(7)","esperado":true},{"expr":"es_feliz(1)","esperado":true},{"expr":"es_feliz(85)","esperado":false},{"expr":"es_feliz(89)","esperado":false}]},{"id":"porcentaje_infelices","tipo":"funcion","nivel":3,"tema":"Cifras","patron":"p-cifras","fuente":"Problemario: números cadena (61)","titulo":"Porcentaje de infelices","enunciado":"El problema 61 pide el porcentaje de enteros menores que N cuya cadena llega a 89. Diseña `porcentaje_infelices(n)` que revise los números 1, 2, ..., n - 1 y devuelva qué porcentaje de ellos son infelices. Ejemplo: entre 1 y 10 solo 1, 7 y 10 son felices, así que `porcentaje_infelices(11)` da 70.0. Supón n ≥ 2. Escribe también `suma_cuadrados` y `es_feliz` (las del reto anterior).","inicio":"def suma_cuadrados(n):\n    \n\ndef es_feliz(n):\n    \n\ndef porcentaje_infelices(n):\n    \n","pistas":["Recorre `range(1, n)` con un contador de infelices y al final divide: contador * 100 / (n - 1).","def suma_cuadrados(n):\n    s = 0\n    while n > 0:\n        digito = n % 10\n        n = n // 10\n        s = s + digito * digito\n    return s\n\ndef es_feliz(n):\n    while n != 1 and n != 89:\n        n = suma_cuadrados(n)\n    return n == 1\n\ndef porcentaje_infelices(n):\n    infelices = 0\n    for k in range(1, n):\n        if ___:\n            infelices += 1\n    return infelices * 100 / (n - 1)"],"solucion":"def suma_cuadrados(n):\n    s = 0\n    while n > 0:\n        digito = n % 10\n        n = n // 10\n        s = s + digito * digito\n    return s\n\ndef es_feliz(n):\n    while n != 1 and n != 89:\n        n = suma_cuadrados(n)\n    return n == 1\n\ndef porcentaje_infelices(n):\n    infelices = 0\n    for k in range(1, n):\n        if not es_feliz(k):\n            infelices += 1\n    return infelices * 100 / (n - 1)","explicacion":["Es un contador dentro de un `for`: cada número que no es feliz suma 1.","Los menores que n son 1, 2, ..., n - 1. Hay n - 1 de ellos, y por eso se divide entre `n - 1` y no entre n.","`not es_feliz(k)` se lee «k no es feliz», o sea, su cadena llega a 89."],"pruebas":[{"expr":"porcentaje_infelices(11)","tol":1e-06,"esperado":70.0},{"expr":"porcentaje_infelices(2)","tol":1e-06,"esperado":0.0},{"expr":"porcentaje_infelices(8)","tol":1e-06,"esperado":71.42857142857143},{"expr":"porcentaje_infelices(101)","tol":1e-06,"esperado":80.0},{"expr":"porcentaje_infelices(1001)","tol":1e-06,"esperado":85.7}]},{"id":"rusa","tipo":"funcion","nivel":2,"tema":"Cifras","patron":"","fuente":"Repaso del quiz del 22-6: multiplicación rusa","titulo":"Multiplicación rusa","enunciado":"La multiplicación rusa de tu repaso del quiz: escribes a y b en dos columnas. En cada fila, a se divide entre 2 (división entera) y b se duplica, hasta que a llega a 0. El producto es la suma de los b de las filas donde a es impar. Ejemplo: 18 × 11 → filas (18, 11), (9, 22), (4, 44), (2, 88), (1, 176) → 22 + 176 = 198. Diseña `multiplicacion_rusa(a, b)` para a ≥ 0 y devuelve el producto sin usar `*`.","inicio":"def multiplicacion_rusa(a, b):\n    \n","pistas":["Usa un `while a > 0` con un acumulador: si `a % 2 == 1` le sumas b; después `a = a // 2` y `b = b + b`.","def multiplicacion_rusa(a, b):\n    resultado = 0\n    while a > 0:\n        if a % 2 == 1:\n            resultado = resultado + b\n        a = a // 2\n        b = ___\n    return resultado"],"solucion":"def multiplicacion_rusa(a, b):\n    resultado = 0\n    while a > 0:\n        if a % 2 == 1:\n            resultado = resultado + b\n        a = a // 2\n        b = b + b\n    return resultado","explicacion":["Es la tabla de tu repaso: con 18 y 11 se suman 22 y 176 porque en esas filas a vale 9 y 1, que son impares.","El `if` va antes de cambiar a y b: primero revisas la fila actual y después pasas a la siguiente.","Duplicar es sumar el número consigo mismo, `b + b`. Por eso no hace falta `*`."],"prohibido":["*"],"pruebas":[{"expr":"multiplicacion_rusa(18, 11)","esperado":198},{"expr":"multiplicacion_rusa(11, 18)","esperado":198},{"expr":"multiplicacion_rusa(1, 7)","esperado":7},{"expr":"multiplicacion_rusa(0, 5)","esperado":0},{"expr":"multiplicacion_rusa(13, 13)","esperado":169},{"expr":"multiplicacion_rusa(100, 37)","esperado":3700}]},{"id":"oblongo","tipo":"funcion","nivel":1,"tema":"Cifras","patron":"","fuente":"Problemario: número oblongo (42); clase del 1-6","titulo":"¿Es oblongo?","enunciado":"Un número es oblongo si es el producto de dos naturales consecutivos: 2 = 1 · 2, 30 = 5 · 6, 42 = 6 · 7. Diseña `es_oblongo(n)` que reciba un entero positivo y devuelva True o False.","inicio":"def es_oblongo(n):\n    \n","pistas":["Prueba k = 1, 2, 3... mientras `k * (k + 1)` no pase de n. Si en algún momento el producto es exactamente n, es oblongo.","def es_oblongo(n):\n    k = 1\n    while k * (k + 1) <= n:\n        if ___:\n            return True\n        k += 1\n    return False"],"solucion":"def es_oblongo(n):\n    k = 1\n    while k * (k + 1) <= n:\n        if k * (k + 1) == n:\n            return True\n        k += 1\n    return False","explicacion":["En tus apuntes del 1-6 la condición era `numero % contador == 0 and numero % (contador+1) == 0`. Con contador = 1 eso se cumple para todo número par, y 10 o 14 salían oblongos. Hay que comparar el producto: `k * (k + 1) == n`.","El ciclo para cuando el producto ya pasa de n, porque después solo crece.","`return True` dentro del ciclo termina en cuanto lo encuentra. `return False` va afuera."],"pruebas":[{"expr":"es_oblongo(30)","esperado":true},{"expr":"es_oblongo(2)","esperado":true},{"expr":"es_oblongo(56)","esperado":true},{"expr":"es_oblongo(10)","esperado":false},{"expr":"es_oblongo(14)","esperado":false},{"expr":"es_oblongo(1)","esperado":false}]},{"id":"primo_capicua","tipo":"funcion","nivel":2,"tema":"Cifras","patron":"p-cifras","fuente":"Problemario: primo capicúa (31); clase del 14-9 (primo palindrómico)","titulo":"Primo capicúa","enunciado":"El problemario llama primo capicúa a un primo que sigue siendo primo cuando volteas sus cifras: 13 (31), 17 (71), 37 (73), 113 (311). Diseña tres funciones: `es_primo(n)`, `voltear(n)`, que devuelve el número con las cifras al revés usando `%` y `//`, y `es_primo_capicua(n)`, que devuelve True o False. Con esta definición, 11 también cumple.","inicio":"def es_primo(n):\n    \n\ndef voltear(n):\n    \n\ndef es_primo_capicua(n):\n    \n","pistas":["`es_primo_capicua` solo une las otras dos: el número tiene que ser primo y su volteado también.","def es_primo(n):\n    if n < 2:\n        return False\n    for i in range(2, n):\n        if n % i == 0:\n            return False\n    return True\n\ndef voltear(n):\n    volteado = 0\n    while n > 0:\n        digito = n % 10\n        n = n // 10\n        volteado = volteado * 10 + digito\n    return volteado\n\ndef es_primo_capicua(n):\n    return es_primo(n) and ___"],"solucion":"def es_primo(n):\n    if n < 2:\n        return False\n    for i in range(2, n):\n        if n % i == 0:\n            return False\n    return True\n\ndef voltear(n):\n    volteado = 0\n    while n > 0:\n        digito = n % 10\n        n = n // 10\n        volteado = volteado * 10 + digito\n    return volteado\n\ndef es_primo_capicua(n):\n    return es_primo(n) and es_primo(voltear(n))","explicacion":["Es el programa de la clase del 14-9 con `def`: cada tarea en su función, y la última solo las llama.","En la pizarra estaban `es primo` y `es-primo`: un nombre no puede tener espacios ni guiones. Usa `es_primo`.","En tus apuntes `primo(1)` daba True. El `if n < 2: return False` lo arregla. Ojo con 19: es primo, pero 91 = 7 · 13."],"pruebas":[{"expr":"es_primo_capicua(13)","esperado":true},{"expr":"es_primo_capicua(113)","esperado":true},{"expr":"es_primo_capicua(19)","esperado":false},{"expr":"es_primo_capicua(23)","esperado":false},{"expr":"es_primo_capicua(1)","esperado":false},{"expr":"es_primo_capicua(11)","esperado":true}]},{"id":"rebotes","tipo":"funcion","nivel":2,"tema":"Simulación","patron":"","fuente":"Problemario: rebotes (66); clase del 8-6","titulo":"Rebotes de una pelota","enunciado":"Se deja caer una pelota desde h1 metros. En cada rebote pierde un `porcentaje` de la altura anterior: con 50 %, desde 10 m sube a 5, luego a 2.5, 1.25, 0.625... Diseña `contar_rebotes(h1, porcentaje, h2)` que devuelva cuántos rebotes hay hasta el primero cuya altura máxima no llega a h2 (es menor que h2), contándolo a él. Con (10, 50, 1) da 4. Una altura exactamente igual a h2 sí llega. Supón 0 < h2 < h1 y 0 < porcentaje < 100.","inicio":"def contar_rebotes(h1, porcentaje, h2):\n    \n","pistas":["Simula con `while`: mientras la altura todavía llegue a h2, calcula el siguiente rebote y suma 1 al contador.","def contar_rebotes(h1, porcentaje, h2):\n    altura = h1\n    rebotes = 0\n    while ___:\n        altura = altura - altura * porcentaje / 100\n        rebotes += 1\n    return rebotes"],"solucion":"def contar_rebotes(h1, porcentaje, h2):\n    altura = h1\n    rebotes = 0\n    while altura >= h2:\n        altura = altura - altura * porcentaje / 100\n        rebotes += 1\n    return rebotes","explicacion":["Es el programa de los rebotes de tu clase del 8-6. Solo cambia el criterio de parada: h2 en vez de 10⁻⁴.","La condición del `while` dice cuándo seguir: mientras la altura todavía llegue a h2 (`altura >= h2`).","En tus apuntes estaba `0,0001` con coma. En Python el decimal se escribe con punto: `0.0001` o `1e-4`."],"pruebas":[{"expr":"contar_rebotes(10, 50, 1)","esperado":4},{"expr":"contar_rebotes(100, 20, 50)","esperado":4},{"expr":"contar_rebotes(10, 90, 5)","esperado":1},{"expr":"contar_rebotes(10, 50, 1.25)","esperado":4},{"expr":"contar_rebotes(10, 50, 0.0001)","esperado":17}]},{"id":"caracol","tipo":"funcion","nivel":2,"tema":"Simulación","patron":"","fuente":"Problemario: el caracol en el pozo (64)","titulo":"El caracol en el pozo","enunciado":"Un caracol está en el fondo de un pozo de h metros. Cada día sube `sube` metros: si en ese momento llega a h o más, ya salió. Si no, en la noche resbala `baja` metros. Diseña `dias_caracol(h, sube, baja)` que simule día por día con `while` y devuelva el número del día en que sale. Si nunca sale (sube < h y además sube <= baja), devuelve -1.","inicio":"def dias_caracol(h, sube, baja):\n    \n","pistas":["Cada vuelta del `while` es un día: suma `sube` y, si todavía no salió, resta `baja`. El ciclo sigue mientras la altura sea menor que h.","def dias_caracol(h, sube, baja):\n    if sube < h and sube <= baja:\n        return -1\n    altura = 0\n    dia = 0\n    while altura < h:\n        dia += 1\n        altura = altura + sube\n        if altura < h:\n            altura = ___\n    return dia"],"solucion":"def dias_caracol(h, sube, baja):\n    if sube < h and sube <= baja:\n        return -1\n    altura = 0\n    dia = 0\n    while altura < h:\n        dia += 1\n        altura = altura + sube\n        if altura < h:\n            altura = altura - baja\n    return dia","explicacion":["Si sale durante el día ya no resbala. Por eso va `if altura < h` antes de restar `baja`.","Sin el `if` del inicio, con sube <= baja el ciclo nunca termina. Pero si sube >= h, sale el primer día aunque resbale mucho.","Con h = 10, sube 3 y baja 2: cada día completo gana 1 m. Al amanecer del día 8 está en 7 m, sube a 10 y sale."],"pruebas":[{"expr":"dias_caracol(10, 3, 2)","esperado":8},{"expr":"dias_caracol(20, 5, 1)","esperado":5},{"expr":"dias_caracol(10, 10, 5)","esperado":1},{"expr":"dias_caracol(5, 6, 10)","esperado":1},{"expr":"dias_caracol(10, 2, 2)","esperado":-1},{"expr":"dias_caracol(2.5, 0.5, 0.25)","esperado":9}]},{"id":"tanque","tipo":"funcion","nivel":2,"tema":"Simulación","patron":"","fuente":"Clase del 8-6: tanque que rebosa; problemario (74), simplificado","titulo":"¿Cuándo rebosa el tanque?","enunciado":"Un tanque de `capacidad` litros empieza con `inicial` litros. Cada segundo le entran `entrada` litros y le salen `salida` litros. Diseña `segundos_para_rebosar(capacidad, inicial, entrada, salida)` que simule segundo a segundo con `while` y devuelva cuántos segundos pasan hasta que el volumen supera la capacidad (es mayor que ella). Si `entrada <= salida`, nunca rebosa: devuelve -1. Datos de tu clase: (5000, 2400, 69, 16).","inicio":"def segundos_para_rebosar(capacidad, inicial, entrada, salida):\n    \n","pistas":["Antes del ciclo descarta el caso `entrada <= salida`. Luego repite mientras el volumen no pase de la capacidad: suma `entrada - salida` y cuenta 1 segundo.","def segundos_para_rebosar(capacidad, inicial, entrada, salida):\n    if entrada <= salida:\n        return -1\n    volumen = inicial\n    tiempo = 0\n    while ___:\n        volumen = volumen + entrada - salida\n        tiempo += 1\n    return tiempo"],"solucion":"def segundos_para_rebosar(capacidad, inicial, entrada, salida):\n    if entrada <= salida:\n        return -1\n    volumen = inicial\n    tiempo = 0\n    while volumen <= capacidad:\n        volumen = volumen + entrada - salida\n        tiempo += 1\n    return tiempo","explicacion":["Con los datos de tu clase el tanque gana 69 - 16 = 53 L por segundo. A los 49 s tiene 4997 L y a los 50 s tiene 5050 L: rebosa a los 50 s, como en tus apuntes.","El `if` del inicio evita el ciclo infinito. En tus apuntes, `if FlujodeEntrada = FlujodeSalida` usaba `=` en vez de `==`.","Si el volumen llega justo a la capacidad todavía no rebosa. Por eso el ciclo sigue con `volumen <= capacidad`."],"pruebas":[{"expr":"segundos_para_rebosar(5000, 2400, 69, 16)","esperado":50},{"expr":"segundos_para_rebosar(100, 90, 10, 5)","esperado":3},{"expr":"segundos_para_rebosar(1000, 999, 5, 1)","esperado":1},{"expr":"segundos_para_rebosar(10, 2.5, 1.5, 0.5)","esperado":8},{"expr":"segundos_para_rebosar(300, 100, 16, 16)","esperado":-1},{"expr":"segundos_para_rebosar(300, 100, 10, 20)","esperado":-1}]},{"id":"pares_impares","tipo":"funcion","nivel":3,"tema":"Listas","patron":"p-ordenar","fuente":"Problemario: ordenar posiciones pares e impares (126)","titulo":"Ordenar posiciones pares e impares","enunciado":"Diseña `ordenar_pares_impares(v)` que ordene, dentro de la misma lista, los elementos de las posiciones pares (0, 2, 4…) de menor a mayor y los de las posiciones impares (1, 3, 5…) de mayor a menor. Cada valor se queda en una posición del mismo tipo. No crees listas auxiliares: solo intercambia valores dentro de `v` y al final devuelve `v`. Ejemplo: [5, 8, 1, 3, 9, 2, 4, 7] → [1, 8, 4, 7, 5, 3, 9, 2]. No uses `sort` ni `sorted`.","inicio":"def ordenar_pares_impares(v):\n    \n","pistas":["Es el ordenamiento por intercambio de clase, pero saltando de 2 en 2: un doble ciclo para las posiciones pares (con `>`) y otro para las impares (con `<`).","def ordenar_pares_impares(v):\n    n = len(v)\n    for i in range(0, n, 2):\n        for j in range(i + 2, n, 2):\n            if v[i] > v[j]:\n                v[i], v[j] = v[j], v[i]\n    for i in range(1, n, 2):\n        for j in range(i + 2, n, 2):\n            if ___:\n                v[i], v[j] = v[j], v[i]\n    return v"],"solucion":"def ordenar_pares_impares(v):\n    n = len(v)\n    for i in range(0, n, 2):\n        for j in range(i + 2, n, 2):\n            if v[i] > v[j]:\n                v[i], v[j] = v[j], v[i]\n    for i in range(1, n, 2):\n        for j in range(i + 2, n, 2):\n            if v[i] < v[j]:\n                v[i], v[j] = v[j], v[i]\n    return v","explicacion":["El tercer número de `range` es el salto: `range(0, n, 2)` da 0, 2, 4… y `range(1, n, 2)` da 1, 3, 5… Así `i` y `j` son siempre posiciones del mismo tipo.","`j` arranca en `i + 2`, la siguiente posición del mismo tipo. Es el `i + 1` del ordenamiento de clase.","Para las impares solo cambia la comparación: con `v[i] < v[j]` el mayor queda adelante."],"prohibido":["sorted(",".sort("],"pruebas":[{"expr":"ordenar_pares_impares([5, 8, 1, 3, 9, 2, 4, 7])","esperado":[1,8,4,7,5,3,9,2]},{"expr":"ordenar_pares_impares([9, 1, 7, 2, 5])","esperado":[5,2,7,1,9]},{"expr":"ordenar_pares_impares([2, 2, 1, 5, 1, 5])","esperado":[1,5,1,5,2,2]},{"expr":"ordenar_pares_impares([3, 1])","esperado":[3,1]},{"expr":"ordenar_pares_impares([4])","esperado":[4]},{"expr":"ordenar_pares_impares([])","esperado":[]}]},{"id":"meseta","tipo":"funcion","nivel":3,"tema":"Listas","patron":"p-lista","fuente":"Problemario: vector tipo meseta, variante de la montaña (129)","titulo":"Vector tipo meseta","enunciado":"Un vector es «tipo meseta» si sus valores suben estrictamente, después el valor máximo se repite en dos o más posiciones seguidas (la meseta) y al final bajan estrictamente. Ejemplo: [1, 3, 7, 7, 4, 2]. Debe haber al menos una subida antes de la meseta y al menos una bajada después. [1, 3, 7, 4, 2] no es meseta (el máximo no se repite) y [1, 3, 3, 5, 2] tampoco (lo repetido no es el máximo). Diseña `es_meseta(v)` que devuelva True o False.","inicio":"def es_meseta(v):\n    \n","pistas":["Igual que en la montaña, avanza un índice `i`: primero mientras suba, luego mientras se repita (`v[i] == v[i + 1]`) y por último mientras baje; entre un tramo y otro revisa que el tramo sí haya existido.","def es_meseta(v):\n    n = len(v)\n    i = 0\n    while i < n - 1 and v[i] < v[i + 1]:\n        i += 1\n    if i == 0:\n        return False\n    inicio = i\n    while i < n - 1 and ___:\n        i += 1\n    if i == inicio or i == n - 1:\n        return False\n    while i < n - 1 and v[i] > v[i + 1]:\n        i += 1\n    return i == n - 1"],"solucion":"def es_meseta(v):\n    n = len(v)\n    i = 0\n    while i < n - 1 and v[i] < v[i + 1]:\n        i += 1\n    if i == 0:\n        return False\n    inicio = i\n    while i < n - 1 and v[i] == v[i + 1]:\n        i += 1\n    if i == inicio or i == n - 1:\n        return False\n    while i < n - 1 and v[i] > v[i + 1]:\n        i += 1\n    return i == n - 1","explicacion":["`inicio` guarda dónde empezó la meseta. Si después del segundo `while` el índice sigue ahí, el máximo no se repitió.","Si la meseta llega hasta el final (`i == n - 1`), no hubo bajada. Si `i == 0` después del primer `while`, no hubo subida.","La meseta siempre queda en el máximo: todo lo de antes sube hasta ella y todo lo de después baja. Por eso no hace falta buscar el mayor aparte."],"pruebas":[{"expr":"es_meseta([1, 3, 7, 7, 4, 2])","esperado":true},{"expr":"es_meseta([1, 5, 5, 5, 2])","esperado":true},{"expr":"es_meseta([1, 3, 7, 4, 2])","esperado":false},{"expr":"es_meseta([5, 5, 2])","esperado":false},{"expr":"es_meseta([1, 4, 4])","esperado":false},{"expr":"es_meseta([1, 4, 4, 2, 2])","esperado":false}]},{"id":"dependientes","tipo":"funcion","nivel":3,"tema":"Vectores","patron":"p-lista","fuente":"Problemario: vectores linealmente dependientes (128)","titulo":"Vectores linealmente dependientes","enunciado":"Varios vectores son linealmente dependientes si alguno se puede obtener sumando múltiplos de los otros. Ejemplo: [1, 2] y [2, 4] lo son, porque [2, 4] = 2·[1, 2]. Diseña `son_dependientes(vectores)` que reciba una lista de vectores (cada uno es una lista de N números) y devuelva True si son dependientes o False si son independientes. Usa eliminación de Gauss sobre una copia: son dependientes si el rango (las filas que no quedan en cero) es menor que la cantidad de vectores. Toma como cero cualquier valor con `abs(x) < 1e-9`.","inicio":"def son_dependientes(vectores):\n    \n","pistas":["Pon los vectores como filas y haz lo mismo que con un sistema de ecuaciones: en cada columna escoge una fila con valor distinto de cero (el pivote) y réstale múltiplos de ella a las filas de abajo hasta dejarles un cero; el rango es la cantidad de pivotes que encontraste.","def son_dependientes(vectores):\n    m = len(vectores)\n    n = len(vectores[0])\n    if m > n:\n        return True\n    a = []\n    for v in vectores:\n        a.append(list(v))\n    rango = 0\n    for col in range(n):\n        p = rango\n        while p < m and abs(a[p][col]) < 1e-9:\n            p += 1\n        if p < m:\n            a[rango], a[p] = a[p], a[rango]\n            for f in range(rango + 1, m):\n                factor = a[f][col] / a[rango][col]\n                for k in range(n):\n                    a[f][k] = a[f][k] - ___\n            rango += 1\n    return rango < m"],"solucion":"def son_dependientes(vectores):\n    m = len(vectores)\n    n = len(vectores[0])\n    if m > n:\n        return True\n    a = []\n    for v in vectores:\n        a.append(list(v))\n    rango = 0\n    for col in range(n):\n        p = rango\n        while p < m and abs(a[p][col]) < 1e-9:\n            p += 1\n        if p < m:\n            a[rango], a[p] = a[p], a[rango]\n            for f in range(rango + 1, m):\n                factor = a[f][col] / a[rango][col]\n                for k in range(n):\n                    a[f][k] = a[f][k] - factor * a[rango][k]\n            rango += 1\n    return rango < m","explicacion":["Si una fila queda toda en cero, era una combinación de las de arriba. Por eso, si el rango es menor que la cantidad de vectores, son dependientes.","`list(v)` copia cada vector: la eliminación cambia la copia `a` y no la lista que te pasaron. Se compara con `1e-9` y no con `== 0` porque las divisiones dejan restos como 0.0000000001.","Con más vectores que componentes (por ejemplo, 3 vectores en el plano) siempre son dependientes, porque el rango no puede pasar de N: eso es el `if m > n`."],"pruebas":[{"expr":"son_dependientes([[1, 2], [2, 4]])","esperado":true},{"expr":"son_dependientes([[1, 0], [0, 1]])","esperado":false},{"expr":"son_dependientes([[1, 2, 3], [4, 5, 6], [7, 8, 9]])","esperado":true},{"expr":"son_dependientes([[1, 0, 0], [0, 1, 0]])","esperado":false},{"expr":"son_dependientes([[1, 1], [1, 2], [3, 1]])","esperado":true},{"expr":"son_dependientes([[0, 0], [1, 1]])","esperado":true}]},{"id":"adn","tipo":"funcion","nivel":3,"tema":"Cadenas","patron":"p-cadena","fuente":"Problemario: secuencias de ADN (109)","titulo":"Secuencias de ADN","enunciado":"Una secuencia de ADN es un texto con las letras A, C, G y T. Diseña `subcadena_comun(a, b)` que devuelva el trozo de letras seguidas más largo que aparece en las dos secuencias. Ejemplo: para 'ATGTCTTCCTCGA' y 'TGCTTCCTATGAC' el resultado es 'CTTCCT'. Si hay empate, devuelve el primero que encuentres recorriendo `a` desde la izquierda. Si no tienen ninguna letra en común, devuelve la cadena vacía `''`.","inicio":"def subcadena_comun(a, b):\n    \n","pistas":["Para cada posición `i` de `a`, arma letra por letra el trozo que empieza allí (`trozo = trozo + a[j]`), pregunta con `in` si está en `b` y guarda el más largo.","def subcadena_comun(a, b):\n    mejor = ''\n    for i in range(len(a)):\n        trozo = ''\n        for j in range(i, len(a)):\n            trozo = trozo + a[j]\n            if trozo in b and ___:\n                mejor = trozo\n    return mejor"],"solucion":"def subcadena_comun(a, b):\n    mejor = ''\n    for i in range(len(a)):\n        trozo = ''\n        for j in range(i, len(a)):\n            trozo = trozo + a[j]\n            if trozo in b and len(trozo) > len(mejor):\n                mejor = trozo\n    return mejor","explicacion":["`trozo in b` pregunta si un texto aparece dentro de otro con las letras seguidas y en el mismo orden.","Se usa `>` y no `>=`: en un empate se queda el que apareció primero.","Otra forma de sacar el trozo es `a[i:j]`, que copia las letras desde la posición `i` hasta la `j - 1` (la `j` no entra)."],"pruebas":[{"expr":"subcadena_comun('ATGTCTTCCTCGA', 'TGCTTCCTATGAC')","esperado":"CTTCCT"},{"expr":"subcadena_comun('GATTACA', 'TACAGATT')","esperado":"GATT"},{"expr":"subcadena_comun('ACGT', 'GTAC')","esperado":"AC"},{"expr":"subcadena_comun('AAAA', 'AA')","esperado":"AA"},{"expr":"subcadena_comun('ACG', 'TTT')","esperado":""},{"expr":"subcadena_comun('GATTACA', 'GATTACA')","esperado":"GATTACA"}]},{"id":"sin_repetidas","tipo":"funcion","nivel":2,"tema":"Cadenas","patron":"p-cadena","fuente":"Problemario: largo sin letras repetidas (111)","titulo":"Largo sin letras repetidas","enunciado":"El largo de una palabra «sin letras repetidas» es la cantidad de letras distintas que tiene, sin distinguir mayúsculas. Ejemplo: 'Banana' tiene 3 (b, a, n). Diseña `largo_sin_repetidas(palabra)` que devuelva ese número, y `mas_larga_y_corta(palabras)` que reciba una lista de palabras y devuelva la lista `[mas_larga, mas_corta]` según esa medida. Si hay empate, gana la que aparece primero en la lista.","inicio":"def largo_sin_repetidas(palabra):\n    \n\ndef mas_larga_y_corta(palabras):\n    \n","pistas":["Lleva un texto `vistas` que empieza vacío y agrégale cada letra solo si todavía no está; su `len` es la respuesta. Después busca la mayor y la menor como en el reto del rango, comparando `largo_sin_repetidas(p)`.","def largo_sin_repetidas(palabra):\n    vistas = ''\n    for letra in palabra.lower():\n        if not (letra in vistas):\n            vistas = ___\n    return len(vistas)\n\ndef mas_larga_y_corta(palabras):\n    larga = palabras[0]\n    corta = palabras[0]\n    for p in palabras:\n        if largo_sin_repetidas(p) > largo_sin_repetidas(larga):\n            larga = p\n        if ___:\n            corta = p\n    return [larga, corta]"],"solucion":"def largo_sin_repetidas(palabra):\n    vistas = ''\n    for letra in palabra.lower():\n        if not (letra in vistas):\n            vistas = vistas + letra\n    return len(vistas)\n\ndef mas_larga_y_corta(palabras):\n    larga = palabras[0]\n    corta = palabras[0]\n    for p in palabras:\n        if largo_sin_repetidas(p) > largo_sin_repetidas(larga):\n            larga = p\n        if largo_sin_repetidas(p) < largo_sin_repetidas(corta):\n            corta = p\n    return [larga, corta]","explicacion":["`palabra.lower()` pasa todo a minúsculas antes de contar: así la «A» y la «a» de 'Ana' son la misma letra.","`vistas` es un acumulador de texto: empieza en `''` y crece con `+`, como el binario de clase.","Se devuelven las palabras tal como vinieron; solo la medida usa minúsculas. Con `>` y `<` estrictos, en un empate se queda la primera."],"pruebas":[{"expr":"largo_sin_repetidas('Ana')","esperado":2},{"expr":"largo_sin_repetidas('murcielago')","esperado":10},{"expr":"mas_larga_y_corta(['casa', 'perro', 'Ana', 'computadora'])","esperado":["computadora","Ana"]},{"expr":"mas_larga_y_corta(['sol', 'mar', 'papa'])","esperado":["sol","papa"]},{"expr":"mas_larga_y_corta(['oso', 'ala', 'rio'])","esperado":["rio","oso"]},{"expr":"mas_larga_y_corta(['hola'])","esperado":["hola","hola"]}]},{"id":"a_romano","tipo":"funcion","nivel":2,"tema":"Cadenas","patron":"p-cadena","fuente":"Problemario: números romanos (112)","titulo":"De base diez a romano","enunciado":"Diseña `a_romano(n)` que reciba un entero entre 1 y 3999 y devuelva el número romano como texto. Ejemplos: 4 → 'IV', 1994 → 'MCMXCIV'. Usa dos listas paralelas: una con los valores (1000, 900, 500, 400, …) y otra con sus símbolos ('M', 'CM', 'D', 'CD', …). El máximo es 3999 porque no hay símbolo mayor que M y un símbolo no se repite más de tres veces seguidas.","inicio":"def a_romano(n):\n    \n","pistas":["Recorre los valores de mayor a menor: mientras `n` alcance para el valor actual, pega su símbolo al resultado y réstale ese valor a `n`.","def a_romano(n):\n    valores = [1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1]\n    simbolos = ['M', 'CM', 'D', 'CD', 'C', 'XC', 'L', 'XL', 'X', 'IX', 'V', 'IV', 'I']\n    romano = ''\n    for i in range(len(valores)):\n        while n >= valores[i]:\n            romano = romano + simbolos[i]\n            n = ___\n    return romano"],"solucion":"def a_romano(n):\n    valores = [1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1]\n    simbolos = ['M', 'CM', 'D', 'CD', 'C', 'XC', 'L', 'XL', 'X', 'IX', 'V', 'IV', 'I']\n    romano = ''\n    for i in range(len(valores)):\n        while n >= valores[i]:\n            romano = romano + simbolos[i]\n            n = n - valores[i]\n    return romano","explicacion":["Las listas son paralelas: `valores[i]` y `simbolos[i]` hablan del mismo número, por eso se recorren con el mismo índice `i`.","Poner 900, 400, 90, 40, 9 y 4 en las listas evita casos especiales: el ciclo escribe 'CM' o 'IV' solo.","Va `while` y no `if` porque un símbolo puede repetirse: 3000 → 'MMM'."],"pruebas":[{"expr":"a_romano(4)","esperado":"IV"},{"expr":"a_romano(1994)","esperado":"MCMXCIV"},{"expr":"a_romano(3999)","esperado":"MMMCMXCIX"},{"expr":"a_romano(1)","esperado":"I"},{"expr":"a_romano(2026)","esperado":"MMXXVI"},{"expr":"a_romano(444)","esperado":"CDXLIV"}]},{"id":"de_romano","tipo":"funcion","nivel":2,"tema":"Cadenas","patron":"p-cadena","fuente":"Problemario: romanos a base diez (113)","titulo":"De romano a base diez","enunciado":"Diseña `valor(simbolo)` que devuelva el valor de un símbolo romano (I = 1, V = 5, X = 10, L = 50, C = 100, D = 500, M = 1000) buscándolo en dos listas paralelas, y `de_romano(texto)` que convierta un número romano a entero. Regla: si un símbolo vale menos que el que le sigue, se resta; si no, se suma. Ejemplo: 'MCMXCIV' → 1994. Acepta también minúsculas.","inicio":"def valor(simbolo):\n    \n\ndef de_romano(texto):\n    \n","pistas":["Recorre el texto por posición y compara `valor(texto[i])` con `valor(texto[i + 1])`, pero solo cuando existe la posición `i + 1`.","def valor(simbolo):\n    simbolos = ['I', 'V', 'X', 'L', 'C', 'D', 'M']\n    valores = [1, 5, 10, 50, 100, 500, 1000]\n    for i in range(len(simbolos)):\n        if simbolos[i] == simbolo:\n            return valores[i]\n    return 0\n\ndef de_romano(texto):\n    texto = texto.upper()\n    total = 0\n    for i in range(len(texto)):\n        actual = valor(texto[i])\n        if i + 1 < len(texto) and actual < valor(texto[i + 1]):\n            total = total - actual\n        else:\n            total = ___\n    return total"],"solucion":"def valor(simbolo):\n    simbolos = ['I', 'V', 'X', 'L', 'C', 'D', 'M']\n    valores = [1, 5, 10, 50, 100, 500, 1000]\n    for i in range(len(simbolos)):\n        if simbolos[i] == simbolo:\n            return valores[i]\n    return 0\n\ndef de_romano(texto):\n    texto = texto.upper()\n    total = 0\n    for i in range(len(texto)):\n        actual = valor(texto[i])\n        if i + 1 < len(texto) and actual < valor(texto[i + 1]):\n            total = total - actual\n        else:\n            total = total + actual\n    return total","explicacion":["En 'IV' la I vale menos que la V que le sigue: se resta 1 y después se suma 5, total 4.","`and` revisa de izquierda a derecha: si `i + 1 < len(texto)` es False, ya no mira `texto[i + 1]`. Así se evita el IndexError en el último símbolo.","`valor` busca el símbolo en una lista y devuelve el número que está en la misma posición de la otra."],"pruebas":[{"expr":"de_romano('MCMXCIV')","esperado":1994},{"expr":"de_romano('MMXXVI')","esperado":2026},{"expr":"de_romano('IV')","esperado":4},{"expr":"de_romano('mmmcmxcix')","esperado":3999},{"expr":"de_romano('XLII')","esperado":42},{"expr":"valor('D')","esperado":500}]},{"id":"ahorcado","tipo":"funcion","nivel":2,"tema":"Cadenas","patron":"p-cadena","fuente":"Problemario: el ahorcado (114)","titulo":"El ahorcado","enunciado":"Para poder probar el juego lo separamos en dos funciones. `mostrar(palabra, letras)` devuelve la palabra con un `_` en cada letra que no está en la lista `letras`, todo separado por espacios: `mostrar('gato', ['a'])` → '_ a _ _'. `jugar(palabra, intentos, max_errores)` simula una partida: recorre en orden las letras de la lista `intentos` y devuelve True si se adivinan todas las letras de la palabra antes de llegar a `max_errores` letras falladas. Devuelve False si se llega a ese número de errores o si se acaban los intentos. Una letra que ya se probó no cuenta otra vez (ni como acierto ni como error). Todo va en minúsculas.","inicio":"def mostrar(palabra, letras):\n    \n\ndef jugar(palabra, intentos, max_errores):\n    \n","pistas":["En `jugar` lleva una lista `probadas` y un contador `errores`; si la letra es nueva, agrégala, y si no está en la palabra suma un error. Ganaste cuando `mostrar(palabra, probadas)` ya no tiene ningún `_`.","def mostrar(palabra, letras):\n    resultado = ''\n    for c in palabra:\n        if c in letras:\n            resultado = resultado + c + ' '\n        else:\n            resultado = resultado + ___\n    return resultado.strip()\n\ndef jugar(palabra, intentos, max_errores):\n    probadas = []\n    errores = 0\n    for letra in intentos:\n        if not (letra in probadas):\n            probadas.append(letra)\n            if not (letra in palabra):\n                errores += 1\n                if errores >= max_errores:\n                    return False\n            elif ___:\n                return True\n    return False"],"solucion":"def mostrar(palabra, letras):\n    resultado = ''\n    for c in palabra:\n        if c in letras:\n            resultado = resultado + c + ' '\n        else:\n            resultado = resultado + '_ '\n    return resultado.strip()\n\ndef jugar(palabra, intentos, max_errores):\n    probadas = []\n    errores = 0\n    for letra in intentos:\n        if not (letra in probadas):\n            probadas.append(letra)\n            if not (letra in palabra):\n                errores += 1\n                if errores >= max_errores:\n                    return False\n            elif not ('_' in mostrar(palabra, probadas)):\n                return True\n    return False","explicacion":["`mostrar` pega cada letra con un espacio detrás; `strip()` quita el último espacio que sobra.","`'_' in mostrar(palabra, probadas)` reutiliza la función que ya hiciste: si no queda ningún `_`, la palabra está completa. Una letra repetida no entra al `if not (letra in probadas)`, así que no suma nada.","Para jugar de verdad: pide la palabra con `input()`, crea `probadas = []` y `errores = 0`, y repite `while errores < max_errores and '_' in mostrar(palabra, probadas):` pidiendo una letra con `input()`, sumando un error si no está y mostrando `mostrar(palabra, probadas)`. Al salir del ciclo, si no queda `_` ganó el jugador; si no, ganó la computadora."],"pruebas":[{"expr":"mostrar('gato', ['a'])","esperado":"_ a _ _"},{"expr":"mostrar('casa', ['a', 's', 'c'])","esperado":"c a s a"},{"expr":"jugar('gato', ['a', 'x', 'g', 't', 'o'], 3)","esperado":true},{"expr":"jugar('gato', ['x', 'y', 'a', 'z'], 3)","esperado":false},{"expr":"jugar('gato', ['x', 'x', 'x', 'a', 'g', 't', 'o'], 2)","esperado":true},{"expr":"jugar('sol', ['s', 'o'], 5)","esperado":false}]},{"id":"morse","tipo":"funcion","nivel":3,"tema":"Cadenas","patron":"p-cadena","fuente":"Problemario: telegramas en código Morse (115)","titulo":"Telegramas en Morse","enunciado":"En código Morse cada letra es una secuencia de puntos y rayas; la tabla de la a a la z ya está en la lista `codigos` del código inicial. Si se pierden los espacios entre letras, un mensaje puede leerse de varias formas. Ejemplo: '-..-----.' con 3 letras puede ser njg, dog, xmg o xon: 4 mensajes. Diseña `contar_mensajes(morse, n)` que reciba el texto de puntos y rayas (sin espacios) y devuelva cuántos mensajes de exactamente `n` letras lo producen.","inicio":"# Código Morse de la a a la z, en orden\ncodigos = ['.-', '-...', '-.-.', '-..', '.', '..-.', '--.', '....', '..', '.---', '-.-', '.-..', '--',\n           '-.', '---', '.--.', '--.-', '.-.', '...', '-', '..-', '...-', '.--', '-..-', '-.--', '--..']\n\ndef contar_mensajes(morse, n):\n    \n","pistas":["Piensa en la primera letra: prueba cada código que coincida con el comienzo del mensaje y cuenta, con la misma función, las formas de leer el resto con `n - 1` letras; si `n` es 0, hay 1 forma solo cuando ya no queda mensaje.","codigos = ['.-', '-...', '-.-.', '-..', '.', '..-.', '--.', '....', '..', '.---', '-.-', '.-..', '--',\n           '-.', '---', '.--.', '--.-', '.-.', '...', '-', '..-', '...-', '.--', '-..-', '-.--', '--..']\n\ndef contar_mensajes(morse, n):\n    if n == 0:\n        if morse == '':\n            return 1\n        return 0\n    total = 0\n    for codigo in codigos:\n        k = len(codigo)\n        if morse[:k] == codigo:\n            total = total + ___\n    return total"],"solucion":"# Código Morse de la a a la z, en orden\ncodigos = ['.-', '-...', '-.-.', '-..', '.', '..-.', '--.', '....', '..', '.---', '-.-', '.-..', '--',\n           '-.', '---', '.--.', '--.-', '.-.', '...', '-', '..-', '...-', '.--', '-..-', '-.--', '--..']\n\ndef contar_mensajes(morse, n):\n    if n == 0:\n        if morse == '':\n            return 1\n        return 0\n    total = 0\n    for codigo in codigos:\n        k = len(codigo)\n        if morse[:k] == codigo:\n            total = total + contar_mensajes(morse[k:], n - 1)\n    return total","explicacion":["`morse[:k]` son los primeros `k` caracteres y `morse[k:]` es todo lo que viene después. Así se separa la primera letra del resto del mensaje.","La función se llama a sí misma con un mensaje más corto y una letra menos (recursión). Siempre termina porque `n` baja hasta 0.","Si el mensaje se acaba antes de tiempo, ningún código coincide con `''` y esa rama suma 0. Si sobran puntos o rayas cuando `n` llega a 0, también suma 0."],"pruebas":[{"expr":"contar_mensajes('-..-----.', 3)","esperado":4},{"expr":"contar_mensajes('.-', 1)","esperado":1},{"expr":"contar_mensajes('.-', 2)","esperado":1},{"expr":"contar_mensajes('...', 2)","esperado":2},{"expr":"contar_mensajes('....', 5)","esperado":0},{"expr":"contar_mensajes('-..-----.', 4)","esperado":25}]},{"id":"coseno","tipo":"funcion","nivel":2,"tema":"Series","patron":"p-serie","fuente":"Problemario: coseno por serie de Taylor (91); cuaderno pág. 27-30","titulo":"Coseno por serie de Taylor","enunciado":"cos(x) = 1 − x²/2! + x⁴/4! − x⁶/6! + … con x en radianes. Diseña `coseno(grados, precision)` que reciba el ángulo en grados, lo pase a radianes y devuelva el coseno calculado con la serie. Genera cada término a partir del anterior, como un solo valor. No uses factorial ni `math.cos`. Detén la suma cuando la diferencia entre las dos últimas sumas, en valor absoluto, sea menor que `precision`.","inicio":"import math\n\ndef coseno(grados, precision):\n    \n","pistas":["Del término con xⁱ al siguiente con xⁱ⁺² se multiplica por −x² y se divide entre (i + 1)(i + 2). Si primero sumas 2 a i, divides entre i·(i − 1).","import math\n\ndef coseno(grados, precision):\n    x = grados * math.pi / 180\n    termino = 1\n    s = termino\n    i = 0\n    while abs(termino) >= precision:\n        i += 2\n        termino = ___\n        s += termino\n    return s"],"solucion":"import math\n\ndef coseno(grados, precision):\n    x = grados * math.pi / 180\n    termino = 1\n    s = termino\n    i = 0\n    while abs(termino) >= precision:\n        i += 2\n        termino = -termino * x * x / (i * (i - 1))\n        s += termino\n    return s","explicacion":["El primer término es 1, no x como en el seno. Por eso `i` empieza en 0 y sube de 2 en 2: 2, 4, 6…","Dos sumas seguidas difieren justo en el término que acabas de sumar. Por eso la condición mira `abs(termino)`: los términos alternan de signo.","En tu cuaderno (pág. 30) el divisor quedó `j * (i - 1)`, con dos contadores distintos, y cos 60° daba 0.522. Tiene que ser el mismo número: `j * (j - 1)`, o `i * (i - 1)` como aquí."],"prohibido":["math.cos","factorial("],"pruebas":[{"expr":"coseno(0, 0.0000001)","esperado":1.0,"tol":1e-06},{"expr":"coseno(60, 0.0000001)","esperado":0.5,"tol":1e-06},{"expr":"coseno(90, 0.0000001)","esperado":0.0,"tol":1e-06},{"expr":"coseno(180, 0.0000001)","esperado":-1.0,"tol":1e-06},{"expr":"coseno(360, 0.0000001)","esperado":1.0,"tol":1e-06}]},{"id":"exp_x","tipo":"funcion","nivel":2,"tema":"Series","patron":"p-serie","fuente":"Problemario: eˣ por serie de Taylor (95)","titulo":"eˣ por serie, contando términos","enunciado":"eˣ = 1 + x + x²/2! + x³/3! + … Diseña `exponencial(x)` que sume la serie generando cada término a partir del anterior. No uses factorial ni `math.exp`. Detén la suma cuando la diferencia entre las dos últimas sumas, en valor absoluto, sea menor que 0.0001. Devuelve la lista `[valor, terminos]`, donde `terminos` es cuántos términos sumaste en total: cuenta el 1 inicial y también el último término (el que ya es menor que 0.0001). Ejemplo: para x = 1 se suman 1 + 1 + 1/2! + … + 1/8!, que son 9 términos.","inicio":"def exponencial(x):\n    \n","pistas":["Cada término es el anterior multiplicado por x y dividido entre i. El contador de términos empieza en 1, porque el 1 inicial ya está sumado antes del ciclo.","def exponencial(x):\n    termino = 1\n    s = termino\n    terminos = 1\n    i = 0\n    while abs(termino) >= 0.0001:\n        i += 1\n        termino = ___\n        s += termino\n        terminos += 1\n    return [s, terminos]"],"solucion":"def exponencial(x):\n    termino = 1\n    s = termino\n    terminos = 1\n    i = 0\n    while abs(termino) >= 0.0001:\n        i += 1\n        termino = termino * x / i\n        s += termino\n        terminos += 1\n    return [s, terminos]","explicacion":["`termino = termino * x / i` pasa de x³/3! a x⁴/4! sin calcular ningún factorial.","La diferencia entre las dos últimas sumas es el último término sumado. Con `abs` también sirve para x negativo, donde los términos alternan de signo.","Al devolver `[s, terminos]` salen los dos datos juntos: `exponencial(1)[0]` es el valor y `exponencial(1)[1]` el número de términos."],"prohibido":["math.exp","factorial("],"pruebas":[{"expr":"exponencial(1)[0]","esperado":2.718281828459045,"tol":0.001},{"expr":"exponencial(1)[1]","esperado":9},{"expr":"exponencial(2)[0]","esperado":7.3890560989306495,"tol":0.001},{"expr":"exponencial(2)[1]","esperado":12},{"expr":"exponencial(-1)[0]","esperado":0.36787944117144233,"tol":0.001},{"expr":"exponencial(5)[0]","esperado":148.41315910257657,"tol":0.001}]},{"id":"pi_serie","tipo":"funcion","nivel":2,"tema":"Series","patron":"p-serie","fuente":"Problemario: π por la serie de π²/6 (89)","titulo":"π con la serie de π²/6","enunciado":"π²/6 = 1 + 1/2² + 1/3² + 1/4² + … Diseña `calcular_pi(precision)` que sume la serie y después despeje π = √(6·S). Suma términos hasta que el último término sumado sea menor que `precision` (ese término sí se suma). Devuelve la lista `[pi_aprox, terminos]`, donde `terminos` cuenta todos los términos sumados, incluido el 1. Ejemplo: con `precision = 0.02` se suman 1 + 1/2² + … + 1/8², porque 1/8² ≈ 0.0156 es el primero menor que 0.02. Son 8 términos.","inicio":"import math\n\ndef calcular_pi(precision):\n    \n","pistas":["Lleva k desde 1. En cada vuelta sube k, calcula `1 / (k * k)`, súmalo y cuéntalo. Al salir del ciclo, π es la raíz cuadrada de 6 por la suma.","import math\n\ndef calcular_pi(precision):\n    s = 1\n    terminos = 1\n    termino = 1\n    k = 1\n    while termino >= precision:\n        k += 1\n        termino = ___\n        s += termino\n        terminos += 1\n    pi_aprox = ___\n    return [pi_aprox, terminos]"],"solucion":"import math\n\ndef calcular_pi(precision):\n    s = 1\n    terminos = 1\n    termino = 1\n    k = 1\n    while termino >= precision:\n        k += 1\n        termino = 1 / (k * k)\n        s += termino\n        terminos += 1\n    pi_aprox = math.sqrt(6 * s)\n    return [pi_aprox, terminos]","explicacion":["El problemario dice «la diferencia entre los dos últimos términos sumados». Aquí se toma como la diferencia entre las dos últimas sumas, que es justo el último término 1/k².","Esta serie converge lento: con 1001 términos π sale con solo 3 decimales buenos. Por eso las pruebas comparan con un margen de 0.01 y de 0.001.","`math.sqrt(6 * s)` despeja π de π²/6 = S. También vale `(6 * s) ** 0.5`."],"pruebas":[{"expr":"calcular_pi(0.0001)[0]","esperado":3.141592653589793,"tol":0.01},{"expr":"calcular_pi(0.000001)[0]","esperado":3.141592653589793,"tol":0.001},{"expr":"calcular_pi(0.02)[1]","esperado":8},{"expr":"calcular_pi(0.003)[1]","esperado":19},{"expr":"calcular_pi(0.00005)[1]","esperado":142}]},{"id":"fibonacci","tipo":"funcion","nivel":1,"tema":"Series","patron":"p-serie","fuente":"Problemario: números de Fibonacci (81); cuaderno pág. 27-31","titulo":"Fibonacci: el término n","enunciado":"La serie de Fibonacci es 1, 1, 2, 3, 5, 8, 13, 21, … Cada término es la suma de los dos anteriores: Fn = Fn−1 + Fn−2, con F1 = F2 = 1. Diseña `fibonacci(n)` que devuelva el término de la posición n. Hazlo con un ciclo y dos variables, sin listas. Ejemplo: `fibonacci(8)` devuelve 21.","inicio":"def fibonacci(n):\n    \n","pistas":["Guarda los dos últimos términos en t1 y t2, los dos empiezan en 1. En cada vuelta el nuevo t1 es el viejo t2 y el nuevo t2 es t1 + t2. Repite hasta llegar a la posición n.","def fibonacci(n):\n    t1 = 1\n    t2 = 1\n    i = 2\n    while i < n:\n        t1, t2 = ___\n        i += 1\n    return t2"],"solucion":"def fibonacci(n):\n    t1 = 1\n    t2 = 1\n    i = 2\n    while i < n:\n        t1, t2 = t2, t1 + t2\n        i += 1\n    return t2","explicacion":["`t1, t2 = t2, t1 + t2` calcula primero los dos valores de la derecha con los t1 y t2 viejos, y después los guarda. Hace lo mismo que tu versión del cuaderno: `siguiente = t1 + t2`, `t1 = t2`, `t2 = siguiente`.","Para n = 1 y n = 2 el ciclo no corre y se devuelve 1 directo. No hace falta un `if` aparte.","El problemario pide ver el valor máximo que aguanta el computador. En Python los enteros no tienen tope: `fibonacci(100)` da 354224848179261915075 sin error."],"pruebas":[{"expr":"fibonacci(1)","esperado":1},{"expr":"fibonacci(2)","esperado":1},{"expr":"fibonacci(3)","esperado":2},{"expr":"fibonacci(10)","esperado":55},{"expr":"fibonacci(50)","esperado":12586269025}]},{"id":"newton_raiz","tipo":"funcion","nivel":2,"tema":"Métodos numéricos","patron":"p-numerico","fuente":"Problemario: raíz n-ésima por el método de Newton (98)","titulo":"Raíz n-ésima por Newton","enunciado":"El método de Newton para la raíz n-ésima de a empieza con x_ant = 1 y calcula x_sig = ((n − 1)·x_ant + a / x_antⁿ⁻¹) / n. Si |x_sig − x_ant| < tol, x_sig es la raíz. Si no, x_sig pasa a ser el nuevo x_ant y se repite. Diseña `raiz_n(a, n, tol)` que devuelva la raíz. Como el método puede no converger, detente también después de 1000 iteraciones. No uses `math.sqrt` ni `** (1/n)`.","inicio":"def raiz_n(a, n, tol):\n    \n","pistas":["Calcula un primer x_sig antes del ciclo. Mientras la diferencia con x_ant no sea menor que tol (y no llegues a 1000 vueltas), copia x_sig en x_ant y calcula el siguiente.","def raiz_n(a, n, tol):\n    x_ant = 1\n    x_sig = ((n - 1) * x_ant + a / x_ant ** (n - 1)) / n\n    iteraciones = 1\n    while abs(x_sig - x_ant) >= tol and iteraciones < 1000:\n        x_ant = ___\n        x_sig = ((n - 1) * x_ant + a / x_ant ** (n - 1)) / n\n        iteraciones += 1\n    return x_sig"],"solucion":"def raiz_n(a, n, tol):\n    x_ant = 1\n    x_sig = ((n - 1) * x_ant + a / x_ant ** (n - 1)) / n\n    iteraciones = 1\n    while abs(x_sig - x_ant) >= tol and iteraciones < 1000:\n        x_ant = x_sig\n        x_sig = ((n - 1) * x_ant + a / x_ant ** (n - 1)) / n\n        iteraciones += 1\n    return x_sig","explicacion":["x_sig se calcula una vez antes del `while` para poder compararlo con x_ant desde la primera vuelta. Es la misma idea del `c` antes del ciclo en la bisección.","Es un método abierto: no siempre converge. El contador `iteraciones < 1000` evita un ciclo infinito; eso es lo que pide el problemario al decir que lo tomes en cuenta en el código.","Con n = 2 queda el método clásico de la raíz cuadrada: x_sig = (x_ant + a / x_ant) / 2."],"prohibido":["math.sqrt","**(1/","** (1/"],"pruebas":[{"expr":"raiz_n(27, 3, 0.0000001)","esperado":3.0,"tol":1e-06},{"expr":"raiz_n(2, 2, 0.0000001)","esperado":1.4142135623730951,"tol":1e-06},{"expr":"raiz_n(100, 2, 0.0000001)","esperado":10.0,"tol":1e-06},{"expr":"raiz_n(1024, 10, 0.0000001)","esperado":2.0,"tol":1e-06},{"expr":"raiz_n(10, 5, 0.0000001)","esperado":1.5848931924611136,"tol":1e-06}]},{"id":"secante","tipo":"funcion","nivel":2,"tema":"Métodos numéricos","patron":"p-numerico","fuente":"Problemario: método de la secante (103)","titulo":"Raíz por la secante","enunciado":"Define `f(x) = x**3 - x - 2` y diseña `raiz_secante(x0, x1, tol)` con el método de la secante: x2 = x1 − f(x1)·(x1 − x0) / (f(x1) − f(x0)). Después corre los puntos (x0 toma el valor de x1 y x1 el de x2) y calcula otro x2. Repite hasta que |x2 − x1| < tol, con un máximo de 100 iteraciones, y devuelve x2. La raíz está cerca de 1.5214.","inicio":"def f(x):\n    return x**3 - x - 2\n\ndef raiz_secante(x0, x1, tol):\n    \n","pistas":["Calcula un primer x2 antes del ciclo. Dentro del ciclo: primero `x0 = x1`, después `x1 = x2`, y con esos dos puntos calcula el nuevo x2.","def f(x):\n    return x**3 - x - 2\n\ndef raiz_secante(x0, x1, tol):\n    x2 = x1 - f(x1) * (x1 - x0) / (f(x1) - f(x0))\n    iteraciones = 1\n    while abs(x2 - x1) >= tol and iteraciones < 100:\n        x0 = ___\n        x1 = ___\n        x2 = x1 - f(x1) * (x1 - x0) / (f(x1) - f(x0))\n        iteraciones += 1\n    return x2"],"solucion":"def f(x):\n    return x**3 - x - 2\n\ndef raiz_secante(x0, x1, tol):\n    x2 = x1 - f(x1) * (x1 - x0) / (f(x1) - f(x0))\n    iteraciones = 1\n    while abs(x2 - x1) >= tol and iteraciones < 100:\n        x0 = x1\n        x1 = x2\n        x2 = x1 - f(x1) * (x1 - x0) / (f(x1) - f(x0))\n        iteraciones += 1\n    return x2","explicacion":["La secante es como Newton sin derivada: cambia f'(x) por la pendiente de la recta que pasa por los dos últimos puntos.","Es un método abierto: x0 y x1 no tienen que encerrar la raíz, pero puede no converger. Por eso el tope de 100 vueltas.","El orden importa: si haces `x1 = x2` antes de `x0 = x1`, x0 y x1 quedan iguales y f(x1) − f(x0) da 0: división entre cero."],"pruebas":[{"expr":"raiz_secante(1, 2, 0.0000001)","esperado":1.5213797068045676,"tol":1e-06},{"expr":"raiz_secante(2, 3, 0.0000001)","esperado":1.5213797068045676,"tol":1e-06},{"expr":"raiz_secante(1.5, 1.6, 0.0000001)","esperado":1.5213797068045676,"tol":1e-06},{"expr":"raiz_secante(0, 3, 0.0000001)","esperado":1.5213797068045676,"tol":1e-06},{"expr":"f(raiz_secante(1, 2, 1e-10))","esperado":0.0,"tol":1e-07}]},{"id":"regula_falsi","tipo":"funcion","nivel":2,"tema":"Métodos numéricos","patron":"p-numerico","fuente":"Problemario: Regula Falsi (103); hoja impresa del cuaderno, pág. 79","titulo":"Raíz por Regula Falsi","enunciado":"Define `f(x) = x**3 - x - 2` y diseña `raiz_regula_falsi(a, b, tol)` con el método de Regula Falsi en [a, b], donde f cambia de signo. En cada paso calcula c = (a·f(b) − b·f(a)) / (f(b) − f(a)) y quédate con el subintervalo donde f cambia de signo, como en la bisección. Detente cuando |f(c)| < tol, con un máximo de 1000 iteraciones, y devuelve c. En la hoja impresa de tu cuaderno (pág. 79), el primer c en [1, 2] es 1.3333.","inicio":"def f(x):\n    return x**3 - x - 2\n\ndef raiz_regula_falsi(a, b, tol):\n    \n","pistas":["Es la bisección con otro c: en vez del punto medio, el punto donde la recta entre (a, f(a)) y (b, f(b)) corta el eje x. Calcula un primer c antes del ciclo.","def f(x):\n    return x**3 - x - 2\n\ndef raiz_regula_falsi(a, b, tol):\n    c = (a * f(b) - b * f(a)) / (f(b) - f(a))\n    iteraciones = 1\n    while abs(f(c)) >= tol and iteraciones < 1000:\n        if f(a) * f(c) < 0:\n            b = c\n        else:\n            a = c\n        c = ___\n        iteraciones += 1\n    return c"],"solucion":"def f(x):\n    return x**3 - x - 2\n\ndef raiz_regula_falsi(a, b, tol):\n    c = (a * f(b) - b * f(a)) / (f(b) - f(a))\n    iteraciones = 1\n    while abs(f(c)) >= tol and iteraciones < 1000:\n        if f(a) * f(c) < 0:\n            b = c\n        else:\n            a = c\n        c = (a * f(b) - b * f(a)) / (f(b) - f(a))\n        iteraciones += 1\n    return c","explicacion":["El `if` es el mismo de la bisección. Solo cambia la fórmula de c, que suele caer más cerca de la raíz.","Aquí se para con |f(c)| < tol y no con el ancho del intervalo: con esta f el extremo b = 2 nunca se mueve, así que el intervalo no se achica a cero.","Con `tol = 1` la función devuelve el primer c, 1.3333, y con `tol = 0.5` el segundo, 1.4627. Son los pasos de la hoja impresa (allí sale redondeado como 1.4630)."],"pruebas":[{"expr":"raiz_regula_falsi(1, 2, 0.00000001)","esperado":1.5213797068045676,"tol":1e-06},{"expr":"raiz_regula_falsi(0, 3, 0.00000001)","esperado":1.5213797068045676,"tol":1e-06},{"expr":"raiz_regula_falsi(1, 2, 1)","esperado":1.3333333333333333,"tol":0.0001},{"expr":"raiz_regula_falsi(1, 2, 0.5)","tol":0.0001,"esperado":1.4626865671641789},{"expr":"f(raiz_regula_falsi(1, 2, 0.000001))","esperado":0.0,"tol":1e-06}]},{"id":"seccion_dorada","tipo":"funcion","nivel":3,"tema":"Métodos numéricos","patron":"p-numerico","fuente":"Problemario: máximo por el método de la sección dorada (99)","titulo":"Máximo por sección dorada","enunciado":"La sección dorada busca el máximo de una función unimodal en [a, b] con dos puntos interiores: L = a + 0.382·(b − a) y M = a + 0.618·(b − a). Si f(L) > f(M), el máximo está en [a, M]: haz b = M, luego M = L, y calcula L de nuevo. Si no, está en [L, b]: haz a = L, luego L = M, y calcula M de nuevo. Repite mientras b − a no sea menor que `error` y devuelve el punto medio (a + b)/2. Diseña `maximo_dorado(a, b, error)`. El código inicial trae f(x) = −(x − 2)² + 3, con el máximo en x = 2, pero sirve cualquier función unimodal.","inicio":"def f(x):\n    return -(x - 2)**2 + 3\n\ndef maximo_dorado(a, b, error):\n    \n","pistas":["Calcula L y M antes del ciclo. En cada vuelta descartas un pedazo del intervalo y reusas uno de los puntos; el otro se calcula con su fórmula de siempre, usando los nuevos a y b.","def f(x):\n    return -(x - 2)**2 + 3\n\ndef maximo_dorado(a, b, error):\n    xl = a + 0.382 * (b - a)\n    xm = a + 0.618 * (b - a)\n    while b - a >= error:\n        if f(xl) > f(xm):\n            b = xm\n            xm = xl\n            xl = ___\n        else:\n            a = xl\n            xl = xm\n            xm = ___\n    return (a + b) / 2"],"solucion":"def f(x):\n    return -(x - 2)**2 + 3\n\ndef maximo_dorado(a, b, error):\n    xl = a + 0.382 * (b - a)\n    xm = a + 0.618 * (b - a)\n    while b - a >= error:\n        if f(xl) > f(xm):\n            b = xm\n            xm = xl\n            xl = a + 0.382 * (b - a)\n        else:\n            a = xl\n            xl = xm\n            xm = a + 0.618 * (b - a)\n    return (a + b) / 2","explicacion":["Ojo: el problemario escribe «Si f(L) > f(M) entonces A = L». Esa regla busca el mínimo. Para el máximo es al revés: si f(L) > f(M), el máximo no puede estar a la derecha de M, así que b = M.","0.382 y 0.618 salen de la razón dorada. Por eso el punto que se reusa cae otra vez en 0.382 o 0.618 del nuevo intervalo, y en cada vuelta el intervalo queda en 0.618 de su largo.","El ejemplo del problemario, f(x) = eˣ + sen(x), siempre crece en intervalos como [0, 5]: su máximo queda en el borde. Por eso aquí se usa una parábola con el máximo adentro."],"pruebas":[{"expr":"maximo_dorado(0, 5, 0.0001)","esperado":2.0,"tol":0.001},{"expr":"maximo_dorado(1, 3, 0.0001)","esperado":2.0,"tol":0.001},{"expr":"maximo_dorado(-1, 4, 0.0001)","esperado":2.0,"tol":0.001},{"expr":"maximo_dorado(3, 6, 0.0001)","esperado":3.0,"tol":0.001},{"expr":"f(maximo_dorado(0, 5, 0.0001))","esperado":3.0,"tol":1e-06}]}],"errores":[{"id":"dospuntos","titulo":"Ciclo para números perfectos","codigo":"numero = int(input(\"Ingrese un número: \"))\nsuma = 0\nfor i in range(1, numero):\n    if numero % i == 0\n        suma += i\nif suma == numero:\n    print(\"Es perfecto\")\nelse:\n    print(\"No es perfecto\")","opciones":["Agregar dos puntos al final de la línea 4: `if numero % i == 0:`","Cambiar `==` por `=` en la línea 4","Quitar la sangría de la línea 5"],"correcta":0,"significado":"«expected ':'» significa «se esperaba el signo de dos puntos». `if`, `elif`, `else`, `for`, `while` y `def` siempre terminan en `:`.","leccion":"El símbolo ^ marca dónde Python notó el problema: justo al final de la línea, donde faltan los dos puntos.","lineas":[4],"tipo_error":"SyntaxError","linea_error":4,"salida":"  File \"programa.py\", line 4\n    if numero % i == 0\n                      ^\nSyntaxError: expected ':'\n"},{"id":"coma","titulo":"Tolerancia con coma decimal","codigo":"def f(x):\n    return 4*x\n\ndef raiz_tanteo(a, b, tolerancia=0,0000000001):\n    c = (a + b) / 2\n    while abs(b - a) > tolerancia:\n        c = (a + b) / 2\n        if f(a) * f(c) < 0:\n            b = c\n        else:\n            a = c\n    return c\n\nprint(raiz_tanteo(-20, 22))","opciones":["Escribir el decimal con punto: `tolerancia=0.0000000001`","Poner la tolerancia entre comillas: `tolerancia=\"0,0000000001\"`","Quitar el valor por defecto y escribir `tolerancia`"],"correcta":0,"significado":"Python usa punto para los decimales. Con coma, lee `0` y luego otro número `0000000001`, y un entero no puede empezar con ceros: por eso habla de «leading zeros» (ceros a la izquierda).","leccion":"Entre comillas sería un texto, y `abs(b - a) > \"...\"` daría otro error. También vale escribir `1e-10`.","lineas":[4],"tipo_error":"SyntaxError","linea_error":4,"salida":"  File \"programa.py\", line 4\n    def raiz_tanteo(a, b, tolerancia=0,0000000001):\n                                       ^^^^^^^^^\nSyntaxError: leading zeros in decimal integer literals are not permitted; use an 0o prefix for octal integers\n"},{"id":"retur","titulo":"Buscar el mayor","codigo":"def busca_mayor(lista):\n    mayor = lista[0]\n    for i in lista:\n        if mayor < i:\n            mayor = i\n    retur mayor\n\nprint(busca_mayor([21, 13, 35, 2]))","opciones":["Escribir `return` completo en la línea 6","Poner `retur(mayor)` con paréntesis","Mover la línea 6 dentro del `if`"],"correcta":0,"significado":"«invalid syntax» es el mensaje general cuando Python no entiende una línea. Aquí lee `retur` como un nombre de variable seguido de otro nombre, y eso no es una instrucción válida.","leccion":"Las palabras reservadas (`return`, `while`, `print`…) deben estar escritas exactas y en minúscula.","lineas":[6],"tipo_error":"SyntaxError","linea_error":6,"salida":"  File \"programa.py\", line 6\n    retur mayor\n          ^^^^^\nSyntaxError: invalid syntax\n"},{"id":"mayuscula","titulo":"Número factorion","codigo":"def calcula_factorial(n):\n    f = 1\n    for i in range(1, n + 1):\n        f = f * i\n    return f\n\nnumero = int(input(\"ingrese un numero: \"))\ncopiaNumero = numero\nsuma = 0\nwhile numero > 0:\n    digito = numero % 10\n    suma = suma + calcula_factorial(digito)\n    numero = numero // 10\nif suma == CopiaNumero:\n    print(\"Es factorion\")\nelse:\n    print(\"No es factorion\")","opciones":["Escribir `copiaNumero` con c minúscula en la línea 14","Agregar `import CopiaNumero` al inicio","Cambiar `suma == CopiaNumero` por `suma = CopiaNumero`"],"correcta":0,"significado":"«name 'CopiaNumero' is not defined» significa que esa variable nunca se creó. Python distingue mayúsculas: `copiaNumero` y `CopiaNumero` son dos nombres distintos. El mismo Python sugiere: «Did you mean: 'copiaNumero'?» (¿quiso decir…?).","leccion":"Elige un estilo y manténgalo. Con `snake_case` en minúsculas (`copia_numero`) se evita este problema.","lineas":[14,8],"tipo_error":"NameError","linea_error":14,"salida":"ingrese un numero: 145\nTraceback (most recent call last):\n  File \"programa.py\", line 14, in <module>\n    if suma == CopiaNumero:\n               ^^^^^^^^^^^\nNameError: name 'CopiaNumero' is not defined. Did you mean: 'copiaNumero'?\n"},{"id":"tilde","titulo":"Número perfecto","codigo":"número = int(input(\"Ingrese un número: \"))\ncontador = 0\nsuma = 0\nwhile contador < numero - 1:\n    contador += 1\n    if numero % contador == 0:\n        suma = suma + contador\nif suma == numero:\n    print(\"El número es perfecto\")","opciones":["Quitar la tilde en la línea 1: `numero = int(...)`","Agregar la tilde en todas las líneas que dicen `numero`","Cambiar `while` por `for` en la línea 4"],"correcta":0,"significado":"Para Python, `número` (con tilde) y `numero` (sin tilde) son variables distintas. La línea 1 creó `número`; la línea 4 busca `numero`, que no existe.","leccion":"La opción 2 también funcionaría, pero es fácil olvidar una tilde. Lo recomendable es no usar tildes ni ñ en nombres de variables. En los textos entre comillas sí se pueden usar.","lineas":[1,4],"tipo_error":"NameError","linea_error":4,"salida":"Ingrese un número: 28\nTraceback (most recent call last):\n  File \"programa.py\", line 4, in <module>\n    while contador < numero - 1:\n                     ^^^^^^\nNameError: name 'numero' is not defined. Did you mean: 'número'?\n"},{"id":"multiplicar","titulo":"Puntos colineales","codigo":"x1 = float(input(\"x1: \"))\ny1 = float(input(\"y1: \"))\nx2 = float(input(\"x2: \"))\ny2 = float(input(\"y2: \"))\nx3 = float(input(\"x3: \"))\ny3 = float(input(\"y3: \"))\ns = x1(y2 - y3) + x2*(y3 - y1) + x3*(y1 - y2)\nif s == 0:\n    print(\"Son colineales\")\nelse:\n    print(\"No son colineales\")","opciones":["Escribir el signo de multiplicar: `x1*(y2 - y3)`","Convertir x1 a entero con `int(x1)`","Poner la expresión entre corchetes"],"correcta":0,"significado":"«'float' object is not callable»: un número decimal no se puede «llamar». En Python, `x1(...)` pegado a un paréntesis significa llamar a una función llamada x1. En matemáticas se omite el ×; en Python, nunca.","leccion":"Siempre que en la fórmula haya una multiplicación implícita, escribe `*`.","lineas":[7],"tipo_error":"TypeError","linea_error":7,"salida":"x1: 0\ny1: 0\nx2: 1\ny2: 1\nx3: 2\ny3: 2\nTraceback (most recent call last):\n  File \"programa.py\", line 7, in <module>\n    s = x1(y2 - y3) + x2*(y3 - y1) + x3*(y1 - y2)\n        ~~^^^^^^^^^\nTypeError: 'float' object is not callable\n"},{"id":"concatenar","titulo":"Mostrar una suma","codigo":"lista = [21, 13, 35, 2]\nsuma = 0\nfor x in lista:\n    suma += x\nprint(\"La suma es: \" + suma)","opciones":["Separar con coma: `print(\"La suma es:\", suma)`","Cambiar la línea 2 por `suma = \"0\"`","Quitar las comillas del texto"],"correcta":0,"significado":"«can only concatenate str (not \"int\") to str»: el `+` entre un texto y un número no está permitido. Con textos, `+` pega; con números, suma; mezclarlos da TypeError.","leccion":"Con coma, `print` muestra ambos valores separados por un espacio. También sirve `str(suma)` o un f-string: `print(f\"La suma es: {suma}\")`.","lineas":[5],"tipo_error":"TypeError","linea_error":5,"salida":"Traceback (most recent call last):\n  File \"programa.py\", line 5, in <module>\n    print(\"La suma es: \" + suma)\n          ~~~~~~~~~~~~~~~^~~~~~\nTypeError: can only concatenate str (not \"int\") to str\n"},{"id":"diezmil","titulo":"Área por rectángulos","codigo":"def f(x):\n    return 4*x\n\ndef area_rectangulos(a, b, n=10.000):\n    ancho = (b - a) / n\n    total = 0\n    for k in range(n):\n        total += ancho * f(a + ancho * k)\n    return total\n\nprint(area_rectangulos(0, 10))","opciones":["Escribir diez mil sin punto: `n=10000`","Cambiar `range(n)` por `range(n, 1)`","Convertir el ancho a entero"],"correcta":0,"significado":"«'float' object cannot be interpreted as an integer»: `ra     return posiciones\n\nprint(posiciones_mayor([21, 2, 10, 21, 21, 10]))","opciones":["Usar paréntesis: `posiciones.append(i)`","Cambiar a `posiciones[i] = i`","Crear la lista con `posiciones = ()`"],"correcta":0,"significado":"«'builtin_function_or_method' object is not subscriptable»: `append` es una función y se llama con paréntesis. Los corchetes son para posiciones de una lista (`lista[i]`).","leccion":"La opción 2 da IndexError: en una lista vacía no existe la posición i.","lineas":[9],"tipo_error":"TypeError","linea_error":9,"salida":"Traceback (most recent call last):\n  File \"programa.py\", line 12, in <module>\n    print(posiciones_mayor([21, 2, 10, 21, 21, 10]))\n          ~~~~~~~~~~~~~~~~^^^^^^^^^^^^^^^^^^^^^^^^^\n  File \"programa.py\", line 9, in posiciones_mayor\n    posiciones.append[i]\n    ~~~~~~~~~~~~~~~~~^^^\nTypeError: 'builtin_function_or_method' object is not subscriptable\n"},{"id":"sangria","titulo":"Validar a y b","codigo":"def area(a, b):\n    return (b - a) * 2\n\na = float(input(\"ingrese a: \"))\nb = float(input(\"ingrese b: \"))\nif b < a:\n    print(\"ingrese otros datos\")\nelse:\nprint(area(a, b))","opciones":["Sangrar la línea 9 con 4 espacios para que quede dentro del `else`","Borrar la línea 8 y dejar la 9 igual","Agregar dos puntos al final de la línea 9"],"correcta":0,"significado":"«expected an indented block after 'else' statement on line 8»: después de `else:` Python espera al menos una línea sangrada. La sangría (4 espacios) es la que dice qué está dentro del `else`.","leccion":"Borrar el `else` (opción 2) quitaría el error, pero el área se calcularía también con datos inválidos.","lineas":[9],"tipo_error":"IndentationError","linea_error":9,"salida":"  File \"programa.py\", line 9\n    print(area(a, b))\n    ^^^^^\nIndentationError: expected an indented block after 'else' statement on line 8\n"},{"id":"cero","titulo":"Número automórfico","codigo":"numero = int(input(\"Ingrese el número: \"))\ncopia = numero\ncuadrado = numero * numero\ndivisor = 1\nwhile numero > 0:\n    numero = numero // 10\n    divisor = numero * 10\nif cuadrado % divisor == copia:\n    print(\"Es automórfico\")\nelse:\n    print(\"No es automórfico\")","opciones":["En la línea 7, multiplicar el divisor: `divisor = divisor * 10`","En la línea 8, cambiar `%` por `//`","En la línea 4, empezar con `divisor = 0`"],"correcta":0,"significado":"«integer modulo by zero»: se intentó calcular el resto de dividir entre 0. En la última vuelta `numero` vale 0, y `numero * 10` deja el divisor en 0.","leccion":"Python señala la línea 8, pero la causa está en la 7. Cuando el error dice «by zero», busca dónde ese valor se volvió 0.","lineas":[7],"tipo_error":"ZeroDivisionError","linea_error":8,"salida":"Ingrese el número: 25\nTraceback (most recent call last):\n  File \"programa.py\", line 8, in <module>\n    if cuadrado % divisor == copia:\n       ~~~~~~~~~^~~~~~~~~\nZeroDivisionError: integer modulo by zero\n"},{"id":"y_and","titulo":"Número perfecto, otra forma","codigo":"numero = int(input(\"Ingrese el número: \"))\ncontador = 0\nsuma = 0\nwhile contador < numero // 2:\n    contador += 1\n    if numero % contador == 0:\n        suma += contador\nif suma == numero y numero > 0:\n    print(\"El número es perfecto\")\nelse:\n    print(\"El número no es perfecto\")","opciones":["Escribir el operador lógico en inglés: `and`","Cambiar `y` por `&&`","Separar con coma: `suma == numero, numero > 0`"],"correcta":0,"significado":"«invalid syntax»: Python no reconoce `y` como operador. Los operadores lógicos son `and`, `or` y `not`.","leccion":"Con coma (opción 3) no hay error, pero se forma una tupla que siempre es verdadera: el `if` se cumpliría siempre. Ese error también está en tus apuntes, en un `while`.","lineas":[8],"tipo_error":"SyntaxError","linea_error":8,"salida":"  File \"programa.py\", line 8\n    if suma == numero y numero > 0:\n                      ^\nSyntaxError: invalid syntax\n"},{"id":"sin_return","titulo":"Bisección que da 1.0","codigo":"def f(x):\n    return 4*x\n\ndef raiz_tanteo(a, b, tolerancia=0.0000000001):\n    while abs(b - a) > tolerancia:\n        c = (a + b) / 2\n        if f(a) * f(c) < 0:\n            b = c\n        else:\n            a = c\n        return c\n\nprint(raiz_tanteo(-20, 22))","opciones":["Quitar 4 espacios a la línea 11 para alinearla con el `while`","Cambiar `return c` por `print(c)`","Bajar la tolerancia"],"correcta":0,"significado":"No hay mensaje de error: el programa imprime 1.0, que es solo el primer punto medio. Como `return c` está dentro del `while`, la función termina en la primera vuelta.","leccion":"La sangría decide dónde termina el ciclo. Un `return` dentro de un ciclo lo corta en esa vuelta.","lineas":[11],"tipo_error":"Sin mensaje de error","salida":"1.0\n"},{"id":"infinito","titulo":"Persistencia que no termina","codigo":"numero = int(input(\"Ingrese un número natural: \"))\ncontador = 0\nwhile numero > 0:\n    producto = 1\n    while numero > 0:\n        producto *= numero % 10\n        numero //= 10\n    numero = producto\n    contador += 1\nprint(\"La persistencia es:\", contador)","opciones":["Repetir solo mientras tenga más de un dígito: `while numero > 9:`","Cambiar el ciclo interno a `while numero > 9:`","Empezar con `contador = 1`"],"correcta":0,"significado":"El programa nunca termina. 39 → 27 → 14 → 4, y luego 4 → 4 → 4…: el número nunca llega a 0, así que el ciclo externo no se detiene. En VS Code se detiene con Ctrl + C.","leccion":"Antes de escribir un `while`, pregúntese: ¿qué cambia dentro del ciclo para que la condición llegue a ser falsa?","lineas":[3],"salida":"Ingrese un número natural: 39\n\n(el programa sigue corriendo y no muestra nada más)\n\n^C\nTraceback (most recent call last):\n  File \"programa.py\", line 5, in <module>\n    while numero > 0:\n          ^^^^^^^^^^\nKeyboardInterrupt","tipo_error":"Ciclo infinito","linea_error":5},{"id":"fu_guion","titulo":"Suma de dos valores","codigo":"# suma de dos valores\nvalor-1 = int(input(\"Ingrese el primer valor: \"))\nvalor-2 = int(input(\"Ingrese el segundo valor: \"))\nsuma = valor-1 + valor-2\nprint(\"La suma es:\", suma)","lineas":[2],"opciones":["Usar guion bajo en los nombres: `valor_1` y `valor_2`, en todas las líneas","Cambiar `=` por `==` en la línea 2, como sugiere Python","Poner el nombre entre comillas: `\"valor-1\" = ...`"],"correcta":0,"significado":"«cannot assign to expression here» significa «no se puede asignar a una expresión». Python lee `valor-1` como la resta `valor - 1`, y a una resta no se le puede guardar un valor. La sugerencia «Maybe you meant '=='?» (¿quisiste decir ==?) no aplica aquí: no querías comparar.","leccion":"En un nombre solo van letras, números y guion bajo. En tus apuntes `Casa-1` aparece como válido: no lo es, se escribe `Casa_1`. Fíjate también que no apareció ningún mensaje de `input`: con un error de sintaxis no corre ninguna línea.","tipo_error":"SyntaxError","linea_error":2,"salida":"  File \"programa.py\", line 2\n    valor-1 = int(input(\"Ingrese el primer valor: \"))\n    ^^^^^^^\nSyntaxError: cannot assign to expression here. Maybe you meant '==' instead of '='?\n"},{"id":"fu_print_asigna","titulo":"Área del cuadrado","codigo":"lado = int(input(\"Ingrese el valor del lado: \"))\nprint = (\"el valor suministrado es:\")\narea = lado * lado\nprint(\"El área del cuadrado es:\", area)","lineas":[2],"opciones":["En la línea 2, llamar a print sin el `=`: `print(\"el valor suministrado es:\", lado)`","En la línea 4, quitar los paréntesis: `print \"El área del cuadrado es:\", area`","En la línea 4, escribir también `print = (\"El área del cuadrado es:\", area)`"],"correcta":0,"significado":"«'str' object is not callable» significa «un texto no se puede llamar». La línea 2 no muestra nada: guarda el texto en una variable llamada `print`. Desde ahí `print` ya no es la función sino un texto, y en la línea 4 `print(...)` intenta «llamar» a ese texto.","leccion":"Python señala la línea 4, pero el problema está en la 2. Para mostrar algo se escribe `print(...)`, sin `=`. Es el primer ejemplo de input y print de tus apuntes. Sin paréntesis (opción 2) es SyntaxError, y con `=` (opción 3) no se muestra nada.","tipo_error":"TypeError","linea_error":4,"salida":"Ingrese el valor del lado: 5\nTraceback (most recent call last):\n  File \"programa.py\", line 4, in <module>\n    print(\"El área del cuadrado es:\", area)\n    ~~~~~^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^\nTypeError: 'str' object is not callable\n"},{"id":"fu_heron","titulo":"Fórmula de Herón","codigo":"a = float(input(\"Lado a: \"))\nb = float(input(\"Lado b: \"))\nc = float(input(\"Lado c: \"))\ns = a + b + c / 2\narea = (s * (s - a) * (s - b) * (s - c)) ** (1/2)\nprint(\"El área del triángulo es:\", area)","lineas":[4],"opciones":["Encerrar la suma entre paréntesis: `s = (a + b + c) / 2`","Cambiar `/ 2` por `// 2` en la línea 4","Quitar los paréntesis del exponente en la línea 5: `** 1/2`"],"correcta":0,"significado":"No hay mensaje de error, pero el resultado está mal: muestra 39.09…, y el triángulo 3, 4, 5 es rectángulo, con área 3 · 4 / 2 = 6. Como `/` va antes que `+`, Python dividió solo c entre 2: s quedó en 3 + 4 + 2.5 = 9.5 en vez de 6.","leccion":"Es la fórmula de Herón de tus apuntes, escrita `s = a+b+c/2`. Prueba siempre con datos cuya respuesta conoces: así se descubren los errores de lógica.","tipo_error":"Sin mensaje de error","salida":"Lado a: 3\nLado b: 4\nLado c: 5\nEl área del triángulo es: 39.093637589766445\n"},{"id":"fu_comilla","titulo":"División entera y resto","codigo":"dividendo = 7\ndivisor = 2\nprint(\"Calculando...\")\nprint(\"resultado)\nprint(dividendo // divisor, dividendo % divisor)","lineas":[4],"opciones":["Cerrar la comilla: `print(\"resultado\")`","Agregar dos puntos al final: `print(\"resultado):`","Borrar la línea 3, porque «Calculando...» no se mostró"],"correcta":0,"significado":"«unterminated string literal» significa «texto sin terminar»: se abrieron comill
