<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: columna central tipo juego. Mapa de temas con nodos en zigzag; cada lección se abre a pantalla completa, una pregunta a la vez, con barra de acción abajo. Colores de resaltador, uno por tema. */
:root{
  --bg:#f7f5fb; --card:#ffffff; --ink:#221e33; --muted:#6c6782; --line:#e6e2ef; --soft:#f2eff8; --on:#ffffff;
  --ok:#1b9a5a; --ok-bg:#e2f5ea; --bad:#d6443a; --bad-bg:#fce6e3; --gold:#f2b705; --gold-bg:#fff0bf; --gray:#c9c4d6;
  --scr-bg:#272338; --scr-fg:#efebf8; --scr-dim:#9d97b4; --scr-err:#ff9d8f;
  --kw:#7d4fd6; --str:#1f8a55; --num:#d4621f; --com:#9a94ae;
  --morado:#7e4fd8; --morado-b:#efe7fc; --rosado:#d4437c; --rosado-b:#fce6ef; --verde:#1f8f58; --verde-b:#e0f3e8;
  --azul:#2c6bc9; --azul-b:#e3edfb; --naranja:#d9661f; --naranja-b:#fdebdc; --turquesa:#0c8d8c; --turquesa-b:#dbf2f1;
  --amarillo:#a87b00; --amarillo-b:#fff1c4; --oro:#b88600; --oro-b:#fff0bf;
  --pizarra:#4a6382; --pizarra-b:#e4eaf2; --coral:#c84a39; --coral-b:#fde6e2;
  --f-game:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121c; --card:#1f1b2b; --ink:#f2f0f8; --muted:#a9a4bd; --line:#322d43; --soft:#1a1725; --on:#14121c;
  --ok:#4fd08b; --ok-bg:#163020; --bad:#ff7d70; --bad-bg:#3b1c1a; --gold:#ffc83d; --gold-bg:#3a3011; --gray:#4a4460;
  --scr-bg:#0f0d16; --kw:#b893ff; --str:#6fd6a0; --num:#f4a066; --com:#7f7a95;
  --morado:#ab88f2; --morado-b:#2a2143; --rosado:#f27fac; --rosado-b:#3a1f2c; --verde:#4fc386; --verde-b:#173326;
  --azul:#73a3f2; --azul-b:#1b2a45; --naranja:#f59c5f; --naranja-b:#3a2617; --turquesa:#40c7c3; --turquesa-b:#123030;
  --amarillo:#f0c33c; --amarillo-b:#3a3012; --oro:#ffc83d; --oro-b:#3a3011; color-scheme:dark;
  --pizarra:#9db4d3; --pizarra-b:#1d2533; --coral:#f68a7b; --coral-b:#3b201c;
}}
:root[data-theme="dark"]{
  --bg:#14121c; --card:#1f1b2b; --ink:#f2f0f8; --muted:#a9a4bd; --line:#322d43; --soft:#1a1725; --on:#14121c;
  --ok:#4fd08b; --ok-bg:#163020; --bad:#ff7d70; --bad-bg:#3b1c1a; --gold:#ffc83d; --gold-bg:#3a3011; --gray:#4a4460;
  --scr-bg:#0f0d16; --kw:#b893ff; --str:#6fd6a0; --num:#f4a066; --com:#7f7a95;
  --morado:#ab88f2; --morado-b:#2a2143; --rosado:#f27fac; --rosado-b:#3a1f2c; --verde:#4fc386; --verde-b:#173326;
  --azul:#73a3f2; --azul-b:#1b2a45; --naranja:#f59c5f; --naranja-b:#3a2617; --turquesa:#40c7c3; --turquesa-b:#123030;
  --amarillo:#f0c33c; --amarillo-b:#3a3012; --oro:#ffc83d; --oro-b:#3a3011; color-scheme:dark;
  --pizarra:#9db4d3; --pizarra-b:#1d2533; --coral:#f68a7b; --coral-b:#3b201c;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.55;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--f-game);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--uc,var(--morado));outline-offset:2px}
code{font-family:var(--f-mono);font-size:.86em;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:.05em .35em;overflow-wrap:anywhere}
.u-morado{--uc:var(--morado);--ub:var(--morado-b)}.u-rosado{--uc:var(--rosado);--ub:var(--rosado-b)}.u-verde{--uc:var(--verde);--ub:var(--verde-b)}
.u-azul{--uc:var(--azul);--ub:var(--azul-b)}.u-naranja{--uc:var(--naranja);--ub:var(--naranja-b)}.u-turquesa{--uc:var(--turquesa);--ub:var(--turquesa-b)}
.u-amarillo{--uc:var(--amarillo);--ub:var(--amarillo-b)}.u-oro{--uc:var(--oro);--ub:var(--oro-b)}
.u-pizarra{--uc:var(--pizarra);--ub:var(--pizarra-b)}.u-coral{--uc:var(--coral);--ub:var(--coral-b)}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.marca{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 2px;font-family:var(--f-game);font-weight:700;font-size:1.2rem}
.marca svg{width:30px;height:30px}
.stats{margin-left:auto;display:flex;align-items:center;gap:6px}
.stat{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-game);font-weight:600;font-size:1rem;padding:5px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat svg{width:18px;height:18px}
.btn-ap{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:600}
.btn-ap svg{width:18px;height:18px}
@media (max-width:520px){.marca span{display:none}.btn-ap span{display:none}.stat{padding:4px 7px;font-size:.92rem}}

.pagina{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
.col{max-width:620px;margin:0 auto}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 20px;font-family:var(--f-game);font-weight:600;font-size:1.05rem;background:var(--uc,var(--morado));color:var(--on);box-shadow:0 4px 0 color-mix(in srgb,var(--uc,var(--morado)) 70%,#000);transition:transform .06s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--uc,var(--morado)) 70%,#000)}
.btn:disabled{background:var(--gray);box-shadow:0 4px 0 color-mix(in srgb,var(--gray) 70%,#000);cursor:not-allowed;color:var(--card)}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.sec:active{box-shadow:0 1px 0 var(--line)}
.btn.ok{--uc:var(--ok)}.btn.bad{--uc:var(--bad)}
.btn.ancho{width:100%}
.btn.chico{padding:7px 13px;font-size:.95rem;border-radius:11px}
.link{border:0;background:none;padding:0;color:var(--uc,var(--morado));font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* Mapa */
.hero{display:grid;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px}
.hero .ceja{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;color:var(--rosado);background:var(--rosado-b);padding:4px 11px;border-radius:999px;justify-self:start}
.hero h1{font-size:clamp(1.75rem,5vw,2.4rem);font-weight:700}
.hero p{color:var(--muted);max-width:60ch}
.hero-pie{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.progreso{flex:1 1 220px;display:grid;gap:6px;font-size:.9rem;color:var(--muted)}
.barra{height:12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.barra i{display:block;height:100%;background:var(--uc,var(--morado));border-radius:999px;width:0;transition:width .5s}
.unidad{margin-top:34px}
.u-cab{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;background:var(--ub);border-radius:22px;padding:16px 18px}
.u-num{grid-row:span 2;width:52px;height:52px;border-radius:16px;background:var(--uc);color:var(--on);display:grid;place-items:center;font-family:var(--f-game);font-weight:700;font-size:1.6rem}
.u-cab h2{font-size:1.4rem}
.u-cab p{color:var(--muted);font-size:.95rem}
.u-pie{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:8px;font-size:.9rem;color:var(--muted)}
.camino{display:grid;justify-items:center;gap:10px;padding:22px 0 4px}
.paso{display:grid;justify-items:center;gap:4px;transform:translateX(calc(var(--x,0) * 58px));width:190px;position:relative}
@media (max-width:520px){.paso{transform:translateX(calc(var(--x,0) * 40px))}}
.nodo{width:78px;height:78px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--gray);color:var(--card);box-shadow:0 6px 0 color-mix(in srgb,var(--gray) 65%,#000);position:relative}
.nodo svg{width:34px;height:34px}
.nodo.hecho,.nodo.actual{background:var(--uc);color:var(--on);box-shadow:0 6px 0 color-mix(in srgb,var(--uc) 65%,#000)}
.nodo.desafio{border-radius:24px}
.nodo:active{transform:translateY(3px);box-shadow:0 3px 0 color-mix(in srgb,var(--gray) 65%,#000)}
.nodo.actual::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--uc);opacity:.55;animation:latido 1.8s ease-out infinite}
.nodo.desafio.actual::after{border-radius:30px}
@keyframes latido{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.12);opacity:0}}
.globo{position:absolute;top:-38px;background:var(--card);border:2px solid var(--uc);color:var(--uc);font-family:var(--f-game);font-weight:600;font-size:.88rem;padding:3px 11px;border-radius:12px;white-space:nowrap;z-index:2}
.globo::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--card);border-right:2px solid var(--uc);border-bottom:2px solid var(--uc);transform:translateX(-50%) rotate(45deg)}
.paso.con-globo{margin-top:30px}
.estrellas{display:flex;gap:2px;height:18px}
.estrellas svg{width:18px;height:18px}
.nodo-t{font-weight:600;font-size:.92rem;text-align:center;line-height:1.25}
.nodo-s{font-size:.8rem;color:var(--muted)}

/* Lección (pantalla completa) */
.lec{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lec-top{display:flex;align-items:center;gap:12px;max-width:760px;width:100%;margin:0 auto;padding:14px 16px 8px}
.cerrar{width:40px;height:40px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--muted);flex:none}
.cerrar svg{width:24px;height:24px}
.lec-top .barra{flex:1;height:16px}
.lec-n{font-family:var(--f-game);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.4em;text-align:right}
.lec-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lec-in{max-width:760px;margin:0 auto;padding:14px 16px 28px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.tipo{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-game);font-weight:600;color:var(--uc);font-size:.95rem}
.tipo svg{width:20px;height:20px}
.pregunta{font-family:var(--f-game);font-weight:600;font-size:clamp(1.25rem,3.6vw,1.55rem);line-height:1.3}
.lec-pie{border-top:1px solid var(--line);background:var(--card);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.lec-pie.ok{background:var(--ok-bg);border-top-color:var(--ok)}
.lec-pie.bad{background:var(--bad-bg);border-top-color:var(--bad)}
.pie-in{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between}
.pie-in .btn{min-width:180px}
@media (max-width:560px){.pie-in .btn{width:100%}}
.fb{flex:1 1 300px;display:grid;gap:4px;max-height:38vh;overflow-y:auto}
.fb h3{font-size:1.25rem;display:flex;align-items:center;gap:8px}
.fb h3 svg{width:26px;height:26px;flex:none}
.lec-pie.ok .fb h3{color:var(--ok)}.lec-pie.bad .fb h3{color:var(--bad)}
.fb p{font-size:.97rem}
.fb .corr{font-size:.95rem}

/* Tarjeta de aprendizaje */
.aprende{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;gap:12px}
.aprende h2{font-size:clamp(1.4rem,4vw,1.8rem)}
.aprende ul{margin:0;padding-left:1.2em;display:grid;gap:8px}
.ojo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--gold-bg);border-radius:14px;padding:12px 14px;font-size:.95rem}
.ojo svg{width:22px;height:22px;color:var(--oro)}
.ojo b{display:block;font-family:var(--f-game);font-weight:600}

/* Código */
pre.code{margin:0;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:13px 15px;overflow-x:auto;font-family:var(--f-mono);font-size:.88rem;line-height:1.65;tab-size:4}
pre.code code{background:none;border:0;padding:0;font-size:inherit}
.tk-k{color:var(--kw);font-weight:600}.tk-s{color:var(--str)}.tk-n{color:var(--num)}.tk-c{color:var(--com);font-style:italic}
.pantalla{border-radius:14px;overflow:hidden;background:var(--scr-bg)}
.pantalla .pt{display:flex;align-items:center;gap:6px;padding:7px 12px 0;color:var(--scr-dim);font-size:.75rem;font-family:var(--f-game);font-weight:500}
.pantalla .pt i{width:8px;height:8px;border-radius:50%;background:var(--scr-dim);opacity:.6}
.pantalla pre{margin:0;padding:8px 14px 12px;color:var(--scr-fg);font-family:var(--f-mono);font-size:.85rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.pantalla .err{color:var(--scr-err)}.pantalla .dim{color:var(--scr-dim)}

/* Opciones */
.ops{display:grid;gap:10px}
.op{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 3px 0 var(--line);min-height:56px}
.op .k{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-game);font-weight:600;color:var(--muted);font-size:.9rem}
.op .v{min-width:0;flex:1}
.op .v.mono{font-family:var(--f-mono);font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
.op:hover:not(:disabled){border-color:color-mix(in srgb,var(--uc) 50%,var(--line))}
.op[aria-pressed="true"]{border-color:var(--uc);background:var(--ub);box-shadow:0 3px 0 var(--uc)}
.op[aria-pressed="true"] .k{border-color:var(--uc);color:var(--uc)}
.op.ok{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 3px 0 var(--ok)}
.op.bad{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 3px 0 var(--bad)}
.op:disabled{cursor:default}
.ops.salidas{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* Completar */
.hueco{display:inline-block;min-width:3.2em;padding:0 .4em;border-bottom:3px solid var(--uc);background:var(--ub);border-radius:6px 6px 0 0;color:var(--ink);text-align:center;font-weight:600}
.hueco.vacio{color:transparent}
.hueco.ok{border-color:var(--ok);background:var(--ok-bg)}
.hueco.bad{border-color:var(--bad);background:var(--bad-bg)}
.fichas{display:flex;flex-wrap:wrap;gap:10px}
.ficha{font-family:var(--f-mono);font-size:1rem;font-weight:600;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px 16px;box-shadow:0 3px 0 var(--line);max-width:100%;overflow-wrap:anywhere;text-align:left}
.ficha[aria-pressed="true"]{border-color:var(--uc);background:var(--ub);box-shadow:0 3px 0 var(--uc)}
.ficha:disabled{cursor:default;opacity:.6}

/* Encuentra el error */
.listado{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:8px 0;overflow-x:auto}
.cl{display:flex;width:100%;min-width:max-content;border:0;background:none;text-align:left;padding:3px 14px 3px 0;font-family:var(--f-mono);font-size:.88rem;line-height:1.6;white-space:pre;border-left:4px solid transparent}
.cl .nl{width:2.6em;flex:none;text-align:right;padding-right:12px;color:var(--com);user-select:none}
.cl:hover:not(:disabled){background:var(--ub)}
.cl[aria-pressed="true"]{background:var(--ub);border-left-color:var(--uc)}
.cl.ok{background:var(--ok-bg);border-left-color:var(--ok)}
.cl.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.cl:disabled{cursor:default;color:inherit}
.fase{font-family:var(--f-game);font-weight:600;font-size:1.05rem}
.aviso{border-radius:14px;padding:11px 14px;font-size:.95rem;background:var(--soft);border:1px solid var(--line)}
.aviso.ok{background:var(--ok-bg);border-color:var(--ok)}
.aviso.bad{background:var(--bad-bg);border-color:var(--bad)}
.aviso.oro{background:var(--gold-bg);border-color:var(--gold)}
.aviso b{font-family:var(--f-game);font-weight:600}

/* Ordenar */
.zona-t{font-family:var(--f-game);font-weight:600;font-size:.95rem;color:var(--muted)}
.programa{min-height:96px;border:2px solid var(--uc);border-radius:16px;background:var(--card);padding:10px;display:grid;gap:7px;align-content:start}
.banco{display:grid;gap:7px;padding:10px;border:2px dashed var(--line);border-radius:16px;background:var(--soft)}
.blq{display:flex;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:11px;padding:7px 11px;font-family:var(--f-mono);font-size:.86rem;box-shadow:0 2px 0 var(--line)}
.blq .bt{min-width:0;flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.blq .ind{flex:none;align-self:stretch;width:calc(var(--n) * 1.15em);background:repeating-linear-gradient(90deg,var(--gray) 0 2px,transparent 2px 1.15em)}
@media (max-width:520px){.blq{font-size:.78rem;padding:7px 9px}}
.blq:hover{border-color:color-mix(in srgb,var(--uc) 50%,var(--line))}

.programa .blq{border-color:color-mix(in srgb,var(--uc) 35%,var(--line))}
.blq.bad{border-color:var(--bad);background:var(--bad-bg)}
.blq.ok{border-color:var(--ok)}
.vacio-t{color:var(--muted);font-size:.92rem;padding:6px}

/* Resultado */
.resultado{display:grid;justify-items:center;text-align:center;gap:14px;padding:30px 0}
.res-est{display:flex;gap:10px}
.res-est svg{width:64px;height:64px}
.res-est .on{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.res-est .on:nth-child(2){animation-delay:.18s}.res-est .on:nth-child(3){animation-delay:.36s}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.res-datos{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.dato{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 18px;display:grid;justify-items:center;min-width:120px}
.dato b{font-family:var(--f-game);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.dato span{font-size:.85rem;color:var(--muted)}
.res-acc{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

/* Desafíos y reto */
.volver{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 0;font-weight:700;color:var(--muted)}
.volver svg{width:20px;height:20px}
.lista-ret{display:grid;gap:12px}
.ret{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 3px 0 var(--line)}
.ret:hover{border-color:color-mix(in srgb,var(--uc) 50%,var(--line))}
.ret-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--ub);color:var(--uc)}
.ret-ic svg{width:24px;height:24px}
.ret.hecho .ret-ic{background:var(--uc);color:var(--on)}
.ret h3{font-size:1.08rem}
.ret p{font-size:.88rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.chip.f1{background:var(--verde-b);color:var(--verde);border-color:transparent}.chip.f2{background:var(--azul-b);color:var(--azul);border-color:transparent}.chip.f3{background:var(--rosado-b);color:var(--rosado);border-color:transparent}
.chip.prio{background:var(--gold-bg);color:var(--oro);border-color:transparent}
.grupo-t{font-family:var(--f-game);font-weight:600;color:var(--muted);margin:14px 0 2px}
.tarjeta{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px}
.editor{display:grid;grid-template-columns:auto minmax(0,1fr);border:2px solid var(--uc);border-radius:16px;background:var(--soft);overflow:hidden}
.gut{margin:0;padding:12px 8px 12px 10px;font-family:var(--f-mono);font-size:.9rem;line-height:1.6;color:var(--com);text-align:right;user-select:none;background:var(--card);border-right:1px solid var(--line);overflow:hidden;min-width:2.8em}
.gut span{display:block;border-radius:4px;padding:0 3px}
.gut span.err{background:var(--bad);color:#fff}
.editor textarea{display:block;width:100%;min-height:260px;resize:vertical;border:0;outline:0;background:transparent;padding:12px 14px;font-family:var(--f-mono);font-size:.9rem;line-height:1.6;white-space:pre;overflow:auto;tab-size:4;color:var(--ink)}
.entrada textarea{width:100%;min-height:62px;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:8px 10px;font-family:var(--f-mono);font-size:.88rem;resize:vertical}
details.pleg>summary{cursor:pointer;font-weight:700;color:var(--uc);font-size:.95rem}
details.pleg[open]>summary{margin-bottom:8px}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pruebas{display:grid;gap:8px}
.prueba{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;border-radius:14px;padding:10px 12px;background:var(--card);border:2px solid var(--line)}
.prueba.ok{border-color:var(--ok);background:var(--ok-bg)}
.prueba.bad{border-color:var(--bad);background:var(--bad-bg)}
.prueba .ic{width:26px;height:26px}
.prueba.ok .ic{color:var(--ok)}.prueba.bad .ic{color:var(--bad)}
.prueba .d{min-width:0;display:grid;gap:4px;font-size:.9rem}
.prueba .d code{white-space:pre-wrap;word-break:break-word}
.estado-py{display:inline-flex;align-items:center;gap:7px;font-size:.88rem;color:var(--muted)}
.estado-py i{width:9px;height:9px;border-radius:50%;background:var(--gray)}
.estado-py[data-e="listo"] i{background:var(--ok)}.estado-py[data-e="cargando"] i{background:var(--gold);animation:parpadeo 1s infinite}.estado-py[data-e="no"] i{background:var(--bad)}
@keyframes parpadeo{50%{opacity:.3}}
.confirmar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--gold-bg);border-radius:12px;padding:8px 12px;font-size:.93rem}
.sim-banda{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--oro-b);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.sim-banda b{font-family:var(--f-game);font-variant-numeric:tabular-nums;font-size:1.1rem}

/* Apuntes */
.ap-nav{display:flex;flex-wrap:wrap;gap:8px}
.ap-nav a{text-decoration:none;font-weight:600;font-size:.9rem;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.ap-sec{margin-top:28px;display:grid;gap:14px}
.ap-sec>h2{font-size:1.5rem}
details.ap-u{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
details.ap-u>summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--ub)}
details.ap-u>summary::-webkit-details-marker{display:none}
details.ap-u>summary .u-num{width:42px;height:42px;border-radius:13px;font-size:1.25rem;grid-row:auto}
details.ap-u>summary h3{font-size:1.15rem}
details.ap-u>summary .mas{margin-left:auto;font-weight:700;color:var(--uc);font-size:.88rem;white-space:nowrap}
.ap-cuerpo{padding:16px;display:grid;gap:18px}
.ap-tema{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.ap-tema:first-child{border-top:0;padding-top:0}
.ap-tema h4{font-size:1.08rem}
.ap-tema ul{margin:0;padding-left:1.15em;display:grid;gap:5px}
.tabla{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{background:var(--soft);font-family:var(--f-game);font-weight:600}
.consejos{display:grid;gap:10px}
.consejo{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.consejo .nn{width:36px;height:36px;border-radius:11px;background:var(--morado-b);color:var(--morado);display:grid;place-items:center;font-family:var(--f-game);font-weight:700}
.consejo h4{font-size:1.05rem;margin-bottom:2px}
.consejo p,.consejo li{color:var(--muted);font-size:.95rem}
.consejo ul{margin:4px 0 0;padding-left:1.1em}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-family:var(--f-game);font-weight:600;z-index:90;max-width:calc(100% - 32px)}
.dialogo{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,#000 45%,transparent);display:grid;place-items:center;padding:16px}
.dialogo>div{background:var(--card);border-radius:22px;padding:22px;max-width:380px;width:100%;display:grid;gap:14px;text-align:center}
.dialogo h3{font-size:1.3rem}
.dialogo p{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

<script>
const DATA = {"unidades":[{"id":"u0","color":"pizarra","titulo":"Fundamentos","sub":"La base de todo: qué hace un programa, variables, operadores y cómo se piensa un algoritmo","patrones":["p-programa"],"lecciones":[{"id":"f-1","titulo":"La computadora y el programa","items":[{"t":"aprende","titulo":"Entrada, proceso y salida","texto":["Todo programa, sin importar su tamaño, tiene tres partes: **entrada** (los datos que recibe), **proceso** (lo que hace con esos datos para construir la solución) y **salida** (mostrar los resultados).","En Python la entrada suele ser `input()`, el proceso son las operaciones y asignaciones, y la salida es `print()`.","Antes de escribir código pregúntate: ¿qué datos entran y cómo son?, ¿qué hago con ellos?, ¿qué debo mostrar? Entre la entrada y la salida está la pregunta central del curso: ¿cómo resolver el problema?"],"code":"lado = int(input(\"Ingrese el valor del lado: \"))   # entrada\narea = lado * lado                                 # proceso\nprint(\"El área del cuadrado es:\", area)            # salida","ojo":"Error típico: calcular el resultado y olvidar el `print`. El programa corre sin errores, pero no muestra nada. El profesor lo dice así: no mostrar la solución carece de sentido lógico.","entrada":"5","id":"f-1-0","salida":"Ingrese el valor del lado: 5\nEl área del cuadrado es: 25"},{"t":"aprende","titulo":"Las partes del computador","texto":["**CPU** (unidad central de procesamiento): el «cerebro» del computador. Ejecuta las operaciones numéricas y lógicas.","**Memoria principal (RAM)**: guarda los programas que están funcionando y sus datos. Es volátil: se borra al apagar el equipo. Tus variables viven aquí; por eso en clase se dijo «siempre se trabaja en memoria principal».","**Almacenamiento** (disco duro, USB, discos ópticos): guarda los archivos de forma permanente, como tu archivo `.py`. No se borra al apagar.","**Periféricos**: los de entrada introducen datos (teclado, ratón, escáner); los de salida muestran la información procesada (monitor, impresora)."],"ojo":"En tus apuntes las memorias portátiles (USB) aparecen como dispositivos de salida. En realidad son almacenamiento: sirven para guardar datos y también para leerlos.","id":"f-1-1"},{"t":"aprende","titulo":"Datos, información y bits","texto":["**Datos**: símbolos (números, letras, bits) que por sí solos no tienen sentido. **Información**: el resultado de procesar e interpretar los datos. Datos + interpretación = información.","Ejemplo: 3, 4 y 5 son datos. «El triángulo de lados 3, 4 y 5 tiene área 6» es información.","**Bit**: un 0 o un 1. El transistor funciona como un interruptor de dos estados: 1 encendido y 0 apagado. Un microchip reúne muchísimos transistores (hoy, miles de millones).","El hardware no sabe qué es un video, un texto o un número: solo procesa secuencias de bits. Los programas son los que convierten datos en información."],"ojo":"Mostrar solo `print(area)` entrega un dato suelto. `print(\"El área del cuadrado es:\", area)` entrega información: el dato con su interpretación.","id":"f-1-2"},{"t":"aprende","titulo":"Programar: instrucciones exactas","texto":["**Programación**: el proceso de escribir código para resolver un problema. **Código**: secuencia ordenada de instrucciones escritas por el programador. **Lenguaje de programación**: el idioma con el que se le dan instrucciones al computador; el del curso es Python 3.","Entre personas usamos lenguaje natural, a veces difuso o incompleto, y el otro llena los huecos con su experiencia. El computador no tiene experiencia ni adivina intenciones: hay que indicarle cada paso, por obvio que parezca.","**Abstracción**: Python te deja programar sin ocuparte de los detalles del hardware, como mover bits o administrar la memoria. El sistema operativo y el lenguaje se encargan de eso."],"code":"lado = 4\nprint(\"lado * lado\")\nprint(lado * lado)","ojo":"El computador hace lo que escribiste, no lo que quisiste decir. Entre comillas, `lado * lado` es solo texto.","id":"f-1-3","salida":"lado * lado\n16"},{"t":"elige","q":"En el programa del área del cuadrado, ¿a qué parte del esquema pertenece `area = lado * lado`?","ops":["Al proceso","A la entrada","A la salida"],"ok":0,"exp":"Es el cálculo que se hace con los datos. La entrada es el `input` y la salida es el `print`.","id":"f-1-4"},{"t":"elige","q":"¿Cuál de estos es un dispositivo de entrada?","ops":["El teclado","El monitor","La impresora","La CPU"],"ok":0,"exp":"El teclado introduce datos. El monitor y la impresora son de salida, y la CPU procesa.","id":"f-1-5"},{"t":"elige","q":"¿Qué parte del computador ejecuta las operaciones numéricas y lógicas?","ops":["La CPU","La memoria RAM","El disco duro"],"ok":0,"exp":"La CPU es el «cerebro». La RAM guarda temporalmente los datos y el disco los guarda de forma permanente.","id":"f-1-6"},{"t":"elige","q":"Se va la luz mientras corre tu programa. ¿Qué se pierde?","ops":["Los valores de las variables, que estaban en la RAM","El archivo .py que ya estaba guardado en el disco","Nada: la RAM conserva los datos al apagar"],"ok":0,"exp":"La RAM es volátil. El archivo guardado está en el almacenamiento, que es permanente.","id":"f-1-7"},{"t":"elige","q":"¿Cuál de estas opciones es información y no solo un dato?","ops":["«El área del cuadrado de lado 5 es 25»","25","01011001"],"ok":0,"exp":"Un número solo, o una secuencia de bits, no dice nada. La frase interpreta el dato: qué es y de dónde sale.","id":"f-1-8"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"lado = 3\nprint(\"lado\")\nprint(lado)\nprint(\"lado =\", lado)","ops":["3\n3\nlado = 3","lado\nlado\nlado = lado","lado\n3\nlado = lado"],"exp":"Con comillas se muestra el texto tal cual: la palabra «lado». Sin comillas se muestra el valor de la variable: 3.","id":"f-1-9","correcta":"lado\n3\nlado = 3"},{"t":"completa","q":"Completa la salida para que el programa muestre el resultado.","code":"lado = 6\narea = lado * lado\n___(\"El área es:\", area)","ops":["print","input","area"],"ok":0,"exp":"`print` muestra los valores en la pantalla. `input` sirve para pedir datos, no para mostrar resultados.","id":"f-1-10","salida":"El área es: 36"},{"t":"elige","q":"¿Por qué al computador hay que indicarle cada paso, aunque sea obvio?","ops":["No tiene experiencia ni sentido común: hace exactamente lo que se le indica","Porque solo entiende inglés","Porque es más lento que una persona"],"ok":0,"exp":"Una persona llena los huecos de una instrucción incompleta. El computador necesita instrucciones rigurosas y completas.","id":"f-1-11"},{"t":"elige","q":"¿Qué es la abstracción en programación?","ops":["Programar sin ocuparte de los detalles del hardware, como mover bits o administrar la memoria","Escribir el programa sin comentarios","Resolver el problema de memoria, sin escribir código"],"ok":0,"exp":"Gracias a la abstracción escribes `area = lado * lado` y no tienes que decidir en qué dirección de memoria se guarda.","id":"f-1-12"},{"t":"ordena","ref":"fu_rectangulo","id":"f-1-13"}]},{"id":"f-2","titulo":"Variables, tipos y nombres","items":[{"t":"aprende","titulo":"Variables y asignación","texto":["Una variable es una cajita con nombre en la memoria principal. Guarda un dato, y su tipo indica qué clase de dato es.","Se crea con la sentencia de asignación: `identificador = expresión`. Python calcula primero la expresión de la derecha y después guarda el resultado en la variable de la izquierda.","Por eso `x = x + 1` tiene sentido: toma el valor actual de x, le suma 1 y lo guarda otra vez en x. El valor anterior se pierde. Si después cambias x, y no cambia: y guardó un número, no la fórmula.","`=` no es la igualdad de matemáticas, significa «guarda en». A la izquierda solo va un nombre: `5 = x` da SyntaxError."],"code":"x = 5\nx = x + 1\ny = x * 2\nprint(x, y)\nx = 100\nprint(x, y)","ojo":"En tus apuntes dice que los identificadores «no pueden repetirse». Sí puedes volver a asignar un nombre: el valor nuevo reemplaza al anterior. Lo que no puedes es guardar dos datos distintos a la vez con el mismo nombre.","id":"f-2-0","salida":"6 12\n100 12"},{"t":"aprende","titulo":"Tipos de datos","texto":["`int`: enteros (`7`, `-3`, `0`). `float`: punto flotante, con decimales (`2.5`, `3.0`). `bool`: lógico, solo `True` o `False`. `str`: cadena alfanumérica, entre comillas dobles o simples.","`type(x)` dice de qué tipo es un valor. `7` y `\"7\"` no son lo mismo: el primero es un número y el segundo un texto.","Para convertir: `int()` a entero, `float()` a decimal, `str()` a texto. `input()` siempre devuelve `str`, por eso se convierte lo que escribe el usuario.","`int(3.9)` no redondea: corta los decimales y da 3. `int(\"3.5\")` da ValueError, porque ese texto no es un entero. Si el dato puede tener decimales, usa `float()`."],"code":"print(type(7), type(2.5))\nprint(type(True), type(\"7\"))\nprint(float(\"3.5\"), int(3.9), str(25) + \"1\")\nprint(int(\"3.5\"))","ojo":"En tus apuntes aparece un tipo «carácter». En Python no existe aparte: una letra es un `str` de largo 1. Y el tipo lógico se llama `bool`.","id":"f-2-1","salida":"<class 'int'> <class 'float'>\n<class 'bool'> <class 'str'>\n3.5 3 251\nTraceback (most recent call last):\n  File \"programa.py\", line 4, in <module>\n    print(int(\"3.5\"))\n          ~~~^^^^^^^\nValueError: invalid literal for int() with base 10: '3.5'"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"x = 4\nx = x + 3    # ahora x vale 7\n# x = 0\nx = x * 2\nprint(x)","ops":["0","7","8"],"exp":"Primero se calcula la derecha con el valor actual: 4 + 3 = 7 y luego 7 · 2 = 14. La línea `# x = 0` es un comentario: Python la ignora.","id":"f-2-2","correcta":"14"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"a = 5\nb = a\na = 8\nprint(a, b)","ops":["8 8","5 5","5 8"],"exp":"`b = a` guarda en b el valor que a tenía en ese momento (5). Cambiar a después no cambia b.","id":"f-2-3","correcta":"8 5"},{"t":"elige","q":"Quieres guardar si un número es primo o no. ¿Qué tipo de dato usas?","ops":["`bool`","`int`","`float`","`str`"],"ok":0,"exp":"Un dato que solo puede ser verdadero o falso es lógico: `True` o `False`. En tus apuntes se usa así la variable `testigo`.","id":"f-2-4"},{"t":"completa","q":"Completa la conversión para que el programa sume con decimales.","code":"texto = \"2.5\"\nnumero = ___(texto) + 1\nprint(numero)","ops":["float","int","str"],"ok":0,"exp":"`float(\"2.5\")` da 2.5 y la suma da 3.5. `int(\"2.5\")` da ValueError, y con `str` queda un texto que no se puede sumar con 1.","id":"f-2-5","salida":"3.5"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"print(int(7.9), float(7), str(7) + str(7))","ops":["8 7.0 14","7.9 7 77","8 7 77"],"exp":"`int(7.9)` corta los decimales: 7. `float(7)` es 7.0. `str(7) + str(7)` pega dos textos: 77.","id":"f-2-6","correcta":"7 7.0 77"},{"t":"aprende","titulo":"Reglas para los nombres","texto":["Un identificador (el nombre de una variable) solo lleva letras del alfabeto inglés, números y guion bajo `_`. Sin tildes, sin ñ, sin espacios y sin guiones.","No puede empezar con un número ni ser una palabra reservada: `if`, `elif`, `else`, `for`, `while`, `break`, `def`, `return`, `and`, `or`, `not`, `in`, `True`, `False`, `None`, `import`… Y distingue mayúsculas: `A` y `a` son variables distintas.","Ejemplos de tus apuntes: `Casa1` es válido. `1Casa` no (empieza con número), `Casa 1` no (tiene un espacio) y `Casa-1` tampoco: el guion es la resta, y Python lee `Casa - 1`. Lo correcto es `Casa_1`.","Usa nombres nemotécnicos, que digan qué guardan: `area`, `lado`, `copia_numero`."],"ojo":"En tus apuntes `Casa-1` está marcado como válido dos veces. No lo es: con guion bajo sí, `Casa_1`.","id":"f-2-7"},{"t":"aprende","titulo":"Estilos de nombres y comentarios","texto":["**snake_case**: todo en minúscula y las palabras separadas con `_`: `nombre_inicial`. Es el estilo que usa el curso para las variables.","**camelCase**: la primera palabra en minúscula y cada palabra siguiente con mayúscula inicial: `nombreInicial`. **PascalCase**: todas con mayúscula inicial: `NombreInicial`.","Comentario: todo lo que va después de `#` hasta el final de la línea. Python lo ignora; sirve para explicar el programa a quien lo lee.","`print`, `input`, `int` y `type` no son palabras reservadas: son funciones. Python te deja usar esos nombres para una variable, pero desde ese momento pierdes la función."],"code":"# area del cuadrado\nlado_cuadrado = 5    # snake_case\nladoCuadrado = 6     # camelCase: es OTRA variable\n# lado_cuadrado = 0\nprint(lado_cuadrado, ladoCuadrado)","ojo":"Una nota de tus apuntes dice que en camelCase «se pone primero mayúscula»: eso es PascalCase. La definición de tu sección «Búsquedas» es la correcta: la primera letra va en minúscula.","id":"f-2-8","salida":"5 6"},{"t":"elige","q":"¿Cuál de estos nombres es válido en Python?","ops":["`Casa_1`","`Casa-1`","`1Casa`","`Casa 1`"],"ok":0,"exp":"Solo letras, números y `_`, sin empezar con número. `Casa-1` se lee como una resta y `Casa 1` como dos nombres seguidos.","id":"f-2-9"},{"t":"elige","q":"¿Cuál está escrito en camelCase?","ops":["`nombreInicial`","`NombreInicial`","`nombre_inicial`","`Nombre_Inicial`"],"ok":0,"exp":"camelCase: la primera palabra en minúscula y las siguientes con mayúscula inicial. `NombreInicial` es PascalCase y `nombre_inicial` es snake_case.","id":"f-2-10"},{"t":"elige","q":"¿Cuál de estas palabras no puedes usar como nombre de variable?","ops":["`while`","`print`","`suma`","`area_total`"],"ok":0,"exp":"`while` es palabra reservada: da SyntaxError. `print` no es reservada: Python te deja usarla como variable, pero pierdes la función print para el resto del programa.","id":"f-2-11"},{"t":"error","ref":"fu_guion","id":"f-2-12"},{"t":"error","ref":"fu_print_asigna","id":"f-2-13"}]},{"id":"f-3","titulo":"Operadores, expresiones y salida","items":[{"t":"aprende","titulo":"Operadores aritméticos y jerarquía","texto":["`+` suma, `-` resta, `*` multiplica, `/` divide y siempre da float (`7 / 2` es 3.5), `//` es la división entera (`7 // 2` es 3), `%` es el resto o módulo (`7 % 2` es 1) y `**` es la potencia (`2 ** 3` es 8).","Jerarquía, de mayor a menor prioridad: `( )`, luego `**`, luego `*`, `/`, `//` y `%`, y al final `+` y `-`. Entre operadores de la misma prioridad se calcula de izquierda a derecha.","Las raíces se escriben como potencia con exponente fraccionario, entre paréntesis: √x es `x ** (1/2)` y ∜x es `x ** (1/4)`. Sin paréntesis, `x ** 1/2` calcula x¹ y después divide entre 2."],"code":"print(7 / 2, 7 // 2, 7 % 2, 2 ** 3)\nprint(2 + 3 * 4, (2 + 3) * 4)\nprint(16 ** (1/2), 16 ** 1/2)","ojo":"En tus apuntes la fórmula de Herón dice `s = a+b+c/2`. Así Python divide solo c entre 2. Va con paréntesis: `s = (a + b + c) / 2`.","id":"f-3-0","salida":"3.5 3 1 8\n14 20\n4.0 8.0"},{"t":"aprende","titulo":"Comparar y unir condiciones","texto":["Operadores de relación: `<`, `>`, `<=`, `>=`, `==` (igual) y `!=` (diferente). Toda comparación da `True` o `False`.","Operadores lógicos: `and` es True solo si las dos partes son True; `or` es True si al menos una es True; `not` invierte el valor.","Tablas de verdad de tus apuntes. `and`: T y T da T; T y F, F y T, F y F dan F. `or`: solo F y F da F; las demás dan T.","Comparación encadenada: `0 < p < 1` es lo mismo que `0 < p and p < 1`. Así se valida un rango, como la precisión del parcial."],"code":"p = 0.5\nprint(p != 0, 3 >= 5)\nprint(True and False, True or False, not True)\nprint(0 < p < 1, 0 < 1.5 < 1)","ojo":"`if x > 0 and < 10:` da SyntaxError: cada lado del `and` debe ser una comparación completa. Escribe `x > 0 and x < 10` o `0 < x < 10`.","id":"f-3-1","salida":"True False\nFalse True False\nTrue False"},{"t":"aprende","titulo":"Asignación compuesta","texto":["`x += 3` es lo mismo que `x = x + 3`: se opera con el valor actual y el resultado se guarda en la misma variable.","Existen `+=`, `-=`, `*=`, `/=`, `//=` y `%=`. Según tus apuntes, `+=` es «el más usado por ahora»: en contadores (`contador += 1`) y acumuladores (`suma += x`)."],"code":"x = 10\nx += 5\nprint(x)\nx //= 4\nprint(x)\nx *= 3\nx %= 5\nprint(x)","ojo":"`x =+ 1` no es lo mismo que `x += 1`: Python lo lee como `x = +1` y guarda 1. El signo `=` va al final.","id":"f-3-2","salida":"15\n3\n4"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"print(2 + 3 * 4 ** 2)","ops":["80","146","400"],"exp":"Primero `**`: 4² = 16. Luego `*`: 3 · 16 = 48. Al final `+`: 2 + 48 = 50.","id":"f-3-3","correcta":"50"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"print(17 // 5, 17 % 5, 17 / 5)","ops":["3.4 2 3.4","3 2 3","2 3 3.4"],"exp":"17 entre 5 da cociente 3 y resto 2. `/` es la división normal y da 3.4.","id":"f-3-4","correcta":"3 2 3.4"},{"t":"completa","q":"Completa para calcular la raíz cuadrada de 49.","code":"x = 49\nraiz = x ** ___\nprint(raiz)","ops":["(1/2)","1/2","2"],"ok":0,"exp":"`49 ** (1/2)` da 7.0. Sin paréntesis, `49 ** 1/2` es 49 / 2 = 24.5, y `** 2` eleva al cuadrado.","id":"f-3-5","salida":"7.0"},{"t":"elige","q":"Si `a = True` y `b = False`, ¿cuál de estas expresiones da True?","ops":["`a or b`","`a and b`","`not a`","`not (a or b)`"],"ok":0,"exp":"`or` necesita que al menos una sea True. `and` necesita las dos. `not a` es False, y `not (a or b)` es `not True`, que también es False.","id":"f-3-6"},{"t":"completa","q":"Completa la validación: la precisión debe estar entre 0 y 1.","code":"precision = 0.001\nif 0 < precision ___ 1:\n    print(\"válida\")\nelse:\n    print(\"inválida\")","ops":["<",">","=="],"ok":0,"exp":"`0 < precision < 1` pregunta las dos cosas a la vez: mayor que 0 y menor que 1.","id":"f-3-7","salida":"válida"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"c = 0\nc += 1\nc += 1\nc *= 5\nc -= 3\nprint(c)","ops":["-3","10","2"],"exp":"c pasa por 1, 2, 10 y 7. Cada operador compuesto trabaja con el valor que la variable tiene en ese momento.","id":"f-3-8","correcta":"7"},{"t":"error","ref":"fu_heron","id":"f-3-9"},{"t":"aprende","titulo":"Mostrar resultados: print, f-strings y round","texto":["`print` recibe varios valores separados por coma y los muestra separados por un espacio: `print(\"El área es:\", area)`. Así mezclas texto y números sin convertir.","f-string: una `f` antes de las comillas y las variables entre llaves: `f\"El área es {area}\"`. Sin la `f`, las llaves se muestran tal cual.","Formato dentro de las llaves: `{x:.2f}` muestra 2 decimales; `{t:02d}` muestra un entero con 2 cifras, rellenando con 0 a la izquierda (07).","`round(x, 2)` redondea el número a 2 decimales y sigue siendo un número. `round(x)` lo redondea a entero."],"code":"area = 6.28318\nt = 7\nprint(\"Área:\", area)\nprint(f\"Área: {area:.2f} m2\")\nprint(f\"Segundo {t:02d}\")\nprint(round(area, 2), round(area))","ojo":"En tus apuntes aparece `{Volumen:2F}`. Sin el punto significa «ancho 2» con 6 decimales: 12.500000. Para dos decimales es `{volumen:.2f}`.","id":"f-3-10","salida":"Área: 6.28318\nÁrea: 6.28 m2\nSegundo 07\n6.28 6"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"area = 12.5\nprint(f\"Área: {area:.2f}\")\nprint(\"Área: {area}\")","ops":["Área: 12.5\nÁrea: 12.5","Área: 12.50\nÁrea: 12.50","Área: 12.5\nÁrea: {area}"],"exp":"Con `:.2f` se muestran exactamente 2 decimales: 12.50. La segunda línea no tiene la `f`, así que `{area}` sale como texto.","id":"f-3-11","correcta":"Área: 12.50\nÁrea: {area}"},{"t":"completa","q":"Completa para mostrar el volumen con dos decimales.","code":"volumen = 12.5\nprint(f\"Volumen = {volumen:___} L\")","ops":[".2f","2f","2d"],"ok":0,"exp":"`.2f` da 12.50. `2f`, sin el punto, da 12.500000 (seis decimales). `2d` es para enteros y con un float da ValueError.","id":"f-3-12","salida":"Volumen = 12.50 L"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"print(round(2.71828, 3), round(9.6))","ops":["2.71 9","2.718 9.6","2.719 10"],"exp":"`round(2.71828, 3)` deja 3 decimales: 2.718 (el 2 que sigue no sube el 8). `round(9.6)` redondea al entero más cercano: 10.","id":"f-3-13","correcta":"2.718 10"}]},{"id":"f-4","titulo":"Del problema al algoritmo","items":[{"t":"aprende","titulo":"Las fases para resolver un problema","texto":["1. **Definición del problema**: delimitar la situación. Regla de oro: no confundir un problema con varios problemas conectados; si los hay, resuelve cada uno y verifica que las soluciones encajen.","2. **Análisis**: evitar suposiciones u omisiones. Identifica los **datos** (qué entra, sus características y limitaciones), el **método de solución** (fórmulas o procesos), las **condiciones de solución** (restricciones o reglas) y los **resultados** (qué se quiere obtener).","3. **Diseño del algoritmo**: los pasos en orden. 4. **Codificación**: traducirlo a Python, con mensajes claros para que el usuario no se equivoque. 5. **Ejecución y validación**: probar con datos cuya respuesta ya conoces, en todos los escenarios posibles.","Después viene el **mantenimiento**: revisar el programa para cubrir casos nuevos o adaptarlo a cambios."],"ojo":"Error común en un quiz: saltarse el análisis y empezar a escribir código. Después falta una validación o se usa un dato que el enunciado no da.","id":"f-4-0"},{"t":"aprende","titulo":"Algoritmo y sus representaciones","texto":["Algoritmo: conjunto de instrucciones bien definidas, ordenadas y finitas para resolver un problema paso a paso. Debe ser **preciso** (sin ambigüedades, en un orden claro), **definido** (con los mismos datos da siempre el mismo resultado) y **finito** (termina).","Flujo: estado inicial + entrada → pasos secuenciales → estado final (salida).","Antes de programar, el algoritmo se plantea en **lenguaje natural** (frases), en **pseudocódigo** (pasos con forma de programa, sin la sintaxis exacta de un lenguaje) o con un **diagrama de flujo** (un dibujo).","Área del cuadrado en pseudocódigo: Inicio. Leer lado. area ← lado · lado. Mostrar area. Fin."],"ojo":"Un algoritmo que no termina (por ejemplo, un ciclo sin fin) no es finito, así que no es un algoritmo.","id":"f-4-1"},{"t":"aprende","titulo":"Diagrama de flujo y prueba de escritorio","texto":["Símbolos básicos: **óvalo**, inicio y fin; **paralelogramo**, entrada o salida de datos; **rectángulo**, proceso (un cálculo o una asignación); **rombo**, decisión: una pregunta con dos salidas, True y False. Las flechas marcan el orden.","El rombo es lo que en Python se escribe con `if` y `else`: si la condición es True se sigue por un camino; si es False, por el otro.","**Prueba de escritorio** (traza): seguir el algoritmo a mano con datos concretos y anotar en una tabla cómo cambia cada variable. Así encuentras errores antes de usar el computador.","Traza del número perfecto de clase, con 6: el contador toma 1, 2, 3, 4 y 5. Los que dividen a 6 se acumulan: 1, luego 3, luego 6. El acumulado es igual al número, así que 6 es perfecto."],"ojo":"En un diagrama, el rombo tiene dos salidas y las dos deben llegar a algún lado. Si una rama queda suelta, el algoritmo no dice qué hacer en ese caso.","id":"f-4-2"},{"t":"elige","q":"¿Qué fase va justo después del análisis del problema?","ops":["El diseño del algoritmo","La codificación","La ejecución y validación","La definición del problema"],"ok":0,"exp":"Orden: definición, análisis, diseño del algoritmo, codificación, ejecución y validación. Después, el mantenimiento.","id":"f-4-3"},{"t":"elige","q":"Problema 11 del problemario: «Dadas tres longitudes, indique si pueden formar triángulo y calcule su área». En el análisis, ¿cuál es la condición de solución?","ops":["Que cada lado sea menor que la suma de los otros dos","Las tres longitudes a, b y c","La fórmula de Herón","El área del triángulo"],"ok":0,"exp":"Datos: a, b y c. Método: la fórmula de Herón. Condición: a + b > c, a + c > b y b + c > a. Resultado: el área o un mensaje si no hay triángulo.","id":"f-4-4"},{"t":"elige","q":"¿Qué símbolo del diagrama de flujo representa una decisión?","ops":["El rombo","El rectángulo","El paralelogramo","El óvalo"],"ok":0,"exp":"Rombo: decisión. Rectángulo: proceso. Paralelogramo: entrada o salida. Óvalo: inicio y fin.","id":"f-4-5"},{"t":"elige","q":"¿Cuál de estas opciones está escrita en pseudocódigo?","ops":["Inicio. Leer lado. area ← lado · lado. Mostrar area. Fin.","`area = lado * lado`","Un dibujo con un óvalo, un paralelogramo y un rectángulo","«Multiplica el lado por sí mismo y di cuánto da»"],"ok":0,"exp":"El pseudocódigo tiene forma de programa, sin la sintaxis exacta de un lenguaje. La segunda opción es Python, la tercera un diagrama de flujo y la cuarta lenguaje natural.","id":"f-4-6"},{"t":"elige","q":"Un algoritmo que nunca termina, ¿qué característica no cumple?","ops":["Finito","Preciso","Definido"],"ok":0,"exp":"Finito quiere decir que termina después de un número limitado de pasos.","id":"f-4-7"},{"t":"salida","q":"Haz la prueba de escritorio. ¿Qué aparece en la pantalla?","code":"a = 5\nb = 9\na = a + b\nb = a - b\na = a - b\nprint(a, b)","ops":["5 9","14 5","9 9"],"exp":"Traza: a = 5 y b = 9. Luego a = 14. Luego b = 14 − 9 = 5. Al final a = 14 − 5 = 9. Los valores quedaron intercambiados.","id":"f-4-8","correcta":"9 5"},{"t":"completa","q":"Validación con un dato conocido: un cuadrado de lado 3 tiene área 9. Completa para que la prueba dé True.","code":"lado = 3\narea = lado ___ 2\nprint(area == 9)","ops":["**","*","+"],"ok":0,"exp":"`lado ** 2` es 9. Probar con datos cuya respuesta ya conoces es la fase de ejecución y validación: si sale False, hay un error.","id":"f-4-9","salida":"True"},{"t":"aprende","titulo":"Diseño: top-down, bottom-up y KISS","texto":["**Top-down** (de arriba hacia abajo), el recomendado: descompone el problema en subproblemas más sencillos. Simplifica las tareas, permite programar cada parte por separado y deja el código ordenado en bloques.","**Bottom-up** (de abajo hacia arriba), a evitar: programar cada proceso a medida que aparece, sin planificar. Cuesta integrar las partes y se duplica el esfuerzo.","**Principio KISS** («Keep It Simple, Stupid»: hazlo simple): resuelve con las herramientas más básicas posibles. La solución debe ser tan clara que la entienda alguien con menos conocimiento.","Top-down con el ejemplo de clase «mayor, medio y menor de tres valores»: 1) hallar el mayor; 2) hallar el menor; 3) con esos dos, hallar el del medio; 4) mostrar los tres."],"ojo":"Bottom-up suele terminar con variables repetidas y partes que no encajan. Planifica los pasos antes de escribir la primera línea.","id":"f-4-10"},{"t":"elige","q":"Para el número perfecto planeas: 1) sumar los divisores del número, 2) comparar la suma con el número, 3) mostrar el mensaje. ¿Qué enfoque de diseño es?","ops":["Top-down: dividir el problema en partes más sencillas","Bottom-up: programar cada parte a medida que aparece","Prueba de escritorio"],"ok":0,"exp":"Partiste del problema completo y lo dividiste en subproblemas antes de programar.","id":"f-4-11"},{"t":"elige","q":"¿Qué dice el principio KISS?","ops":["Resolver con las herramientas más simples, de forma que cualquiera lo entienda","Usar siempre la herramienta más avanzada del lenguaje","Escribir todo el programa en la menor cantidad de líneas"],"ok":0,"exp":"Una solución simple es más fácil de revisar y de corregir. Menos líneas no siempre es más simple.","id":"f-4-12"},{"t":"ordena","ref":"fu_triangulo","id":"f-4-13"}]},{"id":"f-5","titulo":"Cómo Python ejecuta tu código","items":[{"t":"aprende","titulo":"La anatomía de un lenguaje","texto":["Todo lenguaje, natural o de programación, tiene 4 elementos. **Alfabeto**: los símbolos permitidos. **Léxico**: el vocabulario, palabras con significado conocido (`print`, `while`, `+`). **Sintaxis**: las reglas gramaticales que dicen si una frase está bien escrita. **Semántica**: las reglas que dicen si una frase tiene sentido.","`print(\"hola\"` rompe la sintaxis: falta cerrar el paréntesis. `x = 10 / 0` está bien escrita, pero no tiene sentido: rompe la semántica.","**Código fuente**: el programa que escribes, en texto puro y legible por humanos. Se lee de arriba hacia abajo y de izquierda a derecha.","**Lenguaje de máquina**: unos y ceros, el único que entiende el procesador. Por eso el código fuente necesita traducción."],"ojo":"El código fuente es texto puro: escríbelo en VS Code o Programiz, no en Word. Word cambia las comillas por comillas curvas (“ ”) y Python no las reconoce.","id":"f-5-0"},{"t":"aprende","titulo":"Compilador e intérprete","texto":["Un **compilador** traduce todo el programa de una vez a código objeto; el **enlazado** (linking) lo une con otras bibliotecas y genera el ejecutable en lenguaje de máquina. Así trabajan lenguajes como C.","Python es **interpretado**: primero revisa que todo el archivo esté bien escrito y después ejecuta las instrucciones una por una, de arriba hacia abajo.","Si hay un error de sintaxis en cualquier parte, no corre ninguna línea. Si todo está bien escrito, ejecuta línea por línea y se detiene en el primer error de ejecución: lo que estaba antes ya se ejecutó."],"code":"print(\"Inicio\")\nx = 10\nprint(x / 2)\nprint(x / 0)\nprint(\"Fin\")","ojo":"En tus apuntes dice que los errores se notifican «de forma secuencial». Python muestra uno solo, el primero que encuentra, y se detiene. Corrige ese y vuelve a ejecutar.","id":"f-5-1","salida":"Inicio\n5.0\nTraceback (most recent call last):\n  File \"programa.py\", line 4, in <module>\n    print(x / 0)\n          ~~^~~\nZeroDivisionError: division by zero"},{"t":"aprende","titulo":"Los 3 tipos de errores","texto":["**Sintaxis**: violan la gramática del lenguaje (faltan los dos puntos, comillas sin cerrar, `y` en vez de `and`). Python da `SyntaxError` o `IndentationError` antes de ejecutar nada.","**Ejecución**: el programa está bien escrito pero falla mientras corre: dividir entre cero (`ZeroDivisionError`), `int(\"abc\")` (`ValueError`), usar un nombre que no existe (`NameError`), mezclar texto y número (`TypeError`).","**Lógica**: el programa corre sin ningún mensaje, pero el resultado está mal. Son los más difíciles: solo se descubren probando con datos cuya respuesta conoces."],"code":"lado = 4\nprint(\"Lado:\", lado)\nprint(\"Área:\", Lado * lado)","ojo":"En tus apuntes dice que usar «variables no declaradas» es un error de sintaxis. En Python es de ejecución (`NameError`): la línea está bien escrita, y el programa alcanza a mostrar lo anterior antes de detenerse.","id":"f-5-2","salida":"Lado: 4\nTraceback (most recent call last):\n  File \"programa.py\", line 3, in <module>\n    print(\"Área:\", Lado * lado)\n                   ^^^^\nNameError: name 'Lado' is not defined. Did you mean: 'lado'?"},{"t":"elige","q":"`print(\"hola\"` no cierra el paréntesis. ¿Qué regla del lenguaje rompe?","ops":["La sintaxis: la gramática del lenguaje","La semántica: el sentido de la frase","El alfabeto: los símbolos permitidos"],"ok":0,"exp":"Está mal escrita. Un ejemplo de semántica sería `x = 10 / 0`: bien escrita, pero sin sentido.","id":"f-5-3"},{"t":"elige","q":"En un programa bien escrito, la línea 5 divide entre cero. ¿Qué pasa al ejecutarlo?","ops":["Se ejecutan las líneas 1 a 4 y el programa se detiene en la 5","No se ejecuta ninguna línea","Python salta la línea 5 y sigue con la 6","Python muestra todos los errores del programa juntos"],"ok":0,"exp":"Python es interpretado: ejecuta línea por línea y se detiene en el primer error de ejecución.","id":"f-5-4"},{"t":"elige","q":"En tus apuntes se crea `suma1` y después se escribe `Suma1 += contador`. Python dice `NameError: name 'Suma1' is not defined`. ¿Qué tipo de error es?","ops":["De ejecución","De sintaxis","De lógica"],"ok":0,"exp":"La línea está bien escrita; falla al ejecutarse porque `Suma1` no existe. Las líneas anteriores sí corrieron.","id":"f-5-5"},{"t":"elige","q":"Este programa corre sin mensajes y muestra 11.0. ¿Qué tipo de error tiene?","ops":["De lógica: corre, pero el resultado está mal","De sintaxis","De ejecución","Ninguno: 11.0 es correcto"],"ok":0,"exp":"El promedio de 8 y 6 es 7. Faltan paréntesis: `(nota1 + nota2) / 2`. Solo lo descubres comparando con una respuesta que conoces.","code":"nota1 = 8\nnota2 = 6\npromedio = nota1 + nota2 / 2\nprint(promedio)","id":"f-5-6"},{"t":"error","ref":"fu_comilla","id":"f-5-7"},{"t":"error","ref":"fu_int_decimal","id":"f-5-8"},{"t":"aprende","titulo":"Funciones integradas y bibliotecas","texto":["Las funciones integradas (built-in) están siempre disponibles, sin `import`: `print`, `input`, `int`, `float`, `str`, `type`, `abs`, `round`, `len`, `max`, `min`, `sum`, `pow`, `divmod`, `range`…","Se llaman con el nombre y los argumentos entre paréntesis, y devuelven un valor: `abs(-7)` da 7; `max(3, 9, 4)` da 9; `pow(2, 5)` da 32; `divmod(17, 5)` da `(3, 2)`, el cociente y el resto juntos; `len(\"hola\")` da 4; `sum([1, 2, 3])` suma una lista.","Otras funciones viven en bibliotecas (módulos) y hay que importarlas primero: `import math` y después `math.sqrt(25)` o `math.pi`. El `import` va al inicio del archivo."],"code":"import math\nprint(abs(-7), max(3, 9, 4), min(3, 9, 4))\nprint(pow(2, 5), divmod(17, 5), len(\"hola\"))\nprint(sum([1, 2, 3]), round(math.pi, 4), math.sqrt(25))","ojo":"Si usas `math.sqrt` sin `import math`, Python da `NameError: name 'math' is not defined`. Las integradas no lo necesitan; las de math, sí.","id":"f-5-9","salida":"7 9 3\n32 (3, 2) 4\n6 3.1416 5.0"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"print(abs(-3.5), max(4, 11, 7), pow(3, 2), divmod(20, 6))","ops":["-3.5 11 9 (3, 2)","3.5 11 6 (3, 2)","3.5 11 9 3"],"exp":"`abs` quita el signo: 3.5. `max` da el mayor: 11. `pow(3, 2)` es 3² = 9. `divmod(20, 6)` da el cociente y el resto juntos: (3, 2).","id":"f-5-10","correcta":"3.5 11 9 (3, 2)"},{"t":"elige","q":"¿Cuál de estas funciones necesita `import math` antes de usarla?","ops":["`sqrt`, la raíz cuadrada","`abs`","`round`","`max`"],"ok":0,"exp":"`abs`, `round` y `max` son integradas. `sqrt` vive en math: `math.sqrt(x)`. Sin math también puedes escribir `x ** (1/2)`.","id":"f-5-11"},{"t":"completa","q":"Completa para calcular √81 con la biblioteca math.","code":"import math\nprint(math.___(81))","ops":["sqrt","raiz","pow"],"ok":0,"exp":"`math.sqrt(81)` da 9.0. Los nombres de las funciones están en inglés: no existe `math.raiz`, y `math.pow` necesita dos argumentos.","id":"f-5-12","salida":"9.0"},{"t":"ordena","ref":"fu_circulo","id":"f-5-13"}]}],"retos":[],"n":1},{"id":"u1","n":2,"color":"morado","titulo":"Escribir sin errores","sub":"Reglas de Python, decisiones con if, validar datos y leer los mensajes de error","patrones":["p-decidir","p-validar"],"lecciones":[{"id":"l1-1","titulo":"Reglas de escritura","items":[{"t":"aprende","titulo":"Dos puntos y sangría","texto":["Las líneas que abren un bloque terminan en dos puntos `:`. Son: `if`, `elif`, `else`, `for`, `while` y `def`.","Lo que va adentro del bloque se escribe con 4 espacios de sangría. La sangría es la que le dice a Python qué está dentro y qué está fuera."],"code":"n = 7\nif n > 5:\n    print(\"grande\")\nprint(\"fin\")","ojo":"En tu cuaderno faltan los dos puntos varias veces. En papel se perdona; en la computadora el programa no corre.","id":"l1-1-0","salida":"grande\nfin"},{"t":"aprende","titulo":"Decimales y nombres","texto":["Los decimales se escriben con punto: `0.0001`. Con coma, Python lo lee como dos cosas separadas y da error.","Diez mil se escribe `10000`. `10.000` es el decimal 10.0.","Python distingue mayúsculas y tildes: `numero`, `Numero` y `número` son tres variables distintas. Escribe los nombres en minúscula, sin tildes y con guion bajo: `copia_numero`."],"ojo":"En tus apuntes aparecen `copiaNumero` y `CopiaNumero` en el mismo programa: Python cree que la segunda no existe.","id":"l1-1-1"},{"t":"aprende","titulo":"Comparar, unir condiciones y multiplicar","texto":["Un `=` guarda un valor: `x = 5`. Dos `==` preguntan si son iguales: `if x == 5:`.","Las condiciones se unen con `and`, `or` y `not`, en inglés. `y` no existe en Python.","La multiplicación siempre lleva `*`. En matemáticas escribes x₁(y₂ − y₃); en Python es `x1*(y2 - y3)`."],"id":"l1-1-2"},{"t":"elige","q":"¿Cuál de estas líneas está bien escrita?","ops":["`if suma == numero:`","`if suma == numero`","`if suma = numero:`","`If suma == numero:`"],"ok":0,"exp":"Lleva `==` para comparar, `if` en minúscula y dos puntos al final.","id":"l1-1-3"},{"t":"elige","q":"¿Cómo se escribe 0,0001 en Python?","ops":["`0.0001`","`0,0001`","`10E-4`","`0.0001,`"],"ok":0,"exp":"Con punto decimal. Ojo: `10E-4` vale 0.001, no 0.0001; para 10⁻⁴ se escribe `1e-4`.","id":"l1-1-4"},{"t":"error","ref":"dospuntos","id":"l1-1-5"},{"t":"error","ref":"coma","id":"l1-1-6"},{"t":"elige","q":"¿Cuántas variables distintas hay aquí?","ops":["3","1","2"],"ok":0,"exp":"Para Python son tres nombres diferentes: cambia una mayúscula o una tilde y ya es otra variable.","code":"numero = 5\nNumero = 6\nnúmero = 7","id":"l1-1-7"},{"t":"error","ref":"y_and","id":"l1-1-8"},{"t":"salida","ref":"notacion","id":"l1-1-9","code":"print(10E-4)\nprint(1e-4)","correcta":"0.001\n0.0001","ops":["0.0001\n0.0001","0.001\n0.001","10E-4\n1e-4"],"exp":"`10E-4` es 10 × 10⁻⁴ = 0.001, no 0.0001. Para 10⁻⁴ se escribe `1e-4`; Python lo muestra como 0.0001. En tus apuntes aparece «10E-4» como criterio de 10⁻⁴: con eso la tolerancia queda 10 veces más grande."},{"t":"error","ref":"multiplicar","id":"l1-1-10"}]},{"id":"l1-dec","titulo":"Decisiones: if, elif y else","items":[{"t":"aprende","titulo":"if y else: elegir un camino","texto":["`if` le hace una pregunta al programa. Si la condición es verdadera (True), ejecuta el bloque con sangría; si es falsa (False), lo salta y sigue con lo que viene después.","`else:` es el camino del «de lo contrario». No lleva condición y va alineado con su `if`.","Para preguntar se usan comparadores: `==` (igual), `!=` (diferente), `<`, `>`, `<=` y `>=`.","Es el diagrama de tu clase del 26-5: un rombo con la pregunta; por True entra al bloque, por False lo salta, y los dos caminos se juntan abajo."],"code":"saldo = 12\nif saldo >= 10:\n    print(\"Puedes comprar el café\")\n\nedad = 16\nif edad >= 18:\n    print(\"Eres mayor de edad\")\nelse:\n    print(\"Eres menor de edad\")\nprint(\"Fin\")","ojo":"En tus apuntes, `edad` no se pide. Si la pides con `input()` y no la conviertes con `int()`, `edad >= 18` da TypeError: no se puede comparar texto con número.","id":"l1-dec-0","salida":"Puedes comprar el café\nEres menor de edad\nFin"},{"t":"aprende","titulo":"Cadena if, elif y else","texto":["Cuando hay tres o más caminos, las preguntas se encadenan con `elif` («si no, si»). Python las revisa en orden y se detiene en la primera verdadera: las de abajo ya no se preguntan.","Por eso el orden importa: `nota >= 9` va antes que `nota >= 5`. Al revés, un 10 cumpliría primero `nota >= 5` y nunca llegaría a «Excelente».","El `else` final atrapa todo lo que no cumplió ninguna condición. Es opcional.","Se escribe `elif`, junto y con dos puntos al final. «eilf» y «else if» no existen en Python."],"code":"nota = 7\nif nota >= 9:\n    print(\"Excelente\")\nelif nota >= 5:\n    print(\"Aprobado\")\nelse:\n    print(\"Reprobado\")","ojo":"En tus apuntes (pág. 9) dice `elif nota >= 5` sin los dos puntos: da SyntaxError: expected ':'.","id":"l1-dec-1","salida":"Aprobado"},{"t":"aprende","titulo":"Varios if, elif, o un if dentro de otro","texto":["Varios `if` seguidos son preguntas independientes: Python revisa todas, y cada `else` pertenece solo al `if` que tiene justo arriba.","Con `elif` todo es una sola cadena: apenas una condición se cumple, las demás se saltan. Úsalo cuando los casos se excluyen entre sí.","Un `if` dentro de otro (anidado) solo se revisa si el de afuera fue verdadero. `if edad >= 18:` con `if saldo >= 10:` adentro equivale a `if edad >= 18 and saldo >= 10:`. Con `or` basta que se cumpla una de las dos."],"code":"entrada = 16\nsalida = 16\n# A: dos if separados\nif entrada == salida:\n    print(\"A: nunca cambia\")\nif entrada > salida:\n    print(\"A: se llena\")\nelse:\n    print(\"A: se vacía\")\n# B: una sola cadena con elif\nif entrada == salida:\n    print(\"B: nunca cambia\")\nelif entrada > salida:\n    print(\"B: se llena\")\nelse:\n    print(\"B: se vacía\")","ojo":"Es el error del tanque de tus apuntes (pág. 37): el segundo `if` debía ser `elif`. Con flujos iguales avisaba «nunca se vacía ni se llena» y después entraba al `else`, a un ciclo que no terminaba.","id":"l1-dec-2","salida":"A: nunca cambia\nA: se vacía\nB: nunca cambia"},{"t":"aprende","titulo":"Decidir con el resto: el año bisiesto","texto":["`n % d == 0` pregunta si d divide exacto a n. `n % 2 != 0` pregunta si n es impar.","Regla del bisiesto (problema 13): si el año es fin de siglo (`anio % 100 == 0`), es bisiesto solo si además `anio % 400 == 0`. Si no es fin de siglo, basta con `anio % 4 == 0`.","El orden importa: 1900 es divisible entre 4, pero es fin de siglo y no es divisible entre 400, así que no es bisiesto. Si solo preguntas por 4, te equivocas. Por eso en tu clase primero se separa el fin de siglo.","En clase además se valida antes que el año sea mayor que 1582, cuando empezó el calendario actual: `if anio <= 1582:` da el aviso, y el `else` hace las preguntas del bisiesto."],"code":"anio = 1900\nprint(anio % 4 == 0, anio % 100 == 0, anio % 400 == 0)\nanio = 2000\nprint(anio % 4 == 0, anio % 100 == 0, anio % 400 == 0)","ojo":"En tu cuaderno (pág. 21), `if anno % 4 = 0:` lleva un solo `=` (SyntaxError) y `annon % 100` tiene una n de más (NameError).","id":"l1-dec-3","salida":"True True False\nTrue True True"},{"t":"elige","q":"¿Cuál línea está bien escrita?","ops":["`elif nota >= 5:`","`else if nota >= 5:`","`eilf nota >= 5:`","`elif nota >= 5`"],"ok":0,"exp":"Se escribe `elif`, junto, y termina en dos puntos como todo lo que abre un bloque.","id":"l1-dec-4"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"nota = 10\nif nota >= 5:\n    print(\"Aprobado\")\nelif nota >= 9:\n    print(\"Excelente\")\nelse:\n    print(\"Reprobado\")","ops":["Excelente","Aprobado\nExcelente","Reprobado"],"exp":"10 cumple la primera condición, `nota >= 5`, y la cadena se detiene ahí. «Excelente» nunca se alcanza: la condición más exigente tiene que ir primero.","id":"l1-dec-5","correcta":"Aprobado"},{"t":"error","ref":"de_elif","id":"l1-dec-6"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"nota = 10\nif nota >= 9:\n    print(\"Excelente\")\nif nota >= 5:\n    print(\"Aprobado\")\nelse:\n    print(\"Reprobado\")","ops":["Excelente","Aprobado","Excelente\nReprobado"],"exp":"Son dos `if` separados: Python revisa los dos. El 10 cumple ambos, así que salen dos mensajes. Con `elif` saldría solo «Excelente».","id":"l1-dec-7","correcta":"Excelente\nAprobado"},{"t":"completa","q":"Completa para que diga si el número es impar.","code":"x = 7\nif x % 2 ___ 0:\n    print(\"impar\")\nelse:\n    print(\"par\")","ops":["!=","==","="],"ok":0,"exp":"`!=` significa «diferente de». 7 % 2 es 1, que es diferente de 0: impar. Con `==` diría «par», y con `=` es SyntaxError.","id":"l1-dec-8","salida":"impar"},{"t":"ordena","ref":"de_tanque","id":"l1-dec-9"},{"t":"completa","q":"Completa para que solo pueda comprar si cumple las dos condiciones, como con dos `if` anidados.","code":"edad = 20\nsaldo = 5\nif edad >= 18 ___ saldo >= 10:\n    print(\"Puede comprar\")\nelse:\n    print(\"No puede comprar\")","ops":["and","or","y"],"ok":0,"exp":"Con `and` hacen falta las dos, y el saldo no alcanza. Con `or` bastaría tener 18 años. `y` no existe en Python.","id":"l1-dec-10","salida":"No puede comprar"},{"t":"error","ref":"de_else_if","id":"l1-dec-11"},{"t":"elige","q":"¿Cuál de estos años es bisiesto?","ops":["2000","1900","2100","2023"],"ok":0,"exp":"2000 es fin de siglo y es divisible entre 400. 1900 y 2100 son fin de siglo, pero no son divisibles entre 400. 2023 ni siquiera es divisible entre 4.","id":"l1-dec-12"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"x = 12\nif x % 3 == 0 and x % 2 != 0:\n    print(\"múltiplo de 3 e impar\")\nelif x % 3 == 0:\n    print(\"múltiplo de 3 y par\")\nelse:\n    print(\"no es múltiplo de 3\")","ops":["múltiplo de 3 e impar","no es múltiplo de 3","múltiplo de 3 e impar\nmúltiplo de 3 y par"],"exp":"12 es múltiplo de 3, pero 12 % 2 es 0, así que la primera condición es falsa. La segunda sí se cumple y la cadena termina ahí.","id":"l1-dec-13","correcta":"múltiplo de 3 y par"}]},{"id":"l1-2","titulo":"Pedir datos y validarlos","items":[{"t":"aprende","titulo":"input siempre devuelve texto","texto":["`input()` muestra un mensaje y espera lo que escribe el usuario. Lo que devuelve siempre es texto, aunque el usuario escriba un número.","Para convertirlo: `int()` da un entero y `float()` un decimal.","Con texto, `+` pega en vez de sumar: `\"3\" + \"4\"` da `\"34\"`."],"code":"edad = input(\"Edad: \")\nprint(edad + \"1\")\nprint(int(edad) + 1)","entrada":"20","id":"l1-2-0","salida":"Edad: 20\n201\n21"},{"t":"aprende","titulo":"Validar: lo pide el profesor en todos los problemas","texto":["Validar es comprobar que el dato cumple lo que pide el enunciado y volver a pedirlo si no.","`texto.isdigit()` es True solo si todos los caracteres son dígitos: acepta «25» y «0», rechaza «-5», «2.5» y «abc».","La variable `bandera` mantiene el ciclo: empieza en True y pasa a False cuando el dato es válido."],"code":"bandera = True\nwhile bandera:\n    n = input(\"Ingrese un número natural: \")\n    if n.isdigit():\n        numero = int(n)\n        bandera = False\n    else:\n        print(\"Debe escribir correctamente el número\")\nprint(\"Dato aceptado:\", numero)","ojo":"El problemario lo dice así: «es una pésima práctica dejar en el usuario la responsabilidad de validar».","entrada":"abc\n25","id":"l1-2-1","salida":"Ingrese un número natural: abc\nDebe escribir correctamente el número\nIngrese un número natural: 25\nDato aceptado: 25"},{"t":"elige","q":"El usuario escribe 20 en `edad = input(\"Edad: \")`. ¿Qué hay en `edad`?","ops":["El texto \"20\"","El número 20","Un error"],"ok":0,"exp":"`input()` siempre devuelve texto. Para usarlo como número: `int(input(...))`.","id":"l1-2-2"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"print(\"3\" + \"4\")","ops":["7","\"3\" + \"4\"","Error"],"exp":"Son textos (tienen comillas), y con textos `+` pega.","id":"l1-2-3","correcta":"34"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"print(\"25\".isdigit(), \"-5\".isdigit(), \"2.5\".isdigit())","ops":["True True True","True True False","True False True"],"exp":"El signo menos y el punto no son dígitos. Por eso `isdigit()` sirve para validar naturales.","id":"l1-2-4","correcta":"True False False"},{"t":"completa","q":"Completa la validación para que acepte solo números naturales.","code":"n = \"abc\"\nif n.___():\n    print(\"válido\")\nelse:\n    print(\"inválido\")","ops":["isdigit","isalpha","upper"],"ok":0,"exp":"`isdigit()` revisa que todo sean dígitos. `isalpha()` revisa letras, que es lo contrario de lo que queremos.","id":"l1-2-5","salida":"inválido"},{"t":"ordena","ref":"validar","id":"l1-2-6"},{"t":"error","ref":"valor","id":"l1-2-7"},{"t":"error","ref":"concatenar","id":"l1-2-8"}]},{"id":"l1-val","titulo":"Más formas de validar","items":[{"t":"aprende","titulo":"Cinco métodos para revisar un texto","texto":["`isdecimal()`: solo los dígitos del 0 al 9. `isdigit()`: también superíndices como «²». `isnumeric()`: también fracciones como «½» y números romanos.","`isalpha()`: solo letras; un espacio o un número la hace False. `isalnum()`: letras o números; un espacio, un guion bajo o un signo la hacen False.","Ninguno acepta el signo menos ni el punto: `\"-5\"` y `\"3.14\"` dan False en los cinco. Con el texto vacío `\"\"` también dan False.","Para pedir un natural, el profesor usa `isdigit()`."],"code":"print(\"25\".isdecimal(), \"25\".isdigit(), \"25\".isnumeric())\nprint(\"²\".isdecimal(), \"²\".isdigit(), \"²\".isnumeric())\nprint(\"½\".isdecimal(), \"½\".isdigit(), \"½\".isnumeric())\nprint(\"-5\".isdigit(), \"3.14\".isnumeric(), \"\".isdigit())\nprint(\"Python\".isalpha(), \"Python 3\".isalpha())\nprint(\"User123\".isalnum(), \"User_123\".isalnum())","ojo":"`\"²\".isdigit()` da True, pero `int(\"²\")` da ValueError. Desde el teclado casi nunca pasa; si quieres lo más estricto, usa `isdecimal()`.","id":"l1-val-0","salida":"True True True\nFalse True True\nFalse False True\nFalse False False\nTrue False\nTrue False"},{"t":"aprende","titulo":"Decimales y negativos: try y except","texto":["`isdigit()` rechaza «-2.5», pero una coordenada, una temperatura o el extremo `a` de un intervalo pueden ser negativos o decimales.","`try:` intenta el bloque. Si adentro ocurre un `ValueError`, como en `float(\"abc\")` o `float(\"2,5\")`, Python salta al bloque `except ValueError:` en vez de detener el programa.","Si `float()` funciona, la línea siguiente baja la bandera. Si falla, esa línea no se ejecuta y el `while` vuelve a pedir el dato.","Para enteros que pueden ser negativos, se hace lo mismo con `int(t)`."],"code":"bandera = True\nwhile bandera:\n    t = input(\"Coordenada x: \")\n    try:\n        x = float(t)\n        bandera = False\n    except ValueError:\n        print(\"Escribe un número; los decimales van con punto\")\nprint(\"x =\", x)","ojo":"No escribas `except:` solo: atraparía cualquier error, incluso uno de tipeo tuyo, y no te enterarías. Nombra el error: `except ValueError:`.","entrada":"-2,5\n-2.5","id":"l1-val-1","salida":"Coordenada x: -2,5\nEscribe un número; los decimales van con punto\nCoordenada x: -2.5\nx = -2.5"},{"t":"aprende","titulo":"Validar un rango y un binario","texto":["Además del tipo, el dato tiene que cumplir el enunciado. Eso se revisa con un `if` dentro del mismo `while bandera`: `if b > a:` para un intervalo, `if 0 < precision < 1:` para una precisión, como en el seno del parcial.","`0 < precision < 1` es una comparación encadenada: equivale a `0 < precision and precision < 1`.","Si el dato además puede no ser un número, junta las dos cosas: `float()` dentro del `try`, y el `if` del rango dentro del mismo `try`, después de convertir.","Un binario escrito como texto solo tiene ceros y unos: `t.count(\"0\") + t.count(\"1\") == len(t)`. Con «1021» la cuenta da 3 y el largo es 4: no es binario."],"code":"bandera = True\nwhile bandera:\n    a = float(input(\"a: \"))\n    b = float(input(\"b: \"))\n    if b > a:\n        bandera = False\n    else:\n        print(\"b debe ser mayor que a\")\nprint(\"Intervalo de\", a, \"a\", b)","ojo":"En tus apuntes (pág. 99) la validación del binario quedó partida en dos líneas y sin dos puntos, y empieza con `Valor` pero usa `valor`. Escríbela en una sola línea, con `:` al final y el mismo nombre.","entrada":"5\n2\n2\n5","id":"l1-val-2","salida":"a: 5\nb: 2\nb debe ser mayor que a\na: 2\nb: 5\nIntervalo de 2.0 a 5.0"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"print(\"User_123\".isalnum(), \"User123\".isalnum(), \"User 123\".isalpha())","ops":["True True False","True True True","False True True"],"exp":"El guion bajo no es letra ni número, así que `isalnum()` da False. «User 123» tiene un espacio y números: `isalpha()` da False.","id":"l1-val-3","correcta":"False True False"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"print(\"-5\".isdigit(), \"3.14\".isnumeric(), \"2026\".isdecimal())","ops":["True True True","True False True","False True True"],"exp":"El signo menos y el punto no son dígitos: ninguno de los métodos los acepta. «2026» sí tiene solo dígitos del 0 al 9.","id":"l1-val-4","correcta":"False False True"},{"t":"elige","q":"Tienes que pedir la coordenada x de un punto, que puede ser −2.5. ¿Cómo la validas?","ops":["Con `float()` dentro de un `try` con `except ValueError`, en un `while bandera`","Con `isdigit()`","Con `isalnum()`","Con `isnumeric()`"],"ok":0,"exp":"Los métodos `is...` rechazan el signo menos y el punto. `float()` sí acepta «-2.5», y el `except` atrapa lo que no se puede convertir.","id":"l1-val-5"},{"t":"completa","q":"Completa para atrapar el error de conversión.","code":"t = \"3,5\"\ntry:\n    x = float(t)\n    print(\"Número:\", x)\nexcept ___:\n    print(\"Dato inválido\")","ops":["ValueError","TypeError","ZeroDivisionError"],"ok":0,"exp":"`float(\"3,5\")` da ValueError por la coma. Si el `except` nombra otro error, no lo atrapa y el programa se detiene igual.","id":"l1-val-6","salida":"Dato inválido"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"t = \"-7\"\ntry:\n    x = float(t)\n    print(\"ok\", x)\nexcept ValueError:\n    print(\"inválido\")\nprint(t.isdigit())","ops":["inválido\nFalse","ok -7\nFalse","ok -7.0\nTrue"],"exp":"`float()` acepta el signo menos y da el decimal -7.0. `isdigit()`, en cambio, da False por el signo.","id":"l1-val-7","correcta":"ok -7.0\nFalse"},{"t":"elige","q":"¿Qué valores de `precision` pasan la validación `if 0 < precision < 1:`?","ops":["0.5 y 0.0001","0 y 1","1 y 10","-0.5 y 0.5"],"ok":0,"exp":"Tiene que ser mayor que 0 y menor que 1, sin incluir los extremos: 0 y 1 no pasan.","id":"l1-val-8"},{"t":"error","ref":"de_try","id":"l1-val-9"},{"t":"salida","q":"¿Qué aparece en la pantalla?","code":"t = \"1021\"\nprint(t.count(\"0\") + t.count(\"1\"), len(t))","ops":["4 4","2 4","3 3"],"exp":"Hay un 0 y dos 1: la cuenta da 3. El largo es 4 por el 2. Como no coinciden, «1021» no es binario.","id":"l1-val-10","correcta":"3 4"},{"t":"ordena","ref":"de_binario","id":"l1-val-11"},{"t":"aprende","titulo":"Limpiar la pantalla: import os","texto":["`os` es una biblioteca para hablar con el sistema operativo. Se importa al inicio del programa: `import os`.","`os.system(\"cls\")` le pide a la terminal de Windows que borre la pantalla. El profesor lo usa en el factorión, antes de pedir el dato, para empezar con la pantalla limpia.","Solo funciona en Windows. En Linux y Mac el comando es `\"clear\"`. Si quieres que sirva en los dos, decide con `os.name`, que vale `\"nt\"` en Windows y `\"posix\"` en Linux y Mac.","Aquí en el juego no se puede ver el efecto: pr
